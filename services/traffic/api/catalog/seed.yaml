  - {slug: apple, name: Apple, country: US, asns: [714, 6185]}
  - {slug: zoom, name: Zoom, country: US, asns: [30103]}
  - {slug: spotify, name: Spotify, country: SE, asns: [8403]}
  - {slug: bytedance, name: ByteDance (TikTok), country: SG, asns: [138699, 396986]}
  - {slug: twitch, name: Twitch, country: US, asns: [46489]}
  - {slug: valve, name: Valve (Steam), country: US, asns: [32590]}
  - {slug: discord, name: Discord, country: US, asns: [49544]}
  - {slug: telegram, name: Telegram, country: GB, asns: [62041, 62014, 59930]}
