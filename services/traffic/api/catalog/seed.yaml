# Catálogo semilla de clasificación de tráfico (I1-07, EP-12; docs/traffic-model.md §6).
# Global de plataforma: categorías → servicios → organizaciones → ASN → prefijos, con reglas
# deterministas (prefix > asn_port > asn > port). Sin editor hasta I4: se cambia aquí y se publica
# como snapshot versionado (horus-catalog publish). Los prefijos son rangos publicados por cada
# proveedor; se clasifica al nivel que la evidencia soporta (genéricos de CDN/nube, nunca más).
version: 1
categories:
  - {slug: video_streaming, name: Streaming de video}
  - {slug: social, name: Redes sociales}
  - {slug: gaming, name: Videojuegos}
  - {slug: software_updates, name: Actualizaciones de software}
  - {slug: web, name: Navegación web}
  - {slug: messaging, name: Mensajería}
  - {slug: cloud, name: Nube y almacenamiento}
  - {slug: video_calls, name: Videollamadas}
  - {slug: music, name: Música}
  - {slug: ecommerce, name: Comercio electrónico}
  - {slug: cdn_infra, name: CDN e infraestructura}
  - {slug: network_services, name: Servicios de red (DNS, NTP)}

organizations:
  - {slug: google, name: Google, country: US, asns: [15169, 36040, 396982]}
  - {slug: meta, name: Meta, country: US, asns: [32934]}
  - {slug: netflix, name: Netflix, country: US, asns: [2906, 40027]}
