# Buckets NATS KV que provisiona la infraestructura (`horus nats-provision --kv`, servicio
# one-shot `nats-init` del compose de producción, I1-22). Los streams salen del contrato
# packages/events/streams/streams.yaml (C4).
#
# Campos: bucket, description, history (1), ttl (vacío = sin caducidad), max_bytes, storage
# (file|memory).
kv:
  # Estado de cada exportador de flujos (collector escribe, ingester lee; I1-09, FLOW).
  # Mismos parámetros que crea el collector en desarrollo (services/collector/module.go).
  - bucket: flow_exporter_state
    description: Estado de los exportadores de flujos (I1-09)
    history: 1
    storage: file
  # Plantillas IPFIX/v9 y secuencias de cada exportador: el collector las reinstala tras un
  # reinicio y mide lo enviado mientras estuvo caído (D23; services/collector/internal/app/persist.go).
  - bucket: flow_collector_state
    description: Plantillas y secuencias del collector para continuar tras un reinicio (D23)
    history: 1
    storage: file
  # Grupos de INSERT en curso del ingester (token → batch_id): hace idempotentes los reintentos
  # tras una caída del proceso (services/ingester/internal/app/group.go). TTL = max_age de TLM_FLOWS.
  - bucket: flows_ingester_groups
    description: Grupos de INSERT en curso del ingester (FLOW)
    history: 1
    ttl: 24h
    max_bytes: 64MiB
    storage: file
