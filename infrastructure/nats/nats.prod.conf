# NATS JetStream — configuración de PRODUCCIÓN de un servidor (compose.prod.yaml, I1-22).
#
# Solo escucha en la red interna del compose (no se publica en el host). Usuario y contraseña
# en auth.conf, que genera scripts/install.sh en HORUS_SECRETS_DIR/nats_auth.conf (nunca en el
# repositorio); los contenedores horus-* reciben la URL con credenciales como secreto
# (HORUS_NATS_URL_FILE). Streams y KV: servicio nats-init (`horus nats-provision`).
#
# max_file_store: JetStream reserva el max_bytes de cada stream (≈16 GiB de streams de eventos
# + HORUS_TLM_FLOWS_MAX_BYTES de telemetría), así que el instalador lo dimensiona con el disco.

server_name: horus-nats
port: 4222
http_port: 8222
max_payload: 8MB

include auth.conf

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 256MB
  max_file_store: $HORUS_NATS_MAX_FILE_STORE
}
