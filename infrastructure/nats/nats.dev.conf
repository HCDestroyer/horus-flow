# NATS JetStream — configuración de DESARROLLO (compose.dev.yaml, historia I0-02).
# Producción tendrá su propia configuración con autenticación (cuentas/NKeys) y TLS
# (docs/security.md); esta solo escucha en la red del compose y en el loopback del host.

server_name: horus-dev-nats

# Clientes (HORUS_NATS_URL=nats://nats:4222).
port: 4222

# Monitorización: /healthz, /varz, /jsz (prometheus-nats-exporter lo leerá en I0-18).
http_port: 8222

# Tamaño máximo de mensaje: los lotes de flujos van troceados por el colector (events.md).
max_payload: 8MB

jetstream {
  store_dir: /data/jetstream
  # Límites de desarrollo; la memoria debe caber en el límite del contenedor (512 MiB).
  max_memory_store: 128MB
  # JetStream RESERVA el max_bytes de cada stream contra max_file_store (no ocupa disco hasta que
  # llegan mensajes): todos los streams del contrato (también los de I2/I3) suman ≈ 24 GiB y TLM_FLOWS se limita en
  # dev a 2 GiB (HORUS_TLM_FLOWS_MAX_BYTES en compose.dev.yaml). Con menos, los roles no pueden
  # crear sus streams ("insufficient storage resources available").
  max_file_store: 32GB
}
