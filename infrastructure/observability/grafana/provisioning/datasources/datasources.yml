# Grafana — datasources de DESARROLLO provisionados como código (historia I0-18).
# UIDs fijos: los dashboards de infrastructure/observability/grafana/dashboards los referencian.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
