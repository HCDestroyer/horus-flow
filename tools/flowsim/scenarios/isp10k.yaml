name: isp10k
description: >
  Nodo grande de un ISP de 10 000 clientes (docs/vendors/mikrotik.md §2.5):
  10 000 IPv4 privadas en 10.64.0.0/18 detrás del NAT del router principal,
  exportado con las plantillas reales de RouterOS 7 (IE 225-228), un 30 % de
  hogares y la mitad de las empresas con IPv6 (/64 delegado por cliente, sin
  NAT). Mezcla de navegación, streaming, QUIC, DNS, push y NTP; 400 empresas
  con servicios entrantes, SaaS y copias de seguridad; y un 1 % de clientes
  infectados: escáneres tipo Mirai, bots con C2, beacons, P2P UDP y
  spambots. `rate` es el pico (registros/s de fondo); `daily` reparte el día
  (factor por hora local del escenario, 1 = pico a las 21 h) y `-flat` lo
  desactiva (pruebas de carga a tasa fija). El router real medido dio ~0,65
  flujos/s por cliente en hora de uso (152 flujos/s con 236 clientes): unos
  6 500/s de media para 10 000 clientes y 15 000 en pico.
duration: 10m
rate: 15000
report_only: true   # las señales de los infectados dependen de duración y tasa: se informan, no se exigen
fixture:
  duration: 20s
  rate: 500
  skip_file: true   # 10 000 clientes: la captura no se versiona (sim-verify la genera y verifica)
daily: [0.30, 0.20, 0.15, 0.12, 0.12, 0.15, 0.25, 0.40, 0.50, 0.55, 0.60, 0.62,
        0.65, 0.65, 0.62, 0.62, 0.65, 0.72, 0.82, 0.92, 0.98, 1.00, 0.85, 0.55]
indicators:
  - {ip: 203.0.113.66, kind: botnet_cc, confidence: high}
  - {ip: 203.0.113.77, kind: botnet_cc, confidence: high}
exporters:
  - name: node-big
    nat_ips: [203.0.113.32, 203.0.113.33, 203.0.113.34, 203.0.113.35, 203.0.113.36, 203.0.113.37,
              203.0.113.38, 203.0.113.39, 203.0.113.40, 203.0.113.41, 203.0.113.42, 203.0.113.43,
              203.0.113.44, 203.0.113.45, 203.0.113.46, 203.0.113.47]
    prefixes:
      nat:
        customers: [10.64.0.0/18]
        infrastructure: [10.127.255.0/24, 203.0.113.0/28]
        unlisted: [172.16.50.0/24]
        resolver: 10.127.255.53
    populations:
      - name: households
        count: 9500
        ipv6_share: 0.3
        behaviors:
          - residential: {}
      - name: business
        count: 400
        ipv6_share: 0.5
        behaviors:
          - commercial: {inbound_ports: [443, 25, 22], inbound_rate: 0.3}
      - name: mirai
        count: 40
        behaviors:
          - residential: {intensity: 0.2}
          - scan: {mode: horizontal, ports: [23, 2323], rate: 4, respond_ratio: 0.03}
      - name: bot-c2
        count: 20
        behaviors:
          - residential: {}
          - c2: {remote: 203.0.113.66, port: 6667, interval: 45s, jitter: 0.2, responds: true}
      - name: bot-sinkholed
        count: 10
        behaviors:
          - residential: {}
          - c2: {remote: 203.0.113.77, port: 443, interval: 30s, jitter: 0.2, responds: false}
      - name: p2p-bot
        count: 15
        behaviors:
          - residential: {}
          - fanout: {rate: 3, src_port: 51413, respond_ratio: 0.4}
      - name: spambot
        count: 15
        behaviors:
          - residential: {}
          - smtp: {rate: 1, refuse_ratio: 0.3}
