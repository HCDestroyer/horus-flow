# Horus Flow — charon como hub route-based (docs/tunnels.md §4). tunnel-agent crea las interfaces
# XFRM (if_id por túnel) y las rutas /32: charon no instala rutas ni IP virtuales, solo SA y políticas
# con if_id. Conexiones y PSK llegan por vici (load-conn / load-shared) y solo viven en memoria.
charon {
    # Tras arrancar: usuario ipsec y grupo horusvici (dueño del socket vici, 0770).
    user = ipsec
    group = horusvici
    # Solo lo necesario (sin farp, dhcp, ha, eap-radius, attr-sql…): IKEv2 con PSK y kernel netlink.
    load_modular = no
    load = random nonce openssl pem pkcs1 x509 revocation constraints pubkey gmp curve25519 kdf gcm aesni drbg kernel-netlink socket-default vici updown
    install_routes = no
    install_virtual_ip = no
    # Respuestas a routers que reinician sin cerrar la SA (INITIAL_CONTACT) y reintentos acotados.
    retransmit_tries = 5
    # Sin caché de configuración en disco ni PIDs fuera de /run.
    filelog {
        stdout {
            default = 1
            ike = 1
            cfg = 1
            knl = 0
            time_format = %Y-%m-%dT%H:%M:%S
            flush_line = yes
        }
    }
    syslog {
        identifier = horus-ipsec
        daemon {
            default = -1
        }
    }
    plugins {
        vici {
            socket = unix:///run/horus-ipsec/charon.vici
        }
    }
}
