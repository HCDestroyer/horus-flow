# nginx delante de Horus Flow en modo TLS externo (install.sh --tls external
# --trusted-proxies 127.0.0.1/32 --http-bind 127.0.0.1:8080). Es el ejemplo de
# docs/install-debian.md y el proxy de prueba de `make test-install-debian`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/proxy.crt;
    ssl_certificate_key /etc/nginx/tls/proxy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HSTS lo decide el proxy (Horus no lo emite en este modo).
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # $proxy_add_x_forwarded_for AÑADE la IP real al final: lo que mande el cliente queda a
        # la izquierda y Horus lo ignora.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # WebSocket (/api/v1/ws): Upgrade/Connection y tiempos largos para los kioscos.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
