# NATS JetStream de las pruebas de carga y de fallo (I1-26; tests/load/compose.load.yaml).
# Igual que infrastructure/nats/nats.dev.conf salvo max_file_store: los roles crean sus streams
# con los max_bytes del contrato C4 (DEVICES_EVENTS 2 GiB, DETECTION_EVENTS 2 GiB, …) y la suma de
# reservas no cabe en los 2 GB de desarrollo. Es una reserva, no espacio ocupado: el disco real
# lo marca el volumen de la prueba (TLM_FLOWS = LOAD_TLM_MAX_BYTES, que fija el driver).

server_name: horus-load-nats
port: 4222
http_port: 8222
max_payload: 8MB

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 128MB
  max_file_store: 32GB
}
