# Catálogo de eventos v0 del dominio `analytics` (C4; docs/events.md §5.6, §8).
# Un archivo por dominio para que dos agentes no editen el mismo. Cada tipo: mensaje Protobuf en
# packages/protobuf/horus/events/<dominio>/v1/ y golden file en packages/events/examples/<type>.json.
# Cambios de pii / tenant_scope requieren a la persona.
domain: analytics
version: v0
events:
- type: horus.analytics.audit.recorded
  subject: horus.analytics.audit.recorded.{entry_id}
  tenant_scope: tenant
  stream: ANALYTICS_EVENTS
  family: domain
  encoding: json
  schema: horus.common.v1.AuditRecord
  schema_version: 1
  producer: analytics
  consumers:
  - auth
  websocket_topics: []
  pii: true
  pii_fields:
  - ip
  - user_agent
  status: draft
  since: I1
  example: examples/horus.analytics.audit.recorded.json
  notes: Único evento con IP y User-Agent; tenant_id null para acciones de plataforma. Solo auth lo persiste (cadena de hashes).
- type: horus.analytics.dashboard.created
  subject: horus.analytics.dashboard.created.{dashboard_id}
  tenant_scope: tenant
  stream: ANALYTICS_EVENTS
  family: domain
  encoding: json
  schema: horus.events.analytics.v1.DashboardChanged
  schema_version: 1
  producer: analytics
  consumers:
  - gateway
  - analytics
  websocket_topics:
  - dashboard.{dashboard_id}
  pii: false
  pii_fields: []
  status: draft
  since: I1
  example: examples/horus.analytics.dashboard.created.json
- type: horus.analytics.dashboard.updated
  subject: horus.analytics.dashboard.updated.{dashboard_id}
  tenant_scope: tenant
  stream: ANALYTICS_EVENTS
  family: domain
  encoding: json
  schema: horus.events.analytics.v1.DashboardChanged
  schema_version: 1
  producer: analytics
  consumers:
  - gateway
  - analytics
  websocket_topics:
  - dashboard.{dashboard_id}
  pii: false
  pii_fields: []
  status: draft
  since: I1
  example: examples/horus.analytics.dashboard.updated.json
- type: horus.analytics.dashboard.deleted
  subject: horus.analytics.dashboard.deleted.{dashboard_id}
  tenant_scope: tenant
  stream: ANALYTICS_EVENTS
  family: domain
  encoding: json
  schema: horus.events.analytics.v1.DashboardChanged
  schema_version: 1
  producer: analytics
  consumers:
  - gateway
  - analytics
  websocket_topics:
  - dashboard.{dashboard_id}
  pii: false
  pii_fields: []
  status: draft
  since: I1
  example: examples/horus.analytics.dashboard.deleted.json
- type: horus.analytics.playlist.updated
  subject: horus.analytics.playlist.updated.{playlist_id}
  tenant_scope: tenant
  stream: ANALYTICS_EVENTS
  family: domain
  encoding: json
  schema: horus.events.analytics.v1.PlaylistChanged
  schema_version: 1
  producer: analytics
