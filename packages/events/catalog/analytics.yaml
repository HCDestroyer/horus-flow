  status: draft
  since: I1
  example: examples/horus.analytics.playlist.updated.json
- type: horus.analytics.playlist.deleted
  subject: horus.analytics.playlist.deleted.{playlist_id}
  tenant_scope: tenant
  stream: ANALYTICS_EVENTS
  family: domain
