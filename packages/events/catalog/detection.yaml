# Catálogo de eventos v0 del dominio `detection` (C4; docs/events.md §5.6, §8).
# Un archivo por dominio para que dos agentes no editen el mismo. Cada tipo: mensaje Protobuf en
# packages/protobuf/horus/events/<dominio>/v1/ y golden file en packages/events/examples/<type>.json.
# Cambios de pii / tenant_scope requieren a la persona.
domain: detection
version: v0
events:
- type: horus.detection.audit.recorded
  subject: horus.detection.audit.recorded.{entry_id}
  tenant_scope: tenant
  stream: DETECTION_EVENTS
  family: domain
  encoding: json
  schema: horus.common.v1.AuditRecord
  schema_version: 1
  producer: detection
  consumers:
  - auth
  websocket_topics: []
  pii: true
  pii_fields:
  - ip
  - user_agent
  status: stable
  since: I1
  example: examples/horus.detection.audit.recorded.json
  notes: Único evento con IP y User-Agent; tenant_id null para acciones de plataforma. Solo auth lo persiste (cadena de hashes).
- type: horus.detection.finding.opened
  subject: horus.detection.finding.opened.{finding_id}
  tenant_scope: tenant
  stream: DETECTION_EVENTS
  family: domain
  encoding: json
  schema: horus.events.detection.v1.Finding
  schema_version: 1
  producer: detection
  consumers:
  - alerts
  - devices
  - gateway
  websocket_topics:
  - security
  pii: false
  pii_fields: []
  status: stable
  since: I1
  example: examples/horus.detection.finding.opened.json
  json_schema: packages/schemas/finding/v0/finding.schema.json
  notes: 'Payload = C8 (finding.schema.json) sin IP del cliente: customer=null y routeros.rendered_*=null (D11).'
- type: horus.detection.finding.updated
  subject: horus.detection.finding.updated.{finding_id}
  tenant_scope: tenant
  stream: DETECTION_EVENTS
  family: domain
  encoding: json
  schema: horus.events.detection.v1.Finding
  schema_version: 1
  producer: detection
  consumers:
  - alerts
  - gateway
  websocket_topics:
  - security
  pii: false
  pii_fields: []
  status: stable
  since: I1
  example: examples/horus.detection.finding.updated.json
  json_schema: packages/schemas/finding/v0/finding.schema.json
- type: horus.detection.finding.resolved
  subject: horus.detection.finding.resolved.{finding_id}
  tenant_scope: tenant
  stream: DETECTION_EVENTS
  family: domain
  encoding: json
  schema: horus.events.detection.v1.Finding
  schema_version: 1
  producer: detection
  consumers:
  - alerts
  - gateway
  websocket_topics:
  - security
  pii: false
  pii_fields: []
  status: stable
  since: I1
  example: examples/horus.detection.finding.resolved.json
  json_schema: packages/schemas/finding/v0/finding.schema.json
- type: horus.detection.customer.security_state_changed
  subject: horus.detection.customer.security_state_changed.{customer_id}
  tenant_scope: tenant
  stream: DETECTION_EVENTS
  family: domain
  encoding: json
  schema: horus.events.detection.v1.SecurityStateChanged
  schema_version: 1
  producer: detection
  consumers:
  - devices
  - alerts
  - analytics
  - gateway
  websocket_topics:
  - security
  pii: false
  pii_fields: []
  status: stable
  since: I1
  example: examples/horus.detection.customer.security_state_changed.json
- type: horus.detection.customer.kind_suggested
  subject: horus.detection.customer.kind_suggested.{customer_id}
  tenant_scope: tenant
  stream: DETECTION_EVENTS
  family: domain
  encoding: json
  schema: horus.events.detection.v1.KindSuggested
  schema_version: 1
  producer: detection
  consumers:
  - devices
  websocket_topics: []
  pii: false
  pii_fields: []
  status: stable
  since: I2
  example: examples/horus.detection.customer.kind_suggested.json
  notes: 'Scoring residencial/comercial (commercial-v1): solo al cambiar la sugerencia y tras la histéresis del ISP (7 días). devices aplica el tipo si kind_locked = false y confidence × 100 ≥ apply_threshold (customer.kind_changed con source=scoring); siempre guarda la sugerencia. Sin IP del cliente.'
- type: horus.detection.score.changed
  subject: horus.detection.score.changed.{customer_id}
  tenant_scope: tenant
  stream: DETECTION_EVENTS
  family: domain
  encoding: json
  schema: horus.events.detection.v1.ScoreChanged
  schema_version: 1
  producer: detection
  consumers:
  - analytics
  websocket_topics: []
  pii: false
  pii_fields: []
  status: stable
  since: I2
  example: examples/horus.detection.score.changed.json
  notes: 'Puntuación comercial diaria que se mueve al menos score_change_delta puntos (5), la primera de un cliente o un cambio de nivel. La serie completa vive en detection.customer_scores_1d (ClickHouse).'
- type: horus.detection.reputation.snapshot_published
  subject: horus.detection.reputation.snapshot_published.{snapshot_id}
  tenant_scope: platform
  stream: DETECTION_EVENTS
  family: domain
  encoding: json
  schema: horus.events.detection.v1.ReputationSnapshotPublished
  schema_version: 1
  producer: detection
  consumers:
  - flows
  - detection
  websocket_topics: []
  pii: false
  pii_fields: []
  status: stable
  since: I1
  example: examples/horus.detection.reputation.snapshot_published.json
- type: horus.detection.reputation.source_refreshed
  subject: horus.detection.reputation.source_refreshed.{source_id}
  tenant_scope: platform
  stream: DETECTION_EVENTS
  family: domain
  encoding: json
  schema: horus.events.detection.v1.ReputationSourceRefreshed
  schema_version: 1
  producer: detection
  consumers:
  - alerts
  - gateway
  websocket_topics: []
  pii: false
  pii_fields: []
  status: stable
  since: I1
  example: examples/horus.detection.reputation.source_refreshed.json
  notes: 'D20: carga completada (result=ok) o fallida (failed | rejected) de una fuente del catálogo base o personalizada (origin); las personalizadas se gestionan en /platform/reputation/sources.'
