- type: horus.wireguard.peer_status.observed
  subject: horus.telemetry.wireguard.peer_status.{server_id}
  tenant_scope: tenant
  stream: TLM_WIREGUARD
  family: telemetry
  encoding: protobuf
  schema: horus.events.wireguard.v1.PeerStatusBatch
  schema_version: 1
  producer: wireguard
  consumers:
  - gateway
  websocket_topics: []
  pii: false
  pii_fields: []
  status: draft
  since: I1
  example: examples/horus.wireguard.peer_status.observed.json
  notes: Un lote por tenant y hub cada 15 s.
