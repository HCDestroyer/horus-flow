# Catálogo de eventos v0 del dominio `wireguard` (C4; docs/events.md §5.6, §8).
# Un archivo por dominio para que dos agentes no editen el mismo. Cada tipo: mensaje Protobuf en
# packages/protobuf/horus/events/<dominio>/v1/ y golden file en packages/events/examples/<type>.json.
# Cambios de pii / tenant_scope requieren a la persona.
domain: wireguard
version: v0
events:
- type: horus.wireguard.audit.recorded
  subject: horus.wireguard.audit.recorded.{entry_id}
  tenant_scope: tenant
  stream: WIREGUARD_EVENTS
  family: domain
  encoding: json
  schema: horus.common.v1.AuditRecord
  schema_version: 1
  producer: wireguard
  consumers:
  - auth
  websocket_topics: []
  pii: true
  pii_fields:
  - ip
  - user_agent
  status: draft
  since: I1
  example: examples/horus.wireguard.audit.recorded.json
  notes: Único evento con IP y User-Agent; tenant_id null para acciones de plataforma. Solo auth lo persiste (cadena de hashes).
- type: horus.wireguard.peer.created
  subject: horus.wireguard.peer.created.{peer_id}
  tenant_scope: tenant
  stream: WIREGUARD_EVENTS
  family: domain
  encoding: json
  schema: horus.events.wireguard.v1.Peer
  schema_version: 1
  producer: wireguard
  consumers:
  - devices
  - gateway
  websocket_topics:
  - wireguard.peers
  pii: false
  pii_fields: []
  status: draft
  since: I1
  example: examples/horus.wireguard.peer.created.json
  notes: 'Al consumir devices.router.created: IP de túnel /32 única en la plataforma.'
- type: horus.wireguard.peer.enrolled
  subject: horus.wireguard.peer.enrolled.{peer_id}
  tenant_scope: tenant
  stream: WIREGUARD_EVENTS
  family: domain
  encoding: json
  schema: horus.events.wireguard.v1.Peer
  schema_version: 1
  producer: wireguard
  consumers:
  - devices
  - alerts
  - gateway
  websocket_topics:
  - wireguard.peers
  pii: false
  pii_fields: []
  status: draft
  since: I1
  example: examples/horus.wireguard.peer.enrolled.json
  notes: Clave pública recibida por POST /enroll/wireguard; sin token ni secretos.
- type: horus.wireguard.peer.activated
  subject: horus.wireguard.peer.activated.{peer_id}
  tenant_scope: tenant
  stream: WIREGUARD_EVENTS
  family: domain
  encoding: json
  schema: horus.events.wireguard.v1.Peer
  schema_version: 1
  producer: wireguard
  consumers:
  - devices
  - gateway
  websocket_topics:
  - wireguard.peers
  pii: false
  pii_fields: []
  status: draft
  since: I1
  example: examples/horus.wireguard.peer.activated.json
- type: horus.wireguard.peer.revoked
  subject: horus.wireguard.peer.revoked.{peer_id}
  tenant_scope: tenant
  stream: WIREGUARD_EVENTS
  family: domain
  encoding: json
  schema: horus.events.wireguard.v1.Peer
  schema_version: 1
  producer: wireguard
  consumers:
  - devices
  - alerts
  - gateway
  websocket_topics:
  - wireguard.peers
  pii: false
  pii_fields: []
  status: draft
  since: I1
  example: examples/horus.wireguard.peer.revoked.json
- type: horus.wireguard.peer.handshake_stale
  subject: horus.wireguard.peer.handshake_stale.{peer_id}
  tenant_scope: tenant
  stream: WIREGUARD_EVENTS
  family: domain
  encoding: json
  schema: horus.events.wireguard.v1.PeerHandshake
  schema_version: 1
  producer: wireguard
  consumers:
  - alerts
  - gateway
  - flows
  websocket_topics:
  - wireguard.peers
  pii: false
  pii_fields: []
  status: draft
  since: I1
  example: examples/horus.wireguard.peer.handshake_stale.json
- type: horus.wireguard.peer.handshake_recovered
  subject: horus.wireguard.peer.handshake_recovered.{peer_id}
  tenant_scope: tenant
  stream: WIREGUARD_EVENTS
  family: domain
  encoding: json
  schema: horus.events.wireguard.v1.PeerHandshake
  schema_version: 1
  producer: wireguard
  consumers:
  - alerts
  - gateway
  websocket_topics:
  - wireguard.peers
  pii: false
  pii_fields: []
  status: draft
  since: I1
  example: examples/horus.wireguard.peer.handshake_recovered.json
- type: horus.wireguard.hub.status_changed
  subject: horus.wireguard.hub.status_changed.{hub_id}
  tenant_scope: platform
  stream: WIREGUARD_EVENTS
  family: domain
  encoding: json
  schema: horus.events.wireguard.v1.HubStatusChanged
  schema_version: 1
  producer: wireguard
  consumers:
  - alerts
