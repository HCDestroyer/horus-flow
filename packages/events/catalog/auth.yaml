# Catálogo de eventos v0 del dominio `auth` (C4; docs/events.md §5.6, §8).
# Un archivo por dominio para que dos agentes no editen el mismo. Cada tipo: mensaje Protobuf en
# packages/protobuf/horus/events/<dominio>/v1/ y golden file en packages/events/examples/<type>.json.
# Cambios de pii / tenant_scope requieren a la persona.
domain: auth
version: v0
events:
- type: horus.auth.tenant.created
  subject: horus.auth.tenant.created.{tenant_id}
  tenant_scope: tenant
  stream: AUTH_EVENTS
  family: domain
  encoding: json
  schema: horus.events.auth.v1.Tenant
  schema_version: 1
  producer: auth
  consumers:
  - devices
  - flows
  - analytics
  - detection
  - alerts
  - gateway
  websocket_topics: []
  pii: false
  pii_fields: []
  status: draft
  since: I0
  example: examples/horus.auth.tenant.created.json
  notes: 'Ciclo de vida del tenant: tenant_id = el propio tenant (events.md §8.1 nota 1).'
