# Catálogo de eventos v0 del dominio `devices` (C4; docs/events.md §5.6, §8).
# Un archivo por dominio para que dos agentes no editen el mismo. Cada tipo: mensaje Protobuf en
# packages/protobuf/horus/events/<dominio>/v1/ y golden file en packages/events/examples/<type>.json.
# Cambios de pii / tenant_scope requieren a la persona.
domain: devices
version: v0
events:
- type: horus.devices.audit.recorded
  subject: horus.devices.audit.recorded.{entry_id}
  tenant_scope: tenant
  stream: DEVICES_EVENTS
  family: domain
  encoding: json
  schema: horus.common.v1.AuditRecord
  schema_version: 1
  producer: devices
  consumers:
  - auth
  websocket_topics: []
  pii: true
  pii_fields:
  - ip
  - user_agent
  status: draft
  since: I0
  example: examples/horus.devices.audit.recorded.json
  notes: Único evento con IP y User-Agent; tenant_id null para acciones de plataforma. Solo auth lo persiste (cadena de hashes).
