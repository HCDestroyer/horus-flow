# Streams JetStream v0 (C4; docs/events.md §3). Los aplica de forma idempotente un job de
# infrastructure/nats/ en cada arranque (PLAT); los módulos no crean streams. Réplicas 1 en v1 (nodo único).
# Comunes: storage file, discard old, allow_direct true. Telemetría: max_bytes parametrizable por despliegue.
version: v0
defaults:
  storage: file
  discard: old
  allow_direct: true
  replicas: 1
streams:
  - { name: AUTH_EVENTS, subjects: ['horus.auth.>'], retention: limits, max_age: 30d, max_bytes: 1GiB, duplicate_window: 20m, max_msg_size: 64KiB }
  - { name: DEVICES_EVENTS, subjects: ['horus.devices.>'], retention: limits, max_age: 30d, max_bytes: 2GiB, duplicate_window: 20m, max_msg_size: 64KiB }
  - { name: WIREGUARD_EVENTS, subjects: ['horus.wireguard.>'], retention: limits, max_age: 30d, max_bytes: 1GiB, duplicate_window: 20m, max_msg_size: 64KiB }
  - { name: SNMP_EVENTS, subjects: ['horus.snmp.>'], retention: limits, max_age: 30d, max_bytes: 2GiB, duplicate_window: 20m, max_msg_size: 64KiB, since: I2 }
  - { name: FLOWS_EVENTS, subjects: ['horus.flows.>'], retention: limits, max_age: 30d, max_bytes: 1GiB, duplicate_window: 20m, max_msg_size: 64KiB }
  - { name: TRAFFIC_EVENTS, subjects: ['horus.traffic.>'], retention: limits, max_age: 30d, max_bytes: 512MiB, duplicate_window: 20m, max_msg_size: 64KiB }
  - { name: DETECTION_EVENTS, subjects: ['horus.detection.>'], retention: limits, max_age: 30d, max_bytes: 2GiB, duplicate_window: 20m, max_msg_size: 64KiB }
  - { name: ALERTS_EVENTS, subjects: ['horus.alerts.>'], retention: limits, max_age: 30d, max_bytes: 2GiB, duplicate_window: 20m, max_msg_size: 64KiB }
  - { name: ANALYTICS_EVENTS, subjects: ['horus.analytics.>'], retention: limits, max_age: 30d, max_bytes: 512MiB, duplicate_window: 20m, max_msg_size: 64KiB }
  - { name: REPORTING_EVENTS, subjects: ['horus.reporting.>'], retention: limits, max_age: 30d, max_bytes: 512MiB, duplicate_window: 20m, max_msg_size: 64KiB, since: I3 }
  - { name: JOBS_EVENTS, subjects: ['horus.jobs.>'], retention: limits, max_age: 30d, max_bytes: 256MiB, duplicate_window: 20m, max_msg_size: 64KiB, since: I3 }
  - { name: TLM_WIREGUARD, subjects: ['horus.telemetry.wireguard.>'], retention: limits, max_age: 24h, max_bytes: 1GiB, duplicate_window: 2m, max_msg_size: 256KiB }
  - name: TLM_FLOWS
    subjects: ['horus.telemetry.flows.>']
    retention: limits
    max_age: 24h
    max_bytes: '${HORUS_TLM_FLOWS_MAX_BYTES:-50GB}'
    duplicate_window: 2m
    max_msg_size: 1MiB
    compression: s2
    note: >-
      max_bytes = tasa_pico × horas × B/flujo (C-12; dimensionado en docs/architecture.md §9.4).
      compression s2 (NATS ≥ 2.10) comprime los bloques en disco; max_bytes cuenta el tamaño sin comprimir.
  - { name: TLM_SNMP, subjects: ['horus.telemetry.snmp.>'], retention: limits, max_age: 72h, max_bytes: 5GiB, duplicate_window: 2m, max_msg_size: 1MiB, since: I2 }
  - { name: WORK, subjects: ['horus.work.>'], retention: workqueue, max_age: 7d, max_bytes: 256MiB, duplicate_window: 20m, max_msg_size: 64KiB, since: I3 }
  - { name: DLQ, subjects: ['horus.dlq.>'], retention: limits, max_age: 30d, max_bytes: 5GiB, duplicate_window: 2m, max_msg_size: 1MiB }
provisioned_consumers:
  # Durables que se crean con el stream (el resto los crea cada módulo al arrancar, events.md §4.1).
  - { stream: TLM_FLOWS, durable: flows-ingester, filter_subjects: ['horus.telemetry.flows.batch.>'], ack_policy: explicit, ack_wait: 60s, max_deliver: -1, max_ack_pending: 5000 }
consumers_i1:
  # Referencia (los crea cada módulo): <módulo>-<propósito>.
  - { durable: auth-audit-<dominio>, streams: '<DOMINIO>_EVENTS', filter: 'horus.<dominio>.audit.recorded.>', module: auth, max_ack_pending: 1 }
  - { durable: wireguard-devices, stream: DEVICES_EVENTS, filter: ['horus.devices.router.created.>', 'horus.devices.router.deleted.>'], module: wireguard }
  - { durable: devices-wireguard, stream: WIREGUARD_EVENTS, filter: ['horus.wireguard.peer.enrolled.>', 'horus.wireguard.peer.activated.>'], module: devices, note: onboarding_state del router }
  - { durable: devices-exporter-state, stream: FLOWS_EVENTS, filter: ['horus.flows.exporter.state_changed.>'], module: devices, note: onboarding_state=exporting }
  - { durable: flows-inventory, stream: DEVICES_EVENTS, filter: ['horus.devices.router.>', 'horus.devices.realm.>'], module: flows }
  - { durable: ingester-known-clients, stream: DEVICES_EVENTS, filter: ['horus.devices.customer.>', 'horus.devices.client_prefix.>', 'horus.devices.realm.>'], module: flows }
  - { durable: devices-client-first-seen, stream: FLOWS_EVENTS, filter: ['horus.flows.client.first_seen.>'], module: devices }
  - { durable: devices-client-activity, stream: TLM_FLOWS, filter: ['horus.telemetry.flows.client_activity.>'], module: devices }
  - { durable: flows-snapshots, streams: [TRAFFIC_EVENTS, DETECTION_EVENTS], filter: ['horus.traffic.catalog.published.>', 'horus.detection.reputation.snapshot_published.>'], module: flows }
  - { durable: detection-customers, stream: DEVICES_EVENTS, filter: ['horus.devices.customer.>'], module: detection }
  - { durable: devices-customer-detection, stream: DETECTION_EVENTS, filter: ['horus.detection.customer.security_state_changed.>'], module: devices }
  - { durable: alerts-notify, streams: [DETECTION_EVENTS, FLOWS_EVENTS, WIREGUARD_EVENTS], filter: ['horus.detection.finding.opened.>', 'horus.detection.finding.updated.>', 'horus.flows.exporter.silent.>', 'horus.flows.exporter.recovered.>', 'horus.wireguard.peer.handshake_stale.>', 'horus.wireguard.peer.handshake_recovered.>'], module: alerts, note: canal mínimo D13 }
  - { durable: analytics-names, stream: DEVICES_EVENTS, filter: ['horus.devices.router.>', 'horus.devices.site.>', 'horus.devices.customer.>'], module: analytics }
  - { durable: auth-tenant-lifecycle, stream: AUTH_EVENTS, filter: ['horus.auth.tenant.>'], module: 'todos los dueños de datos' }
