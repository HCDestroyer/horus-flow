                  writeOnly: true
                  pattern: ^[0-9]+:[A-Za-z0-9_-]{30,}$
                  description: Bot propio aún no guardado (no se guarda).
                channel_id:
                  $ref: '#/components/schemas/Uuid'
                code:
                  type: string
                  pattern: ^hf[a-z0-9]{10}$
                  description: Código de vinculación (bot de la instalación).
