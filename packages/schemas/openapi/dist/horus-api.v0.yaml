            code:
              type: string
              pattern: ^[a-z0-9_]+$
            text:
              type: string
              maxLength: 300
              description: Resumen legible en español, sin IP del cliente (p. ej. 'Escaneo del puerto 23 a 1 240 destinos en 5 min').
