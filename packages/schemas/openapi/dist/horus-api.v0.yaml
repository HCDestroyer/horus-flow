            - string
            - 'null'
          pattern: ^7\.[0-9]+(\.[0-9]+)?$
          description: 'Declarada por el admin (D15: solo RouterOS 7.x). Se sobrescribe con la detectada.'
        tags:
          type: array
          items:
            type: string
    CredentialStatus:
      type: object
      required:
        - kind
        - configured
      properties:
        kind:
          type: string
          enum:
            - snmp
            - routeros_api
        configured:
          type: boolean
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_result:
          type:
            - string
            - 'null'
          enum:
            - ok
            - auth_failed
            - unreachable
            - tls_fingerprint_changed
            - null
    Router:
      allOf:
        - $ref: '#/components/schemas/TenantScopedResource'
        - $ref: '#/components/schemas/RouterInput'
        - type: object
          required:
            - admin_state
            - onboarding_state
            - routeros_version_supported
            - tunnel_address
            - warnings
          properties:
            admin_state:
              type: string
              enum:
                - active
                - maintenance
                - decommissioned
            onboarding_state:
              type: string
              description: |
                Pasos del asistente (I1-19): `pending_configuration` → `key_received` (clave pública enrolada)
                → `tunnel_up` (primer handshake) → `exporting` (primer flujo). Enum abierto.
              enum:
                - pending_configuration
                - key_received
                - tunnel_up
                - exporting
            routeros_version_detected:
              type:
                - string
                - 'null'
            routeros_version_supported:
              type:
                - boolean
                - 'null'
              description: false si la versión (detectada o declarada) es < 7.12 (D15); null si se desconoce.
            tunnel_address:
              type:
                - string
                - 'null'
              description: IP /32 de túnel WireGuard asignada por la IPAM de plataforma = identidad del exportador.
            wireguard_peer_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            warnings:
              type: array
              items:
                type: string
                enum:
                  - routeros_version_unsupported
                  - traffic_flow_target_drift
                  - hardware_offload_suspected
            credentials:
              type: array
              items:
                $ref: '#/components/schemas/CredentialStatus'
    RouterPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
        display_name:
          type:
            - string
            - 'null'
        model:
          type:
            - string
            - 'null'
        routeros_version:
          type:
            - string
            - 'null'
          pattern: ^7\.[0-9]+(\.[0-9]+)?$
        admin_state:
          type: string
          enum:
            - active
            - maintenance
            - decommissioned
        tags:
          type: array
          items:
            type: string
    PrefixImportPreview:
      type: object
      required:
        - router_id
        - read_at
        - routeros_version
        - items
      properties:
        router_id:
          $ref: '#/components/schemas/Uuid'
        read_at:
          $ref: '#/components/schemas/Timestamp'
        routeros_version:
          type: string
        tls_fingerprint_sha256:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - prefix
              - origin
              - suggested_role
              - diff
            properties:
              prefix:
                $ref: '#/components/schemas/Cidr'
              origin:
                type: string
                enum:
                  - ip_pool
                  - ipv6_pool
                  - interface_address
              origin_name:
                type: string
                examples:
                  - pool-pppoe
              suggested_role:
                $ref: '#/components/schemas/ClientPrefixRole'
              suggested_assignment_mode:
                type: string
                enum:
                  - static
                  - dynamic
                  - unknown
              diff:
                type: string
                enum:
                  - new
                  - exists
                  - overlaps
              existing_client_prefix_id:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
    SecuritySummary:
      type: object
      required:
        - open_by_severity
        - new_last_24h
        - affected_customers
        - by_signal
        - by_kind
        - by_security_state
        - by_site
        - generated_at
      properties:
        open_by_severity:
          type: object
          additionalProperties:
            type: integer
        new_last_24h:
          type: integer
        affected_customers:
          type: integer
        by_signal:
          type: object
          description: Clientes afectados por señal (c2_contact, beaconing, fan_out, scanning, watched_ports, sustained_upload, smtp, ddos).
          additionalProperties:
            type: integer
        by_kind:
          type: object
          additionalProperties:
            type: integer
        by_security_state:
          type: object
          additionalProperties:
            type: integer
        by_site:
          type: array
          items:
            type: object
            required:
              - site_id
              - customers_with_signals
              - open_findings
            properties:
              site_id:
                $ref: '#/components/schemas/Uuid'
              customers_with_signals:
                type: integer
              open_findings:
                type: integer
        watched_ports:
          type: array
          items:
            type: object
            required:
              - port
              - protocol
              - customers
              - flows
            properties:
              port:
                type: integer
              protocol:
                type: string
                enum:
                  - tcp
                  - udp
              customers:
                type: integer
              flows:
                $ref: '#/components/schemas/Uint64String'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
    SiteInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 120
        code:
          type:
            - string
            - 'null'
          maxLength: 32
        kind:
          type: string
          enum:
            - node
            - region
            - datacenter
            - other
          default: node
        parent_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        address:
          type:
            - string
            - 'null'
          maxLength: 300
        latitude:
          type:
            - number
            - 'null'
          minimum: -90
          maximum: 90
        longitude:
          type:
            - number
            - 'null'
          minimum: -180
          maximum: 180
        timezone:
          type:
            - string
            - 'null'
        tags:
          type: array
          items:
            type: string
    Site:
      allOf:
        - $ref: '#/components/schemas/TenantScopedResource'
        - $ref: '#/components/schemas/SiteInput'
        - type: object
          required:
            - discovery_mode
            - primary_router_id
            - private_realm_id
          properties:
            discovery_mode:
              type: boolean
              description: true si el nodo no tiene prefijos de clientes (el tráfico cuenta para el nodo, no crea clientes).
            primary_router_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            private_realm_id:
              $ref: '#/components/schemas/Uuid'
              description: Realm `node_private` del nodo (RFC1918 y 100.64.0.0/10).
    CapabilityState:
      type: string
      enum:
        - ok
        - degraded
        - stale
        - unavailable
    SystemStatus:
      type: object
      required:
        - status
        - checked_at
        - capabilities
        - components
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - down
        checked_at:
          $ref: '#/components/schemas/Timestamp'
        capabilities:
          type: object
          required:
            - auth
            - inventory
            - wireguard
            - ingest
            - realtime
            - analytics
            - detection
            - notifications
          properties:
            auth:
              $ref: '#/components/schemas/CapabilityState'
            inventory:
              $ref: '#/components/schemas/CapabilityState'
            wireguard:
              $ref: '#/components/schemas/CapabilityState'
            ingest:
              $ref: '#/components/schemas/CapabilityState'
            monitoring:
              $ref: '#/components/schemas/CapabilityState'
            realtime:
              $ref: '#/components/schemas/CapabilityState'
            analytics:
              $ref: '#/components/schemas/CapabilityState'
            detection:
              $ref: '#/components/schemas/CapabilityState'
            notifications:
              $ref: '#/components/schemas/CapabilityState'
            reports:
              $ref: '#/components/schemas/CapabilityState'
          additionalProperties:
            $ref: '#/components/schemas/CapabilityState'
        components:
          type: array
          description: Vacío para usuarios de tenant y kioscos; detalle solo con `platform.status.read`.
          items:
            type: object
            required:
              - name
              - status
            properties:
              name:
                type: string
                examples:
                  - postgres
                  - valkey
                  - nats
                  - clickhouse
                  - local_storage
                  - remote_storage
                  - collector
                  - wg_agent
              status:
                type: string
                enum:
                  - up
                  - degraded
                  - down
                  - not_configured
              since:
                oneOf:
                  - $ref: '#/components/schemas/Timestamp'
                  - type: 'null'
              detail:
                type:
                  - string
                  - 'null'
        disk_usage_ratio:
          type:
            - number
            - 'null'
          description: Solo plataforma; aviso si > 0.85 (I1-23).
    Size:
      type: object
      required:
        - w
        - h
      properties:
        w:
          type: integer
          minimum: 1
          maximum: 12
        h:
          type: integer
          minimum: 1
          maximum: 12
      additionalProperties: false
    widget-type.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.horus-flow.local/dashboard/v0/widget-type.schema.json
      title: WidgetType
      description: Entrada del catálogo autoritativo de tipos de widget (C9, mitad servidor; api.md §2.11, frontend.md §6.2–§6.3). La sirve GET /widget-types desde widget-types.json.
      type: object
      required:
        - type
        - title
        - description
        - category
        - config_schema
        - required_permission
        - data_endpoint_kind
        - realtime_topic
        - contains_personal_data
        - kiosk_allowed
        - sizes
        - increment
      properties:
        type:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        title:
          type: string
          maxLength: 60
        description:
          type: string
          maxLength: 300
          description: Empieza por verbo ('Muestra…').
        category:
          type: string
          enum:
            - traffic
            - customers
            - security
            - infrastructure
            - platform
            - layout
        config_schema:
          type: object
          description: JSON Schema (2020-12) de la config del widget; el servidor valida cada config guardada.
        required_permission:
          type: string
          description: Permiso que necesita quien mira (usuario). Los kioscos se rigen por kiosk_allowed + dashboards asignados.
        additional_permissions:
          type: array
          items:
            type: string
        data_endpoint_kind:
          type: string
          enum:
            - state
            - series
            - table
            - none
        realtime_topic:
          type:
            - string
            - 'null'
          description: Topic WebSocket (C6) que actualiza el widget, o null si solo REST.
        contains_personal_data:
          type: boolean
          description: true ⇒ IPs de clientes solo con customers.read; en kiosco enmascaradas salvo show_personal_data.
        kiosk_allowed:
          type: boolean
        sizes:
          type: object
          required:
            - allowed
            - default
          properties:
            allowed:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Size'
            default:
              $ref: '#/components/schemas/Size'
          additionalProperties: false
        increment:
          type: string
          enum:
            - I1
            - I2
            - I3
            - I4
        version:
          type: integer
          minimum: 1
          default: 1
      additionalProperties: false
      $defs:
        Size:
          type: object
          required:
            - w
            - h
          properties:
            w:
              type: integer
              minimum: 1
              maximum: 12
            h:
              type: integer
              minimum: 1
              maximum: 12
          additionalProperties: false
    Peer:
      allOf:
        - $ref: '#/components/schemas/TenantScopedResource'
        - type: object
          required:
            - server_id
            - router_id
            - status
            - handshake_state
            - address
            - public_key
            - last_handshake_at
            - enrollment
          properties:
            server_id:
              $ref: '#/components/schemas/Uuid'
            router_id:
              $ref: '#/components/schemas/Uuid'
            status:
              type: string
              enum:
                - awaiting_enrollment
                - pending_handshake
                - active
                - revoked
            handshake_state:
              type: string
              enum:
                - never
                - ok
                - stale
            address:
              type: string
              description: /32 de túnel (identidad del exportador)
              examples:
                - 10.255.3.17/32
            public_key:
              type:
                - string
                - 'null'
            last_handshake_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            endpoint:
              type:
                - string
                - 'null'
              description: IP:puerto público visto del router.
            rx_bytes:
              $ref: '#/components/schemas/Uint64String'
            tx_bytes:
              $ref: '#/components/schemas/Uint64String'
            persistent_keepalive_seconds:
              type: integer
              examples:
                - 25
            enrollment:
              type: object
              required:
                - token_state
              properties:
                token_id:
                  oneOf:
                    - $ref: '#/components/schemas/Uuid'
                    - type: 'null'
                token_state:
                  type: string
                  enum:
                    - none
                    - pending
                    - used
                    - expired
                    - revoked
                token_expires_at:
                  oneOf:
                    - $ref: '#/components/schemas/Timestamp'
                    - type: 'null'
                enrolled_at:
                  oneOf:
                    - $ref: '#/components/schemas/Timestamp'
                    - type: 'null'
  parameters:
    Range:
      name: range
      in: query
      description: Atajo relativo; el servidor lo resuelve y lo devuelve en `meta`.
      schema:
        $ref: '#/components/schemas/RelativeRange'
    From:
      name: from
      in: query
      description: Inicio RFC 3339 UTC, intervalo semiabierto `[from, to)`. Excluyente con `range`.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Fin RFC 3339 UTC (por defecto, ahora).
      schema:
        type: string
        format: date-time
    Step:
      name: step
      in: query
      description: Segundos por bucket; omitido → el servidor elige (≤ ~500 puntos/serie).
      schema:
        type: integer
        minimum: 60
    SiteIdFilter:
      name: site_id
      in: query
      description: Filtro por nodo (multivalor por comas).
      schema:
        type: string
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: Defensa CSRF en rutas autenticadas por cookie; valor fijo `horus`.
      schema:
        type: string
        const: horus
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Recomendado en `POST`.
      schema:
        type: string
        format: uuid
    ClientPrefixId:
      name: client_prefix_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag (`"<version>"`) del recurso; falta → 428, no coincide → 412 con `current`.
      schema:
        type: string
        examples:
          - '"7"'
    Limit:
      name: limit
      in: query
      description: Tamaño de página (1–200, por defecto 50). Fuera de rango → 400.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco (`page.next_cursor`); ligado a filtros, orden y `tid`. Ajeno → `400 INVALID_CURSOR`.
      schema:
        type: string
        maxLength: 2048
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DashboardId:
      name: dashboard_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    WidgetId:
      name: widget_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
    FindingId:
      name: finding_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    KioskId:
      name: kiosk_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el cliente; obligatorio en acciones con efecto externo (falta → 428).
      schema:
        type: string
        format: uuid
    IncludeTotal:
      name: include_total
      in: query
      description: Solo en colecciones administrativas pequeñas; ignorado en las grandes.
      schema:
        type: boolean
        default: false
    Q:
      name: q
      in: query
      description: Búsqueda libre por prefijo/trigram sobre los campos documentados. Nunca IPs de clientes (D1).
      schema:
        type: string
        maxLength: 128
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RouterId:
      name: router_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SiteId:
      name: site_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    Unauthorized:
      description: Sin token, token expirado (`TOKEN_EXPIRED`) o sesión revocada.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples:
              - Bearer error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No existe o el llamante no puede saber que existe (otro tenant → siempre 404).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Módulo caído o degradado (`SERVICE_UNAVAILABLE`, `ANALYTICS_UNAVAILABLE`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Validación semántica (`errors[]`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: Timeout (`TIMEOUT`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: JSON mal formado, parámetro inválido, cursor corrupto, filtro u orden no permitido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Sin permiso, ámbito de token inválido, `Origin` no permitido, 2FA/re-auth requerida, kiosco fuera de su lista blanca.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoContent:
      description: Sin contenido.
    TooManyRequests:
      description: Rate limit por sesión, IP o tenant (`RATE_LIMITED`, `TENANT_RATE_LIMITED`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: '`If-Match` no coincide; incluye `current`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicto de estado o unicidad; `Idempotency-Key` en vuelo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Falta `If-Match` o `Idempotency-Key` obligatorio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    RetryAfter:
      description: Segundos hasta reintentar.
      schema:
        type: integer
    RateLimit:
      description: Draft IETF ratelimit-headers, p. ej. `"default";r=412;t=23`.
      schema:
        type: string
    RateLimitPolicy:
      description: p. ej. `"default";q=600;w=60`.
      schema:
        type: string
    ETag:
      description: Versión del recurso (`"<version>"`).
      schema:
        type: string
    Location:
      description: URL absoluta o relativa del recurso creado; las absolutas se construyen con HORUS_PUBLIC_BASE_URL (D14), nunca con `Host`.
      schema:
        type: string
