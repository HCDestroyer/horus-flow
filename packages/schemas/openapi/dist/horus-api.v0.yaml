        layout:
          $ref: '#/components/schemas/Layout'
        positions:
          type: object
          description: widget_id → posición; debe cubrir todos los widgets del dashboard.
          additionalProperties:
            $ref: '#/components/schemas/Position'
      additionalProperties: false
    WidgetPatch:
      type: object
      properties:
        title:
          type:
            - string
            - 'null'
          maxLength: 80
        position:
          $ref: '#/components/schemas/Position'
        config:
          type: object
        refresh_seconds:
          type:
            - integer
            - 'null'
          minimum: 5
          maximum: 3600
      additionalProperties: false
    StateData:
      type: object
      required:
        - kind
        - values
      properties:
        kind:
          const: state
        values:
          type: object
          description: Clave → valor (número, string, booleano, null o mapa de conteos).
          additionalProperties:
            type:
              - number
              - string
              - boolean
              - 'null'
              - object
      additionalProperties: false
    SeriesData:
      type: object
      required:
        - kind
        - series
      properties:
        kind:
          const: series
        series:
          type: array
          items:
            type: object
            required:
              - metric
              - unit
              - points
            properties:
              metric:
                type: string
              unit:
                type: string
              group:
                type:
                  - string
                  - 'null'
              points:
                type: array
                items:
                  type: array
                  prefixItems:
                    - type: string
                      format: date-time
                    - type:
                        - number
                        - 'null'
