            - cpu_percent
            - cpu_max_core_percent
            - memory_percent
            - temperature_celsius
            - cpu_temperature_celsius
            - interface_errors
            - interface_down
        level:
          type: string
          enum:
            - warning
            - critical
        value:
          type: number
        threshold:
          type: number
        interface_name:
          type:
            - string
            - 'null'
    RouterStatus:
      type: object
      required:
        - router_id
        - site_id
        - name
        - site_name
        - status
        - observed_state
        - reason
        - since
        - last_observed_at
        - signals
        - device
        - uplink
        - interfaces_up
        - interfaces_total
        - thresholds
        - last_flow_at
      properties:
        router_id:
          $ref: '#/components/schemas/Uuid'
        site_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        site_name:
          type: string
        status:
          $ref: '#/components/schemas/RouterEffectiveStatus'
        observed_state:
          oneOf:
            - $ref: '#/components/schemas/RouterObservedState'
            - type: 'null'
        reason:
          oneOf:
            - $ref: '#/components/schemas/RouterStateReason'
            - type: 'null'
        since:
