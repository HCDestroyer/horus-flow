          schema:
            type: string
            examples:
              - offline,critical
      responses:
        '200':
          description: Routers con su estado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RouterStatus'
                  meta:
                    type: object
                    required:
                      - poller
                      - generated_at
                    properties:
                      poller:
                        $ref: '#/components/schemas/PollerHealth'
                      generated_at:
                        $ref: '#/components/schemas/Timestamp'
