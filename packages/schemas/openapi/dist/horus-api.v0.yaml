          type: string
          maxLength: 80
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/PlaylistItem'
        transition:
          type: string
          enum:
            - fade
            - none
          default: fade
      additionalProperties: false
    ReportKind:
      type: string
      description: Tipo de reporte (enum abierto; I3 trae el semanal de seguridad).
      enum:
        - security_weekly
    ReportFormat:
      type: string
      enum:
        - pdf
        - csv
    ReportDefinition:
      type: object
      required:
        - id
        - tenant_id
        - kind
        - enabled
        - weekday
        - hour
        - minute
        - timezone
        - formats
        - recipients
        - next_run_at
        - email_available
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/ReportKind'
        enabled:
          type: boolean
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: 'Día ISO de la ejecución: 1 = lunes … 7 = domingo.'
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
        timezone:
          type: string
          description: Zona IANA (por defecto la del ISP).
        formats:
          type: array
          items:
            $ref: '#/components/schemas/ReportFormat'
        recipients:
          type: array
          maxItems: 20
          items:
            type: string
            format: email
        next_run_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Próxima ejecución (null si está deshabilitada).
        email_available:
          type: boolean
          description: La instalación tiene SMTP para el aviso a los destinatarios.
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ReportDefinitionPatch:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
        timezone:
          type: string
        formats:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReportFormat'
        recipients:
          type: array
          maxItems: 20
          items:
            type: string
            format: email
    ReportStatus:
      type: string
      enum:
        - queued
        - running
        - completed
        - failed
    ReportFile:
      type: object
      required:
        - format
        - size_bytes
        - sha256
        - download_path
      properties:
        format:
          $ref: '#/components/schemas/ReportFormat'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        download_path:
          type: string
          description: Ruta de descarga (`/api/v1/reports/{id}/download?format=pdf`), autenticada.
    ReportRun:
      type: object
      required:
        - id
        - tenant_id
        - kind
        - status
        - definition_id
        - scheduled
        - period_from
        - period_to
        - timezone
        - iso_week
        - formats
        - files
        - size_bytes
        - personal_data_masked
        - error
        - created_by
        - created_at
        - started_at
        - completed_at
        - expires_at
        - expired
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/ReportKind'
        status:
          $ref: '#/components/schemas/ReportStatus'
        definition_id:
          type:
            - string
            - 'null'
          format: uuid
          description: Definición que la programó; null = a petición.
        scheduled:
          type: boolean
        period_from:
          $ref: '#/components/schemas/Timestamp'
        period_to:
          $ref: '#/components/schemas/Timestamp'
          description: Fin excluyente del periodo `[period_from, period_to)`.
        timezone:
          type: string
          description: Zona IANA con la que se calculó y se muestra el periodo.
        iso_week:
          type: string
          pattern: ^[0-9]{4}-W[0-9]{2}$
          description: Semana ISO del inicio del periodo.
        formats:
          type: array
          items:
            $ref: '#/components/schemas/ReportFormat'
        files:
          type: array
          items:
            $ref: '#/components/schemas/ReportFile'
          description: Archivos de la variante que descargaría quien pregunta (ver `personal_data_masked`).
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        personal_data_masked:
          type: boolean
          description: |
            `true` si quien pregunta no tiene `customers.read` con alcance de todo el ISP: `files` (tamaño y SHA-256)
            son los de la variante con las IPs y los alias de clientes enmascarados.
        error:
          type:
            - string
            - 'null'
          description: Motivo legible del fallo (sin detalles internos).
        created_by:
          type:
            - string
            - 'null'
          format: uuid
          description: Usuario que lo pidió; null = programado.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Cuándo se borran los archivos (retención, 365 días por defecto).
        expired:
          type: boolean
          description: Los archivos ya se borraron por la retención.
    ReportCreate:
      type: object
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/ReportKind'
        from:
          type: string
          format: date-time
          description: Inicio (con `to`); omitidos = última semana ISO completa.
        to:
          type: string
          format: date-time
        formats:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReportFormat'
          description: Por defecto PDF y CSV.
    AllowlistEntry:
      type: object
      required:
        - id
        - tenant_id
        - reason
        - created_at
        - created_by
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        prefix:
          type:
            - string
            - 'null'
        asn:
          type:
            - integer
            - 'null'
        kinds:
          type: array
          items:
            type: string
        reason:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        created_by:
          $ref: '#/components/schemas/Uuid'
    RoleCreate:
      type: object
      required:
        - key
        - name
        - permissions
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,62}$
          description: Único en el ISP; no puede coincidir con un rol de sistema.
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            description: Clave de permiso de ISP del catálogo (GET /permissions).
    RolePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
    RouterInput:
      type: object
      additionalProperties: false
      required:
        - site_id
        - name
      properties:
        site_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 120
          description: Hostname / identidad del router.
        display_name:
          type:
            - string
            - 'null'
          maxLength: 120
        is_primary:
          type: boolean
          default: true
        vendor:
          type: string
          enum:
            - mikrotik
          default: mikrotik
        model:
          type:
            - string
            - 'null'
          examples:
            - CCR2116-12G-4S+
        routeros_version:
          type:
            - string
            - 'null'
          pattern: ^7\.[0-9]+(\.[0-9]+)?$
          description: 'Declarada por el admin (D15: solo RouterOS 7.x). Se sobrescribe con la detectada.'
        tags:
          type: array
          items:
            type: string
    CredentialStatus:
      type: object
      required:
        - kind
        - configured
      properties:
        kind:
          type: string
          enum:
            - snmp
            - routeros_api
        configured:
          type: boolean
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_result:
          type:
            - string
            - 'null'
          enum:
            - ok
            - auth_failed
            - unreachable
            - tls_fingerprint_changed
            - null
        tls_fingerprint_sha256:
          type:
            - string
            - 'null'
          description: Huella SHA-256 del certificado TLS fijada para la API de RouterOS (solo routeros_api; null hasta el primer contacto).
    Router:
      allOf:
        - $ref: '#/components/schemas/TenantScopedResource'
        - $ref: '#/components/schemas/RouterInput'
        - type: object
          required:
            - admin_state
            - onboarding_state
            - routeros_version_supported
            - tunnel_address
            - warnings
          properties:
            admin_state:
              type: string
              enum:
                - active
                - maintenance
                - decommissioned
            onboarding_state:
              type: string
              description: |
                Pasos del asistente (I1-19): `pending_configuration` → `key_received` (clave pública enrolada)
                → `tunnel_up` (primer handshake) → `exporting` (primer flujo). Enum abierto.
              enum:
                - pending_configuration
                - key_received
                - tunnel_up
                - exporting
            routeros_version_detected:
              type:
                - string
                - 'null'
            routeros_version_supported:
              type:
                - boolean
                - 'null'
              description: false si la versión (detectada o declarada) es < 7.12 (D15); null si se desconoce.
            tunnel_address:
              type:
                - string
                - 'null'
              description: IP /32 de túnel WireGuard asignada por la IPAM de plataforma = identidad del exportador.
            wireguard_peer_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            warnings:
              type: array
              items:
                type: string
                enum:
                  - routeros_version_unsupported
                  - traffic_flow_target_drift
                  - hardware_offload_suspected
            credentials:
              type: array
              items:
                $ref: '#/components/schemas/CredentialStatus'
    RouterObservedState:
      type: string
      enum:
        - online
        - warning
        - critical
        - degraded
        - offline
    RouterStateReason:
      type: string
      description: Enum abierto (events.md §8.4).
      examples:
        - ok
        - cpu_high
        - memory_high
        - temperature_high
        - snmp_unreachable
        - snmp_auth_failed
        - tunnel_down
        - host_unreachable_via_tunnel
        - exporter_silent
        - interface_down
        - psu_failed
        - fan_failed
    RouterSignals:
      type: object
      description: Las señales que sostienen el estado; `unknown` mientras no haya observación.
      required:
        - icmp
        - snmp
        - wireguard
        - exporter
      properties:
        icmp:
          type: string
          enum:
            - ok
            - fail
            - unknown
        snmp:
          type: string
          enum:
            - ok
            - fail
            - auth_failed
            - unknown
        wireguard:
          type: string
          enum:
            - ok
            - stale
            - never
            - unknown
        exporter:
          type:
            - string
            - 'null'
          description: Estado del exportador de flujos (flows.yaml FlowExporterState) o null si no aplica.
    RouterDeviceSample:
      type: object
      description: Última muestra del dispositivo. Cada campo es null si el sondeo no lo obtuvo (modelo sin sensor, OID ausente).
      required:
        - sampled_at
      properties:
        sampled_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        poll_duration_ms:
          type:
            - integer
            - 'null'
        uptime_seconds:
          type:
            - integer
            - 'null'
        cpu_percent:
          type:
            - number
            - 'null'
          description: Media de los núcleos.
        cpu_max_core_percent:
          type:
            - number
            - 'null'
          description: Núcleo más cargado (Traffic Flow carga uno).
        cpu_cores:
          type:
            - integer
            - 'null'
        memory_percent:
          type:
            - number
            - 'null'
        memory_used_bytes:
          oneOf:
            - $ref: '#/components/schemas/Uint64String'
            - type: 'null'
        memory_total_bytes:
          oneOf:
            - $ref: '#/components/schemas/Uint64String'
            - type: 'null'
        temperature_celsius:
          type:
            - number
            - 'null'
          description: Placa (mtxrHlTemperature).
        cpu_temperature_celsius:
          type:
            - number
            - 'null'
        voltage:
          type:
            - number
            - 'null'
        firmware:
          type:
            - string
            - 'null'
          examples:
            - 7.16.2
        model:
          type:
            - string
            - 'null'
          examples:
            - CCR2116-12G-4S+
        serial_number:
          type:
            - string
            - 'null'
        icmp_rtt_ms:
          type:
            - number
            - 'null'
        icmp_loss_ratio:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
        sensors:
          type: array
          description: Sensores propios del fabricante (mtxrGaugeTable) tal cual los expone.
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
              value:
                type: number
              unit:
                type:
                  - string
                  - 'null'
    RouterUplink:
      type: object
      description: Interfaz que resume el tráfico del router (la de más subida hacia fuera; `flow_role` upstream si está marcado).
      required:
