        occurrences:
          type: integer
          minimum: 1
          description: Ocurrencias acumuladas en el hallazgo abierto (deduplicación por ISP, cliente, kind y objetivo principal).
        reasons:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/$defs-Reason'
        evidence:
