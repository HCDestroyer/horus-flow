        config:
          oneOf:
            - $ref: '#/components/schemas/EmailChannelConfig'
            - $ref: '#/components/schemas/TelegramChannelConfig'
            - $ref: '#/components/schemas/LibreNmsChannelConfig'
            - $ref: '#/components/schemas/WebhookChannelConfig'
        subscription:
          $ref: '#/components/schemas/ChannelSubscription'
        include_personal_data:
          type: boolean
    ConnectionTestResult:
      type: object
      required:
        - ok
        - channel_id
        - channel_kind
        - checked_at
      additionalProperties: false
      properties:
        ok:
          type: boolean
        channel_id:
          $ref: '#/components/schemas/Uuid'
        channel_kind:
          $ref: '#/components/schemas/NotificationChannelKind'
        checked_at:
          $ref: '#/components/schemas/Timestamp'
        latency_ms:
          type:
            - integer
            - 'null'
        remote_version:
          type:
            - string
            - 'null'
          description: 'librenms: versión que informa la API, si la expone.'
        error_code:
          description: Sin valor si `ok`. Enum abierto.
          anyOf:
            - type: string
              enum:
                - dns_failed
                - connect_failed
                - tls_invalid
                - auth_failed
                - forbidden
                - timeout
                - unexpected_response
                - missing_credentials
                - chat_not_found
                - bot_not_member
                - bot_cannot_post
                - not_allowed
            - type: 'null'
        error:
          type:
            - string
            - 'null'
          description: |
            Sin secretos ni cuerpo de la respuesta remota; en Telegram incluye la `description` de la Bot API saneada (sin el
            token). `telegram`: `getMe` + `getChat` + `getChatMember` (en un canal el bot debe ser administrador con
            `can_post_messages`).
        bot_username:
          type:
            - string
            - 'null'
          description: 'telegram: @usuario del bot.'
        chat_title:
          type:
            - string
            - 'null'
          description: 'telegram: título del chat comprobado.'
    NotificationChannelCredentials:
      type: object
      description: Secretos write-only por `kind` (nunca devueltos). Ver `PUT /notification-channels/{id}/credentials`.
      additionalProperties: false
      minProperties: 1
      properties:
        telegram_bot_token:
          type: string
