                - failing
                - disabled
            has_credentials:
              type: boolean
            last_delivery_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_error:
              type:
                - string
                - 'null'
              description: Sin datos sensibles.
    TelegramBotInfo:
