    Meta:
      type: object
      required:
        - widget_type
        - data_endpoint_kind
        - generated_at
        - partial
        - masked_personal_data
      properties:
        widget_type:
          type: string
        data_endpoint_kind:
          type: string
          enum:
            - state
            - series
            - table
        generated_at:
          type: string
          format: date-time
        from:
          type:
            - string
            - 'null'
          format: date-time
        to:
          type:
            - string
            - 'null'
          format: date-time
        step:
          type:
            - integer
            - 'null'
        partial:
          type: boolean
        coverage:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
        freshness_seconds:
          type:
            - integer
            - 'null'
          description: Edad del dato más reciente (la UI marca atrasado > 2× el intervalo esperado y obsoleto > 5×).
        masked_personal_data:
          type: boolean
          description: true si se enmascararon IPs (kiosco sin show_personal_data o usuario sin customers.read).
        cache:
          type: string
          enum:
            - hit
            - miss
      additionalProperties: false
    widget-data.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.horus-flow.local/dashboard/v0/widget-data.schema.json
      title: WidgetData
      description: 'Respuesta de GET /dashboards/{id}/widgets/{wid}/data y POST /widget-data/preview (C9). La forma de `data` depende de data_endpoint_kind del tipo: state (valores actuales), series (series temporales con huecos null) o table (filas). Huecos como ausencia, nunca ceros.'
      type: object
      required:
        - data
        - meta
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/StateData'
            - $ref: '#/components/schemas/SeriesData'
            - $ref: '#/components/schemas/TableData'
        meta:
          $ref: '#/components/schemas/Meta'
      additionalProperties: false
      $defs:
        SecurityState:
          description: 'Estado de seguridad del cliente (= SecurityState de la API) con su etiqueta de presentación (D18): `title` es la etiqueta es-ES que usan UI, kiosco y alertas (clave i18n `security_state.<valor>`). `infected` se muestra como "Infectado", siempre junto a sus razones y nivel de confianza (nunca la palabra sola).'
          oneOf:
            - const: clean
              title: Limpio
            - const: suspected
              title: Sospechoso
            - const: infected
              title: Infectado
            - const: mitigated
              title: Mitigado
        Meta:
          type: object
          required:
            - widget_type
            - data_endpoint_kind
            - generated_at
            - partial
            - masked_personal_data
          properties:
            widget_type:
              type: string
            data_endpoint_kind:
              type: string
              enum:
                - state
                - series
                - table
            generated_at:
              type: string
              format: date-time
            from:
              type:
                - string
                - 'null'
              format: date-time
            to:
              type:
                - string
                - 'null'
              format: date-time
            step:
              type:
                - integer
                - 'null'
            partial:
              type: boolean
            coverage:
              type:
                - number
                - 'null'
              minimum: 0
              maximum: 1
            freshness_seconds:
              type:
                - integer
                - 'null'
              description: Edad del dato más reciente (la UI marca atrasado > 2× el intervalo esperado y obsoleto > 5×).
            masked_personal_data:
              type: boolean
              description: true si se enmascararon IPs (kiosco sin show_personal_data o usuario sin customers.read).
            cache:
              type: string
              enum:
                - hit
                - miss
          additionalProperties: false
        StateData:
          type: object
          required:
            - kind
            - values
          properties:
            kind:
              const: state
            values:
              type: object
              description: Clave → valor (número, string, booleano, null o mapa de conteos).
              additionalProperties:
                type:
                  - number
                  - string
                  - boolean
                  - 'null'
                  - object
          additionalProperties: false
        SeriesData:
          type: object
          required:
            - kind
            - series
          properties:
            kind:
              const: series
            series:
              type: array
              items:
                type: object
                required:
                  - metric
                  - unit
                  - points
                properties:
                  metric:
                    type: string
                  unit:
                    type: string
                  group:
                    type:
                      - string
                      - 'null'
                  points:
                    type: array
                    items:
                      type: array
                      prefixItems:
                        - type: string
                          format: date-time
                        - type:
                            - number
                            - 'null'
                      minItems: 2
                      maxItems: 2
                additionalProperties: false
          additionalProperties: false
        TableData:
          type: object
          required:
            - kind
            - columns
            - rows
          properties:
            kind:
              const: table
            columns:
              type: array
              items:
                type: object
                required:
                  - key
                  - type
                properties:
                  key:
                    type: string
                  type:
                    type: string
                    enum:
                      - string
                      - number
                      - bytes
                      - bps
                      - percent
                      - timestamp
                      - ip
                      - severity
                      - state
                  personal_data:
                    type: boolean
                    default: false
                additionalProperties: false
            rows:
              type: array
              maxItems: 200
              items:
                type: object
            others:
              type:
                - object
                - 'null'
              description: Fila 'Otros' de los top N.
          additionalProperties: false
    FindingTransition:
      type: object
      properties:
        comment:
          type:
            - string
            - 'null'
          maxLength: 2000
        actions_taken:
          type: array
          description: Códigos de las acciones recomendadas que el operador aplicó a mano (D11; informativo).
          items:
            type: string
    FlowExporterState:
      type: string
      description: Enum abierto.
      enum:
        - pending_configuration
        - exporting
        - silent
        - lossy
        - clock_skew
    FlowExporter:
      type: object
      required:
        - tenant_id
        - router_id
        - site_id
        - state
        - state_since
        - exporter_ip
        - last_flow_at
        - flows_per_second
        - loss_ratio_5m
        - clock_skew_seconds
        - flow_source
        - sampling_rate
        - version
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        router_id:
          $ref: '#/components/schemas/Uuid'
        site_id:
          $ref: '#/components/schemas/Uuid'
        version:
          $ref: '#/components/schemas/Version'
        state:
          $ref: '#/components/schemas/FlowExporterState'
        state_since:
          $ref: '#/components/schemas/Timestamp'
        exporter_ip:
          type:
            - string
            - 'null'
          description: IP de túnel del router (identidad del exportador).
        last_flow_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        flows_per_second:
          type:
            - number
            - 'null'
        loss_ratio_5m:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
        clock_skew_seconds:
          type:
            - number
            - 'null'
        flow_source:
          type:
            - string
            - 'null'
          enum:
            - ipfix
            - netflow_v9
            - netflow_v5
            - null
        sampling_rate:
          type:
            - integer
            - 'null'
          minimum: 1
        coverage_ratio:
          type:
            - number
            - 'null'
          description: Bytes en flujos / bytes del uplink por SNMP (I2+); null si no hay SNMP.
        dropped_records_quota_1h:
          $ref: '#/components/schemas/Uint64String'
        hints:
          type: array
          description: Qué revisar (códigos traducibles), p. ej. firewall, ruta al hub, Traffic Flow, offload por hardware.
          items:
            type: string
            enum:
              - check_tunnel
              - check_traffic_flow_target
              - check_firewall
              - hardware_offload_suspected
              - check_ntp
    InfraCheckType:
      type: string
      description: |
        `icmp` (ping), `tcp` (conexión al puerto), `http` (GET con estado esperado; no se guarda el cuerpo) — activos,
        desde el rol `snmp`. `no_traffic` (bytes hacia/desde el objetivo en la ventana por debajo del mínimo, solo si
        antes tuvo tráfico) y `ddos_inbound` (pps/bps entrantes por encima del umbral → `degraded`) — pasivos, desde
        los flujos.
      enum:
        - icmp
        - tcp
        - http
        - no_traffic
        - ddos_inbound
    InfraCheck:
      type: object
      description: Un chequeo. Solo se aceptan los campos de su `type`; `id` lo asigna el servidor y se conserva al editar.
      required:
        - type
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/InfraCheckType'
        port:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 65535
          description: 'tcp y http (http: 80/443 por defecto).'
        path:
          type:
            - string
            - 'null'
          maxLength: 256
          description: http; ruta absoluta, por defecto /.
        https:
          type:
            - boolean
            - 'null'
          description: http.
        tls_verify:
          type:
            - boolean
            - 'null'
          description: http con https; por defecto true.
        expected_status_min:
          type:
            - integer
            - 'null'
          minimum: 100
          maximum: 599
          description: http; por defecto 200.
        expected_status_max:
          type:
            - integer
            - 'null'
          minimum: 100
          maximum: 599
          description: http; por defecto 399.
        forward_port:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 65535
          description: tcp y http con `probe_via_router_id`; puerto de la IP de túnel del router que reenvía a `port` del servidor.
        window_minutes:
          type:
            - integer
            - 'null'
          minimum: 5
          maximum: 1440
          description: no_traffic; por defecto 15.
        min_bytes:
          type:
            - integer
            - 'null'
          minimum: 1
          description: no_traffic; por defecto 1.
        pps_threshold:
          type:
            - number
            - 'null'
          exclusiveMinimum: 0
          description: ddos_inbound (al menos uno de los dos umbrales).
        bps_threshold:
          type:
            - number
            - 'null'
          exclusiveMinimum: 0
          description: ddos_inbound.
    InfraServiceState:
      type: string
      description: Estado de un servicio o chequeo. `degraded` = responde pero con un problema (p. ej. `ddos_inbound`).
      enum:
        - up
        - down
        - degraded
        - unknown
    InfraServiceStatus:
      type: object
      description: Estado del servicio = el peor de sus chequeos conocidos (down > degraded > up); `unknown` solo si ningún chequeo tiene estado todavía.
      required:
        - state
        - reason
        - check_type
        - since
      properties:
        state:
          $ref: '#/components/schemas/InfraServiceState'
        reason:
          type:
            - string
            - 'null'
        check_type:
          description: Chequeo que determina el estado (null si todos están up o no hay chequeos).
          oneOf:
            - $ref: '#/components/schemas/InfraCheckType'
            - type: 'null'
        since:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    InfraCheckResult:
      type: object
      required:
        - at
        - state
        - latency_ms
        - reason
      properties:
        at:
          $ref: '#/components/schemas/Timestamp'
        state:
          $ref: '#/components/schemas/InfraServiceState'
        latency_ms:
          type:
            - number
            - 'null'
        reason:
          type:
            - string
            - 'null'
    InfraCheckStatus:
      type: object
      description: Estado actual de un chequeo con histéresis (`failures_before_down` fallos seguidos → down; `recoveries_before_up` éxitos → up).
      required:
        - check_id
        - type
        - state
        - reason
        - since
        - last_checked_at
        - latency_ms
        - consecutive_failures
        - consecutive_successes
        - detail
      properties:
        check_id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/InfraCheckType'
        state:
          $ref: '#/components/schemas/InfraServiceState'
        reason:
          type:
            - string
            - 'null'
          description: 'Enum abierto: ok, timeout, refused, unreachable, tls_error, http_status, no_traffic, ddos_inbound, no_flow_data, icmp_unavailable, router_unavailable…'
        since:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_checked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        latency_ms:
          type:
            - number
            - 'null'
        consecutive_failures:
          type: integer
          minimum: 0
        consecutive_successes:
          type: integer
          minimum: 0
        detail:
          type:
            - string
            - 'null'
          description: Medida del último resultado sin datos sensibles (p. ej. "HTTP 503", "1250 pps entrantes").
        recent:
          type: array
          description: Solo en el detalle (GET /infra-services/{id}); últimos resultados, el más reciente primero.
          items:
            $ref: '#/components/schemas/InfraCheckResult'
    InfraService:
      allOf:
        - $ref: '#/components/schemas/TenantScopedResource'
        - type: object
          required:
            - name
            - site_id
            - target
            - target_private
            - kind
            - checks
            - interval_seconds
            - failures_before_down
            - recoveries_before_up
            - enabled
            - probe_via_router_id
            - status
            - check_status
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
            site_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            target:
              $ref: '#/components/schemas/IpAddress'
              description: IP del servidor del ISP (infraestructura propia, no de un cliente).
            target_private:
              type: boolean
              description: 'RFC 1918 / ULA / CGNAT: puede necesitar el script de router.'
            kind:
              type: string
              description: Etiqueta libre (iptv | http | dns | radius | other | …).
              examples:
                - iptv
                - http
                - dns
                - radius
                - other
            checks:
              type: array
              items:
                $ref: '#/components/schemas/InfraCheck'
            interval_seconds:
              type: integer
              minimum: 30
              maximum: 3600
            failures_before_down:
              type: integer
              minimum: 1
              maximum: 20
            recoveries_before_up:
              type: integer
              minimum: 1
              maximum: 20
            enabled:
              type: boolean
            probe_via_router_id:
              description: Si se fija, los chequeos tcp/http van a la IP de túnel de ese router en `forward_port` (servidor privado con reenvío).
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            status:
              $ref: '#/components/schemas/InfraServiceStatus'
            check_status:
              type: array
              items:
                $ref: '#/components/schemas/InfraCheckStatus'
    InfraSchedulerHealth:
      type: object
      required:
        - enabled
        - healthy
        - last_cycle_at
        - passive_checks
      properties:
        enabled:
          type: boolean
          description: 'false: el rol snmp no vigila (HORUS_SNMP_ENABLED=false).'
        healthy:
          type: boolean
        last_cycle_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        passive_checks:
          type: boolean
          description: 'false: sin lector de flujos (ClickHouse); no_traffic y ddos_inbound quedan unknown.'
    InfraServiceInput:
      type: object
      required:
        - name
        - target
        - kind
        - checks
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        site_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        target:
          $ref: '#/components/schemas/IpAddress'
        kind:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-z0-9][a-z0-9_-]*$
        checks:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/InfraCheck'
        interval_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 60
        failures_before_down:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
        recoveries_before_up:
          type: integer
          minimum: 1
          maximum: 20
          default: 2
        enabled:
          type: boolean
          default: true
        probe_via_router_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    InfraServicePatch:
      type: object
      additionalProperties: false
      description: JSON Merge Patch; `checks` reemplaza la lista completa.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        site_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        target:
          $ref: '#/components/schemas/IpAddress'
        kind:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[a-z0-9][a-z0-9_-]*$
        checks:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/InfraCheck'
        interval_seconds:
          type: integer
          minimum: 30
          maximum: 3600
        failures_before_down:
          type: integer
          minimum: 1
          maximum: 20
        recoveries_before_up:
          type: integer
          minimum: 1
          maximum: 20
        enabled:
          type: boolean
        probe_via_router_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    InfraRouterSnippet:
      type: object
      required:
        - router_id
        - router_name
        - applicable
        - script
        - horus_side
        - warnings
      properties:
        router_id:
          $ref: '#/components/schemas/Uuid'
        router_name:
          type: string
        applicable:
          type: boolean
          description: false si el objetivo no es privado o no hay chequeos tcp/http con forward_port.
        script:
          type: string
          description: Script RouterOS (.rsc) para pegar; vacío si no aplica.
        horus_side:
          type: string
          description: Qué cambia (o no) del lado de Horus.
        warnings:
          type: array
          items:
            type: string
    ArgosConnection:
      type: object
      description: Cómo se preparó el conector con un enlace de conexión (contrato §1.4); null si se configuró a mano.
      required:
        - linked_at
        - method
        - peer_connector_id
        - api_token_id
        - notification_channel_id
      properties:
        linked_at:
          $ref: '#/components/schemas/Timestamp'
        method:
          type: string
          enum:
            - link_generated
            - link_redeemed
          description: link_generated = Argos canjeó un enlace de Horus; link_redeemed = Horus canjeó uno de Argos.
        peer_connector_id:
          type:
            - string
            - 'null'
          maxLength: 128
          description: '`conector_id` opaco del conector en ArgosISP.'
        api_token_id:
          description: API token `hf_pat_` emitido para ArgosISP en el canje (revocarlo corta su acceso).
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        notification_channel_id:
          description: Canal de notificación webhook hacia ArgosISP (se crea apagado).
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    ArgosIntegration:
      type: object
      required:
        - id
        - configured
        - enabled
        - base_url
        - has_token
        - webhook_url
        - has_webhook_secret
        - last_sync_at
        - last_sync_status
        - last_error
        - identities
        - stale_identities
        - version
        - connection
      properties:
        id:
          description: Id del conector (parte de webhook_url); null si nunca se configuró.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        configured:
          type: boolean
        enabled:
          type: boolean
        base_url:
          type:
            - string
            - 'null'
          examples:
            - https://argos.isp.example/api/v1
        has_token:
          type: boolean
        webhook_url:
          type:
            - string
            - 'null'
          description: URL a copiar en ArgosISP (con el secreto).
        has_webhook_secret:
          type: boolean
        last_sync_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_sync_status:
          type:
            - string
            - 'null'
          enum:
            - ok
            - degraded
            - failing
            - null
        last_error:
          type:
            - string
            - 'null'
        resolver:
          type:
            - string
            - 'null'
          enum:
            - batch
            - fallback
            - null
          description: batch = POST /integraciones/horus/resolver; fallback = GET /ip/:ip.
        identities:
          type: integer
          minimum: 0
          description: Identidades vigentes.
        stale_identities:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
        connection:
          description: Enlace de conexión con el que se preparó el conector (contrato §1.4); null si se configuró a mano.
          oneOf:
            - $ref: '#/components/schemas/ArgosConnection'
            - type: 'null'
    ArgosIntegrationInput:
      type: object
      additionalProperties: false
      required:
        - base_url
        - enabled
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
        enabled:
          type: boolean
        token:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 512
          description: Token atk_… de ArgosISP (solo escritura).
    ArgosConnectionRedeemRequest:
      type: object
      description: Cuerpo del contrato §1.4 (claves en español).
      required:
        - codigo
        - sistema
        - base_url
        - token
        - webhook
      properties:
        codigo:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
