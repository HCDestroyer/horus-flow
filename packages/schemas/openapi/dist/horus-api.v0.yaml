    UpdateStatus:
      type: object
      required:
        - status
        - current_version
        - channel
        - checked_at
        - update_available
      additionalProperties: false
      properties:
        status:
          type: string
          description: |
            `up_to_date`: no hay versión mayor en el canal. `available`: hay una (ver `latest`). `unchecked`: no se
            pudo consultar la fuente (sin Internet, fuente caída) o la comprobación está desactivada.
          enum:
            - up_to_date
            - available
            - unchecked
        current_version:
          type: string
          description: Versión instalada (HORUS_VERSION, semver).
          examples:
            - 1.2.3
        channel:
          type: string
          enum:
            - stable
            - beta
        update_available:
          type: boolean
        checked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        latest:
          oneOf:
            - type: 'null'
            - type: object
              required:
                - version
                - notes_url
                - upgrade_command
                - patch_only
              additionalProperties: false
              properties:
                version:
                  type: string
                  examples:
                    - 1.2.4
                published_at:
                  oneOf:
                    - $ref: '#/components/schemas/Timestamp'
                    - type: 'null'
                notes_url:
                  type: string
                  format: uri
                notes:
                  type:
                    - string
                    - 'null'
                  description: Notas del cambio (Markdown de la release), recortadas a 8 KiB.
                upgrade_command:
                  type: string
                  examples:
                    - sudo horus-ctl upgrade --to 1.2.4
                patch_only:
                  type: boolean
                  description: 'true si solo cambia Z (X.Y iguales): la actualización automática, si está activada, la aplicará en la ventana.'
        error:
          type:
            - string
            - 'null'
          description: Motivo de `unchecked` (texto para la consola; sin secretos).
