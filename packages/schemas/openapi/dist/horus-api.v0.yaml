          writeOnly: true
          minLength: 1
          maxLength: 256
          description: 'librenms: contraseña del usuario.'
        api_token:
          type: string
          writeOnly: true
          minLength: 16
          maxLength: 256
          description: 'librenms: token de API (opcional).'
        webhook_secret:
          type: string
          writeOnly: true
          minLength: 16
          maxLength: 256
          description: 'webhook: secreto HMAC que genera el receptor.'
    LibreNmsErrorCode:
      type: string
