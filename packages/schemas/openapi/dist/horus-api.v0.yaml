    post:
      tags:
        - onboarding
      operationId: enrollWireguard
      summary: El router registra su clave pública con el token de un uso (público, sin sesión)
      description: |
        Token de 256 bits (solo su hash en BD) ligado a (tenant, router, peer previsto), TTL 24 h, un uso,
        revocable; 5 fallos lo invalidan; 10/min por IP. Usado, caducado, revocado o de otro router →
        `ENROLLMENT_TOKEN_INVALID` sin distinguir el caso. Clave pública ya registrada → `409
        WIREGUARD_PUBLIC_KEY_IN_USE`. No devuelve secretos. Auditado y notificado al admin del ISP.
        RouterOS envía el cuerpo con `/tool fetch http-method=post http-header-field="Content-Type: application/json"`.
      x-module: wireguard
      x-scope: public
      x-permission: enrollment_token
      x-rate-limit: enroll
      x-increment: I1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - public_key
              additionalProperties: false
              properties:
                token:
                  type: string
                  minLength: 43
                  maxLength: 64
                  writeOnly: true
                public_key:
                  type: string
                  pattern: ^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$
                  description: Clave pública WireGuard (44 caracteres base64).
      responses:
        '202':
          description: Clave aceptada; el hub añade el peer en < 10 s.
          content:
            application/json:
              schema:
                type: object
                required:
                  - peer_status
                properties:
                  peer_status:
                    type: string
                    const: pending_handshake
