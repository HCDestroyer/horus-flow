    AccessMode:
      type: string
      description: |
        D19, por instalación (`HORUS_ACCESS_MODE`; si falta se deduce de `HORUS_PUBLIC_BASE_URL`: IP literal → `ip_only`).
        `domain`: dominio propio del cliente. `subdomain`: subdominio (del cliente o del proveedor de la instalación).
        `ip_only`: solo la IP pública del servidor; nada en Horus depende de tener dominio.
      enum:
        - domain
        - subdomain
        - ip_only
    TlsMode:
      type: string
      description: |
        `acme`: certificado automático (Let's Encrypt) para el nombre; obligatorio por defecto en `domain`/`subdomain`.
        `acme_ip`: certificado para IP si el emisor ACME lo soporta (solo `ip_only`, opcional).
        `self_signed`: certificado autogenerado en la instalación con SAN = IP (por defecto en `ip_only`).
        `provided`: certificado aportado por el operador (CA interna del ISP), en cualquier modo.
      enum:
        - acme
        - acme_ip
        - self_signed
        - provided
    InstallationAccess:
      type: object
      required:
        - access_mode
        - public_base_url
        - host
        - allowed_origins
        - wireguard_endpoint
        - tls
        - warnings
      additionalProperties: false
      properties:
        access_mode:
          $ref: '#/components/schemas/AccessMode'
        public_base_url:
          type: string
          format: uri
          description: HORUS_PUBLIC_BASE_URL; siempre `https://` (también en `ip_only`).
          examples:
            - https://horus.isp.example
            - https://203.0.113.10
        host:
          type: string
          description: Nombre o IP literal de HORUS_PUBLIC_BASE_URL.
          examples:
            - horus.isp.example
            - 203.0.113.10
        allowed_origins:
          type: array
          items:
            type: string
        wireguard_endpoint:
          type: string
          description: HORUS_WG_ENDPOINT (nombre o IP).
        tls:
          type: object
          required:
            - mode
            - hsts
            - not_after
            - fingerprint_sha256
          additionalProperties: false
          properties:
            mode:
              $ref: '#/components/schemas/TlsMode'
            hsts:
              type: boolean
              description: true solo con nombre y certificado de confianza pública (`domain`/`subdomain` + `acme`).
            issuer:
              type:
                - string
                - 'null'
            not_after:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            fingerprint_sha256:
              type:
                - string
                - 'null'
              pattern: ^[0-9A-F]{2}(:[0-9A-F]{2}){31}$
              description: Huella del certificado servido, para verificarla a mano con self_signed.
        warnings:
          type: array
          description: Avisos para la consola de plataforma (enum abierto de `code`).
          items:
            type: object
            required:
              - code
              - severity
              - message
            additionalProperties: false
            properties:
              code:
                anyOf:
                  - type: string
                    enum:
                      - ip_only_access
                      - self_signed_certificate
                      - certificate_expiring
                      - acme_renewal_failed
                  - type: string
                    pattern: ^[a-z][a-z0-9_]*$
              severity:
                type: string
                enum:
                  - info
                  - warning
                  - critical
              message:
                type: string
