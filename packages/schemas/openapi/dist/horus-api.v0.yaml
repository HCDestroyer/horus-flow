          type: object
          description: Objetivo principal que forma la clave de deduplicación junto con (tenant, customer, kind).
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum:
                - remote_ip
                - remote_port
                - remote_asn
                - remote_prefix
                - none
            value:
              type:
                - string
                - 'null'
          additionalProperties: false
        rule_version:
          type: string
          examples:
            - c2-contact@4
        reputation_snapshot_version:
          type:
            - integer
            - 'null'
        min_sampling_rate:
          type:
