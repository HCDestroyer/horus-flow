            - number
            - 'null'
        rx_pps:
          type:
            - number
            - 'null'
        tx_pps:
          type:
            - number
            - 'null'
        rx_errors_delta:
          type:
            - integer
            - 'null'
        tx_errors_delta:
          type:
            - integer
            - 'null'
        rx_drops_delta:
