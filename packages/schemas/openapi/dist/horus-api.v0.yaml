        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - routers-monitoring
      operationId: putRouterThresholds
      summary: Fija los umbrales propios del ISP (se aplican en el siguiente ciclo de sondeo)
      description: |
        CPU y memoria entre 1 y 100 %, temperatura entre 20 y 150 °C; el aviso no puede superar al crítico (`422`).
        `If-Match` opcional (ETag de la lectura; no coincide → `412`). Sin PostgreSQL en el rol snmp → `503`. Auditado
        (`snmp.thresholds.updated`, antes y después). Horus no escribe nada en los routers: solo cambia cómo evalúa sus
        métricas.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-audited: true
      x-increment: I2
      security:
        - tenantBearer: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
            examples:
              - '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterThresholdValues'
      responses:
        '200':
          description: Umbrales guardados.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterThresholds'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags:
        - routers-monitoring
      operationId: resetRouterThresholds
