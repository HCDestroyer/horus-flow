                  description: Rango propuesto (IPv4 /24 o más amplio; IPv6 /48 o más amplio).
                range:
                  $ref: '#/components/schemas/RelativeRange'
                'n':
                  type: integer
                  minimum: 1
                  maximum: 200
                  default: 50
      responses:
        '200':
          description: IPs del rango ordenadas por bytes.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - address
                        - bytes
                        - packets
                        - last_seen_at
                      properties:
                        address:
                          type: string
                          format: ip
                          examples:
                            - 100.64.12.17
                        bytes:
                          $ref: '#/components/schemas/Uint64String'
                        packets:
                          $ref: '#/components/schemas/Uint64String'
                        last_seen_at:
                          $ref: '#/components/schemas/Timestamp'
                  meta:
                    $ref: '#/components/schemas/AnalyticsMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /system/status:
    get:
      tags:
        - system
      operationId: getSystemStatus
      summary: Capacidades del sistema (resumen para todos; detalle solo con platform.status.read)
      x-module: gateway
      x-scope: session
      x-permission: authenticated
      x-principals:
        - user
        - api_token
        - kiosk
      x-increment: I0
      security:
        - tenantBearer: []
        - kioskBearer: []
        - sessionBearer: []
        - platformBearer: []
      responses:
        '200':
          description: Estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /widget-data/preview:
    post:
      tags:
        - dashboards
      operationId: previewWidgetData
      summary: Datos de un widget no guardado (editor; no disponible para kioscos)
      x-module: analytics
      x-scope: tenant
      x-permission: widget_type
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - config
              properties:
                type:
                  type: string
                config:
                  type: object
                range:
                  $ref: '#/components/schemas/RelativeRange'
      responses:
        '200':
          description: Datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/widget-data.schema'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /widget-types:
    get:
      tags:
        - dashboards
      operationId: listWidgetTypes
      summary: Catálogo de tipos de widget (sin tenant; autoritativo)
      x-module: analytics
      x-scope: session
      x-permission: authenticated
      x-principals:
        - user
        - api_token
        - kiosk
      x-increment: I0
      security:
        - tenantBearer: []
        - kioskBearer: []
        - sessionBearer: []
      responses:
        '200':
          description: Catálogo (fuente packages/schemas/dashboard/v0/widget-types.json).
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/widget-type.schema'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /wireguard/enrollment-tokens/{token_id}/revoke:
    parameters:
      - name: token_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    post:
      tags:
        - onboarding
      operationId: revokeEnrollmentToken
      summary: Revoca un token de enrolamiento no usado
      x-module: wireguard
      x-scope: tenant
      x-permission: wireguard.write
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /wireguard/peers:
    get:
      tags:
        - wireguard
      operationId: listWireguardPeers
      summary: Túneles (peers) de los routers del ISP
      x-module: wireguard
      x-scope: tenant
      x-permission: wireguard.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: router_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: handshake_state
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - last_handshake_at
              - '-last_handshake_at'
      responses:
        '200':
          description: Página de peers.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - page
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Peer'
                  page:
                    $ref: '#/components/schemas/PageInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /wireguard/peers/{peer_id}:
    parameters:
      - name: peer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags:
        - wireguard
      operationId: getWireguardPeer
      summary: Detalle del túnel ("Túnel activo · último handshake hace N s")
      x-module: wireguard
      x-scope: tenant
      x-permission: wireguard.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Peer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /ws/tickets:
    post:
      tags:
        - realtime
      operationId: createWsTicket
      summary: Ticket de un uso (30 s) para abrir el WebSocket ligado al `tid` del token
      description: |
        La conexión `wss://<dominio>/api/v1/ws?ticket=<ticket>` queda ligada al principal y al `tid` del token
        con el que se pidió el ticket. `Origin` se valida contra HORUS_ALLOWED_ORIGINS (D14). Sin Valkey → 503
        (el frontend pasa a polling).
      x-module: gateway
      x-scope: session
      x-permission: authenticated
      x-principals:
        - user
        - api_token
        - kiosk
      x-increment: I1
      security:
        - tenantBearer: []
        - kioskBearer: []
        - sessionBearer: []
      responses:
        '201':
          description: Ticket emitido.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ticket
                  - expires_at
                  - url
                properties:
                  ticket:
                    type: string
                    description: 256 bits base64url, un uso.
                  expires_at:
                    $ref: '#/components/schemas/Timestamp'
                  url:
                    type: string
                    description: URL absoluta del WebSocket construida con HORUS_PUBLIC_BASE_URL (D14).
                    examples:
                      - wss://horus.example.net/api/v1/ws
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    tenantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access JWT EdDSA de 10 min con `scope=tenant` y claim **`tid`** (ISP del token), emitido por
        `POST /auth/token {"tenant_id"}`. Todo endpoint con datos de ISP lo exige; el tenant nunca se
        toma de la ruta, query, cabecera o cuerpo. Un token `session`/`platform` en una ruta de tenant →
        `403 TOKEN_SCOPE_INVALID`. También lo obtienen los API tokens `hf_pat_…` (canjeados por el gateway).
    sessionBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT con `scope=session` (sin `tid`). Solo `/me*`, `/auth/*`, `/ws/tickets`, catálogos sin tenant.
    platformBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT con `scope=platform` (sin `tid`), solo para usuarios con rol de plataforma. Rutas `/platform/*`.
    kioskBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT de kiosco (`typ=kiosk`, `sub=kiosk:<id>`, `tid`), 10 min, solo lectura; solo rutas con `x-principals` que incluyan `kiosk`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-hf_rt
      description: Refresh opaco rotativo (`HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`, sin atributo `Domain`).
    kioskCookie:
      type: apiKey
      in: cookie
      name: __Secure-hf_kiosk
      description: Credencial de dispositivo kiosco (`HttpOnly; Secure; SameSite=Strict; Path=/api/v1/kiosk`, sin `Domain`).
    mcpToken:
      type: http
      scheme: bearer
      bearerFormat: hmcp
      description: Token MCP del asistente de IA (`hmcp_…`), creado en Administración › Inteligencia artificial; solo se guarda su hash. Solo `POST /assist/mcp`.
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 canónico.
      examples:
        - 0192f0c4-7a1e-7c3a-9b1d-2f6e8a4c1d55
    RelativeRange:
      type: string
      enum:
        - 15m
        - 1h
        - 6h
        - 24h
        - 7d
        - 30d
        - 90d
    Timestamp:
      type: string
      format: date-time
      description: UTC, RFC 3339 con `Z` y milisegundos.
      examples:
        - '2026-10-07T14:03:11.123Z'
    AnalyticsMeta:
      type: object
      required:
        - from
        - to
        - step
        - partial
        - coverage
      properties:
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
        step:
          type:
            - integer
            - 'null'
        agg:
          type: string
          enum:
            - avg
            - max
            - min
            - sum
            - last
            - p95
        source:
          type: string
          examples:
            - flows
            - snmp
        partial:
          type: boolean
          description: true si parte del rango no está disponible (retención, exportador silencioso, backend degradado).
        coverage:
          type: number
          minimum: 0
          maximum: 1
          description: Fracción del rango con datos. Huecos como ausencia, nunca ceros.
        generated_at:
          $ref: '#/components/schemas/Timestamp'
    SeriesResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          required:
            - series
          properties:
            series:
              type: array
              items:
                type: object
                required:
                  - metric
                  - unit
                  - points
                properties:
                  metric:
                    type: string
                    examples:
                      - down_bps
                  unit:
                    type: string
                    examples:
                      - bps
                  group:
                    type:
                      - string
                      - 'null'
                  points:
                    type: array
                    description: '[timestamp, valor|null]; huecos como null.'
                    items:
                      type: array
                      prefixItems:
                        - type: string
                          format: date-time
                        - type:
                            - number
                            - 'null'
                      minItems: 2
                      maxItems: 2
        meta:
          $ref: '#/components/schemas/AnalyticsMeta'
    ErrorCode:
      description: |
        Código estable UPPER_SNAKE_CASE (= `ErrorInfo.reason` de gRPC). **Enum abierto**: se listan los
        conocidos en v0; el cliente trata un código desconocido según el `status` HTTP.
      anyOf:
        - type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - TOKEN_EXPIRED
            - SESSION_REVOKED
            - PERMISSION_DENIED
            - ORIGIN_NOT_ALLOWED
            - MFA_REQUIRED
            - MFA_ENROLLMENT_REQUIRED
            - REAUTH_REQUIRED
            - NOT_FOUND
            - ALREADY_EXISTS
            - CONFLICT
            - PRECONDITION_FAILED
            - PRECONDITION_REQUIRED
            - IDEMPOTENCY_KEY_REUSED
            - IDEMPOTENCY_IN_PROGRESS
            - RATE_LIMITED
            - TENANT_RATE_LIMITED
            - INTERNAL
            - SERVICE_UNAVAILABLE
            - ANALYTICS_UNAVAILABLE
            - TIMEOUT
            - INVALID_CREDENTIALS
            - INVALID_CURSOR
            - INVALID_FILTER
            - INVALID_SORT_FIELD
            - TIME_RANGE_TOO_LARGE
            - TENANT_NOT_FOUND
            - TENANT_MISMATCH
            - TENANT_SUSPENDED
            - TOKEN_SCOPE_INVALID
            - KIOSK_FORBIDDEN
            - ROUTER_NOT_FOUND
            - ROUTER_PRIMARY_EXISTS
            - ROUTEROS_VERSION_UNSUPPORTED
            - ROUTER_UNREACHABLE
            - ROUTER_TLS_FINGERPRINT_CHANGED
            - ROUTER_TLS_FINGERPRINT_UNCONFIRMED
            - ROUTER_TLS_FINGERPRINT_MISMATCH
            - SITE_NOT_FOUND
            - SITE_NOT_EMPTY
            - PEER_ALREADY_REVOKED
            - WIREGUARD_IP_POOL_EXHAUSTED
            - WIREGUARD_PUBLIC_KEY_IN_USE
            - ENROLLMENT_TOKEN_INVALID
            - CUSTOMER_NOT_FOUND
            - CUSTOMER_KIND_LOCKED
            - CLIENT_PREFIX_OVERLAP
            - CLIENT_PREFIX_NOT_FOUND
            - ASN_RULE_NOT_FOUND
            - FINDING_NOT_FOUND
            - FINDING_STATE_INVALID
            - REPORT_NOT_FOUND
            - REPORT_NOT_READY
            - REPORT_EXPIRED
            - REPORT_DEFINITION_NOT_FOUND
            - DASHBOARD_NOT_FOUND
            - DASHBOARD_READ_ONLY
            - WIDGET_TYPE_NOT_ALLOWED
            - WIDGET_TYPE_UNKNOWN
            - WIDGET_CONFIG_INVALID
            - KIOSK_ENROLLMENT_CODE_INVALID
            - NOTIFICATION_CHANNEL_NOT_FOUND
            - NOTIFICATION_CHANNEL_KIND_NOT_AVAILABLE
            - NOTIFICATION_CHANNEL_UNREACHABLE
            - NOTIFICATION_CHANNEL_AUTH_FAILED
            - NOTIFICATION_CHANNEL_CREDENTIALS_MISSING
            - LIBRENMS_CHANNEL_REQUIRED
            - LIBRENMS_NOT_PROVISIONED
            - LIBRENMS_DEVICE_NOT_OWNED
            - NOTIFICATION_TELEGRAM_WEBHOOK_ACTIVE
            - NOTIFICATION_TELEGRAM_LINK_CODE_INVALID
            - NOTIFICATION_TELEGRAM_BOT_NOT_CONFIGURED
            - STORAGE_TARGET_UNREACHABLE
            - REPUTATION_SOURCE_NOT_FOUND
            - REPUTATION_SOURCE_READ_ONLY
            - REPUTATION_SOURCE_URL_NOT_ALLOWED
            - ROLE_NOT_FOUND
            - ROLE_READ_ONLY
            - ROLE_IN_USE
            - LAST_PLATFORM_ADMIN
            - WIREGUARD_HUB_NOT_FOUND
            - WIREGUARD_POOL_NOT_FOUND
            - WIREGUARD_POOL_OVERLAP
            - WIREGUARD_POOL_INVALID
            - WIREGUARD_POOL_IN_USE
            - REMOTE_DESTINATION_NOT_FOUND
            - REMOTE_DESTINATION_NOT_READY
            - REMOTE_DESTINATION_SYNC_RUNNING
            - API_TOKEN_NOT_FOUND
            - INTEGRATION_NOT_CONFIGURED
            - INTEGRATION_UNAVAILABLE
        - type: string
          pattern: ^[A-Z][A-Z0-9_]*$
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: Notación de puntos (`allowed_ips.0`).
        code:
          type: string
          examples:
            - INVALID_IP
            - NOT_FOUND
            - REQUIRED
        message:
          type: string
    Problem:
      type: object
      description: RFC 9457 `application/problem+json`. Lo producen los módulos y el gateway con el mismo formato.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          examples:
            - https://docs.horus-flow.local/errors/validation-failed
        title:
          type: string
          description: Texto humano en español; puede cambiar.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        trace_id:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        current:
          type: object
          additionalProperties: true
          description: Solo en 412; representación actual del recurso.
    Uint64String:
      type: string
      pattern: ^[0-9]{1,20}$
      description: Contador que puede superar 2^53, serializado como string decimal.
    TopRow:
      type: object
      required:
        - key
        - label
        - down_bytes
        - up_bytes
        - share
      properties:
        key:
          type: string
          description: ID de servicio/categoría/organización, ASN o customer_id.
        label:
          type: string
        down_bytes:
          $ref: '#/components/schemas/Uint64String'
        up_bytes:
          $ref: '#/components/schemas/Uint64String'
        share:
          type: number
          minimum: 0
          maximum: 1
        customer:
          type:
            - object
            - 'null'
          description: Solo con dimension=customers.
          properties:
            customer_id:
              $ref: '#/components/schemas/Uuid'
            address:
              type: string
              description: IP completa o enmascarada (`10.20.0.•••`) según permisos/kiosco.
            address_masked:
              type: boolean
            alias:
              type:
                - string
                - 'null'
            kind:
              type: string
    TopResult:
      type: object
      required:
        - dimension
        - rows
        - others
        - totals
      properties:
        dimension:
          type: string
        rows:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/TopRow'
        others:
          type: object
          required:
            - down_bytes
            - up_bytes
          properties:
            down_bytes:
              $ref: '#/components/schemas/Uint64String'
            up_bytes:
              $ref: '#/components/schemas/Uint64String'
        totals:
          type: object
          required:
            - down_bytes
            - up_bytes
          properties:
            down_bytes:
              $ref: '#/components/schemas/Uint64String'
            up_bytes:
              $ref: '#/components/schemas/Uint64String'
    ApiTokenTemplate:
      type: object
      required:
        - key
        - name
        - description
        - permissions
      properties:
        key:
          type: string
          examples:
            - argosisp
        name:
          type: string
          examples:
            - ArgosISP
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
    ApiToken:
      type: object
      required:
        - id
        - name
        - prefix
        - user_id
        - permissions
        - template
        - created_at
        - expires_at
        - last_used_at
        - last_used_ip
        - revoked_at
        - active
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        prefix:
          type: string
          description: Primeros caracteres del token (hf_pat_XXXX) para reconocerlo.
        user_id:
          $ref: '#/components/schemas/Uuid'
          description: Quien lo creó (el token actúa con sus permisos actuales ∩ los del token).
        permissions:
          type: array
          items:
            type: string
        template:
          type:
            - string
            - 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        last_used_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_used_ip:
          type:
            - string
            - 'null'
          description: IP del último canje (resolución ~2 min).
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        active:
          type: boolean
    ApiTokenInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples:
            - ArgosISP
        template:
          type:
            - string
            - 'null'
          enum:
            - argosisp
            - null
          description: Plantilla de permisos. Si también llega `permissions`, mandan estos.
        permissions:
          type: array
          maxItems: 64
          items:
            type: string
          description: Claves de permiso de tenant que el creador tiene ahora (nunca `api_tokens.manage`).
        expires_at:
          description: Caducidad (≥ 1 h, ≤ 1 año). Por defecto, dentro de un año.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    ApiTokenIssued:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required:
            - token
          properties:
            token:
              type: string
              pattern: ^hf_pat_[0-9A-Za-z]{43}$
              description: Valor del token. Solo en esta respuesta.
    Version:
      type: integer
      minimum: 1
      description: Versión para concurrencia optimista (= ETag, = `aggregate_version` de los eventos).
    TenantScopedResource:
      type: object
      required:
        - id
        - tenant_id
        - version
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
          description: Redundante con `tid`; permite al cliente detectar un token equivocado.
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    AsnRuleInput:
      type: object
      additionalProperties: false
      required:
        - asn
        - name
      description: |
        `category` es obligatoria salvo que se indique `service`: con un servicio del catálogo la categoría es la de ese
        servicio (los agregados solo guardan el servicio) y una distinta → 422 en `category`.
      properties:
        asn:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          examples:
            - 263237
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre visible en tops, dashboards y kioscos.
        category:
          type: string
          maxLength: 64
          description: Slug de una categoría del catálogo (`GET /asn-rules/catalog`).
        service:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Slug de un servicio del catálogo; null = el nombre de la regla hace de servicio.
        note:
          type:
            - string
            - 'null'
          maxLength: 300
    AsnRule:
      allOf:
        - $ref: '#/components/schemas/TenantScopedResource'
        - $ref: '#/components/schemas/AsnRuleInput'
        - type: object
          required:
            - category
            - service
            - note
          properties:
            category:
              type: string
            service:
              type:
                - string
                - 'null'
            note:
              type:
                - string
                - 'null'
    AsnRuleCatalog:
      type: object
      required:
        - categories
        - services
