    StateData:
      type: object
      required:
        - kind
        - values
      properties:
        kind:
          const: state
        values:
          type: object
          description: Clave → valor (número, string, booleano, null o mapa de conteos).
          additionalProperties:
            type:
              - number
              - string
              - boolean
              - 'null'
              - object
      additionalProperties: false
    SeriesData:
      type: object
      required:
        - kind
        - series
      properties:
        kind:
          const: series
        series:
          type: array
          items:
            type: object
            required:
              - metric
              - unit
              - points
            properties:
              metric:
                type: string
              unit:
                type: string
              group:
                type:
                  - string
                  - 'null'
              points:
                type: array
                items:
                  type: array
                  prefixItems:
                    - type: string
                      format: date-time
                    - type:
                        - number
                        - 'null'
                  minItems: 2
                  maxItems: 2
