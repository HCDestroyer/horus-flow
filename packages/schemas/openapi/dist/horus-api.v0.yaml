# GENERADO (redocly bundle): no editar.
openapi: 3.1.0
info:
  title: Horus Flow API (contrato v0)
  version: 0.1.0
  description: |-
    GENERADO por packages/schemas/tools/contracts-check.mjs --write a partir de las specs de módulo. No editar.
    API pública /api/v1 (docs/api.md). Tenant solo por el claim `tid` del token. Errores RFC 9457, paginación por cursor.
  license:
    name: Propietaria
    identifier: LicenseRef-Horus-Proprietary
servers:
  - url: https://{domain}/api/v1
    description: Host público por instalación (D14, D19, HORUS_PUBLIC_BASE_URL) — dominio propio, subdominio o solo la IP del servidor; siempre HTTPS.
    variables:
      domain:
        default: horus.example.net
        description: Dominio, subdominio o IP literal (modo `ip_only`, p. ej. 203.0.113.10).
tags:
  - name: auth
    description: Sesión y tokens.
  - name: me
    description: Cuenta propia.
  - name: members
    description: Miembros, roles y permisos del tenant.
  - name: kiosks
    description: Kioscos (pantallas NOC) como dispositivos registrados.
  - name: realtime
    description: Tiempo real (WebSocket `wss://<dominio>/api/v1/ws`, subprotocolo `horus.ws.v1`).
  - name: system
    description: Estado del sistema y modos degradados.
  - name: platform
    description: Consola de plataforma (superadministración de la instalación).
  - name: sites
    description: Nodos (sitios) del ISP.
  - name: routers
    description: Routers (el principal de cada nodo exporta los flujos).
  - name: client-prefixes
    description: Qué IPs son de clientes en cada nodo.
  - name: customers
    description: Clientes = IPs observadas (D1).
  - name: onboarding
    description: Script de alta, enrolamiento y script inverso.
  - name: wireguard
    description: Estado de los peers (túneles) del ISP.
  - name: exporters
    description: Exportadores de flujos (router principal de cada nodo).
  - name: traffic
    description: Tops y series de tráfico.
  - name: dashboards
    description: Dashboards, widgets y playlists (D8).
  - name: kiosk
    description: Configuración del kiosco.
  - name: findings
    description: Hallazgos y su ciclo de vida.
  - name: reputation
    description: Feeds de reputación (plataforma) y allowlist (ISP).
  - name: notifications
    description: Canales de notificación del ISP y entregas.
paths:
  /analytics/customers/{customer_id}/traffic:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags:
        - traffic
      operationId: getCustomerTraffic
      summary: Series de tráfico de un cliente (desde reset_at si existe). Acceso auditado
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.customer.read
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
            enum:
              - none
              - service
              - category
              - asn
            default: none
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Step'
      responses:
        '200':
          description: Series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analytics/traffic/attribution:
    get:
      tags:
        - traffic
      operationId: getTrafficAttribution
      summary: Cobertura de atribución (bytes atribuidos a clientes, de infraestructura y fuera de prefijos)
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/SiteIdFilter'
        - $ref: '#/components/parameters/Range'
      responses:
        '200':
          description: Proporciones.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - attributed_ratio
                      - infrastructure_ratio
                      - unattributed_ratio
                    properties:
                      attributed_ratio:
                        type: number
                      infrastructure_ratio:
                        type: number
                      unattributed_ratio:
                        type: number
                  meta:
                    $ref: '#/components/schemas/AnalyticsMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analytics/traffic/timeseries:
    get:
      tags:
        - traffic
      operationId: getTrafficTimeseries
      summary: Serie de tráfico ↓/↑ del ISP o de un nodo (huecos como null)
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/SiteIdFilter'
        - name: metrics
          in: query
          schema:
            type: string
            default: down_bps,up_bps
            description: down_bps,up_bps,flows_per_second,active_customers
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Step'
      responses:
        '200':
          description: Series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /analytics/traffic/top:
    get:
      tags:
        - traffic
      operationId: getTrafficTop
      summary: Top N (≤ 10) + "Otros" por clientes, servicios, categorías, organizaciones o ASN
      description: '`dimension=customers` exige además `customers.read` (datos personales); sin él → 403.'
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - name: dimension
          in: query
          required: true
          schema:
            type: string
            enum:
              - customers
              - services
              - categories
              - organizations
              - asns
        - $ref: '#/components/parameters/SiteIdFilter'
        - name: customer_id
          in: query
          description: Ámbito de cliente (exige `traffic.customer.read`).
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - both
              - download
              - upload
            default: both
        - name: 'n'
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Top.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/TopResult'
                  meta:
                    $ref: '#/components/schemas/AnalyticsMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /auth/invitations/accept:
    post:
      tags:
        - auth
      operationId: authAcceptInvitation
      summary: Acepta una invitación a un tenant (crea el usuario si no existe)
      x-module: auth
      x-scope: public
      x-permission: public
      x-rate-limit: login
      x-increment: I1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 32
                display_name:
                  type:
                    - string
                    - 'null'
                  maxLength: 120
                password:
                  type:
                    - string
                    - 'null'
                  writeOnly: true
                  minLength: 12
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags:
        - auth
      operationId: authLogin
      summary: Inicio de sesión con usuario y contraseña
      description: |
        Sin 2FA → access token de **sesión** (`scope=session`) + cookie de refresh. Con 2FA →
        `mfa_required` + `mfa_token` (5 min, un uso). Errores sin revelar si el usuario existe
        (`INVALID_CREDENTIALS`). Bloqueo progresivo según docs/security.md §4.2.
      x-module: auth
      x-scope: public
      x-permission: public
      x-rate-limit: login
      x-increment: I0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  maxLength: 254
                password:
                  type: string
                  maxLength: 1024
                  writeOnly: true
      responses:
        '200':
          description: Sesión creada o 2FA requerida.
          headers:
            Set-Cookie:
              description: '`__Secure-hf_rt` (solo si no se requiere 2FA).'
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AccessTokenResponse'
                  - $ref: '#/components/schemas/MfaChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags:
        - auth
      operationId: authLogout
      summary: Revoca la sesión actual y borra la cookie
      x-module: auth
      x-scope: session
      x-permission: refresh_cookie
      x-increment: I0
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/mfa/verify:
    post:
      tags:
        - auth
      operationId: authMfaVerify
      summary: Segundo factor (TOTP o código de recuperación)
      x-module: auth
      x-scope: public
      x-permission: public
      x-rate-limit: login
      x-increment: I1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mfa_token
                - code
              properties:
                mfa_token:
                  type: string
                code:
                  type: string
                  minLength: 6
                  maxLength: 16
      responses:
        '200':
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/reauth:
    post:
      tags:
        - auth
      operationId: authReauth
      summary: Re-autenticación reciente (marca `auth_time`)
      x-module: auth
      x-scope: session
      x-permission: authenticated
      x-increment: I1
      security:
        - sessionBearer: []
        - tenantBearer: []
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  writeOnly: true
                code:
                  type:
                    - string
                    - 'null'
      responses:
        '200':
          description: Token renovado con `auth_time` reciente (mismo ámbito que el presentado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags:
        - auth
      operationId: authRefresh
      summary: Rota el refresh y devuelve un access token de sesión
      description: Reutilización de un refresh ya usado ⇒ revoca la sesión (`refresh_token_reuse`). Exige `Origin` permitido (HORUS_ALLOWED_ORIGINS, D14).
      x-module: auth
      x-scope: public
      x-permission: refresh_cookie
      x-increment: I0
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: Nuevo par (cookie rotada).
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/token:
    post:
      tags:
        - auth
      operationId: authIssueToken
      summary: Access token de un tenant o de plataforma
      description: |
        `{"tenant_id"}` → JWT de 10 min con `tid` y los permisos de ese tenant. No miembro →
        `404 TENANT_NOT_FOUND` (no revela si existe); tenant suspendido → `403 TENANT_SUSPENDED`;
        rol que exige 2FA sin TOTP activo → `403 MFA_ENROLLMENT_REQUIRED` (D14: 2FA obligatorio para
        administradores). `{"scope": "platform"}` → token de plataforma (solo roles de plataforma).
      x-module: auth
      x-scope: session
      x-permission: authenticated
      x-increment: I0
      security:
        - sessionBearer: []
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - tenant_id
                  additionalProperties: false
                  properties:
                    tenant_id:
                      $ref: '#/components/schemas/Uuid'
                - type: object
                  required:
                    - scope
                  additionalProperties: false
                  properties:
                    scope:
                      type: string
                      const: platform
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /client-prefixes/{client_prefix_id}:
    parameters:
      - $ref: '#/components/parameters/ClientPrefixId'
    patch:
      tags:
        - client-prefixes
      operationId: updateClientPrefix
      summary: Edita un prefijo (reducirlo pasa a inactive los clientes fuera de todo prefijo)
      x-module: devices
      x-scope: tenant
      x-permission: sites.update
      x-increment: I0
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ClientPrefixPatch'
          application/json:
            schema:
              $ref: '#/components/schemas/ClientPrefixPatch'
      responses:
        '200':
          description: Actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPrefix'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags:
        - client-prefixes
      operationId: deleteClientPrefix
      summary: Borra un prefijo (clientes fuera de todo prefijo → inactive, razón prefix_removed)
      x-module: devices
      x-scope: tenant
      x-permission: sites.update
      x-increment: I0
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /client-prefixes/{client_prefix_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/ClientPrefixId'
    post:
      tags:
        - client-prefixes
      operationId: confirmClientPrefix
      summary: Confirma un prefijo no confirmado
      x-module: devices
      x-scope: tenant
      x-permission: sites.update
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPrefix'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /customers:
    get:
      tags:
        - customers
      operationId: listCustomers
      summary: Clientes descubiertos (sin filtro por IP en la URL)
      x-module: devices
      x-scope: tenant
      x-permission: customers.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SiteIdFilter'
        - name: q
          in: query
          description: Búsqueda sobre `alias` (nunca IP).
          schema:
            type: string
            maxLength: 128
        - name: realm_id
          in: query
          schema:
            type: string
        - name: client_prefix_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            description: active,inactive
        - name: kind
          in: query
          schema:
            type: string
        - name: kind_source
          in: query
          schema:
            type: string
        - name: kind_locked
          in: query
          schema:
            type: boolean
        - name: commercial_use_suspected
          in: query
          schema:
            type: boolean
        - name: security_state
          in: query
          schema:
            type: string
            description: clean,suspected,infected,mitigated
        - name: has_open_findings
          in: query
          schema:
            type: boolean
        - name: last_seen_gte
          in: query
          schema:
            type: string
            format: date-time
        - name: last_seen_lte
          in: query
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - last_seen
              - '-last_seen'
              - first_seen
              - '-first_seen'
              - kind_changed_at
              - '-kind_changed_at'
      responses:
        '200':
          description: Página de clientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /customers/lookup:
    post:
      tags:
        - customers
      operationId: lookupCustomers
      summary: Búsqueda por IP o prefijo en el cuerpo (POST solo para sacar la IP de URLs y logs; no crea nada)
      x-module: devices
      x-scope: tenant
      x-permission: customers.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - address
                  additionalProperties: false
                  properties:
                    address:
                      $ref: '#/components/schemas/IpAddress'
                    site_id:
                      $ref: '#/components/schemas/Uuid'
                - type: object
                  required:
                    - prefix
                  additionalProperties: false
                  properties:
                    prefix:
                      $ref: '#/components/schemas/Cidr'
                    realm_id:
                      $ref: '#/components/schemas/Uuid'
                    site_id:
                      $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Coincidencias (misma forma que la colección).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /customers/stats:
    get:
      tags:
        - customers
      operationId: getCustomerStats
      summary: Conteos por tipo, origen, estado, estado de seguridad y nodo (widgets)
      x-module: devices
      x-scope: tenant
      x-permission: customers.read
      x-principals:
        - user
        - api_token
        - kiosk
      x-increment: I1
      security:
        - tenantBearer: []
        - kioskBearer: []
      parameters:
        - $ref: '#/components/parameters/SiteIdFilter'
      responses:
        '200':
          description: Conteos (sin IPs; apto para kioscos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /customers/{customer_id}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags:
        - customers
      operationId: getCustomer
      summary: Ficha del cliente (acceso auditado) con sugerencia de tipo
      x-module: devices
      x-scope: tenant
      x-permission: customers.read
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Cliente.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - customers
      operationId: updateCustomer
      summary: Alias y notas (datos personales; auditado sin el valor)
      x-module: devices
      x-scope: tenant
      x-permission: customers.update
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerPatch'
      responses:
        '200':
          description: Actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /customers/{customer_id}/findings:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags:
        - findings
      operationId: listCustomerFindings
      summary: Hallazgos de un cliente
      x-module: detection
