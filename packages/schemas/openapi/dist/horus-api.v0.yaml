    RecommendedAction:
      type: object
      description: D11. Acción recomendada explicada, lista para que el operador la aplique A MANO. Horus nunca escribe en el router (execution = manual).
      required:
        - code
        - title
        - explanation
        - priority
        - risk
        - audience
        - execution
        - routeros
      properties:
        code:
          description: Enum abierto.
          anyOf:
            - type: string
              enum:
                - contact_customer
                - quarantine_address_list
                - block_destination
                - block_outbound_port
                - block_smtp_outbound
                - rate_limit_customer
                - inspect_device
                - change_default_credentials
                - update_firmware
                - add_to_allowlist
                - monitor
            - type: string
              pattern: ^[a-z][a-z0-9_]*$
        title:
          type: string
          maxLength: 120
        explanation:
          type: string
          maxLength: 1500
