    finding.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.horus-flow.local/finding/v0/finding.schema.json
      title: Finding
      description: 'Hallazgo de seguridad (C8): correlación explicable de señales compatibles con botnet en una ventana, por cliente (= IP). Misma forma en la API (GET /findings/{id}) y en el payload de horus.detection.finding.opened|updated|resolved (events.md §8.8), salvo `customer` y `recommended_actions[].routeros.rendered_*`, que solo la API rellena y solo para quien tiene customers.read (nunca kioscos ni eventos, events.md §5.7). D11: `recommended_actions` explica qué hacer y propone comandos RouterOS que Horus NUNCA ejecuta (ADR-0022). Lenguaje: ''señales compatibles con…'', nunca ''infectado''.'
      type: object
      required:
        - id
        - tenant_id
        - version
        - state
        - kind
        - category
        - severity
        - confidence
        - confidence_level
        - subject_type
        - customer_id
        - realm_id
        - site_id
        - router_id
        - summary
        - window_from
        - window_to
        - first_seen_at
        - last_seen_at
        - opened_at
        - updated_at
        - occurrences
        - reasons
        - evidence
        - primary_target
        - rule_version
        - recommended_actions
      properties:
        id:
          $ref: '#/components/schemas/$defs-Uuid'
        tenant_id:
          $ref: '#/components/schemas/$defs-Uuid'
        version:
          type: integer
          minimum: 1
        state:
          $ref: '#/components/schemas/FindingState'
        kind:
          $ref: '#/components/schemas/FindingKind'
        category:
          type: string
          enum:
            - security
          description: 'Abierto: ''commercial'' llegará con el scoring (I2).'
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        confidence:
          type: number
          minimum: 0
          maximum: 1
        confidence_level:
          type: string
          enum:
            - low
            - medium
            - high
          description: Banda derivada de confidence (la UI muestra severidad y confianza por separado).
        subject_type:
          type: string
          enum:
            - customer
        customer_id:
          $ref: '#/components/schemas/$defs-Uuid'
        realm_id:
          $ref: '#/components/schemas/$defs-Uuid'
        site_id:
          $ref: '#/components/schemas/$defs-Uuid'
        router_id:
          $ref: '#/components/schemas/$defs-Uuid'
        customer:
          description: Solo API. null en eventos. address solo con customers.read y nunca a kioscos (enmascarada).
          oneOf:
            - type: 'null'
            - type: object
              required:
                - address
                - address_masked
                - alias
                - kind
              properties:
                address:
                  type: string
                address_masked:
                  type: boolean
                alias:
                  type:
                    - string
                    - 'null'
                kind:
                  type: string
              additionalProperties: false
        summary:
          type: object
          required:
            - code
            - text
          properties:
            code:
              type: string
              pattern: ^[a-z0-9_]+$
            text:
              type: string
              maxLength: 300
              description: Resumen legible en español, sin IP del cliente (p. ej. 'Escaneo del puerto 23 a 1 240 destinos en 5 min').
            params:
              type: object
              additionalProperties:
                type:
                  - string
                  - number
                  - boolean
          additionalProperties: false
