                  - string
                  - number
                  - bytes
                  - bps
                  - percent
                  - timestamp
                  - ip
                  - severity
                  - state
              personal_data:
                type: boolean
                default: false
            additionalProperties: false
        rows:
          type: array
          maxItems: 200
          items:
            type: object
        others:
          type:
