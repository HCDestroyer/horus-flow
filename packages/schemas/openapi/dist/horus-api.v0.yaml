            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        last_observed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        signals:
          $ref: '#/components/schemas/RouterSignals'
        device:
          $ref: '#/components/schemas/RouterDeviceSample'
        uplink:
          oneOf:
            - $ref: '#/components/schemas/RouterUplink'
