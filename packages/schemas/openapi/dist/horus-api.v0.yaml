            $ref: '#/components/schemas/Reason'
        confidence:
          type:
            - integer
            - 'null'
        model_ref:
          type:
            - string
            - 'null'
        actor_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        manual_reason:
          type:
            - string
            - 'null'
    ScoringFeature:
      type: object
      required:
        - code
        - value
        - unit
        - normalized
        - weight
        - contribution
        - available
        - detail
      properties:
        code:
          type: string
          description: inbound_services | upload_ratio_high | upload_vs_residential_median | business_hours_pattern | always_on | many_remote_asns (enum abierto).
        value:
          type: number
          description: Valor bruto en `unit`.
        unit:
          type: string
          description: ports | ratio | x | share | asns
        normalized:
          type: number
          minimum: 0
          maximum: 1
        weight:
          type: number
          minimum: 0
          maximum: 1
          description: Peso configurado por el ISP.
        contribution:
          type: number
          minimum: 0
          maximum: 1
          description: Puntos (0..1) que aporta a la probabilidad comercial.
        available:
          type: boolean
          description: false si no hay datos (p. ej. sin mediana residencial).
        detail:
          type: string
          description: Texto humano con los números reales.
    CustomerScoring:
      type: object
      required:
        - customer_id
        - model_version
        - computed_at
        - window_from
        - window_to
        - level
        - suggested_kind
        - commercial_score
        - raw_score
        - confidence
        - scores
        - commercial_use_suspected
        - dynamic_pool
        - customer_kind
        - kind_locked
        - published_level
        - published_at
        - pending_level
        - pending_since
        - features
        - reasons
        - thresholds
      properties:
        customer_id:
          $ref: '#/components/schemas/Uuid'
        model_version:
          type: string
          examples:
            - commercial-v1
        computed_at:
          $ref: '#/components/schemas/Timestamp'
        window_from:
          $ref: '#/components/schemas/Timestamp'
        window_to:
          $ref: '#/components/schemas/Timestamp'
        level:
          type: string
          enum:
            - residential
            - suspected
            - commercial
          description: suspected = residencial con indicios comerciales.
        suggested_kind:
          type: string
          enum:
            - residential
            - commercial
        commercial_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Probabilidad comercial tras el ajuste por pool dinámico.
        raw_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Probabilidad comercial antes del ajuste.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Probabilidad de la clase sugerida.
        scores:
          type: object
          required:
            - residential
            - commercial
          properties:
            residential:
              type: number
              minimum: 0
              maximum: 1
            commercial:
              type: number
              minimum: 0
              maximum: 1
        commercial_use_suspected:
          type: boolean
        dynamic_pool:
          type: boolean
          description: La IP está en un prefijo dinámico (confianza comercial reducida).
        customer_kind:
          type: string
          description: Tipo del cliente al puntuar.
        kind_locked:
          type: boolean
          description: Tipo fijado a mano (el scoring sugiere pero devices no lo cambia).
        published_level:
          type:
            - string
            - 'null'
          enum:
            - residential
            - suspected
            - commercial
            - null
        published_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        pending_level:
          type:
            - string
            - 'null'
          enum:
            - residential
            - suspected
            - commercial
            - null
          description: Nivel nuevo que aún no ha sostenido la histéresis.
        pending_since:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        features:
          type: array
          items:
            $ref: '#/components/schemas/ScoringFeature'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
        thresholds:
          type: object
          required:
