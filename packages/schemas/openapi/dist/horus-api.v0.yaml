    ArgosWebhookEvent:
      type: object
      required:
        - id
        - evento
        - payload
      properties:
        id:
          type: string
          maxLength: 128
        evento:
          type: string
          examples:
            - asignacion.cambiada
            - sesion.iniciada
            - sesion.terminada
            - cliente.actualizado
            - servicio.estado_cambiado
        ocurrido_en:
          type: string
        payload:
          type: object
          additionalProperties: true
    ConsumptionRequest:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - items
      properties:
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
        granularity:
          type: string
          enum:
            - day
            - total
          default: total
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            properties:
              address:
                $ref: '#/components/schemas/IpAddress'
              external_service_id:
                type: integer
                minimum: 1
    ConsumptionResponse:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - address
              - external_service_id
              - up_bytes
              - down_bytes
              - series
            properties:
              address:
                type:
                  - string
                  - 'null'
              external_service_id:
                type:
                  - integer
                  - 'null'
              up_bytes:
                type: integer
                minimum: 0
              down_bytes:
                type: integer
                minimum: 0
              addresses:
                type: array
                description: Solo por servicio — IPs sumadas (dato personal).
                items:
                  type: string
              series:
                type: array
                description: Solo con granularity=day (días UTC).
                items:
                  type: object
                  required:
                    - day
                    - up_bytes
                    - down_bytes
                  properties:
                    day:
                      type: string
                      format: date
                    up_bytes:
                      type: integer
                      minimum: 0
                    down_bytes:
                      type: integer
                      minimum: 0
              error:
                type: string
                enum:
                  - not_found
                  - invalid
        meta:
          type: object
          required:
            - from
            - to
            - granularity
          properties:
            from:
              $ref: '#/components/schemas/Timestamp'
            to:
              $ref: '#/components/schemas/Timestamp'
            granularity:
              type: string
              enum:
                - day
                - total
    IpLookupRequest:
      type: object
      additionalProperties: false
      description: |
        `address` o, desde el contrato 1.2.0, `external_service_id` (exactamente uno de los dos; con ambos o ninguno → 422).
      properties:
        address:
          $ref: '#/components/schemas/IpAddress'
        external_service_id:
          type: integer
          minimum: 1
          description: |
            Servicio de ArgosISP: se usa su identidad vigente (o la vigente en `at`) y se responde con su IP de entonces.
            Si el servicio tiene varias IPs (IPv4 y prefijo IPv6), la del cliente visto más recientemente.
        at:
          description: Instante de la consulta (por defecto ahora).
          $ref: '#/components/schemas/Timestamp'
        include:
          type: array
          description: Bloques opcionales (por defecto los tres).
          items:
            type: string
            enum:
              - consumption
              - health
              - security
    ByteCounters:
      type: object
      required:
        - up_bytes
        - down_bytes
      properties:
        up_bytes:
          type: integer
          minimum: 0
        down_bytes:
          type: integer
          minimum: 0
    IpLookupResponse:
      type: object
      required:
        - customer
        - external
        - consumption
        - health
        - security
        - meta
      properties:
        customer:
          type: object
          required:
            - id
            - address
            - alias
            - alias_source
            - kind
            - kind_source
            - status
            - first_seen
            - last_seen
            - site
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            address:
              $ref: '#/components/schemas/IpAddress'
            alias:
              type:
                - string
                - 'null'
            alias_source:
              type:
                - string
                - 'null'
              enum:
                - manual
                - routeros_ppp
                - argosisp
                - null
            kind:
              $ref: '#/components/schemas/CustomerKind'
            kind_source:
              type: string
              enum:
                - default
                - scoring
                - manual
            status:
              type: string
              enum:
                - active
                - inactive
            first_seen:
              $ref: '#/components/schemas/Timestamp'
            last_seen:
              $ref: '#/components/schemas/Timestamp'
            site:
              type: object
              required:
                - id
                - name
              properties:
                id:
                  $ref: '#/components/schemas/Uuid'
                name:
                  type:
                    - string
                    - 'null'
        external:
          oneOf:
            - $ref: '#/components/schemas/ExternalRef'
            - type: 'null'
        consumption:
          oneOf:
            - type: object
              required:
                - last_24h
                - last_7d
                - last_30d
                - peak_down_bps_24h
                - top_services_7d
              properties:
                last_24h:
                  $ref: '#/components/schemas/ByteCounters'
                last_7d:
                  $ref: '#/components/schemas/ByteCounters'
                last_30d:
                  $ref: '#/components/schemas/ByteCounters'
                peak_down_bps_24h:
                  type: number
                  minimum: 0
                  description: Pico de bajada en buckets de 5 min.
                top_services_7d:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required:
                      - name
                      - bytes
                    properties:
                      name:
                        type: string
                      bytes:
                        type: integer
                        minimum: 0
            - type: 'null'
        health:
          oneOf:
            - type: object
              required:
                - router
                - exporter
                - last_seen_minutes
              properties:
                router:
                  oneOf:
                    - type: object
                      required:
                        - id
                        - name
                        - status
                        - since
                      description: |
                        Router que lleva el tráfico del cliente (contrato 1.6.0): el de sus flujos más recientes (hasta 24 h
                        antes de `at`); sin flujos recientes o sin analítica, el principal de su nodo (`source: primary_router`).
                      properties:
                        id:
                          $ref: '#/components/schemas/Uuid'
                        name:
                          type: string
                        status:
                          type: string
                          description: online, warning, critical, degraded, offline o unknown.
                        since:
                          oneOf:
                            - $ref: '#/components/schemas/Timestamp'
                            - type: 'null'
                        source:
                          type: string
                          enum:
                            - flows
                            - primary_router
                          description: Desde 1.6.0.
                        customer_last_flow_at:
                          description: Último flujo del cliente por este router (null con `primary_router`). Desde 1.6.0.
                          oneOf:
                            - $ref: '#/components/schemas/Timestamp'
                            - type: 'null'
                    - type: 'null'
                exporter:
                  type: object
                  required:
                    - status
                    - last_flow_at
                  properties:
                    status:
                      type:
                        - string
                        - 'null'
                      description: FlowExporterState del router de `health.router`.
                    last_flow_at:
                      description: Último flujo recibido del exportador de ese router (estado del collector).
                      oneOf:
                        - $ref: '#/components/schemas/Timestamp'
                        - type: 'null'
                last_seen_minutes:
                  type: integer
                  minimum: 0
            - type: 'null'
        security:
          oneOf:
            - type: object
              required:
                - state
                - open_findings
                - findings
              properties:
                state:
                  $ref: '#/components/schemas/SecurityState'
                open_findings:
                  type: integer
                  minimum: 0
                findings:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required:
                      - id
                      - kind
                      - severity
                      - opened_at
                      - summary
                    properties:
                      id:
                        $ref: '#/components/schemas/Uuid'
                      kind:
                        type: string
                      severity:
                        type: string
                      state:
                        type: string
                      opened_at:
                        $ref: '#/components/schemas/Timestamp'
                      summary:
                        type: string
            - type: 'null'
        meta:
          type: object
          required:
            - at
            - omitted
          properties:
            at:
              $ref: '#/components/schemas/Timestamp'
            omitted:
              type: array
              items:
                type: object
                required:
                  - section
                  - reason
                properties:
                  section:
                    type: string
                    enum:
                      - external
                      - consumption
                      - health
                      - security
                  reason:
                    type: string
                    enum:
                      - permission
                      - unavailable
                      - not_requested
                      - not_configured
    SecurityStatesRequest:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            description: '`address` o `external_service_id` (exactamente uno).'
            properties:
              address:
                $ref: '#/components/schemas/IpAddress'
              external_service_id:
                type: integer
                minimum: 1
    SecurityStatesResponse:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - address
              - external_service_id
            properties:
              address:
                type:
                  - string
                  - 'null'
                description: La pedida o, por servicio, la IP (o prefijo) elegida (dato personal).
              external_service_id:
                type:
                  - integer
                  - 'null'
                description: El pedido o, por IP, el servicio de la identidad vigente (null sin identidad).
              state:
                $ref: '#/components/schemas/SecurityState'
              open_findings:
                type: integer
                minimum: 0
              max_severity:
                type:
                  - string
                  - 'null'
                description: Severidad del hallazgo activo más grave (null sin hallazgos activos).
              since:
                description: Desde cuándo el cliente está en `state`.
                $ref: '#/components/schemas/Timestamp'
              error:
                type: string
                enum:
                  - not_found
                description: Sin cliente o sin identidad vigente; sin el resto de campos.
        meta:
          type: object
          required:
            - at
          properties:
            at:
              $ref: '#/components/schemas/Timestamp'
    PlaylistItem:
      type: object
      required:
        - dashboard_id
        - duration_seconds
      properties:
        dashboard_id:
          type: string
          format: uuid
        duration_seconds:
          type: integer
          minimum: 10
          maximum: 3600
          default: 30
        variables:
          type: object
          properties:
            site_id:
              type:
                - string
                - 'null'
              format: uuid
          additionalProperties: false
      additionalProperties: false
    Kiosk:
      allOf:
        - $ref: '#/components/schemas/TenantScopedResource'
        - type: object
          required:
            - name
            - status
            - show_personal_data
            - allowed_cidrs
            - dashboard_ids
            - playlist_id
            - expires_at
          properties:
            name:
              type: string
            status:
              type: string
              enum:
                - pending_enrollment
                - active
                - revoked
                - expired
            playlist_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            dashboard_ids:
              type: array
              items:
                $ref: '#/components/schemas/Uuid'
            allowed_cidrs:
              type: array
              items:
                $ref: '#/components/schemas/Cidr'
            cidr_risk:
              type: boolean
              description: true si no hay `allowed_cidrs` (la UI lo marca como riesgo).
            show_personal_data:
              type: boolean
            critical_finding_banner:
              type: boolean
            expires_at:
              $ref: '#/components/schemas/Timestamp'
            last_seen_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            last_ip:
              type:
                - string
                - 'null'
            frontend_version:
              type:
                - string
                - 'null'
    KioskInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 80
        playlist_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        dashboard_ids:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Uuid'
        allowed_cidrs:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/Cidr'
        show_personal_data:
          type: boolean
          default: false
        show_personal_data_reason:
          type:
            - string
            - 'null'
          maxLength: 300
          description: Obligatorio (auditado) si `show_personal_data = true`.
        critical_finding_banner:
          type: boolean
          default: false
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    LibreNmsMonitoringMode:
      type: string
      description: |
        `ping` (por defecto): solo ICMP. `snmp_v2c` / `snmp_v3`: credenciales propias para LibreNMS (write-only).
        `horus_snmp_v3`: las credenciales SNMPv3 de solo lectura de Horus, con consentimiento explícito por router.
      enum:
        - ping
        - snmp_v2c
        - snmp_v3
        - horus_snmp_v3
    LibreNmsRouter:
      type: object
      required:
        - router_id
        - router_name
        - site_id
        - onboarding_state
        - mgmt_ip
        - mode
        - has_snmp_credentials
        - horus_snmp_reuse_consent
        - updated_at
      additionalProperties: false
      properties:
        router_id:
          $ref: '#/components/schemas/Uuid'
        router_name:
          type: string
        site_id:
          $ref: '#/components/schemas/Uuid'
        onboarding_state:
          type: string
        mgmt_ip:
          type:
            - string
            - 'null'
          description: IP de gestión para LibreNMS (no la del túnel). null = el router no se monitorea en LibreNMS.
        mode:
          $ref: '#/components/schemas/LibreNmsMonitoringMode'
        has_snmp_credentials:
          type: boolean
        horus_snmp_reuse_consent:
          type: boolean
        updated_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    LibreNmsRouterInput:
      type: object
      required:
        - mgmt_ip
        - mode
      additionalProperties: false
      properties:
        mgmt_ip:
          type: string
          description: IPv4 o IPv6 de gestión alcanzable desde LibreNMS.
        mode:
          $ref: '#/components/schemas/LibreNmsMonitoringMode'
        reuse_horus_snmp_consent:
          type: boolean
          default: false
          description: Obligatorio (true) con `horus_snmp_v3`. Auditado.
    LibreNmsSnmpCredentials:
      type: object
      description: Write-only. `community` en `snmp_v2c`; `v3_*` en `snmp_v3`.
      additionalProperties: false
      minProperties: 1
      properties:
        community:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 64
        v3_auth_level:
          type: string
          enum:
            - noAuthNoPriv
            - authNoPriv
            - authPriv
        v3_username:
          type: string
          minLength: 1
          maxLength: 64
        v3_auth_protocol:
          type: string
          enum:
            - MD5
            - SHA
            - SHA-224
            - SHA-256
            - SHA-384
            - SHA-512
        v3_auth_password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128
        v3_priv_protocol:
          type: string
          enum:
            - AES
            - DES
        v3_priv_password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 128
    RoleAssignment:
      type: object
      required:
        - role_id
        - scope
      properties:
        role_id:
          $ref: '#/components/schemas/Uuid'
        role_key:
          type: string
          examples:
            - noc
        scope:
          type: string
          pattern: ^(tenant|site:[0-9a-f-]{36}|router_group:[0-9a-f-]{36})$
    Membership:
      type: object
      required:
        - tenant_id
        - tenant_slug
        - tenant_name
        - tenant_status
        - roles
        - permissions_with_scope
      properties:
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        tenant_slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
        tenant_name:
          type: string
        tenant_status:
          type: string
          enum:
            - active
            - suspended
            - offboarding
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
        permissions_with_scope:
          type: object
          description: Permiso → alcances (`["*"]` = todo el tenant; `site:<uuid>`, `router_group:<uuid>`).
          additionalProperties:
            type: array
            items:
              type: string
          examples:
            - devices.read:
                - '*'
              customers.kind.write:
                - site:0192e111-0000-7000-8000-000000000001
    Me:
      type: object
      required:
        - id
        - email
        - display_name
        - platform_roles
        - platform_permissions
        - memberships
        - mfa_enabled
        - must_change_password
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        display_name:
          type: string
        locale:
          type:
            - string
            - 'null'
          examples:
            - es-MX
        timezone:
          type:
            - string
            - 'null'
          examples:
            - America/Mexico_City
        default_tenant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        mfa_enabled:
          type: boolean
        must_change_password:
          type: boolean
        platform_roles:
          type: array
          items:
            type: string
            enum:
              - platform_admin
              - platform_operator
              - platform_auditor
        platform_permissions:
          type: array
          items:
            type: string
            pattern: ^platform\.
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    MePatch:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
          description: Correo nuevo (identidad de la cuenta en toda la plataforma). Exige re-autenticación reciente.
        locale:
          type:
            - string
            - 'null'
        timezone:
          type:
            - string
            - 'null'
        default_tenant_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    Member:
      type: object
      required:
        - user_id
        - display_name
        - email
        - status
        - mfa_enabled
        - role_assignments
        - version
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        tenant_id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - active
            - invited
            - revoked
        mfa_enabled:
          type: boolean
        role_assignments:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
        version:
          $ref: '#/components/schemas/Version'
    InvitationIssued:
      type: object
      required:
        - outcome
        - user_id
        - email_sent
      properties:
        outcome:
          type: string
          enum:
            - added
            - invited
          description: added = la cuenta ya existía y la membresía queda activa; invited = hay que aceptar el enlace.
        user_id:
          $ref: '#/components/schemas/Uuid'
        invitation_url:
          type:
            - string
            - 'null'
          format: uri
          description: Solo con outcome=invited. <HORUS_PUBLIC_BASE_URL>/invitation#token=<token>; se muestra una vez.
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        email_sent:
          type: boolean
    MemberPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetIssued:
      type: object
      required:
        - user_id
        - reset_url
        - expires_at
        - email_sent
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        reset_url:
          type: string
          format: uri
          description: <HORUS_PUBLIC_BASE_URL>/reset-password#token=<token>; se muestra una vez (Cache-Control no-store).
        expires_at:
          type: string
          format: date-time
        email_sent:
          type: boolean
    NotificationChannelKind:
      type: string
      description: |
        `email`, `telegram`, `librenms` (D17, por API) y `webhook` (POST JSON firmado con HMAC-SHA256, ADR-0030;
        contrato docs/integrations/argosisp.md §1.3 y §3.4) disponibles. Enum abierto (después: whatsapp, sms); un
        `kind` conocido por el contrato pero aún no implementado → `422 NOTIFICATION_CHANNEL_KIND_NOT_AVAILABLE`.
      enum:
        - email
        - telegram
        - librenms
        - webhook
    EmailChannelConfig:
      type: object
      title: EmailChannelConfig
      required:
        - recipients
      additionalProperties: false
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: email
        subject_prefix:
          type: string
          maxLength: 40
          default: '[Horus]'
        language:
          type: string
          enum:
            - es
            - en
          default: es
    TelegramChannelConfig:
      type: object
      title: TelegramChannelConfig
      required:
        - chat_id
      additionalProperties: false
      properties:
        chat_id:
          type: string
          pattern: ^-?[0-9]{1,20}$|^@[A-Za-z0-9_]{5,32}$
          description: Id numérico (usuarios positivos, grupos negativos, supergrupos y canales `-100…`) o `@usuario_del_canal`.
        message_thread_id:
          type: integer
          minimum: 1
          description: Tema de un supergrupo con temas (foro); sin valor, el chat general.
        uses_own_bot:
          type: boolean
          default: false
          readOnly: true
        language:
          type: string
          enum:
            - es
            - en
          default: es
    LibreNmsChannelConfig:
      type: object
      title: LibreNmsChannelConfig
      description: |
        D17: LibreNMS como destino por **su API** (instancia dedicada a Horus), configurado a mano por cada ISP.
        Solo la parte no secreta: contraseña y token van por `PUT /notification-channels/{id}/credentials`
        (write-only). LibreNMS como fuente de inventario queda fuera del I1.
      required:
        - base_url
        - username
      additionalProperties: false
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://
          description: URL base de la instancia (p. ej. `https://librenms.isp.example`); Horus añade `/api/v0`. Sin credenciales en la URL.
          examples:
            - https://librenms.isp.example
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: Usuario de LibreNMS dedicado a Horus.
        tls_verify:
          type: boolean
          default: true
          description: false solo para certificados autofirmados (auditado).
        timeout_seconds:
          type: integer
          minimum: 2
          maximum: 30
          default: 10
    WebhookChannelConfig:
      type: object
      title: WebhookChannelConfig
      description: |
        Webhook firmado (ADR-0030, p. ej. el receptor de ArgosISP). Cada entrega es un `POST` con
        `{id, event, occurred_at, tenant, data}` y las cabeceras `X-Webhook-Id` (= `id`, estable entre reintentos),
        `X-Webhook-Timestamp` y `X-Webhook-Signature: v1=hex(HMAC-SHA256(secreto, timestamp + "." + cuerpo))`. El
        secreto lo genera el receptor y va por `PUT …/credentials` (`webhook_secret`, write-only). `event` sigue el
        contrato §3.4: `finding.opened` (finding_opened, finding_reopened), `finding.resolved`,
        `customer.security_state_changed`, `router.status_changed` (router_*: offline, recovered, umbrales, hardware) e
        `infra_service.state_changed` (service_*); los demás tipos no se envían por webhook. Con identidad ArgosISP del
        cliente, `data.external` lleva sus ids. La IP y el alias del cliente solo con `include_personal_data`.
        Reintentos: 1 min, 5 min, 30 min, 2 h y 12 h. Solo https y destinos públicos (privados o loopback solo con
        HORUS_ALERTS_WEBHOOK_ALLOW_PRIVATE=true, laboratorios); cada redirección se valida igual.
      required:
        - url
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://
          description: URL del receptor (sin credenciales en la URL).
          examples:
            - https://argos.isp.example/api/v1/integraciones/horus/webhook
        timeout_seconds:
          type: integer
          minimum: 2
          maximum: 30
          default: 10
    NotificationEventType:
      type: string
      description: |
        Tipos de evento a los que se suscribe un canal (enum abierto), por categoría:
        - `security`: `finding_opened`, `finding_reopened`.
        - `security_updates` (pensada para webhooks, ADR-0030): `finding_resolved` y `customer_security_state_changed`.
        - `routers` (rol snmp): `router_offline`, `router_recovered` (vuelve tras una caída o un umbral avisado),
          `router_cpu_high`, `router_memory_high`, `router_temperature_high` (aviso → `medium`, crítico → `high`),
          `router_hardware_failed` (fuente o ventilador), `router_interface_down` / `router_interface_up` (enlace de
          subida → `high`), `router_rebooted`.
        - `infrastructure` (servicios vigilados, `horus.snmp.service.state_changed`): `service_down`,
          `service_degraded`, `service_recovered`.
        - `exporter_tunnel`: `exporter_silent`, `exporter_recovered`, `tunnel_down`, `tunnel_recovered`.
        - `capacity` (enlaces de subida y pronósticos, `horus.snmp.uplink.condition_changed` y
          `horus.snmp.capacity.forecast_changed`): `uplink_saturated` (saturación sostenida; aviso → `medium`, crítico →
          `high`), `uplink_degraded` (pérdida o latencia sostenidas, mismas severidades), `uplink_recovered`,
          `capacity_forecast_planning` (cruza el umbral de planificación dentro de la antelación → `low`),
          `capacity_forecast_urgent` (cruza el urgente o ya lo supera → `high`) y `capacity_forecast_cleared`.
        Las recuperaciones (`*_recovered`, `router_interface_up`, `capacity_forecast_cleared`) tienen severidad `info`.
      enum:
        - finding_opened
        - finding_reopened
        - exporter_silent
        - exporter_recovered
        - tunnel_down
        - tunnel_recovered
        - router_offline
        - router_recovered
        - router_cpu_high
        - router_memory_high
        - router_temperature_high
        - router_hardware_failed
        - router_interface_down
        - router_interface_up
        - router_rebooted
        - service_down
        - service_degraded
        - service_recovered
        - finding_resolved
        - customer_security_state_changed
        - uplink_saturated
        - uplink_degraded
        - uplink_recovered
        - capacity_forecast_planning
        - capacity_forecast_urgent
        - capacity_forecast_cleared
    NotificationCategory:
      type: string
      description: Grupo de tipos de evento (ver NotificationEventType). Enum abierto.
      enum:
        - security
        - routers
        - infrastructure
        - exporter_tunnel
        - security_updates
        - capacity
    Severity:
      type: string
      description: Severidad (enum abierto; el cliente trata valores desconocidos como "otro").
      enum:
        - info
        - low
        - medium
        - high
        - critical
    ChannelSubscription:
      type: object
      description: |
        Un evento llega al canal si su tipo está en `event_types` **o** su categoría en `categories` (al menos una de las
        dos con valores), su severidad alcanza `min_severity` y su nodo está en `site_ids`. Compatible con las
        suscripciones anteriores (solo `event_types`).
      required:
        - event_types
      additionalProperties: false
      properties:
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/NotificationEventType'
        categories:
          type: array
          description: Categorías completas (incluye los tipos que se añadan a ellas).
          items:
            $ref: '#/components/schemas/NotificationCategory'
        min_severity:
          $ref: '#/components/schemas/Severity'
        notify_recovery:
          type: boolean
          default: true
          description: La recuperación de un recurso llega al canal que recibió su alarma sin filtro de severidad ni agrupación.
        site_ids:
          type: array
          description: Vacío = todos los nodos.
          items:
            $ref: '#/components/schemas/Uuid'
        throttle_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          default: 15
          description: Ventana de agrupación por (canal, tipo, recurso) para no inundar.
    NotificationChannelInput:
      type: object
      required:
        - name
        - kind
        - config
        - subscription
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 80
        kind:
          $ref: '#/components/schemas/NotificationChannelKind'
        enabled:
          type: boolean
          default: true
        config:
          oneOf:
            - $ref: '#/components/schemas/EmailChannelConfig'
            - $ref: '#/components/schemas/TelegramChannelConfig'
            - $ref: '#/components/schemas/LibreNmsChannelConfig'
            - $ref: '#/components/schemas/WebhookChannelConfig'
        subscription:
          $ref: '#/components/schemas/ChannelSubscription'
        include_personal_data:
          type: boolean
          default: false
          description: true ⇒ los mensajes incluyen la IP del cliente (auditado). Por defecto alias o IP enmascarada.
    NotificationChannel:
      allOf:
        - $ref: '#/components/schemas/TenantScopedResource'
        - $ref: '#/components/schemas/NotificationChannelInput'
        - type: object
          required:
