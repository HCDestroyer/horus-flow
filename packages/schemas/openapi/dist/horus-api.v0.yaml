        sistema:
          type: string
          enum:
            - argosisp
          description: Sistema que canjea (B).
        base_url:
          type: string
          maxLength: 2048
          description: Origen https de la API de ArgosISP (Horus añade /api/v1).
        token:
          type: string
          minLength: 8
          maxLength: 512
          writeOnly: true
          description: Token atk_… para que Horus lea de Argos.
        webhook:
          type: object
          required:
            - url
            - secreto
          properties:
            url:
              type: string
              maxLength: 2048
              description: Receptor de webhooks de ArgosISP (§3.4).
            secreto:
              type: string
              minLength: 16
              maxLength: 256
              writeOnly: true
    ArgosConnectionRedeemResponse:
      type: object
