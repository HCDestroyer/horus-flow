          type: integer
          minimum: 1
          maximum: 10
          description: 1 = primero.
        risk:
          type: string
          enum:
            - low
            - medium
            - high
          description: Impacto sobre el servicio del cliente si se aplica.
        audience:
          type: string
          enum:
            - noc
            - network_engineer
            - customer_support
        execution:
          type: string
          const: manual
          description: Siempre manual en v1 (ADR-0022, ADR-0024 §4).
