            - suspected
            - hysteresis_days
          properties:
            commercial:
              type: integer
              minimum: 1
              maximum: 100
            suspected:
              type: integer
              minimum: 1
              maximum: 100
            hysteresis_days:
              type: integer
              minimum: 0
    CustomerScoringPoint:
