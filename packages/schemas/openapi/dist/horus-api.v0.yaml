# GENERADO (redocly bundle): no editar.
openapi: 3.1.0
info:
  title: Horus Flow API (contrato v0)
  version: 0.1.0
  description: |-
    GENERADO por packages/schemas/tools/contracts-check.mjs --write a partir de las specs de módulo. No editar.
    API pública /api/v1 (docs/api.md). Tenant solo por el claim `tid` del token. Errores RFC 9457, paginación por cursor.
  license:
    name: Propietaria
    identifier: LicenseRef-Horus-Proprietary
servers:
  - url: https://{domain}/api/v1
    description: Host público por instalación (D14, D19, HORUS_PUBLIC_BASE_URL) — dominio propio, subdominio o solo la IP del servidor; siempre HTTPS.
    variables:
      domain:
        default: horus.example.net
        description: Dominio, subdominio o IP literal (modo `ip_only`, p. ej. 203.0.113.10).
tags:
  - name: auth
    description: Sesión y tokens.
  - name: me
    description: Cuenta propia.
  - name: members
    description: Miembros, roles y permisos del tenant.
  - name: kiosks
    description: Kioscos (pantallas NOC) como dispositivos registrados.
  - name: api-tokens
    description: API tokens de integración (hf_pat_) del ISP, p. ej. el código de conexión para ArgosISP.
  - name: sso
    description: Autologin entre sistemas con tickets de un solo uso y vinculación de cuentas (ArgosISP, contrato §1.5).
  - name: realtime
    description: Tiempo real (WebSocket `wss://<dominio>/api/v1/ws`, subprotocolo `horus.ws.v1`).
  - name: system
    description: Estado del sistema y modos degradados.
  - name: platform
    description: Consola de plataforma (superadministración de la instalación).
  - name: sites
    description: Nodos (sitios) del ISP.
  - name: routers
    description: Routers (el principal de cada nodo exporta los flujos).
  - name: client-prefixes
    description: Qué IPs son de clientes en cada nodo.
  - name: customers
    description: Clientes = IPs observadas (D1).
  - name: asn-rules
    description: ASN propios del ISP — nombre, categoría y servicio que se aplican al clasificar el tráfico nuevo.
  - name: integrations
    description: Integraciones de ecosistema (ADR-0030) — consulta 360 por IP, consumo por lotes y conector ArgosISP.
  - name: onboarding
    description: Script de alta, enrolamiento y script inverso.
  - name: wireguard
    description: Estado de los peers (túneles) del ISP.
  - name: exporters
    description: Exportadores de flujos (router principal de cada nodo).
  - name: routers-monitoring
    description: Estado observado y métricas en vivo de los routers (SNMP + ICMP por el túnel).
  - name: infra-services
    description: Servicios de infraestructura del ISP (IPTV, HTTP, DNS, RADIUS…) y sus chequeos activos y pasivos.
  - name: capacity
    description: |
      Capacidad de enlaces de subida y salud de los nodos (NOC): utilización y saturación, pérdida/latencia/jitter por
      enlace (sondas netwatch del router, leídas en solo lectura), tráfico local vs internacional y pronóstico de
      crecimiento con fecha estimada de upgrade.
  - name: traffic
    description: Tops y series de tráfico.
  - name: dashboards
    description: Dashboards, widgets y playlists (D8).
  - name: kiosk
    description: Configuración del kiosco.
  - name: reports
    description: Reportes programados y a petición (rol reporting; I3 — seguridad semanal en PDF y CSV).
  - name: findings
    description: Hallazgos y su ciclo de vida.
  - name: reputation
    description: Feeds de reputación (plataforma) y allowlist (ISP).
  - name: scoring
    description: Scoring residencial/comercial explicable del cliente (I2).
  - name: notifications
    description: Canales de notificación del ISP y entregas.
  - name: librenms
    description: Integración con LibreNMS (aprovisionamiento, alertado delegado e IP de gestión de los routers).
  - name: assist
    description: Asistente de IA, configuración del proveedor y auditoría.
  - name: mcp
    description: Servidor MCP con las herramientas de solo lectura del asistente.
paths:
  /analytics/customers/{customer_id}/traffic:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags:
        - traffic
      operationId: getCustomerTraffic
      summary: Series de tráfico de un cliente (desde reset_at si existe). Acceso auditado
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.customer.read
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
            enum:
              - none
              - service
              - category
              - asn
            default: none
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Step'
      responses:
        '200':
          description: Series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analytics/routers/{router_id}/interfaces/metrics:
    parameters:
      - name: router_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags:
        - routers
      operationId: getRouterInterfaceMetrics
      summary: Series por interfaz (tráfico, paquetes, errores, descartes) con rango
      description: |
        Una serie por métrica e interfaz (`group` = nombre de la interfaz). Sin `interface_id`, las interfaces
        de subida (uplink) y, si no hay, las físicas con tráfico; como mucho 8 interfaces por consulta.
      x-module: analytics
      x-scope: tenant
      x-permission: snmp.read
      x-principals:
        - user
        - api_token
        - kiosk
      x-increment: I2
      security:
        - tenantBearer: []
        - kioskBearer: []
      parameters:
        - name: interface_id
          in: query
          description: UUID de interfaces separados por comas (máximo 8).
          schema:
            type: string
        - name: metrics
          in: query
          schema:
            type: string
            default: rx_bps,tx_bps
            description: rx_bps,tx_bps,rx_pps,tx_pps,rx_errors,tx_errors,rx_drops,tx_drops,utilization_rx,utilization_tx
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Step'
      responses:
        '200':
          description: Series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analytics/routers/{router_id}/metrics:
    parameters:
      - name: router_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags:
        - routers
      operationId: getRouterMetrics
      summary: Series del dispositivo (CPU, memoria, temperatura, latencia, disponibilidad) con rango
      description: |
        Desde `snmp.device_metrics` (crudo 30 d, 5 min 90 d, 1 h 13 meses). `availability_ratio` es la fracción
        de sondeos ICMP respondidos en el bucket; los huecos (router apagado, sondeador caído) son `null`, nunca 0.
      x-module: analytics
      x-scope: tenant
      x-permission: snmp.read
      x-principals:
        - user
        - api_token
        - kiosk
      x-increment: I2
      security:
        - tenantBearer: []
        - kioskBearer: []
      parameters:
        - name: metrics
          in: query
          schema:
            type: string
            default: cpu_percent,memory_percent,temperature_celsius
            description: cpu_percent,cpu_max_core_percent,memory_percent,temperature_celsius,cpu_temperature_celsius,icmp_rtt_ms,icmp_loss_ratio,availability_ratio,poll_duration_ms,uptime_seconds
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Step'
      responses:
        '200':
          description: Series (`metric` = nombre pedido; `unit` percent | celsius | ms | ratio | seconds).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analytics/traffic/attribution:
    get:
      tags:
        - traffic
      operationId: getTrafficAttribution
      summary: Cobertura de atribución (bytes atribuidos a clientes, de infraestructura y fuera de prefijos)
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/SiteIdFilter'
        - $ref: '#/components/parameters/Range'
      responses:
        '200':
          description: Proporciones.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - attributed_ratio
                      - infrastructure_ratio
                      - unattributed_ratio
                    properties:
                      attributed_ratio:
                        type: number
                      infrastructure_ratio:
                        type: number
                      unattributed_ratio:
                        type: number
                  meta:
                    $ref: '#/components/schemas/AnalyticsMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /analytics/traffic/timeseries:
    get:
      tags:
        - traffic
      operationId: getTrafficTimeseries
      summary: Serie de tráfico ↓/↑ del ISP o de un nodo (huecos como null)
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/SiteIdFilter'
        - name: metrics
          in: query
          schema:
            type: string
            default: down_bps,up_bps
            description: down_bps,up_bps,flows_per_second,active_customers
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Step'
      responses:
        '200':
          description: Series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /analytics/traffic/top:
    get:
      tags:
        - traffic
      operationId: getTrafficTop
      summary: Top N (≤ 10) + "Otros" por clientes, servicios, categorías, organizaciones o ASN
      description: '`dimension=customers` exige además `customers.read` (datos personales); sin él → 403.'
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - name: dimension
          in: query
          required: true
          schema:
            type: string
            enum:
              - customers
              - services
              - categories
              - organizations
              - asns
        - $ref: '#/components/parameters/SiteIdFilter'
        - name: customer_id
          in: query
          description: Ámbito de cliente (exige `traffic.customer.read`).
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - both
              - download
              - upload
            default: both
        - name: 'n'
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Top.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/TopResult'
                  meta:
                    $ref: '#/components/schemas/AnalyticsMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api-token-templates:
    get:
      tags:
        - api-tokens
      operationId: listApiTokenTemplates
      summary: Plantillas de permisos para API tokens (p. ej. ArgosISP)
      x-module: auth
      x-scope: tenant
      x-permission: api_tokens.manage
      x-principals:
        - user
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Plantillas.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiTokenTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api-tokens:
    get:
      tags:
        - api-tokens
      operationId: listApiTokens
      summary: API tokens de integración del ISP (sin su valor)
      x-module: auth
      x-scope: tenant
      x-permission: api_tokens.manage
      x-principals:
        - user
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Tokens (más recientes primero; incluye revocados y caducados).
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - api-tokens
      operationId: createApiToken
      summary: Crea un API token `hf_pat_…` (el valor se muestra una sola vez)
      description: |
        Token opaco `hf_pat_<32 B base62>` ligado a este ISP y a quien lo crea (docs/security.md §5.4). Lleva un
        subconjunto de los permisos **actuales** del creador (por `template` o `permissions`); en cada uso el
        gateway lo canjea por un access token de 2 min con la intersección entre esos permisos y los que el creador
        tenga en ese momento (con sus alcances por nodo). Caducidad por defecto 1 año (máximo 1 año). Solo se guarda
        su SHA-256. Plantilla `argosisp` = código de conexión para ArgosISP (docs/integrations/argosisp.md §1.1).
        Un API token no puede crear ni gestionar API tokens.
      x-module: auth
      x-scope: tenant
      x-permission: api_tokens.manage
      x-principals:
        - user
      x-reauth: true
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenInput'
      responses:
        '201':
          description: Token creado (incluye `token`, que no se vuelve a mostrar).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenIssued'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api-tokens/{api_token_id}:
    parameters:
      - name: api_token_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    delete:
      tags:
        - api-tokens
      operationId: revokeApiToken
      summary: Revoca un API token (deja de servir de inmediato)
      x-module: auth
      x-scope: tenant
      x-permission: api_tokens.manage
      x-principals:
        - user
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /asn-rules:
    get:
      tags:
        - asn-rules
      operationId: listAsnRules
      summary: Reglas ASN propias del ISP (nombre, categoría y servicio por ASN)
      description: |
        Lista completa (como mucho 1000 reglas por ISP, sin paginar), ordenada por ASN. Las reglas se aplican
        a los flujos que se ingieren desde su alta (`classification_method = local_override`); el histórico
        no se reclasifica. El nombre sí se muestra en los tops por ASN y organización de cualquier rango.
      x-module: devices
      x-scope: tenant
      x-permission: settings.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Reglas del ISP.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AsnRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - asn-rules
      operationId: createAsnRule
      summary: Nombra un ASN para el ISP (ASN repetido → 422 con error en `asn`)
      x-module: devices
      x-scope: tenant
      x-permission: settings.manage
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsnRuleInput'
      responses:
        '201':
          description: Creada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsnRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /asn-rules/catalog:
    get:
      tags:
        - asn-rules
      operationId: getAsnRuleCatalog
      summary: Categorías y servicios del catálogo de plataforma que admite una regla ASN
      x-module: devices
      x-scope: tenant
      x-permission: settings.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Opciones del catálogo vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsnRuleCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /asn-rules/{asn_rule_id}:
    parameters:
      - $ref: '#/components/parameters/AsnRuleId'
    patch:
      tags:
        - asn-rules
      operationId: updateAsnRule
      summary: Edita el nombre, la categoría, el servicio o la nota de una regla (el ASN no cambia)
      x-module: devices
      x-scope: tenant
      x-permission: settings.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/AsnRulePatch'
          application/json:
            schema:
              $ref: '#/components/schemas/AsnRulePatch'
      responses:
        '200':
          description: Actualizada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsnRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    delete:
      tags:
        - asn-rules
      operationId: deleteAsnRule
      summary: Borra una regla (el tráfico nuevo vuelve a clasificarse con el catálogo)
      x-module: devices
      x-scope: tenant
      x-permission: settings.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /asn/{asn}:
    get:
      tags:
        - traffic
      operationId: getAsnInfo
      summary: Cómo se llama hoy un ASN (dataset público, catálogo de plataforma y regla propia del ISP)
      description: |
        Nombre y país del snapshot IP→ASN de plataforma, organización del catálogo si el ASN está en él y la
        regla ASN propia del ISP si existe (proyección de los eventos de devices: puede tardar unos segundos
        en reflejar un cambio). Un ASN desconocido responde 200 con `name` null.
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - name: asn
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 4294967295
      responses:
        '200':
          description: Datos del ASN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsnInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /assist/analyses:
    get:
      tags:
        - assist
      operationId: listAssistAnalyses
      summary: Historial de análisis de IA de un hallazgo o un router, del más reciente al más antiguo
      description: |
        Devuelve los análisis correctos guardados del recurso tal como se mostraron (Markdown enmascarado),
        dentro de la retención `HORUS_ASSIST_HISTORY_RETENTION` (90 días por defecto; 0 = no se guardan y la
        lista viene vacía). Volver a verlos no consume consultas. Permiso: el de lectura del recurso
        (`finding` → `security.findings.read`, `router` → `devices.read`); el recurso se lee como el usuario
        y, si no lo ve, `404 ASSIST_CONTEXT_NOT_FOUND`.
      x-module: assist
      x-scope: tenant
      x-permission: authenticated
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - name: feature
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AssistFeature'
