    NotificationChannelKind:
      type: string
      description: |
        `email`, `telegram` y `librenms` (D17, por API) disponibles. Enum abierto (después: webhook, whatsapp,
        sms); un `kind` conocido por el contrato pero aún no implementado → `422 NOTIFICATION_CHANNEL_KIND_NOT_AVAILABLE`.
      enum:
        - email
        - telegram
        - librenms
    EmailChannelConfig:
      type: object
      title: EmailChannelConfig
      required:
        - recipients
      additionalProperties: false
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: email
        subject_prefix:
          type: string
          maxLength: 40
          default: '[Horus]'
        language:
          type: string
          enum:
            - es
            - en
          default: es
    TelegramChannelConfig:
      type: object
      title: TelegramChannelConfig
      required:
        - chat_id
      additionalProperties: false
      properties:
        chat_id:
          type: string
          pattern: ^-?[0-9]{1,20}$|^@[A-Za-z0-9_]{5,32}$
        uses_own_bot:
          type: boolean
          default: false
          readOnly: true
        language:
          type: string
          enum:
            - es
            - en
          default: es
    LibreNmsChannelConfig:
      type: object
      title: LibreNmsChannelConfig
      description: |
        D17: LibreNMS como destino por **su API** (instancia dedicada a Horus), configurado a mano por cada ISP.
        Solo la parte no secreta: contraseña y token van por `PUT /notification-channels/{id}/credentials`
        (write-only). LibreNMS como fuente de inventario queda fuera del I1.
      required:
        - base_url
        - username
      additionalProperties: false
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https?://
          description: URL base de la instancia (p. ej. `https://librenms.isp.example`); Horus añade `/api/v0`. Sin credenciales en la URL.
          examples:
            - https://librenms.isp.example
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: Usuario de LibreNMS dedicado a Horus.
        tls_verify:
          type: boolean
          default: true
          description: false solo para certificados autofirmados (auditado).
        timeout_seconds:
          type: integer
          minimum: 2
          maximum: 30
          default: 10
    NotificationEventType:
      type: string
      description: Tipos de evento a los que se suscribe un canal en el I1 (enum abierto).
      enum:
        - finding_opened
        - finding_reopened
        - exporter_silent
        - exporter_recovered
        - tunnel_down
        - tunnel_recovered
    Severity:
      type: string
      description: Severidad (enum abierto; el cliente trata valores desconocidos como "otro").
      enum:
        - info
        - low
        - medium
        - high
        - critical
    ChannelSubscription:
      type: object
      required:
