          items:
            $ref: '#/components/schemas/Uuid'
        throttle_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          default: 15
          description: Ventana de agrupación por (canal, tipo, recurso) para no inundar.
    NotificationChannelInput:
      type: object
