          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArgosIntegration' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    put:
      tags: [integrations]
      operationId: putArgosIntegration
      summary: Configura el conector ArgosISP (URL, token `atk_…` de solo escritura, activo)
      description: |
        `token` es de solo escritura: se guarda cifrado con la KEK de devices y nunca se devuelve (`has_token`).
        Omitirlo conserva el guardado. La URL base incluye `/api/v1` de ArgosISP; https obligatorio (destinos
        privados o http solo con HORUS_INTEGRATIONS_ALLOW_PRIVATE=true, laboratorios). La primera configuración genera
        el secreto del webhook (mostrarlo con `POST …/webhook-secret`).
      x-module: devices
      x-scope: tenant
      x-permission: settings.manage
      x-principals: [user]
      x-reauth: true
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArgosIntegrationInput' }
      responses:
        '200':
          description: Conector guardado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArgosIntegration' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /integrations/argosisp/webhook-secret:
    post:
      tags: [integrations]
      operationId: rotateArgosWebhookSecret
      summary: Genera un secreto nuevo para el webhook de ArgosISP y lo muestra una vez (con la URL a copiar en Argos)
      description: |
        El secreto lo genera Horus (receptor) y se copia en ArgosISP junto con `webhook_url` (contrato §1.3). El
        anterior sigue valiendo 24 h para que dé tiempo a cambiarlo en Argos.
      x-module: devices
      x-scope: tenant
      x-permission: settings.manage
      x-principals: [user]
      x-reauth: true
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: URL y secreto (el secreto no se vuelve a mostrar).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArgosWebhookSecret' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /integrations/argosisp/connection-test:
    post:
      tags: [integrations]
      operationId: testArgosIntegration
      summary: Prueba la conexión con ArgosISP (síncrona, timeout 10 s, no cambia nada)
      x-module: devices
      x-scope: tenant
      x-permission: settings.manage
      x-principals: [user]
      x-rate-limit: argosisp
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Resultado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArgosConnectionTest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /integrations/argosisp/webhook/{connector_id}:
    parameters:
      - name: connector_id
        in: path
        required: true
        description: Identificador opaco del conector (no es el ISP); forma parte de la URL que se copia en ArgosISP.
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    post:
      tags: [integrations]
      operationId: receiveArgosWebhook
      summary: Receptor de webhooks firmados de ArgosISP
      description: |
        Contrato docs/integrations/argosisp.md §1.3 y §2.3. Firma obligatoria (`X-Webhook-Signature: v1=…` con el
        secreto del conector), marca de tiempo con ≤ 5 min de desfase y deduplicación por `X-Webhook-Id`. Responde
        202 rápido y procesa en segundo plano (re-resolución de las IPs o servicios afectados). Firma inválida → 401;
        conector desconocido o apagado → 404 (sin distinguir). Eventos desconocidos se aceptan y se ignoran.
      x-module: devices
      x-scope: public
      x-permission: public
      x-rate-limit: webhook_in
      x-increment: I3
      security: []
      parameters:
        - { name: X-Webhook-Id, in: header, required: true, schema: { type: string, maxLength: 128 } }
        - { name: X-Webhook-Timestamp, in: header, required: true, schema: { type: string, pattern: '^[0-9]{1,12}$' } }
        - { name: X-Webhook-Signature, in: header, required: true, schema: { type: string, pattern: '^v1=[0-9a-f]{64}' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArgosWebhookEvent' }
      responses:
        '202': { description: Aceptado (o duplicado ya recibido). }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '413': { description: Cuerpo de más de 1 MiB. }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /integrations/argosisp/connection-links:
    post:
      tags: [integrations]
      operationId: createArgosConnectionLink
      summary: Genera un enlace de conexión para ArgosISP (un uso, 15 min, mostrado una vez)
      description: |
        Contrato docs/integrations/argosisp.md §1.4 (H10). Horus crea un código aleatorio de 32 bytes, guarda solo su
        SHA-256 y devuelve una sola vez `https://<horus>/conectar#<código>` (el código va en el fragmento). Caduca a
        los 15 min y sirve una vez (`POST /integrations/argosisp/conexion/canjear`). Generar un enlace nuevo anula el
        anterior sin usar. Como el canje emite un API token `hf_pat_` (plantilla ArgosISP) a nombre de quien genera el
        enlace y crea un canal de notificación webhook, exige además `api_tokens.manage` y `alerts.manage`. Requiere
        `HORUS_PUBLIC_BASE_URL` (si no, `409 INTEGRATION_NOT_CONFIGURED`). Auditado.
      x-module: devices
      x-scope: tenant
      x-permission: settings.manage
      x-permission-all: [api_tokens.manage, alerts.manage]
      x-principals: [user]
      x-reauth: true
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '201':
          description: Enlace (no se vuelve a mostrar).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArgosConnectionLink' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /integrations/argosisp/connection-links/redeem:
    post:
      tags: [integrations]
      operationId: redeemArgosConnectionLink
      summary: Canjea un enlace de conexión generado en ArgosISP (Conectar con enlace)
      description: |
        Contrato §1.4 (H10), con Horus como sistema B. Horus emite en este momento un API token `hf_pat_` con la
        plantilla ArgosISP a nombre de quien canjea, prepara el secreto del receptor de webhooks y llama, de servidor
        a servidor y solo por https (guardia de egreso; http o destinos privados solo con
        HORUS_INTEGRATIONS_ALLOW_PRIVATE=true), a `POST <API de Argos>/api/v1/integraciones/horus/conexion/canjear`.
        Con la respuesta guarda cifrados el token `atk_…` de Argos y el secreto de su receptor, crea (o actualiza) el
        canal de notificación webhook hacia Argos **apagado** y deja el conector **apagado** hasta que un
        administrador lo active. Si Argos rechaza el código (`410`/`422`) o no responde, revoca el token recién
        emitido y no cambia nada (`422 CONNECTION_LINK_EXPIRED` \| `CONNECTION_LINK_REJECTED`, `502
        INTEGRATION_UNAVAILABLE`). El enlace es `https://<panel de Argos>/conectar#<código>`; si la API de Argos está en
        otro origen, el enlace lo indica con `?api=<origen>` (contrato 1.5.0). Auditado.
      x-module: devices
      x-scope: tenant
      x-permission: settings.manage
      x-permission-all: [api_tokens.manage, alerts.manage]
      x-principals: [user]
      x-reauth: true
      x-audited: true
      x-rate-limit: connection_link
      x-increment: I3
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [link]
              properties:
                link: { type: string, maxLength: 4096, writeOnly: true, examples: ['https://panel.isp.example/conectar#<código>'] }
      responses:
        '200':
          description: Conector preparado y apagado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArgosIntegration' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
        '502':
          description: ArgosISP no responde o respondió algo inesperado (`INTEGRATION_UNAVAILABLE`).
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
  /integrations/argosisp/conexion/canjear:
    post:
      tags: [integrations]
      operationId: redeemArgosConnectionCode
      summary: Canje del enlace de conexión de Horus por ArgosISP (servidor a servidor)
      description: |
        Contrato §1.4 (H10), con Horus como sistema A. Público: el código de un solo uso es la credencial (solo su
        SHA-256 en la base, 15 min). Con un código válido, Horus guarda cifrados el token `atk_…` y el secreto del
        receptor de Argos, crea (o actualiza) el canal webhook hacia Argos **apagado**, emite el API token `hf_pat_`
        (plantilla ArgosISP, a nombre de quien generó el enlace) y el secreto de su propio receptor, y deja el
        conector **apagado** hasta que un administrador lo active. `base_url` y `webhook.url` solo https y destinos
        públicos (guardia de egreso; laboratorios: HORUS_INTEGRATIONS_ALLOW_PRIVATE=true). `base_url` es el origen de
        Argos (Horus añade `/api/v1`, contrato 1.5.0). Repetir **la misma** petición con el mismo código mientras no
        caduque devuelve la misma respuesta (`Idempotency-Replayed: true`); cualquier otra petición con un código ya
        usado → `410`. Auditado en el ISP (`integrations.argosisp.connection_link.redeemed`).
      x-module: devices
      x-scope: public
      x-permission: public
      x-rate-limit: connection_link
      x-increment: I3
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArgosConnectionRedeemRequest' }
      responses:
        '200':
          description: Conexión preparada (el token y el secreto solo viajan en esta respuesta).
          headers:
            Idempotency-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArgosConnectionRedeemResponse' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '410':
          description: Código vencido, ya usado o desconocido (`CONNECTION_LINK_INVALID`).
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /integrations/argosisp/sso/tickets:
    post:
      tags: [integrations]
      operationId: issueArgosSsoTicket
      summary: Emite un ticket de autologin para entrar a Horus desde ArgosISP (un uso, 60 s)
      description: |
        Contrato §1.5 (H11). Lo llama el **servidor** de ArgosISP con su API token `hf_pat_` (permiso `sso.issue` de
        la plantilla ArgosISP); nunca el navegador (solo API tokens: un token de persona → 403). Si el conector se
        preparó con un enlace de conexión, solo vale el token emitido en ese canje. El conector ArgosISP del ISP debe
        estar activo (`409 INTEGRATION_NOT_CONFIGURED`). El ticket (32 B aleatorios, solo su SHA-256) vive 60 s, sirve
        una vez, queda ligado al ISP y al conector y no da ningún permiso: el destino aplica siempre el ACL del usuario
        de Horus vinculado. Responde la URL `https://<horus>/sso/entrar#<ticket>` que el navegador abre. Auditado.
      x-module: devices
      x-scope: tenant
      x-permission: sso.issue
      x-principals: [api_token]
      x-rate-limit: sso_issue
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SsoTicketRequest' }
      responses:
        '201':
          description: Ticket emitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoTicketIssued' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /integrations/argosisp/sso/resolve:
    post:
      tags: [integrations]
      operationId: resolveArgosSsoTarget
      summary: Resuelve el destino de un autologin con el ACL del usuario (cliente, servicio, router u hallazgo)
      description: |
        Contrato §1.5. Tras el canje, la consola pide aquí, con el token del ISP del usuario, a qué recurso de Horus
        lleva el destino: `cliente`/`servicio` = id de ArgosISP (identidad vigente, §2.4); `router`/`hallazgo` = id
        de Horus (el que Argos recibió en los webhooks §3.4, contrato 1.5.0). Exige el permiso de leer ese recurso
        (`customers.read` con su alcance por nodo, `devices.read`, `security.findings.read`); sin él → `403`; sin
        recurso visible → `404`. La consola construye la ruta (nunca una URL recibida).
      x-module: devices
      x-scope: tenant
      x-permission: authenticated
      x-principals: [user]
      x-increment: I3
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, external_id]
              properties:
                type: { type: string, enum: [cliente, servicio, router, hallazgo] }
                external_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Recurso de Horus.
          content:
            application/json:
              schema:
                type: object
                required: [kind, id]
                properties:
                  kind: { type: string, enum: [customer, router, finding] }
                  id: { $ref: './common.yaml#/components/schemas/Uuid' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /integrations/argosisp/sso/open:
    post:
      tags: [integrations]
      operationId: openArgosSso
      summary: '"Ver en ArgosISP": pide a ArgosISP un ticket de autologin para el servicio o cliente de un cliente de Horus'
      description: |
        Contrato §1.5 (H11), con Horus como origen. El **servidor** de Horus llama a
        `POST <API de Argos>/integraciones/horus/sso/tickets` con el token `atk_…` del conector (alcance `sso.emitir`)
        y los datos del usuario de Horus (`id_externo` = id del usuario, correo y nombre); el navegador nunca pide el
        ticket. El destino sale de la identidad vigente del cliente (`servicio` por defecto, o `cliente`). Exige el
        conector activo (`409`), el cliente visible para el usuario (`404`) y su identidad vigente (`404
        EXTERNAL_IDENTITY_NOT_FOUND`). La URL devuelta por Argos solo se acepta si es https (http solo en laboratorio),
        sin credenciales, con la ruta `/sso/entrar` y el ticket en el fragmento. ArgosISP aplica su propio ACL.
        Auditado.
      x-module: devices
      x-scope: tenant
      x-permission: customers.read
      x-principals: [user]
      x-rate-limit: argosisp
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customer_id]
              properties:
                customer_id: { $ref: './common.yaml#/components/schemas/Uuid' }
                target: { type: string, enum: [servicio, cliente], default: servicio }
      responses:
        '200':
          description: URL de un uso para abrir en el navegador.
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string, description: 'https://<panel de Argos>/sso/entrar#<ticket> (60 s, un uso).' }
                  expires_at:
                    oneOf:
                      - $ref: './common.yaml#/components/schemas/Timestamp'
                      - type: 'null'
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
        '502':
          description: ArgosISP no respondió, rechazó el token o devolvió una URL no válida (`INTEGRATION_UNAVAILABLE`).
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
components:
  securitySchemes:
    tenantBearer: { $ref: './common.yaml#/components/securitySchemes/tenantBearer' }
    kioskBearer: { $ref: './common.yaml#/components/securitySchemes/kioskBearer' }
  parameters:
    SiteId:
      name: site_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    RouterId:
      name: router_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    ClientPrefixId:
      name: client_prefix_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    AsnRuleId:
      name: asn_rule_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
  schemas:
    AsnRuleInput:
      type: object
      additionalProperties: false
      required: [asn, name]
      description: |
        `category` es obligatoria salvo que se indique `service`: con un servicio del catálogo la categoría es la de ese
        servicio (los agregados solo guardan el servicio) y una distinta → 422 en `category`.
      properties:
        asn: { type: integer, format: int64, minimum: 1, maximum: 4294967295, examples: [263237] }
        name: { type: string, minLength: 1, maxLength: 80, description: 'Nombre visible en tops, dashboards y kioscos.' }
        category: { type: string, maxLength: 64, description: 'Slug de una categoría del catálogo (`GET /asn-rules/catalog`).' }
        service:
          type: [string, 'null']
          maxLength: 64
          description: Slug de un servicio del catálogo; null = el nombre de la regla hace de servicio.
        note: { type: [string, 'null'], maxLength: 300 }
    AsnRulePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        category: { type: string, maxLength: 64 }
        service: { type: [string, 'null'], maxLength: 64 }
        note: { type: [string, 'null'], maxLength: 300 }
    AsnRule:
      allOf:
        - $ref: './common.yaml#/components/schemas/TenantScopedResource'
        - $ref: '#/components/schemas/AsnRuleInput'
        - type: object
          required: [category, service, note]
          properties:
            category: { type: string }
            service: { type: [string, 'null'] }
            note: { type: [string, 'null'] }
    AsnRuleCatalog:
      type: object
      required: [categories, services]
      properties:
        categories:
          type: array
          items:
            type: object
            required: [slug, name]
            properties:
              slug: { type: string }
              name: { type: string }
        services:
          type: array
          items:
            type: object
            required: [slug, name, category]
            properties:
              slug: { type: string }
              name: { type: string }
              category: { type: string }
    SiteInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        code: { type: [string, 'null'], maxLength: 32 }
        kind: { type: string, enum: [node, region, datacenter, other], default: node }
        parent_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        address: { type: [string, 'null'], maxLength: 300 }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        timezone: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
    Site:
      allOf:
        - $ref: './common.yaml#/components/schemas/TenantScopedResource'
        - $ref: '#/components/schemas/SiteInput'
        - type: object
          required: [discovery_mode, primary_router_id, private_realm_id]
          properties:
            discovery_mode:
              type: boolean
              description: true si el nodo no tiene prefijos de clientes (el tráfico cuenta para el nodo, no crea clientes).
            primary_router_id:
              oneOf:
                - $ref: './common.yaml#/components/schemas/Uuid'
                - type: 'null'
            private_realm_id:
              $ref: './common.yaml#/components/schemas/Uuid'
              description: Realm `node_private` del nodo (RFC1918 y 100.64.0.0/10).
    RouterInput:
      type: object
      additionalProperties: false
      required: [site_id, name]
      properties:
        site_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        name: { type: string, maxLength: 120, description: Hostname / identidad del router. }
        display_name: { type: [string, 'null'], maxLength: 120 }
        is_primary: { type: boolean, default: true }
        vendor:
          type: string
          enum: [mikrotik, huawei]
          default: mikrotik
          description: |
            Fabricante (roadmap I6, adaptadores por fabricante). `mikrotik`: RouterOS 7 con túnel WireGuard
            (`connection_mode=wireguard`). `huawei`: VRP V5/V8 en modo directo sin túnel (`connection_mode=direct`,
            docs/vendors/huawei.md). No se puede cambiar después del alta.
        model: { type: [string, 'null'], examples: [CCR2116-12G-4S+, NE40E-X8A] }
        routeros_version:
          type: [string, 'null']
          pattern: '^7\.[0-9]+(\.[0-9]+)?$'
          description: 'Declarada por el admin (D15: solo RouterOS 7.x; solo `vendor=mikrotik`). Se sobrescribe con la detectada.'
        management_address:
          type: [string, 'null']
          description: |
            Solo `connection_mode=direct`: IP de origen del router vista por Horus (destino del sondeo SNMP e identidad del
            exportador de flujos). Cambiarla devuelve el router a `pending_configuration` hasta verificarla de nuevo.
          examples: ['198.51.100.20']
        device_type:
          type: string
          enum: [router, switch]
          default: router
          description: |
            `switch`: switch de **monitoreo** (docs/vendors/mikrotik.md §13, huawei.md §11). Misma tabla que los routers
            (estado, credencial SNMP cifrada, modo directo y verificación) pero nunca es router principal ni exportador
            primario, nunca crea clientes ni entra en la atribución. Siempre `connection_mode=direct` por la red de
            gestión (`protection_level=unencrypted_private`). No se puede cambiar después del alta.
        switch_platform:
          type: [string, 'null']
          enum: [routeros, swos, vrp, null]
          description: |
            Solo switches (obligatoria): `routeros` (MikroTik CRS con RouterOS 7, SNMPv3), `swos` (MikroTik SwOS, solo
            SNMP v1/v2c: comunidad en claro, solo en la red de gestión) o `vrp` (Huawei serie S). Fija `vendor`.
        tags: { type: array, items: { type: string } }
    RouterPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        display_name: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        routeros_version: { type: [string, 'null'], pattern: '^7\.[0-9]+(\.[0-9]+)?$' }
        admin_state: { type: string, enum: [active, maintenance, decommissioned] }
        management_address: { type: [string, 'null'], description: 'Solo modo directo (ver RouterInput).' }
        sflow_enabled:
          type: boolean
          description: |
            Solo switches con sFlow (`switch_platform=vrp`): el colector acepta sus muestras como fuente **secundaria**
            (top por puerto en la ficha del switch; nunca suman al tráfico de clientes ni de nodos). Otra plataforma →
            `422 SFLOW_NOT_SUPPORTED`.
        tags: { type: array, items: { type: string } }
    Router:
      allOf:
        - $ref: './common.yaml#/components/schemas/TenantScopedResource'
        - $ref: '#/components/schemas/RouterInput'
        - type: object
          required: [admin_state, onboarding_state, routeros_version_supported, tunnel_address, warnings, connection_mode, management_address,
            protection_level, tunnel_remote_address, tunnel_remote_id, device_type, switch_platform, sflow_enabled]
          properties:
            sflow_enabled: { type: boolean, description: 'Switch con sFlow activo (fuente secundaria); siempre false en routers.' }
            admin_state: { type: string, enum: [active, maintenance, decommissioned] }
            onboarding_state:
              type: string
              description: |
                Pasos del asistente (I1-19): `pending_configuration` → `key_received` (clave pública enrolada)
                → `tunnel_up` (primer handshake) → `exporting` (primer flujo). En modo directo (Huawei):
                `pending_configuration` → `snmp_verified` (el sondeador respondió con la credencial SNMPv3 de ese router en
                su dirección de gestión: prueba de control; solo entonces el colector acepta sus flujos) → `exporting`.
                Enum abierto.
              enum: [pending_configuration, key_received, tunnel_up, snmp_verified, exporting]
            connection_mode:
              type: string
              enum: [wireguard, ipsec, gre, direct]
              description: |
                Transporte con Horus (docs/tunnels.md, ADR-0031). `wireguard`: túnel WireGuard router → hub (MikroTik).
                `ipsec`: IPsec IKEv2 route-based (RFC 7296; MikroTik, Huawei y cualquier equipo con IKEv2). `gre`: GRE
                (RFC 2784) **sin cifrado**, respaldo universal. `direct`: sin túnel; el camino lo asegura el operador y el
                colector filtra por la dirección de gestión verificada (docs/vendors/huawei.md §5). Al alta lo fija `vendor`
                (MikroTik → wireguard, Huawei → direct); se cambia con `PUT /routers/{router_id}/transport`.
            protection_level:
              type: string
              enum: [encrypted, unencrypted_private, unencrypted_internet]
              description: |
                `encrypted` (wireguard, ipsec). `unencrypted_private`: gre/direct por un camino que el administrador declaró
                privado (MPLS L3VPN, VRF de gestión, fibra propia). `unencrypted_internet`: gre/direct por Internet,
                confirmado explícitamente por un administrador (aviso permanente en la consola).
            tunnel_remote_address:
              type: [string, 'null']
              description: ipsec/gre — IPv4 pública del router (origen de IKE/GRE; obligatoria en gre).
              examples: ['198.51.100.7']
            tunnel_remote_id:
              type: [string, 'null']
              description: ipsec — identidad IKE del router (IPv4, nombre DNS, usuario@dominio o `keyid:<id>`).
              examples: [rt-centro.isp.example]
            routeros_version_detected: { type: [string, 'null'] }
            routeros_version_supported:
              type: [boolean, 'null']
              description: false si la versión (detectada o declarada) es < 7.12 (D15); null si se desconoce.
            tunnel_address:
              type: [string, 'null']
              description: IP /32 de túnel (WireGuard, IPsec o GRE) asignada por la IPAM de plataforma = identidad del exportador (null en modo directo).
            wireguard_peer_id:
              oneOf:
                - $ref: './common.yaml#/components/schemas/Uuid'
                - type: 'null'
            warnings:
              type: array
              items: { type: string, enum: [routeros_version_unsupported, traffic_flow_target_drift, hardware_offload_suspected] }
            credentials:
              type: array
              items: { $ref: '#/components/schemas/CredentialStatus' }
    RouterTransportInput:
      type: object
      additionalProperties: false
      required: [connection_mode]
      properties:
        connection_mode: { type: string, enum: [wireguard, ipsec, gre, direct] }
        tunnel_remote_address:
          type: [string, 'null']
          description: ipsec (opcional) / gre (obligatoria) — IPv4 pública del router.
          examples: ['198.51.100.7']
        tunnel_remote_id:
          type: [string, 'null']
          maxLength: 253
          description: ipsec — identidad IKE del router (por defecto, su IP pública).
          examples: [rt-centro.isp.example, 'keyid:rt-centro']
        path:
          type: [string, 'null']
          enum: [private, internet, null]
          description: gre/direct — camino por el que viajan gestión y flujos (obligatorio sin cifrado).
        confirm_unencrypted_internet:
          type: boolean
          default: false
          description: gre/direct con `path=internet` — el administrador acepta que SNMP y flujos viajen sin cifrar por Internet.
    DirectOnboarding:
      type: object
      required: [router_id, vendor, language, management_address, collector_address, collector_port, snmp_user, sampling_rate, config, notes, placeholders, warnings]
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        vendor: { type: string, enum: [mikrotik, huawei] }
        language: { type: string, enum: [vrp], description: 'Lenguaje de la configuración (CLI de Huawei VRP).' }
        management_address: { type: string, description: IP de origen del router vista por Horus. }
        collector_address:
          type: [string, 'null']
          description: IP del colector de Horus para el modo directo (HORUS_DEVICES_DIRECT_COLLECTOR_ADDRESS); null = marcador en la configuración.
        collector_port: { type: integer, description: Puerto UDP de NetStream v9 (2055 por defecto). }
        snmp_user: { type: string, description: Usuario SNMPv3 de solo lectura (la contraseña solo va en `config`). }
        sampling_rate: { type: integer }
        config:
          type: string
          description: |
            Configuración VRP para pegar en la CLI (solo comandos, sin comentarios). Contiene las contraseñas SNMPv3:
            se muestra una sola vez.
        notes:
          type: array
          items: { type: string }
          description: Explicaciones (validación pendiente en equipo real, camino seguro, ACL, prompts de contraseña).
        placeholders:
          type: array
          items:
            type: object
            required: [key, description]
            properties:
              key: { type: string, examples: ['{INTERFAZ_NETSTREAM}'] }
              description: { type: string }
        warnings: { type: array, items: { type: string } }
    SwitchOnboarding:
      type: object
      required: [router_id, platform, language, snmp_version, management_address, snmp_user, sflow_enabled, sampling_rate, config, sflow_config,
        notes, placeholders, warnings]
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        platform: { type: string, enum: [routeros, swos, vrp] }
        language:
          type: string
          enum: [routeros, vrp, swos_web]
          description: '`routeros` (script /snmp), `vrp` (CLI serie S) o `swos_web` (pasos de la interfaz web de SwOS).'
        snmp_version: { type: string, enum: ['3', '2c'] }
        management_address: { type: string }
        snmp_user: { type: [string, 'null'], description: 'Usuario SNMPv3 (null con v2c; la contraseña o la comunidad solo van en `config`).' }
        sflow_enabled: { type: boolean }
        sampling_rate: { type: [integer, 'null'] }
        config:
          type: string
          description: Configuración o pasos a aplicar. Contiene la credencial SNMP en claro (se muestra una sola vez).
        sflow_config:
          type: [string, 'null']
          description: Configuración sFlow de la serie S (solo con `sflow=true`).
        notes: { type: array, items: { type: string } }
        placeholders:
          type: array
          items:
            type: object
            required: [key, description]
            properties:
              key: { type: string, examples: ['{PUERTO_SFLOW}'] }
              description: { type: string }
        warnings: { type: array, items: { type: string } }
    CredentialStatus:
      type: object
      required: [kind, configured]
      properties:
        kind: { type: string, enum: [snmp, routeros_api] }
        configured: { type: boolean }
        updated_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        last_used_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        last_result: { type: [string, 'null'], enum: [ok, auth_failed, unreachable, tls_fingerprint_changed, null] }
        tls_fingerprint_sha256:
          type: [string, 'null']
          description: Huella SHA-256 del certificado TLS fijada para la API de RouterOS (solo routeros_api; null hasta el primer contacto).
    ClientPrefixRole:
      type: string
      enum: [customers, infrastructure, excluded]
    ClientPrefixInput:
      type: object
      additionalProperties: false
      required: [prefix, role]
      properties:
        prefix: { $ref: './common.yaml#/components/schemas/Cidr' }
        role: { $ref: '#/components/schemas/ClientPrefixRole' }
        assignment_mode: { type: string, enum: [static, dynamic, unknown], default: unknown }
        default_kind: { $ref: '#/components/schemas/CustomerKind' }
        ipv6_client_len: { type: [integer, 'null'], enum: [48, 56, 60, 64, null], description: Solo IPv6 (por defecto 64). }
        source: { type: string, enum: [manual, routeros_api, discovery_confirmed], default: manual }
        note: { type: [string, 'null'], maxLength: 300 }
    ClientPrefixPatch:
      type: object
      additionalProperties: false
      properties:
        role: { $ref: '#/components/schemas/ClientPrefixRole' }
        assignment_mode: { type: string, enum: [static, dynamic, unknown] }
        default_kind: { $ref: '#/components/schemas/CustomerKind' }
        ipv6_client_len: { type: [integer, 'null'] }
        note: { type: [string, 'null'] }
    ClientPrefix:
      allOf:
        - $ref: './common.yaml#/components/schemas/TenantScopedResource'
        - $ref: '#/components/schemas/ClientPrefixInput'
        - type: object
          required: [site_id, realm_id, realm_kind, confirmed]
          properties:
            site_id: { $ref: './common.yaml#/components/schemas/Uuid' }
            realm_id: { $ref: './common.yaml#/components/schemas/Uuid' }
            realm_kind: { type: string, enum: [public, node_private] }
            confirmed: { type: boolean }
            customers_count: { type: [integer, 'null'] }
    RouterTlsFingerprint:
      type: object
      description: |
        Huella TLS (SHA-256 del certificado, `AA:BB:…`) del servicio REST del router. `not_captured`: aún no leída;
        `pending_confirmation`: observada en el alta, falta que un administrador la confirme; `confirmed`: fijada;
        `changed`: el router presenta otra distinta de la fijada (lecturas detenidas hasta volver a fijarla).
      required: [router_id, status, pinned_sha256, observed_sha256, observed_at, confirmed_at, confirmed_by, last_result, last_used_at]
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        status: { type: string, enum: [not_captured, pending_confirmation, confirmed, changed] }
        pinned_sha256: { type: [string, 'null'], description: Huella fijada (la única con la que se leen datos). }
        observed_sha256: { type: [string, 'null'], description: Huella observada pendiente de confirmación. }
        observed_at: { type: [string, 'null'], format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time, description: Null en huellas fijadas antes de la confirmación explícita. }
        confirmed_by: { type: [string, 'null'], description: Id del usuario que confirmó la huella. }
        last_result: { type: [string, 'null'], enum: [ok, auth_failed, unreachable, tls_fingerprint_changed, null] }
        last_used_at: { type: [string, 'null'], format: date-time }
    PrefixImportPreview:
      type: object
      required: [router_id, read_at, routeros_version, items]
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        read_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        routeros_version: { type: string }
        tls_fingerprint_sha256: { type: string }
        items:
          type: array
          items:
            type: object
            required: [prefix, origin, suggested_role, diff]
            properties:
              prefix: { $ref: './common.yaml#/components/schemas/Cidr' }
              origin: { type: string, enum: [ip_pool, ipv6_pool, interface_address] }
              origin_name: { type: string, examples: [pool-pppoe] }
              suggested_role: { $ref: '#/components/schemas/ClientPrefixRole' }
              suggested_assignment_mode: { type: string, enum: [static, dynamic, unknown] }
              delegated_prefix_length:
                type: [integer, 'null']
                minimum: 1
                maximum: 128
                description: Solo IPv6. `prefix-length` leído de `/ipv6/pool` (tamaño que el router entrega a cada cliente); null en IPv4 o si no es un pool.
              suggested_ipv6_client_len:
                type: [integer, 'null']
                enum: [48, 56, 60, 64, null]
                description: Solo IPv6. Valor propuesto para `ipv6_client_len` (normalmente = delegated_prefix_length si es 48/56/60/64; null si no encaja y el operador debe decidir).
              ipv6_pool_usage:
                type: [string, 'null']
                enum: [dhcpv6_pd, ppp_link, ppp_link_shared, dhcpv6_address, unused, unknown, null]
                description: |
                  Solo IPv6. Uso del pool según `/ppp/profile` y `/ipv6/dhcp-server`: `dhcpv6_pd` (dhcpv6-pd-pool o prefix-pool),
                  `ppp_link` (remote-ipv6-prefix-pool), `ppp_link_shared` (remote-ipv6-prefix-reuse=yes → se sugiere `infrastructure`),
                  `dhcpv6_address` (address-pool /128). Ver docs/vendors/mikrotik.md §11.4.
              diff: { type: string, enum: [new, exists, overlaps] }
              existing_client_prefix_id:
                oneOf:
                  - $ref: './common.yaml#/components/schemas/Uuid'
                  - type: 'null'
    CustomerKind:
      type: string
      description: Tipo de cliente (enum abierto). Por defecto `residential` (D1).
      enum: [residential, commercial, unknown]
    SecurityState:
      type: string
      description: |
        Proyectado desde detection. Etiquetas de presentación (D18; `dashboard/v0/widget-data.schema.json#/$defs/SecurityState`):
        `clean` "Limpio", `suspected` "Sospechoso", `infected` **"Infectado"**, `mitigated` "Mitigado". "Infectado" se
        muestra siempre con las razones y el nivel de confianza de los hallazgos que lo sostienen.
      enum: [clean, suspected, infected, mitigated]
    Customer:
      type: object
      required: [id, tenant_id, version, address, realm_id, site_id, client_prefix_id, status, kind, kind_source, kind_locked, kind_confidence, kind_changed_at, commercial_use_suspected, security_state, open_findings, alias, alias_source, first_seen, last_seen, reset_at]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        tenant_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        version: { $ref: './common.yaml#/components/schemas/Version' }
        address:
          $ref: './common.yaml#/components/schemas/IpAddress'
          description: IP canónica (IPv6 truncada al prefijo del cliente). Dato personal.
        realm_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        site_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        client_prefix_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        status: { type: string, enum: [active, inactive] }
        inactive_reason: { type: [string, 'null'], enum: [no_traffic, prefix_removed, null] }
        kind: { $ref: '#/components/schemas/CustomerKind' }
        kind_source: { type: string, enum: [default, scoring, manual] }
        kind_locked: { type: boolean }
        kind_confidence: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        kind_changed_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        commercial_use_suspected: { type: boolean }
        commercial_score: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Última probabilidad comercial del scoring (I2). }
        suggested_kind:
          description: Tipo sugerido por el último scoring (también con el tipo fijado a mano).
          oneOf:
            - $ref: '#/components/schemas/CustomerKind'
            - type: 'null'
        suggested_confidence: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        suggested_reasons:
          type: array
          description: Razones del último scoring (código estable + detalle con los números reales).
          items: { $ref: './common.yaml#/components/schemas/Reason' }
        suggested_model_version: { type: [string, 'null'] }
        suggested_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        security_state: { $ref: '#/components/schemas/SecurityState' }
        open_findings: { type: integer, minimum: 0 }
        alias: { type: [string, 'null'], maxLength: 120, description: Dato personal. }
        alias_source: { type: [string, 'null'], enum: [manual, routeros_ppp, argosisp, null], description: 'argosisp = nombre del cliente en ArgosISP (nunca pisa uno manual).' }
        first_seen: { $ref: './common.yaml#/components/schemas/Timestamp' }
        last_seen:
          $ref: './common.yaml#/components/schemas/Timestamp'
          description: Resolución ≤ 1 h.
        reset_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        traffic_24h:
          type: [object, 'null']
          description: Resumen opcional (lo rellena analytics si está disponible; null si ClickHouse no responde).
          properties:
            down_bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
            up_bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
            top_category: { type: [string, 'null'] }
    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          properties:
            notes: { type: [string, 'null'], maxLength: 2000, description: Dato personal. }
    CustomerPatch:
      type: object
      additionalProperties: false
      properties:
        alias: { type: [string, 'null'], maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    CustomerPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
        page: { $ref: './common.yaml#/components/schemas/PageInfo' }
    CustomerStats:
      type: object
      required: [total, active, new_today, by_kind, by_kind_source, by_status, by_security_state, by_site, generated_at]
      properties:
        total: { type: integer }
        active: { type: integer }
        new_today: { type: integer }
        by_kind: { type: object, additionalProperties: { type: integer } }
        by_kind_source: { type: object, additionalProperties: { type: integer } }
        by_status: { type: object, additionalProperties: { type: integer } }
        by_security_state: { type: object, additionalProperties: { type: integer } }
        by_site:
          type: array
          items:
            type: object
            required: [site_id, active]
            properties:
              site_id: { $ref: './common.yaml#/components/schemas/Uuid' }
              active: { type: integer }
              with_open_findings: { type: integer }
        generated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    KindChange:
      type: object
      required: [id, changed_at, from_kind, to_kind, source, reasons, confidence, model_ref, actor_id, manual_reason]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        changed_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        from_kind:
          oneOf:
            - $ref: '#/components/schemas/CustomerKind'
            - type: 'null'
        to_kind: { $ref: '#/components/schemas/CustomerKind' }
        source: { type: string, enum: [default, scoring, manual, reset] }
        reasons:
          type: array
          items: { $ref: './common.yaml#/components/schemas/Reason' }
        confidence: { type: [integer, 'null'] }
        model_ref: { type: [string, 'null'] }
        actor_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        manual_reason: { type: [string, 'null'] }
    ExternalRef:
      type: object
      description: Identidad del cliente en un sistema externo vigente en el instante consultado (contrato ArgosISP §3.1).
      required: [system, customer_id, service_id, code, display_name, service_state, plan, company_id, company_name, synced_at, stale]
      properties:
        system: { type: string, enum: [argosisp] }
        customer_id: { type: [integer, 'null'], description: Id del cliente en ArgosISP. }
        service_id: { type: [integer, 'null'], description: Id del servicio en ArgosISP. }
        code: { type: [string, 'null'], examples: [C-000455] }
        display_name: { type: [string, 'null'], description: Nombre en ArgosISP (dato personal). }
        service_state: { type: [string, 'null'], description: 'activo, limitado, suspendido o retirado (enum abierto de ArgosISP).' }
        plan: { type: [string, 'null'] }
        company_id:
          type: [integer, 'null']
          description: |
            Empresa del servicio en ArgosISP (multiempresa, contrato 1.2.0 §2.4). null si ArgosISP no la informó (respaldo
            GET /ip/:ip o versión anterior a 1.2.0).
        company_name: { type: [string, 'null'], description: Nombre de la empresa (puede ser null aunque haya company_id). }
        synced_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        stale: { type: boolean, description: ArgosISP no respondió en la última resolución; se muestra el último dato conocido. }
    ExternalIdentityPeriod:
      type: object
      required: [id, system, external_customer_id, external_service_id, display_name, code, service_state, plan, external_company_id,
        company_name, company_nit, valid_from, valid_to, synced_at, stale]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        system: { type: string, enum: [argosisp] }
        external_customer_id: { type: [integer, 'null'] }
        external_service_id: { type: [integer, 'null'] }
        display_name: { type: [string, 'null'] }
        code: { type: [string, 'null'] }
        service_state: { type: [string, 'null'] }
        plan: { type: [string, 'null'] }
        external_company_id: { type: [integer, 'null'], description: Empresa del servicio en ArgosISP (multiempresa). }
        company_name: { type: [string, 'null'] }
        company_nit: { type: [string, 'null'], description: NIT de la empresa del ISP (no es un dato del cliente). }
        valid_from: { $ref: './common.yaml#/components/schemas/Timestamp' }
        valid_to:
          description: null = vigente.
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        synced_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        stale: { type: boolean }
    CustomerExternalIdentity:
      type: object
      required: [customer_id, connector_enabled, current, history, last_checked_at, last_check_status]
      properties:
        customer_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        connector_enabled: { type: boolean }
        current:
          oneOf:
            - $ref: '#/components/schemas/ExternalRef'
            - type: 'null'
        history: { type: array, items: { $ref: '#/components/schemas/ExternalIdentityPeriod' } }
        last_checked_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        last_check_status: { type: [string, 'null'], enum: [found, not_found, error, null] }
    IpLookupRequest:
      type: object
      additionalProperties: false
      description: |
        `address` o, desde el contrato 1.2.0, `external_service_id` (exactamente uno de los dos; con ambos o ninguno → 422).
      properties:
        address: { $ref: './common.yaml#/components/schemas/IpAddress' }
        external_service_id:
          type: integer
          minimum: 1
          description: |
            Servicio de ArgosISP: se usa su identidad vigente (o la vigente en `at`) y se responde con su IP de entonces.
            Si el servicio tiene varias IPs (IPv4 y prefijo IPv6), la del cliente visto más recientemente.
        at:
          description: Instante de la consulta (por defecto ahora).
          $ref: './common.yaml#/components/schemas/Timestamp'
        include:
          type: array
          description: Bloques opcionales (por defecto los tres).
          items: { type: string, enum: [consumption, health, security] }
    ByteCounters:
      type: object
      required: [up_bytes, down_bytes]
      properties:
        up_bytes: { type: integer, minimum: 0 }
        down_bytes: { type: integer, minimum: 0 }
    IpLookupResponse:
      type: object
      required: [customer, external, consumption, health, security, meta]
      properties:
        customer:
          type: object
          required: [id, address, alias, alias_source, kind, kind_source, status, first_seen, last_seen, site]
          properties:
            id: { $ref: './common.yaml#/components/schemas/Uuid' }
            address: { $ref: './common.yaml#/components/schemas/IpAddress' }
            alias: { type: [string, 'null'] }
            alias_source: { type: [string, 'null'], enum: [manual, routeros_ppp, argosisp, null] }
            kind: { $ref: '#/components/schemas/CustomerKind' }
            kind_source: { type: string, enum: [default, scoring, manual] }
            status: { type: string, enum: [active, inactive] }
            first_seen: { $ref: './common.yaml#/components/schemas/Timestamp' }
            last_seen: { $ref: './common.yaml#/components/schemas/Timestamp' }
            site:
              type: object
              required: [id, name]
              properties:
                id: { $ref: './common.yaml#/components/schemas/Uuid' }
                name: { type: [string, 'null'] }
        external:
          oneOf:
            - $ref: '#/components/schemas/ExternalRef'
            - type: 'null'
        consumption:
          oneOf:
            - type: object
              required: [last_24h, last_7d, last_30d, peak_down_bps_24h, top_services_7d]
              properties:
                last_24h: { $ref: '#/components/schemas/ByteCounters' }
                last_7d: { $ref: '#/components/schemas/ByteCounters' }
                last_30d: { $ref: '#/components/schemas/ByteCounters' }
                peak_down_bps_24h: { type: number, minimum: 0, description: Pico de bajada en buckets de 5 min. }
                top_services_7d:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [name, bytes]
                    properties:
                      name: { type: string }
                      bytes: { type: integer, minimum: 0 }
            - type: 'null'
        health:
          oneOf:
            - type: object
              required: [router, exporter, last_seen_minutes]
              properties:
                router:
                  oneOf:
                    - type: object
                      required: [id, name, status, since]
                      description: |
                        Router que lleva el tráfico del cliente (contrato 1.6.0): el de sus flujos más recientes (hasta 24 h
                        antes de `at`); sin flujos recientes o sin analítica, el principal de su nodo (`source: primary_router`).
                      properties:
                        id: { $ref: './common.yaml#/components/schemas/Uuid' }
                        name: { type: string }
                        status: { type: string, description: 'online, warning, critical, degraded, offline o unknown.' }
                        since:
                          oneOf:
                            - $ref: './common.yaml#/components/schemas/Timestamp'
                            - type: 'null'
                        source: { type: string, enum: [flows, primary_router], description: 'Desde 1.6.0.' }
                        customer_last_flow_at:
                          description: Último flujo del cliente por este router (null con `primary_router`). Desde 1.6.0.
                          oneOf:
                            - $ref: './common.yaml#/components/schemas/Timestamp'
                            - type: 'null'
                    - type: 'null'
                exporter:
                  type: object
                  required: [status, last_flow_at]
                  properties:
                    status: { type: [string, 'null'], description: 'FlowExporterState del router de `health.router`.' }
                    last_flow_at:
                      description: Último flujo recibido del exportador de ese router (estado del collector).
                      oneOf:
                        - $ref: './common.yaml#/components/schemas/Timestamp'
                        - type: 'null'
                last_seen_minutes: { type: integer, minimum: 0 }
            - type: 'null'
        security:
          oneOf:
            - type: object
              required: [state, open_findings, findings]
              properties:
                state: { $ref: '#/components/schemas/SecurityState' }
                open_findings: { type: integer, minimum: 0 }
                findings:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [id, kind, severity, opened_at, summary]
                    properties:
                      id: { $ref: './common.yaml#/components/schemas/Uuid' }
                      kind: { type: string }
                      severity: { type: string }
                      state: { type: string }
                      opened_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
                      summary: { type: string }
            - type: 'null'
        meta:
          type: object
          required: [at, omitted]
          properties:
            at: { $ref: './common.yaml#/components/schemas/Timestamp' }
            omitted:
              type: array
              items:
                type: object
                required: [section, reason]
                properties:
                  section: { type: string, enum: [external, consumption, health, security] }
                  reason: { type: string, enum: [permission, unavailable, not_requested, not_configured] }
    ConsumptionRequest:
      type: object
      additionalProperties: false
      required: [from, to, items]
      properties:
        from: { $ref: './common.yaml#/components/schemas/Timestamp' }
        to: { $ref: './common.yaml#/components/schemas/Timestamp' }
        granularity: { type: string, enum: [day, total], default: total }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            properties:
              address: { $ref: './common.yaml#/components/schemas/IpAddress' }
              external_service_id: { type: integer, minimum: 1 }
    ConsumptionResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            type: object
            required: [address, external_service_id, up_bytes, down_bytes, series]
            properties:
              address: { type: [string, 'null'] }
              external_service_id: { type: [integer, 'null'] }
              up_bytes: { type: integer, minimum: 0 }
              down_bytes: { type: integer, minimum: 0 }
              addresses:
                type: array
                description: Solo por servicio — IPs sumadas (dato personal).
                items: { type: string }
              series:
                type: array
                description: Solo con granularity=day (días UTC).
                items:
                  type: object
                  required: [day, up_bytes, down_bytes]
                  properties:
                    day: { type: string, format: date }
                    up_bytes: { type: integer, minimum: 0 }
                    down_bytes: { type: integer, minimum: 0 }
              error: { type: string, enum: [not_found, invalid] }
        meta:
          type: object
          required: [from, to, granularity]
          properties:
            from: { $ref: './common.yaml#/components/schemas/Timestamp' }
            to: { $ref: './common.yaml#/components/schemas/Timestamp' }
            granularity: { type: string, enum: [day, total] }
    SecurityStatesRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            description: '`address` o `external_service_id` (exactamente uno).'
            properties:
              address: { $ref: './common.yaml#/components/schemas/IpAddress' }
              external_service_id: { type: integer, minimum: 1 }
    SecurityStatesResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            type: object
            required: [address, external_service_id]
            properties:
              address:
                type: [string, 'null']
                description: La pedida o, por servicio, la IP (o prefijo) elegida (dato personal).
              external_service_id:
                type: [integer, 'null']
                description: El pedido o, por IP, el servicio de la identidad vigente (null sin identidad).
              state: { $ref: '#/components/schemas/SecurityState' }
              open_findings: { type: integer, minimum: 0 }
              max_severity:
                type: [string, 'null']
                description: Severidad del hallazgo activo más grave (null sin hallazgos activos).
              since:
                description: Desde cuándo el cliente está en `state`.
                $ref: './common.yaml#/components/schemas/Timestamp'
              error: { type: string, enum: [not_found], description: Sin cliente o sin identidad vigente; sin el resto de campos. }
        meta:
          type: object
          required: [at]
          properties:
            at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    ArgosIntegration:
      type: object
      required: [id, configured, enabled, base_url, has_token, webhook_url, has_webhook_secret, last_sync_at, last_sync_status,
        last_error, identities, stale_identities, version, connection]
      properties:
        id:
          description: Id del conector (parte de webhook_url); null si nunca se configuró.
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        configured: { type: boolean }
        enabled: { type: boolean }
        base_url: { type: [string, 'null'], examples: ['https://argos.isp.example/api/v1'] }
        has_token: { type: boolean }
        webhook_url: { type: [string, 'null'], description: URL a copiar en ArgosISP (con el secreto). }
        has_webhook_secret: { type: boolean }
        last_sync_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        last_sync_status: { type: [string, 'null'], enum: [ok, degraded, failing, null] }
        last_error: { type: [string, 'null'] }
        resolver: { type: [string, 'null'], enum: [batch, fallback, null], description: 'batch = POST /integraciones/horus/resolver; fallback = GET /ip/:ip.' }
        identities: { type: integer, minimum: 0, description: Identidades vigentes. }
        stale_identities: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 0 }
        connection:
          description: Enlace de conexión con el que se preparó el conector (contrato §1.4); null si se configuró a mano.
          oneOf:
            - $ref: '#/components/schemas/ArgosConnection'
            - type: 'null'
    ArgosIntegrationInput:
      type: object
      additionalProperties: false
      required: [base_url, enabled]
      properties:
        base_url: { type: string, format: uri, maxLength: 2048 }
        enabled: { type: boolean }
        token: { type: string, writeOnly: true, minLength: 8, maxLength: 512, description: 'Token atk_… de ArgosISP (solo escritura).' }
    ArgosWebhookSecret:
      type: object
      required: [webhook_url, webhook_secret]
      properties:
        webhook_url: { type: string }
        webhook_secret: { type: string, description: Solo en esta respuesta. }
    ArgosConnectionTest:
      type: object
      required: [ok, tested_at, latency_ms, resolver, error_code, error]
      properties:
        ok: { type: boolean }
        tested_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        latency_ms: { type: [integer, 'null'] }
        resolver: { type: [string, 'null'], enum: [batch, fallback, null] }
        error_code: { type: [string, 'null'], enum: [auth_failed, forbidden, timeout, connect_failed, tls_invalid, unexpected_response, not_allowed, null] }
        error: { type: [string, 'null'] }
    ArgosWebhookEvent:
      type: object
      required: [id, evento, payload]
      properties:
        id: { type: string, maxLength: 128 }
        evento: { type: string, examples: [asignacion.cambiada, sesion.iniciada, sesion.terminada, cliente.actualizado, servicio.estado_cambiado] }
        ocurrido_en: { type: string }
        payload: { type: object, additionalProperties: true }
    ArgosConnection:
      type: object
      description: Cómo se preparó el conector con un enlace de conexión (contrato §1.4); null si se configuró a mano.
      required: [linked_at, method, peer_connector_id, api_token_id, notification_channel_id]
      properties:
        linked_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        method: { type: string, enum: [link_generated, link_redeemed], description: 'link_generated = Argos canjeó un enlace de Horus; link_redeemed = Horus canjeó uno de Argos.' }
        peer_connector_id: { type: [string, 'null'], maxLength: 128, description: '`conector_id` opaco del conector en ArgosISP.' }
        api_token_id:
          description: API token `hf_pat_` emitido para ArgosISP en el canje (revocarlo corta su acceso).
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        notification_channel_id:
          description: Canal de notificación webhook hacia ArgosISP (se crea apagado).
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
    ArgosConnectionLink:
      type: object
      required: [url, expires_at, ttl_seconds]
      properties:
        url: { type: string, description: 'https://<horus>/conectar#<código>. Solo en esta respuesta.' }
        expires_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        ttl_seconds: { type: integer, const: 900 }
    ArgosConnectionRedeemRequest:
      type: object
      description: Cuerpo del contrato §1.4 (claves en español).
      required: [codigo, sistema, base_url, token, webhook]
      properties:
        codigo: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }
        sistema: { type: string, enum: [argosisp], description: Sistema que canjea (B). }
        base_url: { type: string, maxLength: 2048, description: 'Origen https de la API de ArgosISP (Horus añade /api/v1).' }
        token: { type: string, minLength: 8, maxLength: 512, writeOnly: true, description: 'Token atk_… para que Horus lea de Argos.' }
        webhook:
          type: object
          required: [url, secreto]
          properties:
            url: { type: string, maxLength: 2048, description: Receptor de webhooks de ArgosISP (§3.4). }
            secreto: { type: string, minLength: 16, maxLength: 256, writeOnly: true }
    ArgosConnectionRedeemResponse:
      type: object
      required: [token, webhook, conector_id]
      properties:
        token: { type: string, pattern: '^hf_pat_[0-9A-Za-z]{43}$', description: 'API token hf_pat_ (plantilla ArgosISP) para que Argos lea de Horus.' }
        webhook:
          type: object
          required: [url, secreto]
          properties:
            url: { type: string, description: 'Receptor de Horus: /api/v1/integrations/argosisp/webhook/{connector_id}.' }
            secreto: { type: string }
        conector_id: { $ref: './common.yaml#/components/schemas/Uuid' }
    SsoTicketRequest:
      type: object
      required: [usuario, destino]
      properties:
        usuario:
          type: object
          required: [id_externo]
          properties:
            id_externo: { type: string, minLength: 1, maxLength: 128 }
            correo: { type: [string, 'null'], maxLength: 254 }
            nombre: { type: [string, 'null'], maxLength: 120 }
        destino:
          type: object
          required: [tipo, id_externo]
          properties:
            tipo: { type: string, enum: [cliente, servicio, router, hallazgo] }
            id_externo: { type: string, minLength: 1, maxLength: 128 }
    SsoTicketIssued:
      type: object
      required: [url, expira_en]
      properties:
        url: { type: string, description: 'https://<horus>/sso/entrar#<ticket> (un uso, 60 s).' }
        expira_en: { $ref: './common.yaml#/components/schemas/Timestamp' }
