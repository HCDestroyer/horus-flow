      responses:
        '200':
          description: Estado por elemento, en el orden pedido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityStatesResponse' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /integrations/argosisp:
    get:
      tags: [integrations]
      operationId: getArgosIntegration
      summary: Conector ArgosISP del ISP (sin credenciales)
      x-module: devices
      x-scope: tenant
      x-permission: settings.read
