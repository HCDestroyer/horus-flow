  /customers/{customer_id}/external-identity:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [integrations]
      operationId: getCustomerExternalIdentity
      summary: Identidad del cliente en sistemas externos (ArgosISP) con sus periodos de vigencia
      description: |
        La identidad de Horus sigue siendo `(tenant, realm, ip)` (ADR-0018); la externa es una anotación con vigencia
        (`valid_from`/`valid_to`), porque en PPPoE una IP cambia de dueño (ADR-0030). `current` es la vigente;
        `stale = true` si ArgosISP no respondió en la última resolución (se conserva el último dato). Dato personal.
      x-module: devices
      x-scope: tenant
      x-permission: customers.read
      x-increment: I3
