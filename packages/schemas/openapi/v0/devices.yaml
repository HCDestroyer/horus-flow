openapi: 3.1.0
info:
  title: Horus Flow API — módulo devices (contrato v0)
  version: 0.1.0
  description: |
    Inventario por ISP (nodos, routers MikroTik y Huawei VRP, prefijos de clientes) y clientes = IPs descubiertas
    (docs/api.md §2.3, §2.9; docs/database.md §2.2–§2.3; ADR-0018). Reglas:
    - La IP de un cliente **nunca** viaja en la URL: búsqueda por `POST /customers/lookup`.
    - Un router principal por nodo; RouterOS 7.x ≥ 7.12 (D15): una versión inferior se registra con aviso
      `routeros_version_unsupported` y bloquea la generación del script (módulo wireguard).
    - El realm de un prefijo lo decide el servidor: privado/CGNAT → realm `node_private` del nodo (NAT en el
      router principal, D12); público → realm `public` del ISP.
  license:
    name: Propietaria
    identifier: LicenseRef-Horus-Proprietary
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: horus.example.net
tags:
  - name: sites
    description: Nodos (sitios) del ISP.
  - name: routers
    description: Routers (el principal de cada nodo exporta los flujos).
  - name: client-prefixes
    description: Qué IPs son de clientes en cada nodo.
  - name: customers
    description: Clientes = IPs observadas (D1).
  - name: asn-rules
    description: ASN propios del ISP — nombre, categoría y servicio que se aplican al clasificar el tráfico nuevo.
  - name: integrations
    description: Integraciones de ecosistema (ADR-0030) — consulta 360 por IP, consumo por lotes y conector ArgosISP.
paths:
  /sites:
    get:
      tags: [sites]
      operationId: listSites
      summary: Nodos del ISP
      x-module: devices
      x-scope: tenant
      x-permission: sites.read
      x-increment: I0
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/IncludeTotal'
        - $ref: './common.yaml#/components/parameters/Q'
        - name: kind
          in: query
          schema: { type: string }
        - name: parent_id
          in: query
          schema: { $ref: './common.yaml#/components/schemas/Uuid' }
        - name: sort
          in: query
          schema: { type: string, enum: [name, -name, created_at, -created_at] }
      responses:
        '200':
          description: Página de nodos.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Site' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [sites]
      operationId: createSite
      summary: Alta de nodo
      x-module: devices
      x-scope: tenant
      x-permission: sites.create
      x-increment: I0
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInput' }
      responses:
        '201':
          description: Creado.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /sites/{site_id}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      operationId: getSite
      summary: Detalle de nodo
      x-module: devices
      x-scope: tenant
      x-permission: sites.read
      x-increment: I0
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Nodo.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    patch:
      tags: [sites]
      operationId: updateSite
      summary: Edita un nodo
      x-module: devices
      x-scope: tenant
      x-permission: sites.update
      x-increment: I0
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/SiteInput' }
          application/json:
            schema: { $ref: '#/components/schemas/SiteInput' }
      responses:
        '200':
          description: Actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
    delete:
      tags: [sites]
      operationId: deleteSite
      summary: Baja lógica de un nodo (con routers → 409 SITE_NOT_EMPTY)
      x-module: devices
      x-scope: tenant
      x-permission: sites.delete
      x-increment: I0
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
  /routers:
    get:
      tags: [routers]
      operationId: listRouters
      summary: Routers del ISP
      x-module: devices
      x-scope: tenant
      x-permission: devices.read
      x-increment: I0
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/IncludeTotal'
        - $ref: './common.yaml#/components/parameters/Q'
        - $ref: './common.yaml#/components/parameters/SiteIdFilter'
        - name: onboarding_state
          in: query
          schema: { type: string }
        - name: is_primary
          in: query
          schema: { type: boolean }
        - name: device_type
          in: query
          description: |
            Tipo de equipo: `router` (por defecto: el listado de routers no incluye switches), `switch` (switches de
            monitoreo) o `all`.
          schema: { type: string, enum: [router, switch, all], default: router }
        - name: sort
          in: query
          schema: { type: string, enum: [name, -name, created_at, -created_at] }
      responses:
        '200':
          description: Página de routers.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Router' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [routers]
      operationId: createRouter
      summary: Registra un router (queda "Pendiente de configurar"; publica horus.devices.router.created)
      description: 'Segundo router principal en el nodo → `409 ROUTER_PRIMARY_EXISTS`. RouterOS < 7.12 → se acepta con `warnings: [routeros_version_unsupported]`.'
      x-module: devices
      x-scope: tenant
      x-permission: devices.create
      x-increment: I0
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouterInput' }
      responses:
        '201':
          description: Creado.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Router' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /routers/{router_id}:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    get:
      tags: [routers]
      operationId: getRouter
      summary: Detalle del router
      x-module: devices
      x-scope: tenant
      x-permission: devices.read
      x-increment: I0
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Router.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Router' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    patch:
      tags: [routers]
      operationId: updateRouter
      summary: Edita un router
      x-module: devices
      x-scope: tenant
      x-permission: devices.update
      x-increment: I0
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/RouterPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/RouterPatch' }
      responses:
        '200':
          description: Actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Router' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
    delete:
      tags: [routers]
      operationId: deleteRouter
      summary: Baja lógica del router
      x-module: devices
      x-scope: tenant
      x-permission: devices.delete
      x-increment: I0
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
  /routers/{router_id}/credentials/{kind}:
    parameters:
      - $ref: '#/components/parameters/RouterId'
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [snmp, routeros_api] }
    put:
      tags: [routers]
      operationId: putRouterCredential
      summary: Credencial write-only (SNMPv3 o usuario de solo lectura de la API de RouterOS)
      description: Nunca devuelve el secreto. En I1 el script de onboarding genera ambas y las guarda cifradas; este endpoint permite reemplazarlas.
      x-module: devices
      x-scope: tenant
      x-permission: devices.credentials.write
      x-reauth: true
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: SnmpV3Credential
                  required: [username, auth_protocol, auth_password, priv_protocol, priv_password]
                  properties:
                    username: { type: string }
                    auth_protocol: { type: string, enum: [sha1, sha256] }
                    auth_password: { type: string, writeOnly: true, minLength: 8 }
                    priv_protocol: { type: string, enum: [aes128] }
                    priv_password: { type: string, writeOnly: true, minLength: 8 }
                - type: object
                  title: RouterosApiCredential
                  required: [username, password]
                  properties:
                    username: { type: string, examples: [horus-ro] }
                    password: { type: string, writeOnly: true, minLength: 16 }
                    tls_fingerprint_sha256: { type: [string, 'null'], description: Huella fijada en el primer contacto. }
      responses:
        '200':
          description: Estado de la credencial (sin secretos).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialStatus' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /routers/{router_id}/tls-fingerprint:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    get:
      tags: [routers]
      operationId: getRouterTlsFingerprint
      summary: Huella TLS del router (fijada, pendiente de confirmar o cambiada)
      description: |
        Las lecturas REST de solo lectura del router (importación de prefijos, sondas netwatch) exigen una huella confirmada
        por un administrador. Una huella observada en el alta (TOFU) o distinta de la fijada queda pendiente y nunca se
        acepta sola.
      x-module: devices
      x-scope: tenant
      x-permission: devices.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Estado de la huella.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterTlsFingerprint' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /routers/{router_id}/tls-fingerprint/capture:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    post:
      tags: [routers]
      operationId: captureRouterTlsFingerprint
      summary: Lee la huella del certificado del router por el túnel (queda pendiente de confirmar)
      description: |
        Solo el saludo TLS con el servicio `www-ssl` del router: no envía peticiones HTTP ni la contraseña del usuario de
        solo lectura. Si coincide con la fijada no queda nada pendiente; si no, queda pendiente (`changed` si ya había una
        fijada; auditado). Sin túnel o router caído → `502 ROUTER_UNREACHABLE`.
      x-module: devices
      x-scope: tenant
      x-permission: devices.update
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Estado de la huella tras la lectura.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterTlsFingerprint' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '502':
          description: Router inalcanzable por el túnel.
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
  /routers/{router_id}/tls-fingerprint/confirm:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    post:
      tags: [routers]
      operationId: confirmRouterTlsFingerprint
      summary: Un administrador confirma (o vuelve a fijar) la huella pendiente
      description: |
        `fingerprint_sha256` debe ser exactamente la huella pendiente que muestra la consola; si no hay pendiente o no
        coincide → `409 ROUTER_TLS_FINGERPRINT_MISMATCH`. Requiere re-autenticación reciente. Auditado como
        `devices.router.tls_fingerprint_confirmed` (primera) o `devices.router.tls_fingerprint_repinned` (con la anterior).
      x-module: devices
      x-scope: tenant
      x-permission: devices.credentials.write
      x-reauth: true
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint_sha256]
              additionalProperties: false
              properties:
                fingerprint_sha256:
                  type: string
                  description: SHA-256 del certificado en hexadecimal (64 dígitos, con o sin `:`).
                  examples: ['AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99']
      responses:
        '200':
          description: Huella fijada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterTlsFingerprint' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /routers/{router_id}/direct-onboarding:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    post:
      tags: [routers]
      operationId: createDirectOnboarding
      summary: Alta en modo directo (Huawei VRP, sin túnel) — configuración VRP con credencial SNMPv3 nueva
      description: |
        Para routers con `connection_mode=direct` (Huawei VRP no tiene WireGuard; docs/vendors/huawei.md §5). Fija la
        dirección de gestión (`management_address`: la IP de origen del router tal y como la ve Horus por el camino que
        asegura el operador — VRF de gestión, VPN de sitio o relé), emite una credencial SNMPv3 authPriv nueva de solo
        lectura (SHA-256 + AES-128; la anterior deja de valer; cifrada en reposo y **solo en esta respuesta** en claro) y
        devuelve la configuración VRP que **pega el operador** (ACL de SNMP, vista mínima, NetStream v9 hacia el colector).
        Horus nunca escribe en el router. El colector solo acepta flujos de esa IP después de que el sondeador verifique
        la credencial en ella (`onboarding_state=snmp_verified`). Un MikroTik → `422 ROUTER_VENDOR_NOT_SUPPORTED`.
        Sintaxis VRP **pendiente de validación en equipo real** (`notes`).
      x-module: devices
      x-scope: tenant
      x-permission: devices.credentials.write
      x-reauth: true
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                management_address:
                  type: [string, 'null']
                  description: IP unicast del router vista por Horus (sin loopback, link-local ni multicast). Obligatoria si el router aún no la tiene.
                  examples: ['198.51.100.20']
                sampling_rate: { type: [integer, 'null'], minimum: 1, maximum: 65535, description: 'Muestreo de NetStream (1 de cada N paquetes; 1000 por defecto).' }
      responses:
        '201':
          description: Configuración generada (`Cache-Control no-store`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectOnboarding' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /routers/{router_id}/switch-onboarding:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    post:
      tags: [routers]
      operationId: createSwitchOnboarding
      summary: Alta de un switch (modo directo) — credencial SNMP nueva y configuración para pegar
      description: |
        Solo `device_type=switch` (un router → `422 DEVICE_NOT_A_SWITCH`). Fija la dirección de gestión del switch (misma
        regla que el modo directo de Huawei: única en la plataforma una vez verificada, nunca una IP de Horus), emite una
        credencial SNMP de solo lectura nueva — SNMPv3 SHA1/AES en RouterOS (lo que admite `/snmp community`), SNMPv3
        SHA-256/AES-128 en la serie S de Huawei o una **comunidad v2c** en SwOS (solo v1/v2c: aviso de menor seguridad) —,
        cifrada en reposo y **solo en esta respuesta** en claro, y devuelve lo que pega el operador: RouterOS
        (`/snmp community` con `addresses` del sondeador), VRP serie S (ACL + `mib-view` + `usm-user v3`) o los pasos de la
        web de SwOS. Con `sflow=true` (solo `vrp`) activa la fuente secundaria y añade la configuración sFlow (agente =
        dirección de gestión, muestreo solo de entrada). Horus nunca escribe en el switch; queda `snmp_verified` cuando el
        sondeador responde con esa credencial en esa dirección.
      x-module: devices
      x-scope: tenant
      x-permission: devices.credentials.write
      x-reauth: true
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                management_address:
                  type: [string, 'null']
                  description: IP de gestión del switch (obligatoria si aún no la tiene).
                  examples: ['10.20.0.5']
                sflow:
                  type: [boolean, 'null']
                  description: true activa sFlow (solo vrp) y añade su configuración; false lo desactiva; null no cambia.
                sampling_rate: { type: [integer, 'null'], minimum: 256, maximum: 65535, description: 'Muestreo sFlow (1 de cada N; 4096 por defecto).' }
      responses:
        '201':
          description: Configuración generada (`Cache-Control no-store`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitchOnboarding' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /routers/{router_id}/transport:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    put:
      tags: [routers]
      operationId: setRouterTransport
      summary: Transporte con el que el router se conecta a Horus (WireGuard, IPsec IKEv2, GRE o directo) y su nivel de protección
      description: |
        Decisión del PO del 2026-10-17 (docs/tunnels.md, ADR-0031): cada router usa el mejor transporte estándar que admite.
        MikroTik: `wireguard` | `ipsec` | `gre`. Huawei VRP: `ipsec` | `gre` | `direct`. Otro → `422 CONNECTION_MODE_NOT_SUPPORTED`.

        - `ipsec` (IKEv2 route-based, cifra): `tunnel_remote_id` (IPv4, nombre DNS, usuario@dominio o `keyid:<id>`) y/o
          `tunnel_remote_address` (IPv4 pública; si no hay identidad, la identidad es esa IP). Sin ninguna → 422.
        - `gre` (RFC 2784, **no cifra**): `tunnel_remote_address` obligatoria (el hub solo acepta GRE de esa IP) y `path`.
        - `direct` (sin túnel, no cifra): `path`.
        - `path`: `private` (MPLS L3VPN, VRF de gestión, fibra propia → `unencrypted_private`) o `internet`
          (→ `unencrypted_internet`, exige `confirm_unencrypted_internet: true`; si no, `422
          UNENCRYPTED_TRANSPORT_CONFIRMATION_REQUIRED`). Queda auditado (`devices.router.transport_changed` con el nivel y
          la confirmación) y la consola muestra un aviso permanente.

        Cambiar el transporte, la IP pública o la identidad devuelve el router a `pending_configuration` (hay que pegar la
        configuración nueva: script WireGuard, `POST /routers/{router_id}/tunnel-config` o alta directa); la IP de túnel
        (identidad del exportador) se conserva entre transportes con túnel. IP pública (GRE) o identidad IKE (IPsec) en uso
        por otro router → `409 TUNNEL_REMOTE_IN_USE`. Idempotente: el mismo cuerpo no cambia nada.
