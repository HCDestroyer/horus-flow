      x-scope: tenant
      x-permission: devices.credentials.write
      x-reauth: true
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouterTransportInput' }
      responses:
        '200':
          description: Router con el transporte aplicado.
