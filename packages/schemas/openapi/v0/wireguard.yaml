openapi: 3.1.0
info:
  title: Horus Flow API — módulo wireguard (contrato v0)
  version: 0.1.0
  description: |
    Túnel WireGuard router → hub de Horus (D16): por él viajan gestión (REST/API-SSL, SNMPv3) y exportación
    IPFIX. El router es iniciador; su clave privada se genera en el router y **nunca** sale de él; Horus
    recibe solo la pública por `POST /enroll/wireguard` con un token de un uso (docs/api.md §2.4,
    ADR-0022, docs/vendors/mikrotik.md §5, §7). **Horus no escribe en el router** (ADR-0022, D11).
  license:
    name: Propietaria
    identifier: LicenseRef-Horus-Proprietary
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: horus.example.net
tags:
  - name: onboarding
    description: Script de alta, enrolamiento y script inverso.
  - name: wireguard
    description: Estado de los peers (túneles) del ISP.
paths:
  /routers/{router_id}/provisioning-script:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    post:
      tags: [onboarding]
      operationId: createProvisioningScript
      summary: Genera el script RouterOS .rsc de alta con un token de enrolamiento de un uso embebido
      description: |
        Plantilla versionada por RouterOS (7.12 y última long-term). Contiene: interfaz WireGuard sin clave
        privada, peer al hub (`HORUS_WG_ENDPOINT:HORUS_WG_PORT`), firewall solo desde el túnel, usuario de
        solo lectura `horus-ro`, SNMPv3 authPriv, Traffic Flow IPFIX sin muestreo hacia el colector por el
        túnel, y `/tool fetch` a `<HORUS_PUBLIC_BASE_URL>/api/v1/enroll/wireguard` con cuerpo JSON
        `{"token", "public_key"}`. Contraseñas y token se muestran **una sola vez**: pedirlo de nuevo crea
        otros e invalida los anteriores (auditado). RouterOS < 7.12 → `422 ROUTEROS_VERSION_UNSUPPORTED` (D15).
        `/tool fetch` siempre con `check-certificate=yes`: con TLS `self_signed` o `provided` (D19, p. ej. modo
        `ip_only`) el script incluye el certificado público de la instalación y lo importa como confiable antes del
        fetch; nunca desactiva la verificación.
      x-module: wireguard
      x-scope: tenant
      x-permission: wireguard.write
      x-reauth: true
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                routeros_version: { type: [string, 'null'], pattern: '^7\.[0-9]+(\.[0-9]+)?$' }
                ntp_server: { type: [string, 'null'], examples: [pool.ntp.org] }
                enrollment:
                  type: [string, 'null']
                  enum: [fetch, manual, null]
                  default: fetch
                  description: |
                    `fetch`: el router envía su clave pública a `/enroll/wireguard` con el token (necesita llegar al
                    HTTPS de Horus). `manual`: el script no se conecta a Horus ni lleva el token; muestra la clave
                    pública (`HORUS_ROUTER_PUBKEY=`) para pegarla con `POST /wireguard/enrollment-tokens/{token_id}/enroll`.
                    Para instalaciones sin el 443 publicado: en el borde solo queda el UDP de WireGuard.
      responses:
        '201':
          description: Script (`text/plain`, `Cache-Control no-store`). Cabeceras con el token creado.
          headers:
            X-Horus-Enrollment-Token-Id:
              description: ID del token de enrolamiento (para revocarlo).
              schema: { type: string, format: uuid }
            X-Horus-Enrollment-Token-Expires-At:
              schema: { type: string, format: date-time }
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
  /routers/{router_id}/deprovisioning-script:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    post:
      tags: [onboarding]
      operationId: createDeprovisioningScript
      summary: Script inverso (elimina lo que lleva comment="horus" y solo el target de Traffic Flow de Horus)
      x-module: wireguard
      x-scope: tenant
      x-permission: wireguard.write
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Script (`text/plain`, `no-store`).
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /routers/{router_id}/tunnel-config:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    post:
      tags: [onboarding]
      operationId: createTunnelConfig
      summary: Configuración IPsec IKEv2 o GRE para pegar en el router (PSK y credenciales nuevas, una sola vez)
      description: |
        Para routers con `connection_mode` `ipsec` o `gre` (docs/tunnels.md, ADR-0031). Asegura el túnel del router (IP /32
        de la IPAM de plataforma = identidad del exportador; se conserva al cambiar de transporte), emite credenciales SNMPv3
        nuevas (y el usuario de la API en MikroTik) y, en IPsec, una **PSK nueva** de 48 caracteres; todo invalida lo
        anterior, se guarda cifrado y aparece **solo en esta respuesta** (`Cache-Control: no-store`). Devuelve la
        configuración del fabricante (RouterOS 7 o Huawei VRP) y un ejemplo genérico Linux/strongSwan; Horus nunca escribe
        en el router. Hub sin el transporte habilitado o sin IP pública → `409 TUNNEL_TRANSPORT_DISABLED`; router con
        WireGuard o directo → `422 CONNECTION_MODE_MISMATCH`. Auditado (`wireguard.tunnel_config.created`).
      x-module: wireguard
      x-scope: tenant
      x-permission: wireguard.write
      x-reauth: true
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ntp_server: { type: [string, 'null'], examples: [pool.ntp.org] }
                sampling_rate: { type: [integer, 'null'], minimum: 1, maximum: 65535, description: 'Muestreo de NetStream (Huawei; 1000 por defecto).' }
      responses:
        '201':
          description: Configuración generada (`Cache-Control no-store`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TunnelConfig' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /wireguard/enrollment-tokens/{token_id}/revoke:
    parameters:
      - name: token_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    post:
      tags: [onboarding]
      operationId: revokeEnrollmentToken
      summary: Revoca un token de enrolamiento no usado
      x-module: wireguard
      x-scope: tenant
      x-permission: wireguard.write
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /wireguard/enrollment-tokens/{token_id}/enroll:
    parameters:
      - name: token_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    post:
      tags: [onboarding]
      operationId: enrollWireguardManual
      summary: Alta manual — registra la clave pública que la persona copió del router
      description: |
        Para el script generado con `enrollment: manual` (el router no llega al HTTPS de Horus). Mismas reglas que
        `/enroll/wireguard`: token pendiente del ISP (el de la cabecera `X-Horus-Enrollment-Token-Id`), de un uso, TTL
        24 h, 5 fallos lo invalidan; usado, caducado, revocado o desconocido → `ENROLLMENT_TOKEN_INVALID`. Clave ya
        registrada → `409 WIREGUARD_PUBLIC_KEY_IN_USE`. Auditado con la persona como actor.
      x-module: wireguard
      x-scope: tenant
      x-permission: wireguard.write
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key]
              properties:
                public_key:
                  type: string
                  minLength: 44
                  maxLength: 64
                  description: Clave pública WireGuard del router (44 caracteres base64; se ignoran espacios alrededor).
      responses:
        '202':
          description: Clave registrada; el agente añade el peer en segundos.
          content:
            application/json:
              schema:
                type: object
                required: [peer_status]
                properties:
                  peer_status: { type: string, enum: [pending_handshake] }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /enroll/wireguard:
    post:
      tags: [onboarding]
      operationId: enrollWireguard
      summary: El router registra su clave pública con el token de un uso (público, sin sesión)
      description: |
        Token de 256 bits (solo su hash en BD) ligado a (tenant, router, peer previsto), TTL 24 h, un uso,
        revocable; 5 fallos lo invalidan; 10/min por IP. Usado, caducado, revocado o de otro router →
        `ENROLLMENT_TOKEN_INVALID` sin distinguir el caso. Clave pública ya registrada → `409
        WIREGUARD_PUBLIC_KEY_IN_USE`. No devuelve secretos. Auditado y notificado al admin del ISP.
        RouterOS envía el cuerpo con `/tool fetch http-method=post http-header-field="Content-Type: application/json"`.
      x-module: wireguard
      x-scope: public
      x-permission: enrollment_token
      x-rate-limit: enroll
      x-increment: I1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, public_key]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 43, maxLength: 64, writeOnly: true }
                public_key:
                  type: string
                  pattern: '^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$'
                  description: Clave pública WireGuard (44 caracteres base64).
      responses:
        '202':
          description: Clave aceptada; el hub añade el peer en < 10 s.
          content:
            application/json:
              schema:
                type: object
                required: [peer_status]
                properties:
                  peer_status: { type: string, const: pending_handshake }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /wireguard/peers:
    get:
      tags: [wireguard]
      operationId: listWireguardPeers
      summary: Túneles (peers) de los routers del ISP
      x-module: wireguard
      x-scope: tenant
      x-permission: wireguard.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: router_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: handshake_state
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [last_handshake_at, -last_handshake_at] }
      responses:
        '200':
          description: Página de peers.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Peer' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /wireguard/peers/{peer_id}:
    parameters:
      - name: peer_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    get:
      tags: [wireguard]
      operationId: getWireguardPeer
      summary: Detalle del túnel ("Túnel activo · último handshake hace N s")
      x-module: wireguard
      x-scope: tenant
      x-permission: wireguard.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Peer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Peer' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
components:
  securitySchemes:
    tenantBearer: { $ref: './common.yaml#/components/securitySchemes/tenantBearer' }
  parameters:
    RouterId:
      name: router_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
  schemas:
    TunnelStatus:
      type: object
      required: [state, last_rekey_at, last_packet_at, error, remote_address, remote_id, gre_key]
      properties:
        state:
          type: [string, 'null']
          enum: [established, connecting, down, up, null]
          description: 'ipsec: estado de la IKE SA; gre: interfaz del hub (up/down). null = aún sin reporte.'
        last_rekey_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        last_packet_at:
          description: 'gre: último paquete recibido del router.'
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        error: { type: [string, 'null'], description: Último error del agente al aplicar el túnel (sin secretos). }
        remote_address: { type: [string, 'null'], description: IPv4 pública del router. }
        remote_id: { type: [string, 'null'], description: Identidad IKE del router. }
        gre_key: { type: [integer, 'null'], description: 'gre: clave GRE (null = sin clave, RouterOS).' }
    TunnelConfig:
      type: object
      required: [router_id, transport, protection_level, tunnel_address, hub_address, hub_id, remote_address, remote_id, psk, gre_key, snmp_user, configs, warnings]
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        transport: { type: string, enum: [ipsec, gre] }
        protection_level: { type: string, enum: [encrypted, unencrypted_private, unencrypted_internet] }
        tunnel_address: { type: string, examples: [10.255.0.17/32] }
        hub_address: { type: [string, 'null'], description: IPv4 pública del hub (destino de IKE/GRE). }
        hub_id: { type: [string, 'null'], description: 'ipsec: identidad IKE del hub.' }
        remote_address: { type: [string, 'null'] }
        remote_id: { type: [string, 'null'] }
        psk:
          type: [string, 'null']
          description: 'ipsec: clave precompartida nueva (48 caracteres). Solo en esta respuesta; generar otra la sustituye.'
        gre_key: { type: [integer, 'null'] }
        snmp_user: { type: string }
        configs:
          type: array
          items: { $ref: '#/components/schemas/TunnelRouterConfig' }
        warnings: { type: array, items: { type: string } }
    TunnelRouterConfig:
      type: object
      required: [platform, language, title, config, notes, placeholders, warnings]
      properties:
        platform: { type: string, enum: [routeros, vrp, strongswan] }
        language: { type: string, enum: [routeros, vrp, shell] }
        title: { type: string }
        config: { type: string, description: Comandos para pegar (contiene la PSK y las contraseñas). }
        notes: { type: array, items: { type: string } }
        placeholders:
          type: array
          items:
            type: object
            required: [key, description]
            properties:
              key: { type: string }
              description: { type: string }
        warnings: { type: array, items: { type: string } }
    Peer:
      allOf:
        - $ref: './common.yaml#/components/schemas/TenantScopedResource'
        - type: object
          required: [server_id, router_id, status, handshake_state, address, public_key, last_handshake_at, enrollment, transport, tunnel]
          properties:
            server_id: { $ref: './common.yaml#/components/schemas/Uuid' }
            router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
            status: { type: string, enum: [awaiting_enrollment, pending_handshake, active, revoked] }
            handshake_state: { type: string, enum: [never, ok, stale] }
            address: { type: string, description: '/32 de túnel (identidad del exportador)', examples: [10.255.3.17/32] }
            public_key: { type: [string, 'null'] }
            last_handshake_at:
              oneOf:
                - $ref: './common.yaml#/components/schemas/Timestamp'
                - type: 'null'
            endpoint: { type: [string, 'null'], description: IP:puerto público visto del router. }
            rx_bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
            tx_bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
            persistent_keepalive_seconds: { type: integer, examples: [25] }
            transport:
              type: string
              enum: [wireguard, ipsec, gre]
              description: Transporte del túnel (docs/tunnels.md). La /32 sale de la misma IPAM en los tres.
            tunnel:
              description: Estado IPsec/GRE observado por tunnel-agent (null en WireGuard).
              oneOf:
                - $ref: '#/components/schemas/TunnelStatus'
                - type: 'null'
            enrollment:
              type: object
              required: [token_state]
              properties:
                token_id:
                  oneOf:
                    - $ref: './common.yaml#/components/schemas/Uuid'
                    - type: 'null'
                token_state: { type: string, enum: [none, pending, used, expired, revoked] }
                token_expires_at:
                  oneOf:
                    - $ref: './common.yaml#/components/schemas/Timestamp'
                    - type: 'null'
                enrolled_at:
                  oneOf:
                    - $ref: './common.yaml#/components/schemas/Timestamp'
                    - type: 'null'
