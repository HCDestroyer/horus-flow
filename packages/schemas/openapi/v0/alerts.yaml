openapi: 3.1.0
info:
  title: Horus Flow API — módulo alerts, canal mínimo de notificación (contrato v0)
  version: 0.1.0
  description: |
    **D13** adelanta al I1 un canal mínimo de alertas: canales por ISP de tipo `email` (SMTP de la
    instalación) y `telegram` (bot), suscritos a tipos de evento con severidad mínima y filtro por nodo.
    Sin motor de reglas, silencios ni escalado (llegan con alerts completo).
    **D17** `librenms` es una integración por ISP **por la API de LibreNMS** (sin SNMP trap): URL base,
    usuario y, como secretos write-only cifrados (`PUT …/credentials`), contraseña y token de API opcional. Nada
    se comparte entre ISPs aunque dos usen la misma instancia de LibreNMS: cada canal guarda sus propias
    credenciales y Horus nunca reutiliza una sesión de otro tenant. Prueba de conexión
    (`POST …/connection-test`) y registro de entregas como los demás canales. **Horus aprovisiona LibreNMS y le
    delega el alertado** (`…/librenms/sync`): dispositivo «Horus Flow», grupos, plantillas y reglas «Horus · »;
    cada notificación es una línea `HORUS <SEVERIDAD> <tipo> <asunto> | <texto> | <enlace> | id=<entrega>` por
    `POST /api/v0/syslogsink` (host = dispositivo «Horus Flow») que la regla «Evento de seguridad Horus» convierte
    en alerta por los transportes por defecto de LibreNMS. Sin aprovisionar, la entrega falla con
    `librenms_not_provisioned`.
    Los mensajes no incluyen la IP del cliente salvo `include_personal_data=true` (auditado): salen de la
    instalación hacia terceros (proveedor SMTP, Telegram). Los enlaces del mensaje son URLs absolutas sobre
    HORUS_PUBLIC_BASE_URL (D14). Cada envío emite `horus.alerts.notification.sent|failed`.
  license:
    name: Propietaria
    identifier: LicenseRef-Horus-Proprietary
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: horus.example.net
tags:
  - name: notifications
    description: Canales de notificación del ISP y entregas.
  - name: librenms
    description: Integración con LibreNMS (aprovisionamiento, alertado delegado e IP de gestión de los routers).
paths:
  /notification-channels:
    get:
      tags: [notifications]
      operationId: listNotificationChannels
      summary: Canales de notificación del ISP
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Canales (sin secretos).
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/NotificationChannel' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [notifications]
      operationId: createNotificationChannel
      summary: Crea un canal (email, telegram o librenms)
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelInput' }
      responses:
        '201':
          description: Creado (estado `unverified` hasta la primera prueba correcta).
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-channels/{channel_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [notifications]
      operationId: getNotificationChannel
      summary: Detalle del canal
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Canal.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    patch:
      tags: [notifications]
      operationId: updateNotificationChannel
      summary: Edita nombre, destino, suscripciones o lo habilita/deshabilita
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/NotificationChannelPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelPatch' }
      responses:
        '200':
          description: Actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
    delete:
      tags: [notifications]
      operationId: deleteNotificationChannel
      summary: Borra el canal (y sus secretos, crypto-shredding)
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
  /notification-channels/{channel_id}/credentials:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    put:
      tags: [notifications]
      operationId: putNotificationChannelCredentials
      summary: Secretos write-only del canal (token de bot de Telegram propio, contraseña y token de API de LibreNMS)
      description: |
        Write-only: nunca se devuelven (solo `has_credentials`); se cifran con la KEK de `alerts` y se borran con el
        canal (crypto-shredding). Auditado. Solo se aceptan los campos del `kind` del canal (otro → `422 VALIDATION_FAILED`).
        - `telegram`: opcional (sin token propio se usa el bot de la instalación, HORUS_TELEGRAM_BOT_TOKEN_FILE).
        - `librenms` (D17): `password` obligatoria salvo que se envíe `api_token`; `api_token` opcional
          (cabecera `X-Auth-Token` de la API de LibreNMS). Reemplaza el conjunto completo: lo no enviado se borra.
        - `email`: usa el SMTP de la instalación (HORUS_SMTP_*); no tiene secretos por canal (`422`).
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-reauth: true
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelCredentials' }
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-channels/{channel_id}/connection-test:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [notifications]
      operationId: testNotificationChannelConnection
      summary: Prueba de conexión sin enviar notificación (síncrona, timeout 10 s)
      description: |
        Comprueba alcance, TLS y autenticación del destino con las credenciales guardadas, sin publicar nada.
        `librenms` (D17): resuelve `base_url`, valida el certificado (salvo `tls_verify=false`) y hace una llamada
        de solo lectura autenticada a la API. `telegram`: `getMe` del bot. `email`: conexión y `EHLO`/`STARTTLS`
        al SMTP de la instalación. Un resultado correcto pasa el canal de `unverified` a `ok`. El error nunca incluye
        secretos ni el cuerpo de la respuesta remota.
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-rate-limit: connection_test
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Resultado de la prueba (también cuando falla el destino; ver `ok`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTestResult' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-channels/{channel_id}/test:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [notifications]
      operationId: testNotificationChannel
      summary: Envía una notificación de prueba (asíncrona; el resultado llega por WebSocket `me` y en el canal)
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyRequired'
      responses:
        '202':
          description: Prueba encolada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationDelivery' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
  /notification-channels/{channel_id}/librenms:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [librenms]
      operationId: getLibreNmsIntegration
      summary: Estado de la integración con LibreNMS del canal (objetos aprovisionados y última prueba)
      description: |
        Lo que Horus creó (o adoptó) en LibreNMS con sus ids, el resultado de la última sincronización y de la última
        prueba de extremo a extremo. Solo canales `librenms` (otro → `422 LIBRENMS_CHANNEL_REQUIRED`). Sin secretos.
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Estado (status `not_provisioned` si aún no se sincronizó).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibreNmsIntegration' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-channels/{channel_id}/librenms/sync:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [librenms]
      operationId: syncLibreNmsIntegration
      summary: Conecta o sincroniza Horus con LibreNMS (idempotente)
      description: |
        Crea o actualiza en LibreNMS, con el prefijo «Horus · » y guardando sus ids en Horus: el dispositivo «Horus Flow»
        (solo ICMP; host público de Horus) al que van las líneas de syslog de Horus, los grupos estáticos «Routers» e
        «Infraestructura», las plantillas en español y las reglas (router caído, CPU, memoria, interfaz caída, reinicio,
        servicio de infraestructura caído y evento de seguridad Horus por syslog), y los routers con IP de gestión
        configurada (`/librenms/routers`). Recrea lo que se borró a mano en LibreNMS; nunca modifica ni borra objetos
        que Horus no creó; un router que deja de estar configurado sale del grupo pero no se borra de LibreNMS.
        Los transportes no se pueden crear por la API: las reglas usan los transportes marcados por defecto en
        LibreNMS. Mide el desfase horario de LibreNMS (registro de eventos) para fechar el syslog. Síncrona; el
        fallo de un objeto concreto no detiene el resto (ver `steps`).
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-rate-limit: connection_test
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibreNmsSyncInput' }
      responses:
        '200':
          description: Resultado (también cuando falla LibreNMS; ver `ok`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibreNmsSyncResult' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-channels/{channel_id}/librenms/test:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [librenms]
      operationId: testLibreNmsIntegration
      summary: Prueba de extremo a extremo (syslog de prueba y comprobación de que LibreNMS lo guardó)
      description: |
        Comprueba en orden: autenticación (`auth`), que el dispositivo «Horus Flow» existe (`device`), que la regla de
        eventos de Horus existe (`rule`), el envío de una línea `HORUS INFO test …` por `POST /api/v0/syslogsink`
        (`syslog_send`) y su llegada al syslog del dispositivo en unos segundos (`syslog_stored`). `failed_step` y
        `error_code` indican el paso exacto que falla (p. ej. `syslog_not_stored` si el syslog de LibreNMS está
        desactivado). La línea coincide con la regla de eventos: LibreNMS emitirá la alerta por sus transportes por
        defecto y la resolverá a los 5 minutos. Sin aprovisionar → `409 LIBRENMS_NOT_PROVISIONED`.
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-rate-limit: connection_test
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Resultado de la prueba (también cuando falla; ver `ok`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibreNmsTestResult' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-channels/{channel_id}/librenms/devices/{router_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/RouterId'
    delete:
      tags: [librenms]
      operationId: deleteLibreNmsRouterDevice
      summary: Borra de LibreNMS el dispositivo que Horus creó para un router (acción explícita)
      description: |
        Solo dispositivos creados por Horus (un dispositivo que ya existía y Horus adoptó → `409
        LIBRENMS_DEVICE_NOT_OWNED`). Borra también su historial en LibreNMS. Auditado.
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /librenms/routers:
    get:
      tags: [librenms]
      operationId: listLibreNmsRouters
      summary: Routers del ISP con su IP de gestión y modo de monitoreo para LibreNMS
      description: |
        La IP del túnel WireGuard hacia Horus no es alcanzable desde LibreNMS: cada router necesita una IP de gestión
        para LibreNMS y un modo (`ping` por defecto, SNMP v2c/v3 propio para LibreNMS, o las credenciales SNMPv3 de
        Horus con consentimiento explícito). Se guarda en `alerts` sin tocar el inventario de `devices`.
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Routers (sin secretos).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LibreNmsRouter' } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /librenms/routers/{router_id}:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    put:
      tags: [librenms]
      operationId: setLibreNmsRouter
      summary: Fija la IP de gestión y el modo de monitoreo del router en LibreNMS
      description: |
        Se aplica en la siguiente sincronización. `horus_snmp_v3` exige `reuse_horus_snmp_consent=true` (auditado):
        LibreNMS recibe entonces las credenciales SNMPv3 de solo lectura de Horus para ese router. Cambiar de modo
        borra las credenciales SNMP propias guardadas.
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibreNmsRouterInput' }
      responses:
        '200':
          description: Configuración guardada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibreNmsRouter' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
    delete:
      tags: [librenms]
      operationId: clearLibreNmsRouter
      summary: Quita la configuración de LibreNMS del router (sale del grupo en la siguiente sincronización)
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /librenms/routers/{router_id}/snmp-credentials:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    put:
      tags: [librenms]
      operationId: putLibreNmsRouterSnmpCredentials
      summary: Credenciales SNMP propias para LibreNMS (write-only)
      description: |
        Solo en los modos `snmp_v2c` (`community`) y `snmp_v3` (`v3_*`). Write-only: nunca se devuelven (solo
        `has_snmp_credentials`), se cifran con la KEK de `alerts` y se borran con la configuración. Auditado.
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-reauth: true
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibreNmsSnmpCredentials' }
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-deliveries:
    get:
      tags: [notifications]
      operationId: listNotificationDeliveries
      summary: Entregas recientes (enviadas o fallidas) por canal
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: channel_id
          in: query
          schema: { $ref: './common.yaml#/components/schemas/Uuid' }
        - name: status
          in: query
          schema: { type: string, enum: [sent, failed, throttled] }
        - name: channel_kind
          in: query
          schema: { $ref: '#/components/schemas/NotificationChannelKind' }
      responses:
        '200':
          description: Entregas.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/NotificationDelivery' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
components:
  securitySchemes:
    tenantBearer: { $ref: './common.yaml#/components/securitySchemes/tenantBearer' }
  parameters:
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    RouterId:
      name: router_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
  schemas:
    NotificationChannelKind:
      type: string
      description: |
        `email`, `telegram` y `librenms` (D17, por API) disponibles. Enum abierto (después: webhook, whatsapp,
        sms); un `kind` conocido por el contrato pero aún no implementado → `422 NOTIFICATION_CHANNEL_KIND_NOT_AVAILABLE`.
      enum: [email, telegram, librenms]
    NotificationEventType:
      type: string
      description: Tipos de evento a los que se suscribe un canal en el I1 (enum abierto).
      enum:
        - finding_opened
        - finding_reopened
        - exporter_silent
        - exporter_recovered
        - tunnel_down
        - tunnel_recovered
    EmailChannelConfig:
      type: object
      title: EmailChannelConfig
      required: [recipients]
      additionalProperties: false
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: email }
        subject_prefix: { type: string, maxLength: 40, default: '[Horus]' }
        language: { type: string, enum: [es, en], default: es }
    TelegramChannelConfig:
      type: object
      title: TelegramChannelConfig
      required: [chat_id]
      additionalProperties: false
      properties:
        chat_id: { type: string, pattern: '^-?[0-9]{1,20}$|^@[A-Za-z0-9_]{5,32}$' }
        uses_own_bot: { type: boolean, default: false, readOnly: true }
        language: { type: string, enum: [es, en], default: es }
    LibreNmsChannelConfig:
      type: object
      title: LibreNmsChannelConfig
      description: |
        D17: LibreNMS como destino por **su API** (instancia dedicada a Horus), configurado a mano por cada ISP.
        Solo la parte no secreta: contraseña y token van por `PUT /notification-channels/{id}/credentials`
        (write-only). LibreNMS como fuente de inventario queda fuera del I1.
      required: [base_url, username]
      additionalProperties: false
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
          description: URL base de la instancia (p. ej. `https://librenms.isp.example`); Horus añade `/api/v0`. Sin credenciales en la URL.
          examples: ['https://librenms.isp.example']
        username: { type: string, minLength: 1, maxLength: 128, description: Usuario de LibreNMS dedicado a Horus. }
        tls_verify: { type: boolean, default: true, description: false solo para certificados autofirmados (auditado). }
        timeout_seconds: { type: integer, minimum: 2, maximum: 30, default: 10 }
    NotificationChannelCredentials:
      type: object
      description: Secretos write-only por `kind` (nunca devueltos). Ver `PUT /notification-channels/{id}/credentials`.
      additionalProperties: false
      minProperties: 1
      properties:
        telegram_bot_token: { type: string, writeOnly: true, pattern: '^[0-9]+:[A-Za-z0-9_-]{30,}$' }
        password: { type: string, writeOnly: true, minLength: 1, maxLength: 256, description: 'librenms: contraseña del usuario.' }
        api_token: { type: string, writeOnly: true, minLength: 16, maxLength: 256, description: 'librenms: token de API (opcional).' }
    ConnectionTestResult:
      type: object
      required: [ok, channel_id, channel_kind, checked_at]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        channel_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        channel_kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        checked_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        latency_ms: { type: [integer, 'null'] }
        remote_version: { type: [string, 'null'], description: 'librenms: versión que informa la API, si la expone.' }
        error_code:
          description: Sin valor si `ok`. Enum abierto.
          anyOf:
            - type: string
              enum: [dns_failed, connect_failed, tls_invalid, auth_failed, forbidden, timeout, unexpected_response, missing_credentials]
            - type: 'null'
        error: { type: [string, 'null'], description: Sin secretos ni cuerpo de la respuesta remota. }
    ChannelSubscription:
      type: object
      required: [event_types]
      additionalProperties: false
      properties:
        event_types:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/NotificationEventType' }
        min_severity: { $ref: './common.yaml#/components/schemas/Severity' }
        site_ids:
          type: array
          description: Vacío = todos los nodos.
          items: { $ref: './common.yaml#/components/schemas/Uuid' }
        throttle_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          default: 15
          description: Ventana de agrupación por (canal, tipo, recurso) para no inundar.
    NotificationChannelInput:
      type: object
      required: [name, kind, config, subscription]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        enabled: { type: boolean, default: true }
        config:
          oneOf:
            - $ref: '#/components/schemas/EmailChannelConfig'
            - $ref: '#/components/schemas/TelegramChannelConfig'
            - $ref: '#/components/schemas/LibreNmsChannelConfig'
        subscription: { $ref: '#/components/schemas/ChannelSubscription' }
        include_personal_data:
          type: boolean
          default: false
          description: true ⇒ los mensajes incluyen la IP del cliente (auditado). Por defecto alias o IP enmascarada.
    NotificationChannelPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        config:
          oneOf:
            - $ref: '#/components/schemas/EmailChannelConfig'
            - $ref: '#/components/schemas/TelegramChannelConfig'
            - $ref: '#/components/schemas/LibreNmsChannelConfig'
        subscription: { $ref: '#/components/schemas/ChannelSubscription' }
        include_personal_data: { type: boolean }
    NotificationChannel:
      allOf:
        - $ref: './common.yaml#/components/schemas/TenantScopedResource'
        - $ref: '#/components/schemas/NotificationChannelInput'
        - type: object
          required: [status, has_credentials, last_delivery_at, last_error]
          properties:
            status: { type: string, enum: [unverified, ok, failing, disabled] }
            has_credentials: { type: boolean }
            last_delivery_at:
              oneOf:
                - $ref: './common.yaml#/components/schemas/Timestamp'
                - type: 'null'
            last_error: { type: [string, 'null'], description: Sin datos sensibles. }
    NotificationDelivery:
      type: object
      required: [id, tenant_id, channel_id, channel_kind, status, source_event_type, source_event_id, created_at]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        tenant_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        channel_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        channel_kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        status: { type: string, enum: [queued, sent, failed, throttled] }
        event_type: { $ref: '#/components/schemas/NotificationEventType' }
        source_event_type: { type: [string, 'null'], examples: [horus.detection.finding.opened] }
        source_event_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        is_test: { type: boolean }
        error: { type: [string, 'null'] }
        created_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        sent_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
    LibreNmsObject:
      type: object
      description: Objeto de LibreNMS que Horus conoce (creado por Horus o adoptado porque ya existía).
      required: [kind, key, name, remote_id, hostname, created_by_horus, active]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [device, router_device, infra_device, group, template, rule] }
        key:
          type: string
          description: Clave estable (`horus`, `routers`, `infra`, `cpu_high`…, el id del router o el nombre del servicio).
        name: { type: string }
        remote_id: { type: integer, description: Id en LibreNMS. }
        hostname: { type: [string, 'null'], description: 'Dispositivos: host con el que está en LibreNMS.' }
        created_by_horus: { type: boolean, description: 'false: ya existía y Horus solo lo usa (nunca lo borra ni edita).' }
        active: { type: boolean, description: 'false: el router ya no está configurado (fuera del grupo, conservado).' }
    LibreNmsSyncStep:
      type: object
      required: [kind, key, name, action, remote_id]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [device, router_device, infra_device, group, template, rule] }
        key: { type: string }
        name: { type: string }
        action: { type: string, enum: [created, adopted, updated, unchanged, recreated, removed, deleted, failed, skipped] }
        remote_id: { type: [integer, 'null'] }
        error_code: { $ref: '#/components/schemas/LibreNmsErrorCode' }
        error: { type: string, description: '`message` de LibreNMS saneado (sin secretos).' }
    LibreNmsErrorCode:
      type: string
      description: Enum abierto.
      enum: [dns_failed, connect_failed, tls_invalid, timeout, auth_failed, forbidden, not_found, rejected, remote_error,
        unexpected_response, missing_credentials, no_default_transport, librenms_not_provisioned, device_missing,
        rule_missing, syslog_not_stored, devices_unavailable]
    LibreNmsTestStep:
      type: object
      required: [step, ok]
      additionalProperties: false
      properties:
        step: { type: string, enum: [auth, device, rule, syslog_send, syslog_stored, eventlog] }
        ok: { type: boolean }
        error_code: { $ref: '#/components/schemas/LibreNmsErrorCode' }
        detail: { type: string }
    LibreNmsTestResult:
      type: object
      required: [ok, channel_id, checked_at, failed_step, error_code, error, steps]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        channel_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        checked_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        latency_ms: { type: [integer, 'null'] }
        remote_version: { type: [string, 'null'] }
        failed_step:
          anyOf:
            - type: string
              enum: [auth, device, rule, syslog_send, syslog_stored, eventlog]
            - type: 'null'
        error_code:
          anyOf:
            - $ref: '#/components/schemas/LibreNmsErrorCode'
            - type: 'null'
        error: { type: [string, 'null'] }
        line: { type: [string, 'null'], description: Línea de syslog enviada. }
        steps: { type: array, items: { $ref: '#/components/schemas/LibreNmsTestStep' } }
    LibreNmsIntegration:
      type: object
      required: [channel_id, status, horus_hostname, horus_hostname_default, cpu_threshold, memory_threshold,
        tz_offset_minutes, remote_version, last_sync_at, last_error_code, last_error, warnings, objects, last_sync_steps, last_test]
      additionalProperties: false
      properties:
        channel_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        status:
          type: string
          enum: [not_provisioned, ok, partial, failed]
          description: '`partial`: la última sincronización terminó con pasos fallidos.'
        horus_hostname: { type: [string, 'null'], description: Host del dispositivo «Horus Flow» en LibreNMS. }
        horus_hostname_default: { type: [string, 'null'], description: Host de HORUS_PUBLIC_BASE_URL. }
        cpu_threshold: { type: integer, minimum: 50, maximum: 99 }
        memory_threshold: { type: integer, minimum: 50, maximum: 99 }
        tz_offset_minutes: { type: [integer, 'null'], description: Desfase horario de LibreNMS respecto de UTC. }
        remote_version: { type: [string, 'null'] }
        last_sync_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        last_error_code:
          anyOf:
            - $ref: '#/components/schemas/LibreNmsErrorCode'
            - type: 'null'
        last_error: { type: [string, 'null'] }
        warnings: { type: array, items: { type: string } }
        objects: { type: array, items: { $ref: '#/components/schemas/LibreNmsObject' } }
        last_sync_steps: { type: array, items: { $ref: '#/components/schemas/LibreNmsSyncStep' } }
        last_test:
          oneOf:
            - $ref: '#/components/schemas/LibreNmsTestResult'
            - type: 'null'
    LibreNmsSyncInput:
      type: object
      additionalProperties: false
      properties:
        horus_hostname:
          type: string
          minLength: 1
          maxLength: 253
          description: Host público de Horus tal como LibreNMS lo verá (por defecto el de HORUS_PUBLIC_BASE_URL).
        cpu_threshold: { type: integer, minimum: 50, maximum: 99, default: 85 }
        memory_threshold: { type: integer, minimum: 50, maximum: 99, default: 90 }
    LibreNmsSyncResult:
      type: object
      required: [ok, error_code, error, steps, warnings, integration]
      additionalProperties: false
      properties:
        ok: { type: boolean, description: true si terminó sin pasos fallidos. }
        error_code:
          anyOf:
            - $ref: '#/components/schemas/LibreNmsErrorCode'
            - type: 'null'
        error: { type: [string, 'null'] }
        steps: { type: array, items: { $ref: '#/components/schemas/LibreNmsSyncStep' } }
        warnings: { type: array, items: { type: string } }
        integration: { $ref: '#/components/schemas/LibreNmsIntegration' }
    LibreNmsMonitoringMode:
      type: string
      description: |
        `ping` (por defecto): solo ICMP. `snmp_v2c` / `snmp_v3`: credenciales propias para LibreNMS (write-only).
        `horus_snmp_v3`: las credenciales SNMPv3 de solo lectura de Horus, con consentimiento explícito por router.
      enum: [ping, snmp_v2c, snmp_v3, horus_snmp_v3]
    LibreNmsRouter:
      type: object
      required: [router_id, router_name, site_id, onboarding_state, mgmt_ip, mode, has_snmp_credentials,
        horus_snmp_reuse_consent, updated_at]
      additionalProperties: false
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        router_name: { type: string }
        site_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        onboarding_state: { type: string }
        mgmt_ip:
          type: [string, 'null']
          description: IP de gestión para LibreNMS (no la del túnel). null = el router no se monitorea en LibreNMS.
        mode: { $ref: '#/components/schemas/LibreNmsMonitoringMode' }
        has_snmp_credentials: { type: boolean }
        horus_snmp_reuse_consent: { type: boolean }
        updated_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
    LibreNmsRouterInput:
      type: object
      required: [mgmt_ip, mode]
      additionalProperties: false
      properties:
        mgmt_ip: { type: string, description: IPv4 o IPv6 de gestión alcanzable desde LibreNMS. }
        mode: { $ref: '#/components/schemas/LibreNmsMonitoringMode' }
        reuse_horus_snmp_consent:
          type: boolean
          default: false
          description: Obligatorio (true) con `horus_snmp_v3`. Auditado.
    LibreNmsSnmpCredentials:
      type: object
      description: Write-only. `community` en `snmp_v2c`; `v3_*` en `snmp_v3`.
      additionalProperties: false
      minProperties: 1
      properties:
        community: { type: string, writeOnly: true, minLength: 1, maxLength: 64 }
        v3_auth_level: { type: string, enum: [noAuthNoPriv, authNoPriv, authPriv] }
        v3_username: { type: string, minLength: 1, maxLength: 64 }
        v3_auth_protocol: { type: string, enum: [MD5, SHA, SHA-224, SHA-256, SHA-384, SHA-512] }
        v3_auth_password: { type: string, writeOnly: true, minLength: 8, maxLength: 128 }
        v3_priv_protocol: { type: string, enum: [AES, DES] }
        v3_priv_password: { type: string, writeOnly: true, minLength: 8, maxLength: 128 }
