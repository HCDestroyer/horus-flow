openapi: 3.1.0
info:
  title: Horus Flow API — módulo alerts, canal mínimo de notificación (contrato v0)
  version: 0.1.0
  description: |
    **D13** adelanta al I1 un canal mínimo de alertas: canales por ISP de tipo `email` (SMTP de la
    instalación) y `telegram` (bot), suscritos a tipos de evento con severidad mínima y filtro por nodo.
    Sin motor de reglas, silencios ni escalado (llegan con alerts completo).
    **D17** `librenms` es una integración por ISP **por la API de LibreNMS** (sin syslog ni SNMP trap): URL base,
    usuario y, como secretos write-only cifrados (`PUT …/credentials`), contraseña y token de API opcional. Nada
    se comparte entre ISPs aunque dos usen la misma instancia de LibreNMS: cada canal guarda sus propias
    credenciales y Horus nunca reutiliza una sesión de otro tenant. Prueba de conexión
    (`POST …/connection-test`) y registro de entregas como los demás canales.
    Los mensajes no incluyen la IP del cliente salvo `include_personal_data=true` (auditado): salen de la
    instalación hacia terceros (proveedor SMTP, Telegram). Los enlaces del mensaje son URLs absolutas sobre
    HORUS_PUBLIC_BASE_URL (D14). Cada envío emite `horus.alerts.notification.sent|failed`.
    **Categorías**: los tipos de evento se agrupan en `security` (hallazgos), `routers` (estado, umbrales, hardware,
    interfaces y reinicios que informa el rol snmp), `infrastructure` (servicios vigilados) y `exporter_tunnel`. Una
    suscripción por categoría incluye también los tipos que se añadan a ella. **Recuperaciones**: con
    `notify_recovery` (por defecto `true`) la recuperación de un recurso llega siempre al canal que recibió su
    alarma, aunque su severidad (`info`) quede por debajo de `min_severity`.
    **Telegram**: mensajes en HTML con el texto escapado y sin vista previa de enlaces; un `429` se reprograma a la
    hora de `retry_after` y un grupo que pasa a supergrupo (`migrate_to_chat_id`) actualiza el `chat_id` del canal
    (auditado). Asistentes: validar un bot (`getMe`) y detectar el chat (`getUpdates`; con el bot compartido de la
    instalación, solo con un código de un solo uso, porque sus mensajes mezclan a todos los ISP).
  license:
    name: Propietaria
    identifier: LicenseRef-Horus-Proprietary
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: horus.example.net
tags:
  - name: notifications
    description: Canales de notificación del ISP y entregas.
paths:
  /notification-channels:
    get:
      tags: [notifications]
      operationId: listNotificationChannels
      summary: Canales de notificación del ISP
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Canales (sin secretos).
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/NotificationChannel' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [notifications]
      operationId: createNotificationChannel
      summary: Crea un canal (email, telegram o librenms)
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelInput' }
      responses:
        '201':
          description: Creado (estado `unverified` hasta la primera prueba correcta).
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-channels/{channel_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [notifications]
      operationId: getNotificationChannel
      summary: Detalle del canal
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Canal.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    patch:
      tags: [notifications]
      operationId: updateNotificationChannel
      summary: Edita nombre, destino, suscripciones o lo habilita/deshabilita
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/NotificationChannelPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelPatch' }
      responses:
        '200':
          description: Actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
    delete:
      tags: [notifications]
      operationId: deleteNotificationChannel
      summary: Borra el canal (y sus secretos, crypto-shredding)
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
  /notification-channels/{channel_id}/credentials:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    put:
      tags: [notifications]
      operationId: putNotificationChannelCredentials
      summary: Secretos write-only del canal (token de bot de Telegram propio, contraseña y token de API de LibreNMS)
      description: |
        Write-only: nunca se devuelven (solo `has_credentials`); se cifran con la KEK de `alerts` y se borran con el
        canal (crypto-shredding). Auditado. Solo se aceptan los campos del `kind` del canal (otro → `422 VALIDATION_FAILED`).
        - `telegram`: opcional (sin token propio se usa el bot de la instalación, HORUS_TELEGRAM_BOT_TOKEN_FILE).
        - `librenms` (D17): `password` obligatoria salvo que se envíe `api_token`; `api_token` opcional
          (cabecera `X-Auth-Token` de la API de LibreNMS). Reemplaza el conjunto completo: lo no enviado se borra.
        - `email`: usa el SMTP de la instalación (HORUS_SMTP_*); no tiene secretos por canal (`422`).
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-reauth: true
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelCredentials' }
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-channels/{channel_id}/connection-test:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [notifications]
      operationId: testNotificationChannelConnection
      summary: Prueba de conexión sin enviar notificación (síncrona, timeout 10 s)
      description: |
        Comprueba alcance, TLS y autenticación del destino con las credenciales guardadas, sin publicar nada.
        `librenms` (D17): resuelve `base_url`, valida el certificado (salvo `tls_verify=false`) y hace una llamada
        de solo lectura autenticada a la API. `telegram`: `getMe` del bot. `email`: conexión y `EHLO`/`STARTTLS`
        al SMTP de la instalación. Un resultado correcto pasa el canal de `unverified` a `ok`. El error nunca incluye
        secretos ni el cuerpo de la respuesta remota.
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-rate-limit: connection_test
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Resultado de la prueba (también cuando falla el destino; ver `ok`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTestResult' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-channels/{channel_id}/test:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [notifications]
      operationId: testNotificationChannel
      summary: Envía una notificación de prueba (asíncrona; el resultado llega por WebSocket `me` y en el canal)
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyRequired'
      responses:
        '202':
          description: Prueba encolada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationDelivery' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
  /notification-deliveries:
    get:
      tags: [notifications]
      operationId: listNotificationDeliveries
      summary: Entregas recientes (enviadas o fallidas) por canal
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: channel_id
          in: query
          schema: { $ref: './common.yaml#/components/schemas/Uuid' }
        - name: status
          in: query
          schema: { type: string, enum: [sent, failed, throttled] }
        - name: channel_kind
          in: query
          schema: { $ref: '#/components/schemas/NotificationChannelKind' }
      responses:
        '200':
          description: Entregas.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/NotificationDelivery' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
  /notification-channels/telegram/bot-validation:
    post:
      tags: [notifications]
      operationId: validateTelegramBot
      summary: Valida un token de bot de Telegram (getMe) sin guardarlo
      description: |
        Paso del asistente «Crear bot»: tras `/newbot` en @BotFather la persona pega el token y la consola muestra el
        nombre y el usuario del bot. El token no se guarda ni se devuelve (se guarda después con
        `PUT …/credentials`). Un token rechazado → `422 NOTIFICATION_CHANNEL_AUTH_FAILED` con la descripción de
        Telegram (saneada, sin el token).
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-rate-limit: connection_test
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bot_token]
              additionalProperties: false
              properties:
                bot_token: { type: string, writeOnly: true, pattern: '^[0-9]+:[A-Za-z0-9_-]{30,}$' }
      responses:
        '200':
          description: Bot válido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramBotInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-channels/telegram/link-codes:
    post:
      tags: [notifications]
      operationId: createTelegramLinkCode
      summary: Código de un solo uso para detectar el chat con el bot de la instalación
      description: |
        Las actualizaciones del bot compartido (HORUS_TELEGRAM_BOT_TOKEN_FILE) mezclan a todos los ISP: para detectar
        el chat la persona envía `/start <código>` al bot (o publica el código en el canal) y
        `POST …/telegram/chat-detection` solo devuelve el chat que lo envió. Caduca a los 15 minutos. Sin bot de la
        instalación → `422 NOTIFICATION_TELEGRAM_BOT_NOT_CONFIGURED`.
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '201':
          description: Código generado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLinkCode' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /notification-channels/telegram/chat-detection:
    post:
      tags: [notifications]
      operationId: detectTelegramChats
      summary: Detecta los chats donde escribieron al bot o lo añadieron (getUpdates)
      description: |
        Lee las actualizaciones pendientes del bot con `getUpdates` (`message`, `channel_post`, `my_chat_member`; sin
        espera larga) y las confirma con `offset` para que no se acumulen. Con un bot propio (`bot_token` pegado en el
        asistente o el guardado en `channel_id`) devuelve todos los chats; con el bot de la instalación exige `code`
        (`POST …/telegram/link-codes`) y solo devuelve el chat que lo envió. Horus no usa webhooks: si el bot tiene
        uno, Telegram rechaza `getUpdates` → `422 NOTIFICATION_TELEGRAM_WEBHOOK_ACTIVE`.
      x-module: alerts
      x-scope: tenant
      x-permission: alerts.manage
      x-rate-limit: connection_test
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                bot_token: { type: string, writeOnly: true, pattern: '^[0-9]+:[A-Za-z0-9_-]{30,}$', description: Bot propio aún no guardado (no se guarda). }
                channel_id: { $ref: './common.yaml#/components/schemas/Uuid' }
                code: { type: string, pattern: '^hf[a-z0-9]{10}$', description: Código de vinculación (bot de la instalación). }
      responses:
        '200':
          description: Chats candidatos (vacío si nadie escribió todavía).
          content:
            application/json:
              schema:
                type: object
                required: [data, shared_bot]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TelegramChatCandidate' } }
                  bot_username: { type: [string, 'null'], examples: ['@noc_isp_bot'] }
                  shared_bot: { type: boolean, description: true = bot de la instalación (filtrado por código). }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
components:
  securitySchemes:
    tenantBearer: { $ref: './common.yaml#/components/securitySchemes/tenantBearer' }
  parameters:
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
  schemas:
    NotificationChannelKind:
      type: string
      description: |
        `email`, `telegram` y `librenms` (D17, por API) disponibles. Enum abierto (después: webhook, whatsapp,
        sms); un `kind` conocido por el contrato pero aún no implementado → `422 NOTIFICATION_CHANNEL_KIND_NOT_AVAILABLE`.
      enum: [email, telegram, librenms]
    NotificationEventType:
      type: string
      description: |
        Tipos de evento a los que se suscribe un canal (enum abierto), por categoría:
        - `security`: `finding_opened`, `finding_reopened`.
        - `routers` (rol snmp): `router_offline`, `router_recovered` (vuelve tras una caída o un umbral avisado),
          `router_cpu_high`, `router_memory_high`, `router_temperature_high` (aviso → `medium`, crítico → `high`),
          `router_hardware_failed` (fuente o ventilador), `router_interface_down` / `router_interface_up` (enlace de
          subida → `high`), `router_rebooted`.
        - `infrastructure` (servicios vigilados, `horus.snmp.service.state_changed`): `service_down`,
          `service_degraded`, `service_recovered`.
        - `exporter_tunnel`: `exporter_silent`, `exporter_recovered`, `tunnel_down`, `tunnel_recovered`.
        Las recuperaciones (`*_recovered`, `router_interface_up`) tienen severidad `info`.
      enum:
        - finding_opened
        - finding_reopened
        - exporter_silent
        - exporter_recovered
        - tunnel_down
        - tunnel_recovered
        - router_offline
        - router_recovered
        - router_cpu_high
        - router_memory_high
        - router_temperature_high
        - router_hardware_failed
        - router_interface_down
        - router_interface_up
        - router_rebooted
        - service_down
        - service_degraded
        - service_recovered
    NotificationCategory:
      type: string
      description: Grupo de tipos de evento (ver NotificationEventType). Enum abierto.
      enum: [security, routers, infrastructure, exporter_tunnel]
    EmailChannelConfig:
      type: object
      title: EmailChannelConfig
      required: [recipients]
      additionalProperties: false
      properties:
        recipients:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: email }
        subject_prefix: { type: string, maxLength: 40, default: '[Horus]' }
        language: { type: string, enum: [es, en], default: es }
    TelegramChannelConfig:
      type: object
      title: TelegramChannelConfig
      required: [chat_id]
      additionalProperties: false
      properties:
        chat_id:
          type: string
          pattern: '^-?[0-9]{1,20}$|^@[A-Za-z0-9_]{5,32}$'
          description: 'Id numérico (usuarios positivos, grupos negativos, supergrupos y canales `-100…`) o `@usuario_del_canal`.'
        message_thread_id:
          type: integer
          minimum: 1
          description: Tema de un supergrupo con temas (foro); sin valor, el chat general.
        uses_own_bot: { type: boolean, default: false, readOnly: true }
        language: { type: string, enum: [es, en], default: es }
    LibreNmsChannelConfig:
      type: object
      title: LibreNmsChannelConfig
      description: |
        D17: LibreNMS como destino por **su API** (instancia dedicada a Horus), configurado a mano por cada ISP.
        Solo la parte no secreta: contraseña y token van por `PUT /notification-channels/{id}/credentials`
        (write-only). LibreNMS como fuente de inventario queda fuera del I1.
      required: [base_url, username]
      additionalProperties: false
      properties:
        base_url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
          description: URL base de la instancia (p. ej. `https://librenms.isp.example`); Horus añade `/api/v0`. Sin credenciales en la URL.
          examples: ['https://librenms.isp.example']
        username: { type: string, minLength: 1, maxLength: 128, description: Usuario de LibreNMS dedicado a Horus. }
        tls_verify: { type: boolean, default: true, description: false solo para certificados autofirmados (auditado). }
        timeout_seconds: { type: integer, minimum: 2, maximum: 30, default: 10 }
    NotificationChannelCredentials:
      type: object
      description: Secretos write-only por `kind` (nunca devueltos). Ver `PUT /notification-channels/{id}/credentials`.
      additionalProperties: false
      minProperties: 1
      properties:
        telegram_bot_token: { type: string, writeOnly: true, pattern: '^[0-9]+:[A-Za-z0-9_-]{30,}$' }
        password: { type: string, writeOnly: true, minLength: 1, maxLength: 256, description: 'librenms: contraseña del usuario.' }
        api_token: { type: string, writeOnly: true, minLength: 16, maxLength: 256, description: 'librenms: token de API (opcional).' }
    ConnectionTestResult:
      type: object
      required: [ok, channel_id, channel_kind, checked_at]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        channel_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        channel_kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        checked_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        latency_ms: { type: [integer, 'null'] }
        remote_version: { type: [string, 'null'], description: 'librenms: versión que informa la API, si la expone.' }
        error_code:
          description: Sin valor si `ok`. Enum abierto.
          anyOf:
            - type: string
              enum: [dns_failed, connect_failed, tls_invalid, auth_failed, forbidden, timeout, unexpected_response, missing_credentials,
                chat_not_found, bot_not_member, bot_cannot_post]
            - type: 'null'
        error:
          type: [string, 'null']
          description: |
            Sin secretos ni cuerpo de la respuesta remota; en Telegram incluye la `description` de la Bot API saneada (sin el
            token). `telegram`: `getMe` + `getChat` + `getChatMember` (en un canal el bot debe ser administrador con
            `can_post_messages`).
        bot_username: { type: [string, 'null'], description: 'telegram: @usuario del bot.' }
        chat_title: { type: [string, 'null'], description: 'telegram: título del chat comprobado.' }
    ChannelSubscription:
      type: object
      description: |
        Un evento llega al canal si su tipo está en `event_types` **o** su categoría en `categories` (al menos una de las
        dos con valores), su severidad alcanza `min_severity` y su nodo está en `site_ids`. Compatible con las
        suscripciones anteriores (solo `event_types`).
      required: [event_types]
      additionalProperties: false
      properties:
        event_types:
          type: array
          items: { $ref: '#/components/schemas/NotificationEventType' }
        categories:
          type: array
          description: Categorías completas (incluye los tipos que se añadan a ellas).
          items: { $ref: '#/components/schemas/NotificationCategory' }
        min_severity: { $ref: './common.yaml#/components/schemas/Severity' }
        notify_recovery:
          type: boolean
          default: true
          description: La recuperación de un recurso llega al canal que recibió su alarma sin filtro de severidad ni agrupación.
        site_ids:
          type: array
          description: Vacío = todos los nodos.
          items: { $ref: './common.yaml#/components/schemas/Uuid' }
        throttle_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          default: 15
          description: Ventana de agrupación por (canal, tipo, recurso) para no inundar.
    NotificationChannelInput:
      type: object
      required: [name, kind, config, subscription]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        enabled: { type: boolean, default: true }
        config:
          oneOf:
            - $ref: '#/components/schemas/EmailChannelConfig'
            - $ref: '#/components/schemas/TelegramChannelConfig'
            - $ref: '#/components/schemas/LibreNmsChannelConfig'
        subscription: { $ref: '#/components/schemas/ChannelSubscription' }
        include_personal_data:
          type: boolean
          default: false
          description: true ⇒ los mensajes incluyen la IP del cliente (auditado). Por defecto alias o IP enmascarada.
    NotificationChannelPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        config:
          oneOf:
            - $ref: '#/components/schemas/EmailChannelConfig'
            - $ref: '#/components/schemas/TelegramChannelConfig'
            - $ref: '#/components/schemas/LibreNmsChannelConfig'
        subscription: { $ref: '#/components/schemas/ChannelSubscription' }
        include_personal_data: { type: boolean }
    NotificationChannel:
      allOf:
        - $ref: './common.yaml#/components/schemas/TenantScopedResource'
        - $ref: '#/components/schemas/NotificationChannelInput'
        - type: object
          required: [status, has_credentials, last_delivery_at, last_error]
          properties:
            status: { type: string, enum: [unverified, ok, failing, disabled] }
            has_credentials: { type: boolean }
            last_delivery_at:
              oneOf:
                - $ref: './common.yaml#/components/schemas/Timestamp'
                - type: 'null'
            last_error: { type: [string, 'null'], description: Sin datos sensibles. }
    NotificationDelivery:
      type: object
      required: [id, tenant_id, channel_id, channel_kind, status, source_event_type, source_event_id, created_at]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        tenant_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        channel_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        channel_kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        status: { type: string, enum: [queued, sent, failed, throttled] }
        event_type: { $ref: '#/components/schemas/NotificationEventType' }
        source_event_type: { type: [string, 'null'], examples: [horus.detection.finding.opened] }
        source_event_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        is_test: { type: boolean }
        error: { type: [string, 'null'] }
        severity:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Severity'
            - type: 'null'
        summary: { type: [string, 'null'], description: Asunto del mensaje enviado (sin datos personales). }
        resource_id: { type: [string, 'null'], description: 'Recurso que agrupa avisos y empareja recuperaciones (router, interfaz, servicio…).' }
        created_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        sent_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
    TelegramBotInfo:
      type: object
      required: [id, username, first_name]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string, examples: [noc_isp_bot] }
        first_name: { type: string, examples: [NOC Fibra Norte] }
        can_join_groups: { type: boolean }
        can_read_all_group_messages: { type: boolean }
    TelegramLinkCode:
      type: object
      required: [code, expires_at, bot_username, start_url]
      properties:
        code: { type: string, pattern: '^hf[a-z0-9]{10}$' }
        expires_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        bot_username: { type: [string, 'null'], examples: ['@horus_alertas_bot'] }
        start_url: { type: [string, 'null'], description: 'Enlace de t.me al chat privado con el bot y el código como parámetro start.' }
    TelegramChatCandidate:
      type: object
      required: [id, type, title]
      properties:
        id: { type: string, description: chat_id para la configuración del canal., examples: ['-1001234567890'] }
        type: { type: string, enum: [private, group, supergroup, channel] }
        title: { type: string }
        username: { type: string }
