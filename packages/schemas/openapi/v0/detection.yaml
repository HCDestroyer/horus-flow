openapi: 3.1.0
info:
  title: Horus Flow API — módulo detection (contrato v0)
  version: 0.1.0
  description: |
    Hallazgos de seguridad (señales compatibles con botnet), resumen para widgets NOC, feeds de reputación y
    allowlist del ISP (docs/api.md §2.10; ADR-0024). Esquema del hallazgo (C8):
    packages/schemas/finding/v0/finding.schema.json. **D11**: cada hallazgo trae `recommended_actions[]`
    (explicación + comandos RouterOS sugeridos) que **Horus nunca ejecuta**; el operador los copia.
    Los comandos llevan la IP del cliente solo en `rendered_commands`, y solo si quien mira tiene
    `customers.read` (nunca kioscos).
  license:
    name: Propietaria
    identifier: LicenseRef-Horus-Proprietary
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: horus.example.net
tags:
  - name: findings
    description: Hallazgos y su ciclo de vida.
  - name: reputation
    description: Feeds de reputación (plataforma) y allowlist (ISP).
  - name: scoring
    description: Scoring residencial/comercial explicable del cliente (I2).
paths:
  /findings:
    get:
      tags: [findings]
      operationId: listFindings
      summary: Hallazgos del ISP (orden por defecto severidad y recencia)
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/SiteIdFilter'
        - name: kind
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, description: 'open,acknowledged,resolved,false_positive' }
        - name: customer_id
          in: query
          schema: { $ref: './common.yaml#/components/schemas/Uuid' }
        - name: opened_at_gte
          in: query
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          schema: { type: string, enum: [-severity, -last_seen_at, -opened_at, opened_at], default: -severity }
      responses:
        '200':
          description: Página de hallazgos.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '../../finding/v0/finding.schema.json' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /findings/bulk-resolve:
    post:
      tags: [findings]
      operationId: bulkResolveFindings
      summary: "Resolver en bloque los hallazgos activos que encajan con un filtro (p. ej. tras mejorar un detector)"
      description: |
        Resuelve, con el mismo comentario, los hallazgos `open`/`acknowledged` que encajan con `kind`, `severity`
        y `site_id` (los que se omiten no filtran: sin `kind`, todos los tipos) dentro del alcance de nodos de
        quien llama. Cada hallazgo pasa por la misma transición que `resolveFinding`
        (veredicto, evento `horus.detection.finding.resolved` y estado de seguridad del cliente). Como máximo
        1000 por llamada: si `resolved` es 1000, puede quedar alguno; se vuelve a llamar.
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.manage
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              additionalProperties: false
              properties:
                kind: { $ref: '../../finding/v0/finding.schema.json#/$defs/FindingKind' }
                severity: { type: string, enum: [low, medium, high, critical] }
                site_id: { $ref: './common.yaml#/components/schemas/Uuid' }
                comment: { type: string, minLength: 3, maxLength: 2000 }
                states:
                  type: array
                  description: "Estados a cerrar (por defecto ambos: open y acknowledged)."
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [open, acknowledged] }
      responses:
        '200':
          description: Hallazgos resueltos.
          content:
            application/json:
              schema:
                type: object
                required: [resolved]
                properties:
                  resolved: { type: integer, minimum: 0, maximum: 1000 }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /findings/{finding_id}:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    get:
      tags: [findings]
      operationId: getFinding
      summary: Detalle con razones, evidencia agregada, acciones recomendadas y línea de tiempo
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Hallazgo.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '../../finding/v0/finding.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /findings/{finding_id}/evidence:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    get:
      tags: [findings]
      operationId: getFindingEvidence
      summary: Flujos de evidencia del cliente en la ventana (sin payloads). Acceso auditado
      x-module: detection
      x-scope: tenant
      x-permission: security.evidence.read
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Flujos.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [ts, remote_ip, remote_port, protocol, direction, bytes, packets]
                      properties:
                        ts: { $ref: './common.yaml#/components/schemas/Timestamp' }
                        remote_ip: { $ref: './common.yaml#/components/schemas/IpAddress' }
                        remote_port: { type: integer }
                        remote_asn: { type: [integer, 'null'] }
                        protocol: { type: integer }
                        tcp_flags: { type: [integer, 'null'] }
                        direction: { type: string, enum: [upload, download, internal, unknown] }
                        bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
                        packets: { $ref: './common.yaml#/components/schemas/Uint64String' }
                        reputation_category: { type: [string, 'null'] }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /findings/{finding_id}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    post:
      tags: [findings]
      operationId: acknowledgeFinding
      summary: Reconocer (queda asignado a quien lo pulsa)
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindingTransition' }
      responses:
        '200':
          description: Hallazgo actualizado.
          content:
            application/json:
              schema: { $ref: '../../finding/v0/finding.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
  /findings/{finding_id}/resolve:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    post:
      tags: [findings]
      operationId: resolveFinding
      summary: Resolver (si el patrón vuelve se abre uno nuevo enlazado, "reincidente")
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindingTransition' }
      responses:
        '200':
          description: Hallazgo resuelto.
          content:
            application/json:
              schema: { $ref: '../../finding/v0/finding.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
  /findings/{finding_id}/mark-false-positive:
    parameters:
      - $ref: '#/components/parameters/FindingId'
    post:
      tags: [findings]
      operationId: markFindingFalsePositive
      summary: Falso positivo (comentario obligatorio; alimenta verdict_feedback y el periodo de silencio)
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, minLength: 3, maxLength: 2000 }
                silence_days: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: Marcado como falso positivo.
          content:
            application/json:
              schema: { $ref: '../../finding/v0/finding.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /customers/{customer_id}/findings:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    get:
      tags: [findings]
      operationId: listCustomerFindings
      summary: Hallazgos de un cliente
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de hallazgos.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '../../finding/v0/finding.schema.json' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /customers/{customer_id}/scoring:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    get:
      tags: [scoring]
      operationId: getCustomerScoring
      summary: Último scoring residencial/comercial del cliente con su explicación y, con range, la serie diaria
      description: |
        Modelo `commercial-v1` (heurística ponderada y explicable): `features` con valor bruto, valor normalizado 0..1,
        peso y aportación; `reasons[]` ordenadas por aportación; probabilidades por clase; umbrales del ISP; estado de la
        histéresis (nivel publicado en `horus.detection.customer.kind_suggested` y candidato pendiente). Sin scoring
        todavía (menos horas activas que el mínimo, scoring desactivado o fuera del alcance de nodos) → `latest: null`.
        La IP del cliente no aparece en la respuesta ni en la URL.
      x-module: detection
      x-scope: tenant
      x-permission: customers.read
      x-increment: I2
      security:
        - tenantBearer: []
      parameters:
        - name: range
          in: query
          description: Serie diaria hacia atrás (`90d`, `12w`, `48h`; máximo 400d). Sin range no hay serie.
          schema: { type: string, pattern: '^[1-9][0-9]{0,3}[hdw]$' }
      responses:
        '200':
          description: Último scoring (o null) y serie diaria.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerScoringResponse' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /security/summary:
    get:
      tags: [findings]
      operationId: getSecuritySummary
      summary: Conteos por severidad, señal, kind, estado de seguridad y nodo (widgets; sin IPs)
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.read
      x-principals: [user, api_token, kiosk]
      x-increment: I1
      security:
        - tenantBearer: []
        - kioskBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/SiteIdFilter'
        - $ref: './common.yaml#/components/parameters/Range'
      responses:
        '200':
          description: Resumen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecuritySummary' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
  /detection/config:
    get:
      tags: [reputation]
      operationId: getDetectionConfig
      summary: Umbrales vigentes de los detectores del ISP (valores por defecto + ajustes del ISP), solo lectura
      description: 'Los nombres de detector y los campos son los de detection.detector_config (domain.Params); las duraciones en formato Go ("5m0s").'
      x-module: detection
      x-scope: tenant
      x-permission: settings.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Parámetros vigentes.
          content:
            application/json:
              schema:
                type: object
                required: [detectors, customized]
                properties:
                  detectors:
                    type: object
                    description: 'Un objeto por detector (c2_contact, scanning, watched_ports, fanout, smtp, ddos, beaconing, sustained_upload) con enabled, window y sus umbrales; customer_scoring (scoring residencial/comercial: umbrales, histéresis, pesos); más auto_expire.'
                    additionalProperties: true
                  customized:
                    type: array
                    description: Detectores con ajustes propios del ISP.
                    items: { type: string }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /reputation/sources:
    get:
      tags: [reputation]
      operationId: listReputationSources
      summary: Estado de los feeds de reputación de plataforma (última actualización, entradas, licencia)
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Feeds.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [key, name, origin, category, entries, last_success_at, commercial_use_allowed]
                      properties:
                        key: { type: string, examples: [abuse_ch_feodo] }
                        name: { type: string }
                        origin: { type: string, enum: [catalog, custom], description: 'D20: catálogo base o agregada por el superadministrador.' }
                        confidence: { type: integer, minimum: 0, maximum: 100 }
                        category: { type: string, enum: [botnet_cc, scanner, malware_dist, mining_pool, proxy_vpn, tor_exit, blocklist] }
                        entries: { type: integer }
                        last_success_at:
                          oneOf:
                            - $ref: './common.yaml#/components/schemas/Timestamp'
                            - type: 'null'
                        age_seconds: { type: [integer, 'null'] }
                        commercial_use_allowed: { type: boolean, description: 'true en el catálogo base (D20) y en las personalizadas (términos confirmados al darlas de alta).' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
  /reputation/allowlist:
    get:
      tags: [reputation]
      operationId: listAllowlist
      summary: Allowlist del ISP (prefijos/ASN que no deben generar hallazgos)
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Entradas.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AllowlistEntry' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
    post:
      tags: [reputation]
      operationId: createAllowlistEntry
      summary: Añade una entrada a la allowlist
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.manage
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                prefix: { $ref: './common.yaml#/components/schemas/Cidr' }
                asn: { type: integer, minimum: 1 }
                kinds: { type: array, items: { type: string }, description: Vacío = todos. }
                reason: { type: string, maxLength: 300 }
      responses:
        '201':
          description: Creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllowlistEntry' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /reputation/allowlist/{entry_id}:
    parameters:
      - name: entry_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    delete:
      tags: [reputation]
      operationId: deleteAllowlistEntry
      summary: Quita una entrada de la allowlist
      x-module: detection
      x-scope: tenant
      x-permission: security.findings.manage
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
components:
  securitySchemes:
    tenantBearer: { $ref: './common.yaml#/components/securitySchemes/tenantBearer' }
    kioskBearer: { $ref: './common.yaml#/components/securitySchemes/kioskBearer' }
  parameters:
    FindingId:
      name: finding_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
  schemas:
    ScoringFeature:
      type: object
      required: [code, value, unit, normalized, weight, contribution, available, detail]
      properties:
        code:
          type: string
          description: inbound_services | upload_ratio_high | upload_vs_residential_median | business_hours_pattern | always_on | many_remote_asns (enum abierto).
        value: { type: number, description: Valor bruto en `unit`. }
        unit: { type: string, description: 'ports | ratio | x | share | asns' }
        normalized: { type: number, minimum: 0, maximum: 1 }
        weight: { type: number, minimum: 0, maximum: 1, description: Peso configurado por el ISP. }
        contribution: { type: number, minimum: 0, maximum: 1, description: Puntos (0..1) que aporta a la probabilidad comercial. }
        available: { type: boolean, description: false si no hay datos (p. ej. sin mediana residencial). }
        detail: { type: string, description: Texto humano con los números reales. }
    CustomerScoring:
      type: object
      required: [customer_id, model_version, computed_at, window_from, window_to, level, suggested_kind, commercial_score, raw_score,
        confidence, scores, commercial_use_suspected, dynamic_pool, customer_kind, kind_locked, published_level, published_at,
        pending_level, pending_since, features, reasons, thresholds]
      properties:
        customer_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        model_version: { type: string, examples: [commercial-v1] }
        computed_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        window_from: { $ref: './common.yaml#/components/schemas/Timestamp' }
        window_to: { $ref: './common.yaml#/components/schemas/Timestamp' }
        level: { type: string, enum: [residential, suspected, commercial], description: suspected = residencial con indicios comerciales. }
        suggested_kind: { type: string, enum: [residential, commercial] }
        commercial_score: { type: integer, minimum: 0, maximum: 100, description: Probabilidad comercial tras el ajuste por pool dinámico. }
        raw_score: { type: integer, minimum: 0, maximum: 100, description: Probabilidad comercial antes del ajuste. }
        confidence: { type: number, minimum: 0, maximum: 1, description: Probabilidad de la clase sugerida. }
        scores:
          type: object
          required: [residential, commercial]
          properties:
            residential: { type: number, minimum: 0, maximum: 1 }
            commercial: { type: number, minimum: 0, maximum: 1 }
        commercial_use_suspected: { type: boolean }
        dynamic_pool: { type: boolean, description: La IP está en un prefijo dinámico (confianza comercial reducida). }
        customer_kind: { type: string, description: Tipo del cliente al puntuar. }
        kind_locked: { type: boolean, description: Tipo fijado a mano (el scoring sugiere pero devices no lo cambia). }
        published_level: { type: [string, 'null'], enum: [residential, suspected, commercial, null] }
        published_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        pending_level:
          type: [string, 'null']
          enum: [residential, suspected, commercial, null]
          description: Nivel nuevo que aún no ha sostenido la histéresis.
        pending_since:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        features:
          type: array
          items: { $ref: '#/components/schemas/ScoringFeature' }
        reasons:
          type: array
          items: { $ref: './common.yaml#/components/schemas/Reason' }
        thresholds:
          type: object
          required: [commercial, suspected, hysteresis_days]
          properties:
            commercial: { type: integer, minimum: 1, maximum: 100 }
            suspected: { type: integer, minimum: 1, maximum: 100 }
            hysteresis_days: { type: integer, minimum: 0 }
    CustomerScoringPoint:
      type: object
      required: [day, commercial_score, confidence, level, suggested_kind, kind]
      properties:
        day: { type: string, format: date }
        commercial_score: { type: integer, minimum: 0, maximum: 100 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        level: { type: string, enum: [residential, suspected, commercial] }
        suggested_kind: { type: string }
        kind: { type: string, description: Tipo vigente del cliente ese día. }
    CustomerScoringResponse:
      type: object
      required: [latest, series]
      properties:
        latest:
          oneOf:
            - $ref: '#/components/schemas/CustomerScoring'
            - type: 'null'
        series:
          type: array
          items: { $ref: '#/components/schemas/CustomerScoringPoint' }
        series_unavailable: { type: boolean, description: ClickHouse no respondió; la serie va vacía. }
    FindingTransition:
      type: object
      properties:
        comment: { type: [string, 'null'], maxLength: 2000 }
        actions_taken:
          type: array
          description: Códigos de las acciones recomendadas que el operador aplicó a mano (D11; informativo).
          items: { type: string }
    SecuritySummary:
      type: object
      required: [open_by_severity, new_last_24h, affected_customers, by_signal, by_kind, by_security_state, by_site, generated_at]
      properties:
        open_by_severity: { type: object, additionalProperties: { type: integer } }
        new_last_24h: { type: integer }
        affected_customers: { type: integer }
        by_signal:
          type: object
          description: Clientes afectados por señal (c2_contact, beaconing, fan_out, scanning, watched_ports, sustained_upload, smtp, ddos).
          additionalProperties: { type: integer }
        by_kind: { type: object, additionalProperties: { type: integer } }
        by_security_state: { type: object, additionalProperties: { type: integer } }
        by_site:
          type: array
          items:
            type: object
            required: [site_id, customers_with_signals, open_findings]
            properties:
              site_id: { $ref: './common.yaml#/components/schemas/Uuid' }
              customers_with_signals: { type: integer }
              open_findings: { type: integer }
        watched_ports:
          type: array
          items:
            type: object
            required: [port, protocol, customers, flows]
            properties:
              port: { type: integer }
              protocol: { type: string, enum: [tcp, udp] }
              customers: { type: integer }
              flows: { $ref: './common.yaml#/components/schemas/Uint64String' }
        generated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    AllowlistEntry:
      type: object
      required: [id, tenant_id, reason, created_at, created_by]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        tenant_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        prefix: { type: [string, 'null'] }
        asn: { type: [integer, 'null'] }
        kinds: { type: array, items: { type: string } }
        reason: { type: string }
        created_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        created_by: { $ref: './common.yaml#/components/schemas/Uuid' }
