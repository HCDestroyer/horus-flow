openapi: 3.1.0
info:
  title: Horus Flow API — módulo auth (contrato v0)
  version: 0.1.0
  description: |
    Sesión, token por tenant, cuenta propia, miembros y roles del tenant, catálogo de permisos y
    kioscos (identidad del dispositivo). Módulo dueño: `auth` (docs/api.md §2.1, §2.2, §2.12;
    docs/security.md §5–§6). Extensiones por operación: `x-module`, `x-scope`, `x-permission`,
    `x-principals`, `x-reauth` (🔒 re-autenticación reciente), `x-increment`.
  license:
    name: Propietaria
    identifier: LicenseRef-Horus-Proprietary
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: horus.example.net
tags:
  - name: auth
    description: Sesión y tokens.
  - name: me
    description: Cuenta propia.
  - name: members
    description: Miembros, roles y permisos del tenant.
  - name: kiosks
    description: Kioscos (pantallas NOC) como dispositivos registrados.
  - name: api-tokens
    description: API tokens de integración (hf_pat_) del ISP, p. ej. el código de conexión para ArgosISP.
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      summary: Inicio de sesión con usuario y contraseña
      description: |
        Sin 2FA → access token de **sesión** (`scope=session`) + cookie de refresh. Con 2FA →
        `mfa_required` + `mfa_token` (5 min, un uso). Errores sin revelar si el usuario existe
        (`INVALID_CREDENTIALS`). Bloqueo progresivo según docs/security.md §4.2.
      x-module: auth
      x-scope: public
      x-permission: public
      x-rate-limit: login
      x-increment: I0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024, writeOnly: true }
      responses:
        '200':
          description: Sesión creada o 2FA requerida.
          headers:
            Set-Cookie:
              description: '`__Secure-hf_rt` (solo si no se requiere 2FA).'
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AccessTokenResponse'
                  - $ref: '#/components/schemas/MfaChallenge'
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /auth/mfa/verify:
    post:
      tags: [auth]
      operationId: authMfaVerify
      summary: Segundo factor (TOTP o código de recuperación)
      x-module: auth
      x-scope: public
      x-permission: public
      x-rate-limit: login
      x-increment: I1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string }
                code: { type: string, minLength: 6, maxLength: 16 }
      responses:
        '200':
          description: Sesión creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /auth/token:
    post:
      tags: [auth]
      operationId: authIssueToken
      summary: Access token de un tenant o de plataforma
      description: |
        `{"tenant_id"}` → JWT de 10 min con `tid` y los permisos de ese tenant. No miembro →
        `404 TENANT_NOT_FOUND` (no revela si existe); tenant suspendido → `403 TENANT_SUSPENDED`;
        rol que exige 2FA sin TOTP activo → `403 MFA_ENROLLMENT_REQUIRED` (D14: 2FA obligatorio para
        administradores). `{"scope": "platform"}` → token de plataforma (solo roles de plataforma).
      x-module: auth
      x-scope: session
      x-permission: authenticated
      x-increment: I0
      security:
        - sessionBearer: []
        - refreshCookie: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [tenant_id]
                  additionalProperties: false
                  properties:
                    tenant_id: { $ref: './common.yaml#/components/schemas/Uuid' }
                - type: object
                  required: [scope]
                  additionalProperties: false
                  properties:
                    scope: { type: string, const: platform }
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: authRefresh
      summary: Rota el refresh y devuelve un access token de sesión
      description: Reutilización de un refresh ya usado ⇒ revoca la sesión (`refresh_token_reuse`). Exige `Origin` permitido (HORUS_ALLOWED_ORIGINS, D14).
      x-module: auth
      x-scope: public
      x-permission: refresh_cookie
      x-increment: I0
      security:
        - refreshCookie: []
      parameters:
        - $ref: './common.yaml#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: Nuevo par (cookie rotada).
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /auth/reauth:
    post:
      tags: [auth]
      operationId: authReauth
      summary: Re-autenticación reciente (marca `auth_time`)
      x-module: auth
      x-scope: session
      x-permission: authenticated
      x-increment: I1
      security:
        - sessionBearer: []
        - tenantBearer: []
        - platformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, writeOnly: true }
                code: { type: [string, 'null'] }
      responses:
        '200':
          description: Token renovado con `auth_time` reciente (mismo ámbito que el presentado).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Revoca la sesión actual y borra la cookie
      x-module: auth
      x-scope: session
      x-permission: refresh_cookie
      x-increment: I0
      security:
        - refreshCookie: []
      parameters:
        - $ref: './common.yaml#/components/parameters/XRequestedWith'
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /auth/invitations/inspect:
    post:
      tags: [auth]
      operationId: authInspectInvitation
      summary: Datos de una invitación para la página de aceptación (sin consumirla)
      x-module: auth
      x-scope: public
      x-permission: public
      x-rate-limit: login
      x-increment: I1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32 }
      responses:
        '200':
          description: Invitación vigente.
          content:
            application/json:
              schema:
                type: object
                required: [email, tenant_name, needs_password, expires_at]
                properties:
                  email: { type: string, format: email }
                  tenant_name: { type: string }
                  needs_password:
                    type: boolean
                    description: true si la cuenta es nueva (debe elegir contraseña); false si ya existía.
                  expires_at: { type: string, format: date-time }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /auth/invitations/accept:
    post:
      tags: [auth]
      operationId: authAcceptInvitation
      summary: Acepta una invitación a un tenant (crea el usuario si no existe)
      x-module: auth
      x-scope: public
      x-permission: public
      x-rate-limit: login
      x-increment: I1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32 }
                display_name: { type: [string, 'null'], maxLength: 120 }
                password: { type: [string, 'null'], writeOnly: true, minLength: 12 }
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: authForgotPassword
      summary: Pide un enlace para restablecer la contraseña (respuesta idéntica exista o no la cuenta)
      description: |
        Si el correo corresponde a una cuenta activa y la instalación tiene SMTP, se le envía un enlace de un
        uso (30 min) a <HORUS_PUBLIC_BASE_URL>/reset-password#token=…; en cualquier otro caso la respuesta es
        la misma. `email_delivery` solo dice si la instalación puede enviar correo (no depende de la cuenta):
        sin SMTP, la persona debe pedir el enlace a un administrador (POST /members/{user_id}/password-reset).
        Límite: 20/min por IP y 5/min por cuenta.
      x-module: auth
      x-scope: public
      x-permission: public
      x-rate-limit: login
      x-increment: I1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Aceptado (siempre).
          content:
            application/json:
              schema:
                type: object
                required: [email_delivery]
                properties:
                  email_delivery:
                    type: boolean
                    description: true si la instalación envía correo; false si no hay SMTP configurado.
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /auth/password/reset/inspect:
    post:
      tags: [auth]
      operationId: authInspectPasswordReset
      summary: Datos de un enlace de restablecimiento para la página (sin consumirlo)
      x-module: auth
      x-scope: public
      x-permission: public
      x-rate-limit: login
      x-increment: I1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32 }
      responses:
        '200':
          description: Enlace vigente.
          content:
            application/json:
              schema:
                type: object
                required: [email, display_name, expires_at]
                properties:
                  email: { type: string, format: email }
                  display_name: { type: string }
                  expires_at: { type: string, format: date-time }
        '422':
          description: Enlace inválido, caducado o ya usado (`errors[0].field = token`, code INVALID_TOKEN | EXPIRED | USED).
          content:
            application/problem+json:
              schema: { $ref: './common.yaml#/components/schemas/Problem' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /auth/password/reset:
    post:
      tags: [auth]
      operationId: authResetPassword
      summary: Fija una contraseña nueva con un enlace de restablecimiento (un uso; revoca todas las sesiones)
      description: |
        Consume el token, guarda la contraseña (misma política que /me/password), quita el bloqueo por
        intentos fallidos y revoca todas las sesiones de la cuenta (reason password_reset). El 2FA no se toca.
      x-module: auth
      x-scope: public
      x-permission: public
      x-rate-limit: login
      x-increment: I1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string, minLength: 32 }
                new_password: { type: string, writeOnly: true, minLength: 12 }
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Usuario actual, roles de plataforma y membresías con permisos por ISP
      x-module: auth
      x-scope: session
      x-permission: authenticated
      x-increment: I0
      security:
        - sessionBearer: []
        - tenantBearer: []
        - platformBearer: []
      responses:
        '200':
          description: Usuario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Nombre, idioma, zona horaria, tenant por defecto y correo (el correo exige re-autenticación reciente)
      description: |
        Cambiar `email` requiere auth_time de menos de 5 min (403 REAUTH_REQUIRED si no; POST /auth/reauth);
        409 ALREADY_EXISTS si otra cuenta ya usa ese correo. Los demás campos no exigen re-autenticación.
      x-module: auth
      x-scope: session
      x-permission: authenticated
      x-increment: I1
      security:
        - sessionBearer: []
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/MePatch' }
          application/json:
            schema: { $ref: '#/components/schemas/MePatch' }
      responses:
        '200':
          description: Actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /me/password:
    post:
      tags: [me]
      operationId: changeMyPassword
      summary: Cambio de contraseña (revoca las demás sesiones)
      x-module: auth
      x-scope: session
      x-permission: authenticated
      x-increment: I0
      security:
        - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, writeOnly: true }
                new_password: { type: string, writeOnly: true, minLength: 12 }
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /me/totp/enroll:
    post:
      tags: [me]
      operationId: enrollMyTotp
      summary: Inicia el alta de TOTP (devuelve secreto y URI otpauth, una vez)
      description: Adelantado a I1 por D14 (acceso por Internet ⇒ 2FA obligatorio para administradores).
      x-module: auth
      x-scope: session
      x-permission: authenticated
      x-increment: I1
      security:
        - sessionBearer: []
      responses:
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '200':
          description: 'Secreto (solo esta vez; `Cache-Control: no-store`).'
          content:
            application/json:
              schema:
                type: object
                required: [otpauth_uri, secret]
                properties:
                  otpauth_uri: { type: string }
                  secret: { type: string }
  /me/totp/confirm:
    post:
      tags: [me]
      operationId: confirmMyTotp
      summary: Confirma TOTP con un código y devuelve los códigos de recuperación
      x-module: auth
      x-scope: session
      x-permission: authenticated
      x-increment: I1
      security:
        - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 8 }
      responses:
        '200':
          description: 10 códigos de recuperación (solo esta vez).
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string }, minItems: 10, maxItems: 10 }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /permissions:
    get:
      tags: [members]
      operationId: listPermissions
      summary: Catálogo de permisos y roles de sistema (C7)
      x-module: auth
      x-scope: session
      x-permission: authenticated
      x-increment: I0
      security:
        - sessionBearer: []
        - tenantBearer: []
        - platformBearer: []
      responses:
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '200':
          description: 'Catálogo (fuente: packages/schemas/permissions/v0/permissions.yaml).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionCatalog' }
  /members:
    get:
      tags: [members]
      operationId: listMembers
      summary: Miembros del tenant
      x-module: auth
      x-scope: tenant
      x-permission: users.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - $ref: './common.yaml#/components/parameters/IncludeTotal'
        - $ref: './common.yaml#/components/parameters/Q'
        - name: status
          in: query
          schema: { type: string, enum: [active, invited, revoked] }
      responses:
        '200':
          description: Página de miembros.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Member' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [members]
      operationId: inviteMember
      summary: Invita por email con roles iniciales (misma respuesta exista o no el email)
      x-module: auth
      x-scope: tenant
      x-permission: users.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role_assignments]
              properties:
                email: { type: string, format: email }
                role_assignments:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/RoleAssignment' }
      responses:
        '202':
          description: |
            Miembro añadido (cuenta activa existente: `outcome=added`, sin enlace) o invitado
            (`outcome=invited`): el enlace de un solo uso se devuelve a quien invita para que lo
            comparta (compartir nativo o copiar) y, si hay SMTP configurado, también se envía por
            correo (`email_sent`). El token va en el fragmento (#token=…): nunca llega a un servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationIssued' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /members/{user_id}/invitation:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    post:
      tags: [members]
      operationId: reissueMemberInvitation
      summary: Genera un enlace de invitación nuevo para un miembro invitado (invalida los anteriores)
      x-module: auth
      x-scope: tenant
      x-permission: users.manage
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Enlace nuevo (y reenvío por correo si hay SMTP).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationIssued' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /members/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    delete:
      tags: [members]
      operationId: removeMember
      summary: Quita al usuario del tenant (corta su acceso en ≤ 5 s)
      x-module: auth
      x-scope: tenant
      x-permission: users.manage
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    patch:
      tags: [members]
      operationId: updateMember
      summary: Corrige el nombre o el correo de un miembro que solo pertenece a este ISP
      description: |
        La cuenta es global: un administrador del ISP solo puede editarla si no tiene membresías activas en
        otros ISP ni roles de plataforma (409 USER_SHARED si las tiene: lo hace la plataforma). 409
        ALREADY_EXISTS si otra cuenta usa ese correo. Exige re-autenticación reciente y queda auditado.
      x-module: auth
      x-scope: tenant
      x-permission: users.manage
      x-reauth: true
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/MemberPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/MemberPatch' }
      responses:
        '200':
          description: Miembro actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /members/{user_id}/password-reset:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    post:
      tags: [members]
      operationId: resetMemberPassword
      summary: Genera un enlace de restablecimiento de contraseña para un miembro que solo pertenece a este ISP
      description: |
        Enlace de un uso (30 min) a <HORUS_PUBLIC_BASE_URL>/reset-password#token=…, que se muestra una vez y,
        si hay SMTP, también se envía por correo. Invalida los enlaces anteriores sin usar. Las sesiones se
        revocan cuando la persona lo canjea, no al emitirlo. 409 USER_SHARED si la cuenta tiene membresías
        activas en otros ISP o roles de plataforma; 409 CONFLICT si el miembro está invitado (reenvíe la
        invitación) o la cuenta está bloqueada. Anti-escalada: quien lo emite debe tener todos los permisos de
        los roles del miembro.
      x-module: auth
      x-scope: tenant
      x-permission: users.manage
      x-reauth: true
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Enlace emitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetIssued' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /members/{user_id}/role-assignments:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    put:
      tags: [members]
      operationId: replaceMemberRoleAssignments
      summary: Reemplaza las asignaciones (rol, alcance) del miembro
      x-module: auth
      x-scope: tenant
      x-permission: roles.assign
      x-reauth: true
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/RoleAssignment' }
      responses:
        '200':
          description: Asignaciones vigentes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleAssignment' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
  /roles:
    get:
      tags: [members]
      operationId: listRoles
      summary: Roles del tenant (plantillas de sistema + propios)
      x-module: auth
      x-scope: tenant
      x-permission: roles.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Role' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
    post:
      tags: [members]
      operationId: createRole
      summary: Crea un rol propio del ISP (solo permisos de ISP que tenga quien lo crea)
      x-module: auth
      x-scope: tenant
      x-permission: roles.manage
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCreate' }
      responses:
        '201':
          description: Rol creado.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /roles/{role_id}:
    parameters:
      - name: role_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    patch:
      tags: [members]
      operationId: updateRole
      summary: Edita un rol propio (nombre, descripción, permisos); los de sistema no se editan
      x-module: auth
      x-scope: tenant
      x-permission: roles.manage
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolePatch' }
      responses:
        '200':
          description: Rol actualizado.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
    delete:
      tags: [members]
      operationId: deleteRole
      summary: Borra un rol propio sin asignaciones (409 ROLE_IN_USE si alguien lo tiene)
      x-module: auth
      x-scope: tenant
      x-permission: roles.manage
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
  /kiosks:
    get:
      tags: [kiosks]
      operationId: listKiosks
      summary: Kioscos (pantallas NOC) del tenant
      x-module: auth
      x-scope: tenant
      x-permission: kiosks.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
      responses:
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '200':
          description: Página de kioscos.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Kiosk' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
    post:
      tags: [kiosks]
      operationId: createKiosk
      summary: Alta de kiosco
      x-module: auth
      x-scope: tenant
      x-permission: kiosks.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KioskInput' }
      responses:
        '201':
          description: Creado.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kiosk' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /kiosks/{kiosk_id}:
    parameters:
      - $ref: '#/components/parameters/KioskId'
    get:
      tags: [kiosks]
      operationId: getKiosk
      summary: Detalle de kiosco
      x-module: auth
      x-scope: tenant
      x-permission: kiosks.manage
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Kiosco.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kiosk' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    patch:
      tags: [kiosks]
      operationId: updateKiosk
      summary: Edita dashboards/playlist, CIDR, política de datos personales y caducidad
      x-module: auth
      x-scope: tenant
      x-permission: kiosks.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/KioskInput' }
          application/json:
            schema: { $ref: '#/components/schemas/KioskInput' }
      responses:
        '200':
          description: Actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kiosk' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /kiosks/{kiosk_id}/enrollment-codes:
    parameters:
      - $ref: '#/components/parameters/KioskId'
    post:
      tags: [kiosks]
      operationId: createKioskEnrollmentCode
      summary: Código de enrolamiento de un uso (10 min) + URL del QR
      description: '`qr_url` = `<HORUS_PUBLIC_BASE_URL>/kiosk/enroll#code=<código>` (fragmento: no viaja al servidor).'
      x-module: auth
      x-scope: tenant
      x-permission: kiosks.manage
      x-reauth: true
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyRequired'
      responses:
        '201':
          description: Código (solo esta vez; `no-store`).
          content:
            application/json:
              schema:
                type: object
                required: [code, qr_url, expires_at]
                properties:
                  code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{8}$' }
                  qr_url: { type: string, format: uri }
                  expires_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
  /kiosks/{kiosk_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/KioskId'
    post:
      tags: [kiosks]
      operationId: revokeKiosk
      summary: Revocación inmediata (cierra su WebSocket con 4409 en < 5 s)
      x-module: auth
      x-scope: tenant
      x-permission: kiosks.manage
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '200':
          description: Kiosco revocado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kiosk' }
  /kiosk/enroll:
    post:
      tags: [kiosks]
      operationId: kioskEnroll
      summary: Canje del código → cookie de dispositivo
      description: Público, rate limited (5/min por IP; 10 fallos invalidan el código); aplica `allowed_cidrs`.
      x-module: auth
      x-scope: public
      x-permission: public
      x-rate-limit: kiosk_enroll
      x-increment: I1
      security: []
      parameters:
        - $ref: './common.yaml#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{8}$' }
      responses:
        '204':
          description: 'Enrolado; `Set-Cookie: __Secure-hf_kiosk`.'
          headers:
            Set-Cookie: { schema: { type: string } }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /kiosk/token:
    post:
      tags: [kiosks]
      operationId: kioskIssueToken
      summary: Cookie de dispositivo (rotativa) → access JWT de kiosco
      x-module: auth
      x-scope: public
      x-permission: kiosk_cookie
      x-increment: I1
      security:
        - kioskCookie: []
      parameters:
        - $ref: './common.yaml#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: JWT de kiosco (10 min) y cookie rotada.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /api-tokens:
    get:
      tags: [api-tokens]
      operationId: listApiTokens
      summary: API tokens de integración del ISP (sin su valor)
      x-module: auth
      x-scope: tenant
      x-permission: api_tokens.manage
      x-principals: [user]
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Tokens (más recientes primero; incluye revocados y caducados).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ApiToken' } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [api-tokens]
      operationId: createApiToken
      summary: Crea un API token `hf_pat_…` (el valor se muestra una sola vez)
      description: |
        Token opaco `hf_pat_<32 B base62>` ligado a este ISP y a quien lo crea (docs/security.md §5.4). Lleva un
        subconjunto de los permisos **actuales** del creador (por `template` o `permissions`); en cada uso el
        gateway lo canjea por un access token de 2 min con la intersección entre esos permisos y los que el creador
        tenga en ese momento (con sus alcances por nodo). Caducidad por defecto 1 año (máximo 1 año). Solo se guarda
        su SHA-256. Plantilla `argosisp` = código de conexión para ArgosISP (docs/integrations/argosisp.md §1.1).
        Un API token no puede crear ni gestionar API tokens.
      x-module: auth
      x-scope: tenant
      x-permission: api_tokens.manage
      x-principals: [user]
      x-reauth: true
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiTokenInput' }
      responses:
        '201':
          description: Token creado (incluye `token`, que no se vuelve a mostrar).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenIssued' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /api-tokens/{api_token_id}:
    parameters:
      - name: api_token_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    delete:
      tags: [api-tokens]
      operationId: revokeApiToken
      summary: Revoca un API token (deja de servir de inmediato)
      x-module: auth
      x-scope: tenant
      x-permission: api_tokens.manage
      x-principals: [user]
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /api-token-templates:
    get:
      tags: [api-tokens]
      operationId: listApiTokenTemplates
      summary: Plantillas de permisos para API tokens (p. ej. ArgosISP)
      x-module: auth
      x-scope: tenant
      x-permission: api_tokens.manage
      x-principals: [user]
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Plantillas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ApiTokenTemplate' } }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
components:
  securitySchemes:
    tenantBearer: { $ref: './common.yaml#/components/securitySchemes/tenantBearer' }
    sessionBearer: { $ref: './common.yaml#/components/securitySchemes/sessionBearer' }
    platformBearer: { $ref: './common.yaml#/components/securitySchemes/platformBearer' }
    kioskBearer: { $ref: './common.yaml#/components/securitySchemes/kioskBearer' }
    refreshCookie: { $ref: './common.yaml#/components/securitySchemes/refreshCookie' }
    kioskCookie: { $ref: './common.yaml#/components/securitySchemes/kioskCookie' }
  parameters:
    KioskId:
      name: kiosk_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
  schemas:
    AccessTokenResponse:
      type: object
      required: [access_token, token_type, expires_at, scope]
      properties:
        access_token: { type: string, description: 'JWT EdDSA; solo en memoria de la SPA.' }
        token_type: { type: string, const: Bearer }
        expires_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        scope: { type: string, enum: [session, tenant, platform, kiosk] }
        tenant_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
          description: '`tid` del token (solo `scope=tenant` o `kiosk`).'
    MfaChallenge:
      type: object
      required: [mfa_required, mfa_token]
      properties:
        mfa_required: { type: boolean, const: true }
        mfa_token: { type: string }
    Me:
      type: object
      required: [id, email, display_name, platform_roles, platform_permissions, memberships, mfa_enabled, must_change_password]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        email: { type: string, format: email }
        display_name: { type: string }
        locale: { type: [string, 'null'], examples: [es-MX] }
        timezone: { type: [string, 'null'], examples: [America/Mexico_City] }
        default_tenant_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        mfa_enabled: { type: boolean }
        must_change_password: { type: boolean }
        platform_roles:
          type: array
          items: { type: string, enum: [platform_admin, platform_operator, platform_auditor] }
        platform_permissions:
          type: array
          items: { type: string, pattern: '^platform\.' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
    MePatch:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 120 }
        email:
          type: string
          format: email
          maxLength: 254
          description: Correo nuevo (identidad de la cuenta en toda la plataforma). Exige re-autenticación reciente.
        locale: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
        default_tenant_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
    Membership:
      type: object
      required: [tenant_id, tenant_slug, tenant_name, tenant_status, roles, permissions_with_scope]
      properties:
        tenant_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        tenant_slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        tenant_name: { type: string }
        tenant_status: { type: string, enum: [active, suspended, offboarding] }
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleAssignment' }
        permissions_with_scope:
          type: object
          description: 'Permiso → alcances (`["*"]` = todo el tenant; `site:<uuid>`, `router_group:<uuid>`).'
          additionalProperties:
            type: array
            items: { type: string }
          examples:
            - devices.read: ['*']
              customers.kind.write: ['site:0192e111-0000-7000-8000-000000000001']
    RoleAssignment:
      type: object
      required: [role_id, scope]
      properties:
        role_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        role_key: { type: string, examples: [noc] }
        scope:
          type: string
          pattern: '^(tenant|site:[0-9a-f-]{36}|router_group:[0-9a-f-]{36})$'
    InvitationIssued:
      type: object
      required: [outcome, user_id, email_sent]
      properties:
        outcome:
          type: string
          enum: [added, invited]
          description: added = la cuenta ya existía y la membresía queda activa; invited = hay que aceptar el enlace.
        user_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        invitation_url:
          type: [string, 'null']
          format: uri
          description: Solo con outcome=invited. <HORUS_PUBLIC_BASE_URL>/invitation#token=<token>; se muestra una vez.
        expires_at: { type: [string, 'null'], format: date-time }
        email_sent: { type: boolean }
    PasswordResetIssued:
      type: object
      required: [user_id, reset_url, expires_at, email_sent]
      properties:
        user_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        reset_url:
          type: string
          format: uri
          description: <HORUS_PUBLIC_BASE_URL>/reset-password#token=<token>; se muestra una vez (Cache-Control no-store).
        expires_at: { type: string, format: date-time }
        email_sent: { type: boolean }
    MemberPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
    Member:
      type: object
      required: [user_id, display_name, email, status, mfa_enabled, role_assignments, version]
      properties:
        user_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        tenant_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        display_name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, invited, revoked] }
        mfa_enabled: { type: boolean }
        role_assignments:
          type: array
          items: { $ref: '#/components/schemas/RoleAssignment' }
        version: { $ref: './common.yaml#/components/schemas/Version' }
    Role:
      type: object
      required: [id, key, name, is_system, permissions]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        tenant_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        key: { type: string }
        name: { type: string }
        is_system: { type: boolean }
        requires_mfa: { type: boolean }
        permissions: { type: array, items: { type: string } }
        description: { type: [string, 'null'], maxLength: 500 }
        version:
          description: Solo en roles propios (If-Match de PATCH/DELETE); los de sistema no lo traen.
          $ref: './common.yaml#/components/schemas/Version'
        assignments_count: { type: integer, description: Asignaciones activas de este rol en el ISP. }
    RoleCreate:
      type: object
      required: [key, name, permissions]
      additionalProperties: false
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{1,62}$', description: Único en el ISP; no puede coincidir con un rol de sistema. }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 500 }
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, description: Clave de permiso de ISP del catálogo (GET /permissions). }
    RolePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 500 }
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    PermissionCatalog:
      type: object
      required: [version, permissions, roles]
      properties:
        version: { type: string, examples: [v0] }
        permissions:
          type: array
          items:
            type: object
            required: [key, family, description]
            properties:
              key: { type: string }
              family: { type: string, enum: [tenant, platform] }
              description: { type: string }
              personal_data: { type: boolean }
              audited: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    KioskInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        playlist_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        dashboard_ids:
          type: array
          maxItems: 20
          items: { $ref: './common.yaml#/components/schemas/Uuid' }
        allowed_cidrs:
          type: array
          maxItems: 32
          items: { $ref: './common.yaml#/components/schemas/Cidr' }
        show_personal_data: { type: boolean, default: false }
        show_personal_data_reason:
          type: [string, 'null']
          maxLength: 300
          description: Obligatorio (auditado) si `show_personal_data = true`.
        critical_finding_banner: { type: boolean, default: false }
        expires_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    Kiosk:
      allOf:
        - $ref: './common.yaml#/components/schemas/TenantScopedResource'
        - type: object
          required: [name, status, show_personal_data, allowed_cidrs, dashboard_ids, playlist_id, expires_at]
          properties:
            name: { type: string }
            status: { type: string, enum: [pending_enrollment, active, revoked, expired] }
            playlist_id:
              oneOf:
                - $ref: './common.yaml#/components/schemas/Uuid'
                - type: 'null'
            dashboard_ids:
              type: array
              items: { $ref: './common.yaml#/components/schemas/Uuid' }
            allowed_cidrs:
              type: array
              items: { $ref: './common.yaml#/components/schemas/Cidr' }
            cidr_risk: { type: boolean, description: true si no hay `allowed_cidrs` (la UI lo marca como riesgo). }
            show_personal_data: { type: boolean }
            critical_finding_banner: { type: boolean }
            expires_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
            last_seen_at:
              oneOf:
                - $ref: './common.yaml#/components/schemas/Timestamp'
                - type: 'null'
            last_ip: { type: [string, 'null'] }
            frontend_version: { type: [string, 'null'] }
    ApiTokenInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, examples: [ArgosISP] }
        template:
          type: [string, 'null']
          enum: [argosisp, null]
          description: Plantilla de permisos. Si también llega `permissions`, mandan estos.
        permissions:
          type: array
          maxItems: 64
          items: { type: string }
          description: Claves de permiso de tenant que el creador tiene ahora (nunca `api_tokens.manage`).
        expires_at:
          description: Caducidad (≥ 1 h, ≤ 1 año). Por defecto, dentro de un año.
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
    ApiToken:
      type: object
      required: [id, name, prefix, user_id, permissions, template, created_at, expires_at, last_used_at, last_used_ip, revoked_at, active]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        name: { type: string }
        prefix: { type: string, description: 'Primeros caracteres del token (hf_pat_XXXX) para reconocerlo.' }
        user_id:
          $ref: './common.yaml#/components/schemas/Uuid'
          description: Quien lo creó (el token actúa con sus permisos actuales ∩ los del token).
        permissions: { type: array, items: { type: string } }
        template: { type: [string, 'null'] }
        created_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        expires_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        last_used_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        last_used_ip: { type: [string, 'null'], description: IP del último canje (resolución ~2 min). }
        revoked_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        active: { type: boolean }
    ApiTokenIssued:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: '^hf_pat_[0-9A-Za-z]{43}$'
              description: Valor del token. Solo en esta respuesta.
    ApiTokenTemplate:
      type: object
      required: [key, name, description, permissions]
      properties:
        key: { type: string, examples: [argosisp] }
        name: { type: string, examples: [ArgosISP] }
        description: { type: string }
        permissions: { type: array, items: { type: string } }
