# GENERADO: no editar (npm run generate en packages/schemas).
openapi: 3.1.0
info:
  title: Horus Flow API (contrato v0)
  version: 0.1.0
  description: |-
    GENERADO por packages/schemas/tools/contracts-check.mjs --write a partir de las specs de módulo. No editar.
    API pública /api/v1 (docs/api.md). Tenant solo por el claim `tid` del token. Errores RFC 9457, paginación por cursor.
  license:
    name: Propietaria
    identifier: LicenseRef-Horus-Proprietary
servers:
  - url: https://{domain}/api/v1
    description: Host público por instalación (D14, D19, HORUS_PUBLIC_BASE_URL) — dominio propio, subdominio o solo la IP del servidor; siempre HTTPS.
    variables:
      domain:
        default: horus.example.net
        description: Dominio, subdominio o IP literal (modo `ip_only`, p. ej. 203.0.113.10).
tags:
  - name: auth
    description: Sesión y tokens.
  - name: me
    description: Cuenta propia.
  - name: members
    description: Miembros, roles y permisos del tenant.
  - name: kiosks
    description: Kioscos (pantallas NOC) como dispositivos registrados.
  - name: realtime
    description: Tiempo real (WebSocket `wss://<dominio>/api/v1/ws`, subprotocolo `horus.ws.v1`).
  - name: system
    description: Estado del sistema y modos degradados.
  - name: platform
    description: Consola de plataforma (superadministración de la instalación).
  - name: sites
    description: Nodos (sitios) del ISP.
  - name: routers
    description: Routers (el principal de cada nodo exporta los flujos).
  - name: client-prefixes
    description: Qué IPs son de clientes en cada nodo.
  - name: customers
    description: Clientes = IPs observadas (D1).
  - name: onboarding
    description: Script de alta, enrolamiento y script inverso.
  - name: wireguard
    description: Estado de los peers (túneles) del ISP.
  - name: exporters
    description: Exportadores de flujos (router principal de cada nodo).
  - name: traffic
    description: Tops y series de tráfico.
  - name: dashboards
    description: Dashboards, widgets y playlists (D8).
  - name: kiosk
    description: Configuración del kiosco.
  - name: findings
    description: Hallazgos y su ciclo de vida.
  - name: reputation
    description: Feeds de reputación (plataforma) y allowlist (ISP).
  - name: notifications
    description: Canales de notificación del ISP y entregas.
