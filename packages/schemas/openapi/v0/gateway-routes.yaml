    - prefix: /api/v1/kiosks/{kiosk_id}/revoke
      scope: tenant
      methods:
        POST: kiosks.manage
    - prefix: /api/v1/me
      scope: session
      methods:
        GET: authenticated
        PATCH: authenticated
    - prefix: /api/v1/me/password
      scope: session
      methods:
        POST: authenticated
    - prefix: /api/v1/me/totp/confirm
      scope: session
      methods:
        POST: authenticated
    - prefix: /api/v1/me/totp/enroll
      scope: session
      methods:
        POST: authenticated
    - prefix: /api/v1/members
      scope: tenant
      methods:
        GET: users.read
        POST: users.manage
    - prefix: /api/v1/members/{user_id}
      scope: tenant
      methods:
        DELETE: users.manage
    - prefix: /api/v1/members/{user_id}/role-assignments
      scope: tenant
      methods:
        PUT: roles.assign
      reauth:
        - PUT
    - prefix: /api/v1/permissions
      scope: session
      methods:
        GET: authenticated
    - prefix: /api/v1/platform/tenants
      scope: platform
      methods:
        GET: platform.tenants.read
        POST: platform.tenants.manage
      reauth:
        - POST
      idempotency_key_required:
        - POST
    - prefix: /api/v1/platform/tenants/{tenant_id}
      scope: platform
      methods:
        GET: platform.tenants.read
        PATCH: platform.tenants.manage
    - prefix: /api/v1/platform/tenants/{tenant_id}/resume
      scope: platform
      methods:
        POST: platform.tenants.manage
      reauth:
        - POST
    - prefix: /api/v1/platform/tenants/{tenant_id}/suspend
      scope: platform
      methods:
        POST: platform.tenants.manage
      reauth:
