# Tabla de rutas del gateway (C5; docs/api.md §3.1). GENERADA desde las extensiones x-* de las specs de módulo
# con `npm run generate` en packages/schemas; CI comprueba que está al día. Ruta sensible (persona).
version: v0
generated_from: packages/schemas/openapi/v0/*.yaml (x-module, x-scope, x-permission, x-principals, x-reauth, x-rate-limit, x-audited)
defaults:
  principals:
    - user
    - api_token
  timeouts:
    crud: 5s
    action: 15s
    analytics: 30s
  deny_by_default: true
  match: prefijo más específico
  special_permissions:
    public: sin autenticación (rate limit propio)
    authenticated: cualquier token válido del ámbito indicado
    refresh_cookie: "cookie __Secure-hf_rt + X-Requested-With: horus + Origin permitido"
    kiosk_cookie: "cookie __Secure-hf_kiosk + X-Requested-With: horus + allowed_cidrs"
    enrollment_token: token de enrolamiento de un uso en el cuerpo (lo valida wireguard)
    widget_type: required_permission del tipo de widget (lo evalúa analytics) + acceso al dashboard
    dashboard_access: dueño del dashboard o dashboards.manage si es del ISP (lo evalúa analytics)
    kiosk_self: JWT de kiosco; devuelve solo su propia configuración
modules:
  alerts:
    - prefix: /api/v1/notification-channels
      scope: tenant
      methods:
        GET: alerts.read
        POST: alerts.manage
    - prefix: /api/v1/notification-channels/{channel_id}
      scope: tenant
      methods:
        GET: alerts.read
        PATCH: alerts.manage
        DELETE: alerts.manage
    - prefix: /api/v1/notification-channels/{channel_id}/connection-test
      scope: tenant
      methods:
        POST: alerts.manage
      rate_limit: connection_test
    - prefix: /api/v1/notification-channels/{channel_id}/credentials
      scope: tenant
      methods:
        PUT: alerts.manage
      reauth:
        - PUT
      audited:
        - PUT
    - prefix: /api/v1/notification-channels/{channel_id}/test
      scope: tenant
      methods:
        POST: alerts.manage
      idempotency_key_required:
        - POST
    - prefix: /api/v1/notification-deliveries
      scope: tenant
      methods:
        GET: alerts.read
  analytics:
    - prefix: /api/v1/analytics/customers/{customer_id}/traffic
      scope: tenant
      methods:
        GET: traffic.customer.read
      audited:
        - GET
    - prefix: /api/v1/analytics/traffic/attribution
      scope: tenant
      methods:
        GET: traffic.read
    - prefix: /api/v1/analytics/traffic/timeseries
      scope: tenant
      methods:
        GET: traffic.read
    - prefix: /api/v1/analytics/traffic/top
      scope: tenant
      methods:
        GET: traffic.read
    - prefix: /api/v1/dashboards
      scope: tenant
      methods:
        GET: dashboards.read
        POST: dashboards.read
    - prefix: /api/v1/dashboards/{dashboard_id}
      scope: tenant
      methods:
        GET: dashboards.read
        PATCH: dashboard_access
        DELETE: dashboard_access
      principals:
        - user
        - api_token
        - kiosk
    - prefix: /api/v1/dashboards/{dashboard_id}/duplicate
      scope: tenant
      methods:
        POST: dashboards.read
    - prefix: /api/v1/dashboards/{dashboard_id}/layout
      scope: tenant
      methods:
        PUT: dashboard_access
    - prefix: /api/v1/dashboards/{dashboard_id}/widgets
      scope: tenant
      methods:
        POST: dashboard_access
    - prefix: /api/v1/dashboards/{dashboard_id}/widgets/{widget_id}
      scope: tenant
      methods:
        PATCH: dashboard_access
        DELETE: dashboard_access
    - prefix: /api/v1/dashboards/{dashboard_id}/widgets/{widget_id}/data
      scope: tenant
      methods:
        GET: widget_type
      principals:
        - user
        - api_token
        - kiosk
    - prefix: /api/v1/kiosk/config
      scope: tenant
      methods:
        GET: kiosk_self
      principals:
        - kiosk
    - prefix: /api/v1/platform/remote-destinations
      scope: platform
      methods:
        GET: platform.storage.manage
    - prefix: /api/v1/playlists
      scope: tenant
      methods:
        GET: dashboards.read
        POST: dashboards.manage
    - prefix: /api/v1/playlists/{playlist_id}
      scope: tenant
      methods:
        PATCH: dashboards.manage
        DELETE: dashboards.manage
    - prefix: /api/v1/sites/{site_id}/prefix-proposals
      scope: tenant
      methods:
        GET: sites.read
    - prefix: /api/v1/widget-data/preview
      scope: tenant
      methods:
        POST: widget_type
    - prefix: /api/v1/widget-types
      scope: session
      methods:
        GET: authenticated
      principals:
        - user
        - api_token
        - kiosk
  auth:
    - prefix: /api/v1/auth/invitations/accept
      scope: public
      methods:
        POST: public
      rate_limit: login
    - prefix: /api/v1/auth/login
      scope: public
      methods:
