    - prefix: /api/v1/auth/mfa/verify
      scope: public
      methods:
        POST: public
      rate_limit: login
    - prefix: /api/v1/auth/reauth
      scope: session
      methods:
        POST: authenticated
    - prefix: /api/v1/auth/refresh
      scope: public
      methods:
        POST: refresh_cookie
    - prefix: /api/v1/auth/token
      scope: session
      methods:
        POST: authenticated
    - prefix: /api/v1/kiosk/enroll
      scope: public
      methods:
        POST: public
      rate_limit: kiosk_enroll
    - prefix: /api/v1/kiosk/token
      scope: public
      methods:
        POST: kiosk_cookie
    - prefix: /api/v1/kiosks
      scope: tenant
      methods:
        GET: kiosks.manage
        POST: kiosks.manage
    - prefix: /api/v1/kiosks/{kiosk_id}
