    - prefix: /api/v1/reputation/sources
      scope: tenant
      methods:
        GET: security.findings.read
    - prefix: /api/v1/security/summary
      scope: tenant
      methods:
        GET: security.findings.read
      principals:
        - user
        - api_token
        - kiosk
  devices:
    - prefix: /api/v1/client-prefixes/{client_prefix_id}
