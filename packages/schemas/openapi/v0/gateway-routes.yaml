    - prefix: /api/v1/flow-exporters/{router_id}
      scope: tenant
      methods:
        GET: flows.read
    - prefix: /api/v1/platform/exporters/unregistered
      scope: platform
      methods:
        GET: platform.tenants.read
  gateway:
    - prefix: /api/v1/platform/installation
      scope: platform
