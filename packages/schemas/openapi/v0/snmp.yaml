openapi: 3.1.0
info:
  title: Horus Flow API — módulo snmp (contrato v0)
  version: 0.1.0
  description: |
    Monitoreo de routers (EP-08, docs/api.md §2.5–§2.6, docs/architecture.md §10.4): el rol `snmp` sondea cada
    router por el túnel WireGuard (ICMP cada 30 s; SNMPv3 cada 60 s para sistema e interfaces, cada 300 s para
    salud) y mantiene su **estado observado** con razón (`online | warning | critical | degraded | offline`)
    correlacionando ICMP, SNMP, handshake WireGuard y exportador de flujos, con histéresis de 2 observaciones.
    El **estado efectivo** que muestra la consola añade `stale` (última observación con más de 3 intervalos o
    sondeador sin latido: "no sabemos", nunca `offline` por falta de monitoreo), `unknown` (nunca observado) y
    `maintenance` (reservado). Las series históricas las sirve `analytics` (`/analytics/routers/{id}/…`).
    Ausencia de dato = `null`, nunca cero.
  license:
    name: Propietaria
    identifier: LicenseRef-Horus-Proprietary
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: horus.example.net
tags:
  - name: routers-monitoring
    description: Estado observado y métricas en vivo de los routers (SNMP + ICMP por el túnel).
  - name: infra-services
    description: Servicios de infraestructura del ISP (IPTV, HTTP, DNS, RADIUS…) y sus chequeos activos y pasivos.
  - name: switches
    description: |
      Switches de monitoreo (MikroTik RouterOS/SwOS y Huawei serie S) en modo directo: puertos elegidos, uplinks, vecinos
      LLDP, flaps y top sFlow (fuente secundaria).
  - name: capacity
    description: |
      Capacidad de enlaces de subida y salud de los nodos (NOC): utilización y saturación, pérdida/latencia/jitter por
      enlace (sondas netwatch del router, leídas en solo lectura), tráfico local vs internacional y pronóstico de
      crecimiento con fecha estimada de upgrade.
paths:
  /routers/status:
    get:
      tags: [routers-monitoring]
      operationId: listRouterStatus
      summary: Estado efectivo y últimas métricas de cada router (vista NOC de routers)
      description: |
        Una fila por router del ISP (o del nodo) con el estado efectivo, su razón, las señales que lo sostienen
        (ICMP, SNMP, túnel, exportador) y la última muestra (CPU, memoria, temperatura, uptime, latencia, enlace
        de subida). `meta.poller` dice si el sondeador late: sin latido, todo router pasa a `stale`. Apto para
        kioscos (sin datos personales). Orden: problemas primero (critical, offline, degraded, warning, stale),
        después por nombre.
      x-module: snmp
      x-scope: tenant
      x-permission: devices.read
      x-principals: [user, api_token, kiosk]
      x-increment: I2
      security:
        - tenantBearer: []
        - kioskBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/SiteIdFilter'
        - name: status
          in: query
          description: Filtra por estado efectivo (lista separada por comas).
          schema: { type: string, examples: ['offline,critical'] }
      responses:
        '200':
          description: Routers con su estado.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RouterStatus' } }
                  meta:
                    type: object
                    required: [poller, generated_at]
                    properties:
                      poller: { $ref: '#/components/schemas/PollerHealth' }
                      generated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /routers/{router_id}/metrics/live:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    get:
      tags: [routers-monitoring]
      operationId: getRouterLiveMetrics
      summary: Última muestra completa de un router (dispositivo, sensores e interfaces)
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.read
      x-principals: [user, api_token, kiosk]
      x-increment: I2
      security:
        - tenantBearer: []
        - kioskBearer: []
      responses:
        '200':
          description: Última muestra (los campos son null hasta el primer sondeo con éxito).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterLiveMetrics' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /routers/{router_id}/interfaces:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    get:
      tags: [routers-monitoring]
      operationId: listRouterInterfaces
      summary: Interfaces descubiertas por SNMP y cuáles se sondean
      description: |
        Inventario leído de IF-MIB en el último descubrimiento (cada hora y al reconectar). Se sondean las
        físicas (ether, sfp, wlan), VLAN, bridge y bonding; no las dinámicas por cliente (`<pppoe-…>`), cuyo
        consumo sale de los flujos. `uplink` marca la interfaz con más tráfico de subida al exterior, que es
        la que resume el estado del router.
      x-module: snmp
      x-scope: tenant
      x-permission: devices.read
      x-principals: [user, api_token, kiosk]
      x-increment: I2
      security:
        - tenantBearer: []
        - kioskBearer: []
      responses:
        '200':
          description: Interfaces.
          content:
            application/json:
              schema:
                type: object
                required: [data, discovered_at]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RouterInterface' } }
                  discovered_at:
                    oneOf:
                      - $ref: './common.yaml#/components/schemas/Timestamp'
                      - type: 'null'
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /routers/{router_id}/poll:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    post:
      tags: [routers-monitoring]
      operationId: pollRouterNow
      summary: Sondeo inmediato (el resultado llega por WebSocket router.{id}.metrics y en /metrics/live)
      x-module: snmp
      x-scope: tenant
      x-permission: devices.update
      x-audited: true
      x-increment: I2
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyRequired'
      responses:
        '202':
          description: Encolado.
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: boolean }
                  reason:
                    type: [string, 'null']
                    description: Si no se encola (sin túnel, sin credenciales SNMP, sondeador inactivo), por qué.
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /infra-services:
    get:
      tags: [infra-services]
      operationId: listInfraServices
      summary: Servicios de infraestructura del ISP con su estado (IPTV, HTTP, DNS, RADIUS…)
      description: |
        Inventario de los servidores propios del ISP que Horus vigila (no son clientes) con el estado del
        servicio (el peor de sus chequeos), la latencia del último chequeo activo y el último cambio. Los
        usuarios con alcance por nodo solo ven los servicios de sus nodos (los servicios sin nodo exigen
        alcance completo). Máximo 500 servicios por ISP.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.read
      x-increment: I2
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/SiteIdFilter'
      responses:
        '200':
          description: Servicios.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/InfraService' } }
                  meta:
                    type: object
                    required: [scheduler, generated_at]
                    properties:
                      scheduler: { $ref: '#/components/schemas/InfraSchedulerHealth' }
                      generated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
    post:
      tags: [infra-services]
      operationId: createInfraService
      summary: Da de alta un servicio de infraestructura y sus chequeos
      description: |
        Chequeos activos (`icmp`, `tcp`, `http`) desde el rol `snmp` y pasivos desde los flujos (`no_traffic`,
        `ddos_inbound`). `interval_seconds` ≥ 30. Horus solo sondea: nunca escribe en routers ni servidores.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-increment: I2
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InfraServiceInput' }
      responses:
        '201':
          description: Creado (estado `unknown` hasta el primer chequeo).
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfraService' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /infra-services/{service_id}:
    parameters:
      - $ref: '#/components/parameters/InfraServiceId'
    get:
      tags: [infra-services]
      operationId: getInfraService
      summary: Detalle de un servicio con el historial reciente de cada chequeo
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.read
      x-increment: I2
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Servicio (cada chequeo incluye `recent`, los últimos resultados).
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfraService' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    patch:
      tags: [infra-services]
      operationId: updateInfraService
      summary: Edita el servicio (los chequeos se reemplazan como lista; los que conservan `id` mantienen su estado)
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-increment: I2
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/InfraServicePatch' }
          application/json:
            schema: { $ref: '#/components/schemas/InfraServicePatch' }
      responses:
        '200':
          description: Actualizado.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfraService' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
    delete:
      tags: [infra-services]
      operationId: deleteInfraService
      summary: Borra el servicio y su estado (deja de vigilarse; no emite evento)
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-increment: I2
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
  /infra-services/{service_id}/router-snippet:
    parameters:
      - $ref: '#/components/parameters/InfraServiceId'
    get:
      tags: [infra-services]
      operationId: getInfraServiceRouterSnippet
      summary: Script RouterOS para que el ISP haga alcanzable un servidor privado por el túnel (lo pega el usuario)
      description: |
        Para servidores con IP privada (RFC 1918 / ULA / CGNAT) que Horus no alcanza directamente. Genera las
        reglas MikroTik que el **usuario** revisa y pega en el router del nodo (Horus nunca escribe en routers):
        reenvío de cada puerto TCP/HTTP desde la IP de túnel del router hacia el servidor (`dst-nat`),
        `masquerade` de ese tráfico y aceptación en `forward`, todo limitado a la red de servicios de Horus y con
        `comment="horus-infra"`. El servicio debe declarar `probe_via_router_id` (o pasar `router_id`) y cada
        chequeo tcp/http `forward_port`. `horus_side` explica qué cambia en Horus: nada en el hub WireGuard, porque
        el tráfico va a la /32 de túnel del router, que ya está en sus AllowedIPs. ICMP no se puede reenviar.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-increment: I2
      security:
        - tenantBearer: []
      parameters:
        - name: router_id
          in: query
          required: false
          description: Router por el que se accede (por defecto `probe_via_router_id` del servicio).
          schema: { $ref: './common.yaml#/components/schemas/Uuid' }
      responses:
        '200':
          description: Script y notas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfraRouterSnippet' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /routers/thresholds:
    get:
      tags: [routers-monitoring]
      operationId: getRouterThresholds
      summary: Umbrales de CPU, memoria y temperatura de los routers del ISP
      description: |
        Umbrales vigentes (aviso y crítico) con los que el sondeador calcula `warning`/`critical` y las razones
        `cpu_high`, `memory_high` y `temperature_high`. Sin ajustes del ISP (`customized=false`, `version=0`) rigen los
        de la instalación (HORUS_SNMP_*_WARNING/_CRITICAL), que también se devuelven en `defaults`. CPU y memoria deben
        mantenerse `sustained_cycles` ciclos seguidos; la temperatura, uno.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.read
      x-increment: I2
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Umbrales vigentes.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterThresholds' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    put:
      tags: [routers-monitoring]
      operationId: putRouterThresholds
      summary: Fija los umbrales propios del ISP (se aplican en el siguiente ciclo de sondeo)
      description: |
        CPU y memoria entre 1 y 100 %, temperatura entre 20 y 150 °C; el aviso no puede superar al crítico (`422`).
        `If-Match` opcional (ETag de la lectura; no coincide → `412`). Sin PostgreSQL en el rol snmp → `503`. Auditado
        (`snmp.thresholds.updated`, antes y después). Horus no escribe nada en los routers: solo cambia cómo evalúa sus
        métricas.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-audited: true
      x-increment: I2
      security:
        - tenantBearer: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string, examples: ['"3"'] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouterThresholdValues' }
      responses:
        '200':
          description: Umbrales guardados.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterThresholds' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
    delete:
      tags: [routers-monitoring]
      operationId: resetRouterThresholds
      summary: Vuelve a los umbrales de la instalación
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-audited: true
      x-increment: I2
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Umbrales de la instalación (customized=false).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterThresholds' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /capacity/overview:
    get:
      tags: [capacity]
      operationId: getCapacityOverview
      summary: Capacidad y salud de los nodos (enlaces de subida, sondas, pronósticos)
      description: |
        Vista NOC de capacidad: un bloque por nodo con su **salud explicable** (enlaces caídos, saturación, pérdida,
        latencia, routers y servicios de infraestructura; siempre con razones) y la tabla de sus enlaces de subida (el
        detectado por el sondeador y los configurados): utilización en vivo sobre la capacidad (contratada o, si no,
        velocidad del puerto), p95 y horas sobre el 70 / 85 % de la ventana (`days`, últimos días completos + hoy al
        vuelo), diagnóstico lleno/averiado, pérdida/latencia/jitter de la sonda de su puerta de enlace, condiciones
        sostenidas vigentes y el último pronóstico. `egress` es la salida internacional agregada (solo con alcance
        completo) y `horus_probes` las sondas de respaldo «ruta Horus → destino» (no miden un enlace del ISP). Sin
        datos personales. Las razones de salud y las recomendaciones van en español.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.read
      x-increment: I3
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/CapacitySiteId'
        - name: days
          in: query
          description: Ventana en días para p95, horas sobre umbral y diagnóstico (1–30).
          schema: { type: integer, minimum: 1, maximum: 30, default: 7 }
      responses:
        '200':
          description: Nodos con su capacidad.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityOverview' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /capacity/egress:
    get:
      tags: [capacity]
      operationId: getCapacityEgress
      summary: Detalle de la salida internacional agregada (serie diaria y pronóstico)
      description: |
        Suma de los enlaces marcados `international_egress`: pico diario (p95 de la suma intervalo a intervalo), capacidad
        agregada y pronóstico con proyección. Solo con alcance completo del ISP (`404` con alcance por nodo o sin
        enlaces marcados).
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.read
      x-increment: I3
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/CapacityDays'
      responses:
        '200':
          description: Serie y pronóstico.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacitySubjectDetail' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /capacity/uplinks/{interface_id}:
    parameters:
      - $ref: '#/components/parameters/InterfaceId'
    get:
      tags: [capacity]
      operationId: getCapacityUplink
      summary: Detalle de un enlace de subida (serie diaria, pronóstico y sondas)
      description: |
        Serie de picos diarios (p95 rx/tx, horas sobre umbral, errores, descartes) de los últimos `days` días, el último
        pronóstico con su banda de proyección (12 meses) y la serie horaria de la sonda de su puerta de enlace. Las series
        de bits/s por minuto las sirve analytics (`getRouterInterfaceMetrics`). Un enlace de otro ISP o fuera del
        alcance → `404`.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.read
      x-increment: I3
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/CapacityDays'
      responses:
        '200':
          description: Detalle del enlace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacitySubjectDetail' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    put:
      tags: [capacity]
      operationId: putCapacityUplink
      summary: Configura un enlace de subida (proveedor, tipo, capacidad contratada, salida internacional)
      description: |
        La interfaz debe ser de un router sondeado del ISP (`router_id` es su router) y estar en el alcance del usuario;
        si no → `404 UPLINK_NOT_FOUND`. Una interfaz configurada cuenta como enlace de subida aunque el sondeador no la
        haya elegido. `contracted_bps` (bits/s) puede ser menor que la velocidad del puerto; si falta se usa la
        velocidad. `international_egress` por defecto es `true` solo para `international_transit`. `If-Match` opcional
        (`412`). Máximo 500 enlaces configurados por ISP (`409 UPLINK_LIMIT_REACHED`). Sin PostgreSQL → `503`. Auditado
        (`snmp.uplink_config.updated`, antes y después). Horus no escribe nada en el router.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string, examples: ['"2"'] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UplinkConfigInput' }
      responses:
        '200':
          description: Configuración guardada.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UplinkConfig' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
    delete:
      tags: [capacity]
      operationId: deleteCapacityUplink
      summary: Quita la configuración de un enlace (vuelve a solo detección)
      description: Auditado (`snmp.uplink_config.deleted`). Sin configuración → `404`.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /capacity/settings:
    get:
      tags: [capacity]
      operationId: getCapacitySettings
      summary: Umbrales de capacidad, país para el tráfico local, ASN locales y sondas de respaldo
      description: |
        Sin ajustes del ISP (`customized=false`, `version=0`) rigen los valores por defecto (también en `defaults`):
        planificación 80 %, urgente 90 %, antelación 90 días, saturación 70 / 85 % sostenida 15 min, pérdida 1 / 5 %,
        latencia 80 / 200 ms. `effective_country` es `country` si se fijó y, si no, el país del ISP (`tenant_country`).
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.read
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Ajustes vigentes.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacitySettings' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    put:
      tags: [capacity]
      operationId: putCapacitySettings
      summary: Fija los ajustes de capacidad del ISP
      description: |
        Proporciones entre 0,3 y 1; planificación ≤ urgente, aviso ≤ crítico (`422`). `probe_targets`: hasta 10 IPv4
        públicas que Horus sondea desde su host («ruta Horus → destino»); las redes internas de la instalación se
        rechazan. `local_asns`: hasta 200 (IXP, cachés on-net). `If-Match` opcional (`412`). Sin PostgreSQL → `503`.
        Auditado (`snmp.capacity_settings.updated`).
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string, examples: ['"3"'] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapacitySettingsValues' }
      responses:
        '200':
          description: Ajustes guardados.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacitySettings' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
    delete:
      tags: [capacity]
      operationId: resetCapacitySettings
      summary: Vuelve a los ajustes de capacidad por defecto
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Ajustes por defecto (customized=false).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacitySettings' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /capacity/traffic-split:
    get:
      tags: [capacity]
      operationId: getCapacityTrafficSplit
      summary: Tráfico remoto local vs internacional por nodo y por día
      description: |
        Volumen remoto (`flows.site_1d`, días UTC) clasificado por el ASN remoto: **local** si está en `local_asns` del
        ISP o su organización es del país efectivo; **internacional** si es de otro país; **desconocido** sin ASN o sin
        país (no entra en las proporciones). Sin país (`country_source=none`) solo la lista local cuenta como local.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.read
      x-increment: I3
      security:
        - tenantBearer: []
      parameters:
        - $ref: '#/components/parameters/CapacitySiteId'
        - name: days
          in: query
          description: Días completos (1–90).
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '200':
          description: Reparto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficSplitReport' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /routers/{router_id}/netwatch-snippet:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    get:
      tags: [capacity]
      operationId: getRouterNetwatchSnippet
      summary: Script RouterOS de sondas netwatch por enlace (lo pega el usuario; Horus solo lo lee)
      description: |
        Sondas ICMP de `/tool netwatch` (RouterOS v7) hacia la puerta de enlace del proveedor de cada enlace de subida del
        router (`{GATEWAY_n}`: el usuario completa la IP en la consola antes de copiar; nunca viaja en la URL) y hacia
        referencias internacionales (1.1.1.1, 8.8.8.8), con `comment="horus-uplink;…"` y sin scripts. Horus **nunca
        escribe en el router**: las lee cada minuto con el usuario de solo lectura por la API REST (huella TLS ya
        fijada). `probes_error` dice por qué no se pudieron leer (`no_api_credential`, `tls_fingerprint_not_pinned`,
        `auth_failed`, `unreachable`…).
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Script y estado de la lectura.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetwatchSnippet' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /switches/status:
    get:
      tags: [switches]
      operationId: listSwitchStatus
      summary: Estado efectivo y resumen de puertos de cada switch (lista «Switches» por nodo)
      description: |
        Una fila por switch de monitoreo (`device_type=switch`) con el mismo estado efectivo que los routers (ICMP + SNMP
        por la dirección de gestión) y el resumen de puertos: monitoreados, uplinks (caídos), puertos inestables (≥ 4
        cambios de estado en la última hora) y vecinos LLDP. `/routers/status` no incluye switches. Apto para kioscos.
      x-module: snmp
      x-scope: tenant
      x-permission: devices.read
      x-principals: [user, api_token, kiosk]
      x-increment: I3
      security:
        - tenantBearer: []
        - kioskBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/SiteIdFilter'
      responses:
        '200':
          description: Switches con su estado.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SwitchStatus' } }
                  meta:
                    type: object
                    required: [poller, generated_at]
                    properties:
                      poller: { $ref: '#/components/schemas/PollerHealth' }
                      generated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /switches/{router_id}/ports:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    get:
      tags: [switches]
      operationId: listSwitchPorts
      summary: Puertos del switch con su elección, última muestra, flaps y vecino LLDP
      description: |
        Puertos físicos y agregados del último descubrimiento IF-MIB (nombre, ifAlias, velocidad, estado administrativo y
        operativo), si se sondean (`monitored`, máximo `max_ports` por switch) y si son de subida (`uplink`), el uplink
        sugerido (`suggested_uplink`: su vecino LLDP es un router o switch de Horus), los cambios de estado de la última
        hora y del día y la última muestra (tráfico, utilización, errores, descartes). Sin elección del operador
        (`selection.configured=false`) rige la de por defecto: uplinks sugeridos + puertos con descripción.
      x-module: snmp
      x-scope: tenant
      x-permission: devices.read
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Puertos.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitchPorts' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    put:
      tags: [switches]
      operationId: putSwitchPorts
      summary: Elige los puertos a monitorear y marca los uplinks
      description: |
        Sustituye la elección: los puertos listados se sondean cada intervalo (máximo 64: cardinalidad de las series) y
        `uplink=true` los marca de subida (entran en el análisis de capacidad y avisan si caen o se vuelven inestables).
        Un puerto que no existe en el último descubrimiento → 422. Con `If-Match` (ETag de GET) una edición concurrente
        → 412. Se aplica en caliente.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string, examples: ['"3"'] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchPortSelectionInput' }
      responses:
        '200':
          description: Elección guardada.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitchPorts' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
    delete:
      tags: [switches]
      operationId: resetSwitchPorts
      summary: Vuelve a la elección de puertos por defecto
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.manage
      x-audited: true
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Puertos con la elección por defecto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitchPorts' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /switches/{router_id}/neighbors:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    get:
      tags: [switches]
      operationId: listSwitchNeighbors
      summary: Vecinos LLDP del switch (solo lectura)
      description: |
        LLDP-MIB (`lldpRemTable`, `lldpRemManAddrTable`) y, si no publica filas, la tabla de vecinos de MIKROTIK-MIB
        (`mtxrNeighborTable`, `source=mndp`). `known_device` es el router o switch de Horus reconocido por nombre de
        sistema o dirección de gestión. SwOS no tiene LLDP (lista vacía).
      x-module: snmp
      x-scope: tenant
      x-permission: devices.read
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Vecinos.
          content:
            application/json:
              schema:
                type: object
                required: [data, discovered_at]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SwitchNeighbor' } }
                  discovered_at: { $ref: '#/components/schemas/NullableTimestamp' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /switches/{router_id}/flows/top:
    parameters:
      - $ref: '#/components/parameters/RouterId'
    get:
      tags: [switches]
      operationId: getSwitchFlowTop
      summary: Top de IP y protocolos por puerto a partir del sFlow del switch (fuente secundaria)
      description: |
        Lee `flows.switch_samples`: las muestras sFlow del switch (`sflow_enabled`), que **nunca** se suman al tráfico de
        clientes ni de nodos (salen de los flujos del router) ni crean clientes (docs/traffic-model.md §13). Bytes y
        paquetes escalados por la tasa de muestreo. Las IP solo viajan en la respuesta, nunca en la URL. Sin ClickHouse
        → 503.
      x-module: snmp
      x-scope: tenant
      x-permission: snmp.read
      x-increment: I3
      security:
        - tenantBearer: []
      parameters:
        - name: by
          in: query
          schema: { type: string, enum: [src_ip, dst_ip, protocol], default: src_ip }
        - name: if_index
          in: query
          description: Puerto de entrada (ifIndex); 0 o ausente = todo el switch.
          schema: { type: integer, minimum: 0 }
        - name: window_minutes
          in: query
          schema: { type: integer, minimum: 5, maximum: 10080, default: 60 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Top.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SwitchFlowTop' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    tenantBearer: { $ref: './common.yaml#/components/securitySchemes/tenantBearer' }
    kioskBearer: { $ref: './common.yaml#/components/securitySchemes/kioskBearer' }
  parameters:
    InfraServiceId:
      name: service_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    RouterId:
      name: router_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    InterfaceId:
      name: interface_id
      in: path
      required: true
      description: interface_id estable (UUIDv5 del router y el nombre de la interfaz).
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    CapacitySiteId:
      name: site_id
      in: query
      required: false
      description: Un nodo (dentro del alcance del usuario).
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    CapacityDays:
      name: days
      in: query
      required: false
      description: Días de la serie diaria (7–365).
      schema: { type: integer, minimum: 7, maximum: 365, default: 90 }
  schemas:
    SwitchStatus:
      allOf:
        - $ref: '#/components/schemas/RouterStatus'
        - type: object
          required: [platform, sflow_enabled, ports_monitored, uplinks, uplinks_down, ports_flapping, neighbors_count]
          properties:
            platform: { type: string, enum: [routeros, swos, vrp] }
            sflow_enabled: { type: boolean }
            ports_monitored: { type: integer }
            uplinks: { type: integer }
            uplinks_down: { type: integer }
            ports_flapping: { type: integer, description: Puertos con ≥ 4 cambios de estado operativo en la última hora. }
            neighbors_count: { type: integer }
    SwitchNeighbor:
      type: object
      required: [local_if_index, local_port, sys_name, port_id, port_desc, chassis_id, mgmt_address, platform, source, known_device]
      properties:
        local_if_index: { type: integer, description: ifIndex del puerto local (0 si no se pudo traducir). }
        local_port: { type: string }
        sys_name: { type: string, examples: [rt-core-1] }
        port_id: { type: string, examples: [sfp-sfpplus1] }
        port_desc: { type: string }
        chassis_id: { type: string, examples: ['48:8F:5A:11:22:33'] }
        mgmt_address: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        source: { type: string, enum: [lldp, mndp] }
        known_device: { type: [string, 'null'], description: Router o switch de Horus que es el vecino. }
    SwitchPort:
      type: object
      required: [interface_id, if_index, name, alias, type, speed_bps, admin_up, oper_status, monitored, uplink, suggested_uplink, flaps_1h,
        flaps_24h, last_change_at, sample, neighbors]
      properties:
        interface_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        if_index: { type: integer }
        name: { type: string, examples: [XGigabitEthernet0/0/1, sfp-sfpplus1, Port3] }
        alias: { type: [string, 'null'] }
        type: { type: string }
        speed_bps: { type: [integer, 'null'] }
        admin_up: { type: [boolean, 'null'] }
        oper_status: { oneOf: [{ $ref: '#/components/schemas/InterfaceOperStatus' }, { type: 'null' }] }
        monitored: { type: boolean }
        uplink: { type: boolean }
        suggested_uplink: { type: boolean }
        flaps_1h: { type: integer }
        flaps_24h: { type: integer }
        last_change_at: { $ref: '#/components/schemas/NullableTimestamp' }
        sample: { oneOf: [{ $ref: '#/components/schemas/InterfaceSample' }, { type: 'null' }] }
        neighbors: { type: array, items: { $ref: '#/components/schemas/SwitchNeighbor' } }
    SwitchPorts:
      type: object
      required: [router_id, platform, interval_seconds, max_ports, monitored_count, selection, discovered_at, neighbors_at, data]
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        platform: { type: string, enum: [routeros, swos, vrp] }
        interval_seconds: { type: integer }
        max_ports: { type: integer, examples: [64] }
        monitored_count: { type: integer }
        selection:
          type: object
          required: [configured, version, updated_at, updated_by]
          properties:
            configured: { type: boolean, description: false = elección por defecto. }
            version: { type: [integer, 'null'] }
            updated_at: { $ref: '#/components/schemas/NullableTimestamp' }
            updated_by: { type: [string, 'null'] }
        discovered_at: { $ref: '#/components/schemas/NullableTimestamp' }
        neighbors_at: { $ref: '#/components/schemas/NullableTimestamp' }
        data: { type: array, items: { $ref: '#/components/schemas/SwitchPort' } }
    SwitchPortSelectionInput:
      type: object
      additionalProperties: false
      required: [ports]
      properties:
        ports:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, maxLength: 128, description: ifName del puerto. }
              uplink: { type: boolean, default: false }
    SwitchFlowTop:
      type: object
      required: [router_id, by, if_index, from, to, total_bytes, samples, sflow_enabled, source, data]
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        by: { type: string, enum: [src_ip, dst_ip, protocol] }
        if_index: { type: [integer, 'null'] }
        from: { $ref: './common.yaml#/components/schemas/Timestamp' }
        to: { $ref: './common.yaml#/components/schemas/Timestamp' }
        total_bytes: { type: string, description: Entero decimal (UInt64). }
        samples: { type: string }
        sflow_enabled: { type: boolean }
        source: { type: string, enum: [secondary], description: Siempre fuente secundaria (no suma a clientes ni nodos). }
        data:
          type: array
          items:
            type: object
            required: [key, bytes, packets]
            properties:
              key: { type: string, description: 'IP (src_ip/dst_ip) o «protocolo/puerto» (protocol, p. ej. 6/443).' }
              bytes: { type: string }
              packets: { type: string }
    RouterEffectiveStatus:
      type: string
      description: |
        Estado efectivo (api.md §2.6). `stale` = la observación es vieja o el sondeador no late; `unknown` = nunca observado;
        `unreachable` = switch vía router con el túnel de su router del sitio caído (ADR-0032).
      enum: [online, warning, critical, degraded, offline, unreachable, stale, unknown, maintenance]
    RouterObservedState:
      type: string
      description: '`unreachable` solo en switches vía router (ADR-0032) cuyo router del sitio tiene el túnel caído (razón `via_router_tunnel_down`): no es un fallo del switch.'
      enum: [online, warning, critical, degraded, offline, unreachable]
    RouterStateReason:
      type: string
      description: |
        Enum abierto (events.md §8.4). `interface_flapping` solo en switches (uplink inestable). `via_router_tunnel_down`:
        switch vía router cuyo router del sitio tiene el túnel caído (estado `unreachable`).
      examples: [ok, cpu_high, memory_high, temperature_high, snmp_unreachable, snmp_auth_failed, tunnel_down, host_unreachable_via_tunnel, exporter_silent, interface_down, interface_flapping, psu_failed, fan_failed, via_router_tunnel_down]
    RouterSignals:
      type: object
      description: Las señales que sostienen el estado; `unknown` mientras no haya observación.
      required: [icmp, snmp, wireguard, exporter]
      properties:
        icmp: { type: string, enum: [ok, fail, unknown] }
        snmp: { type: string, enum: [ok, fail, auth_failed, unknown] }
        wireguard: { type: string, enum: [ok, stale, never, unknown] }
        exporter:
          type: [string, 'null']
          description: Estado del exportador de flujos (flows.yaml FlowExporterState) o null si no aplica.
    RouterDeviceSample:
      type: object
      description: Última muestra del dispositivo. Cada campo es null si el sondeo no lo obtuvo (modelo sin sensor, OID ausente).
      required: [sampled_at]
      properties:
        sampled_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        poll_duration_ms: { type: [integer, 'null'] }
        uptime_seconds: { type: [integer, 'null'] }
        cpu_percent: { type: [number, 'null'], description: Media de los núcleos. }
        cpu_max_core_percent: { type: [number, 'null'], description: Núcleo más cargado (Traffic Flow carga uno). }
        cpu_cores: { type: [integer, 'null'] }
        memory_percent: { type: [number, 'null'] }
        memory_used_bytes:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uint64String'
            - type: 'null'
        memory_total_bytes:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uint64String'
            - type: 'null'
        temperature_celsius: { type: [number, 'null'], description: Placa (mtxrHlTemperature). }
        cpu_temperature_celsius: { type: [number, 'null'] }
        voltage: { type: [number, 'null'] }
        firmware: { type: [string, 'null'], examples: ['7.16.2'] }
        model: { type: [string, 'null'], examples: ['CCR2116-12G-4S+'] }
        serial_number: { type: [string, 'null'] }
        icmp_rtt_ms: { type: [number, 'null'] }
        icmp_loss_ratio: { type: [number, 'null'], minimum: 0, maximum: 1 }
        sensors:
          type: array
          description: Sensores propios del fabricante (mtxrGaugeTable) tal cual los expone.
          items:
            type: object
            required: [name, value]
            properties:
              name: { type: string }
              value: { type: number }
              unit: { type: [string, 'null'] }
    RouterUplink:
      type: object
      description: Interfaz que resume el tráfico del router (la de más subida hacia fuera; `flow_role` upstream si está marcado).
      required: [interface_id, name]
      properties:
        interface_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        name: { type: string }
        rx_bps: { type: [number, 'null'] }
        tx_bps: { type: [number, 'null'] }
        speed_bps: { type: [integer, 'null'] }
        utilization: { type: [number, 'null'], minimum: 0, maximum: 1, description: 'max(rx, tx) / velocidad.' }
    RouterThresholdHit:
      type: object
      required: [metric, level, value, threshold]
      properties:
        metric: { type: string, enum: [cpu_percent, cpu_max_core_percent, memory_percent, temperature_celsius, cpu_temperature_celsius, interface_errors, interface_down] }
        level: { type: string, enum: [warning, critical] }
        value: { type: number }
        threshold: { type: number }
        interface_name: { type: [string, 'null'] }
    RouterStatus:
      type: object
      required: [router_id, site_id, name, site_name, status, observed_state, reason, since, last_observed_at, signals, device, uplink, interfaces_up, interfaces_total, thresholds, last_flow_at]
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        site_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        name: { type: string }
        site_name: { type: string }
        status: { $ref: '#/components/schemas/RouterEffectiveStatus' }
        observed_state:
          oneOf:
            - $ref: '#/components/schemas/RouterObservedState'
            - type: 'null'
        reason:
          oneOf:
            - $ref: '#/components/schemas/RouterStateReason'
            - type: 'null'
        since:
          description: Desde cuándo está en el estado efectivo actual.
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        last_observed_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        signals: { $ref: '#/components/schemas/RouterSignals' }
        device: { $ref: '#/components/schemas/RouterDeviceSample' }
        uplink:
          oneOf:
            - $ref: '#/components/schemas/RouterUplink'
            - type: 'null'
        interfaces_up: { type: [integer, 'null'] }
        interfaces_total: { type: [integer, 'null'] }
        thresholds: { type: array, items: { $ref: '#/components/schemas/RouterThresholdHit' } }
        last_flow_at:
          description: Último flujo recibido del exportador de flujos del router (estado del collector leído en el último sondeo; null = nunca).
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        connection_mode:
          type: string
          enum: [wireguard, ipsec, gre, direct]
          description: Transporte del router con Horus (docs/tunnels.md). Ausente en filas anteriores al campo.
        protection_level:
          type: string
          enum: [encrypted, unencrypted_private, unencrypted_internet]
          description: Nivel de protección del transporte; el NOC marca los que no cifran.
        device_type:
          type: string
          enum: [switch]
          description: '`switch` en las filas de switches (GET /switches/status); ausente en los routers.'
    PollerHealth:
      type: object
      required: [healthy, last_cycle_at, interval_seconds, targets]
      properties:
        healthy: { type: boolean, description: El sondeador late (último ciclo hace menos de 3 intervalos). }
        last_cycle_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        interval_seconds: { type: integer, description: Intervalo del sondeo de sistema e interfaces (60 por defecto). }
        targets: { type: integer, description: Routers que este ISP tiene en sondeo (con túnel y credenciales SNMP). }
        enabled: { type: boolean, default: true, description: false si HORUS_SNMP_ENABLED=false en la instalación. }
    InterfaceOperStatus:
      type: string
      enum: [up, down, testing, unknown, dormant, not_present, lower_layer_down]
    RouterInterface:
      type: object
      required: [id, if_index, name, alias, type, speed_bps, monitored, uplink, oper_status, admin_up, last_seen_at]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        if_index: { type: integer }
        name: { type: string, examples: ['sfp-sfpplus1'] }
        alias: { type: [string, 'null'], examples: ['UPLINK-TRANSIT-A'] }
        type: { type: string, description: 'ifType como nombre IANA: ethernetCsmacd, l2vlan, bridge, ieee8023adLag, ppp, tunnel, other.' }
        speed_bps: { type: [integer, 'null'] }
        monitored: { type: boolean, description: Se sondean sus contadores cada intervalo. }
        uplink: { type: boolean }
        oper_status:
          oneOf:
            - $ref: '#/components/schemas/InterfaceOperStatus'
            - type: 'null'
        admin_up: { type: [boolean, 'null'] }
        last_seen_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
    InterfaceSample:
      type: object
      description: Última muestra de una interfaz sondeada. Tasas null en el primer sondeo o tras una discontinuidad de contador.
      required: [interface_id, if_index, name, oper_status, rx_bps, tx_bps]
      properties:
        interface_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        if_index: { type: integer }
        name: { type: string }
        alias: { type: [string, 'null'] }
        uplink: { type: boolean, default: false }
        oper_status:
          oneOf:
            - $ref: '#/components/schemas/InterfaceOperStatus'
            - type: 'null'
        speed_bps: { type: [integer, 'null'] }
        rx_bps: { type: [number, 'null'] }
        tx_bps: { type: [number, 'null'] }
        rx_pps: { type: [number, 'null'] }
        tx_pps: { type: [number, 'null'] }
        rx_errors_delta: { type: [integer, 'null'] }
        tx_errors_delta: { type: [integer, 'null'] }
        rx_drops_delta: { type: [integer, 'null'] }
        tx_drops_delta: { type: [integer, 'null'] }
        utilization_rx: { type: [number, 'null'], minimum: 0, maximum: 1 }
        utilization_tx: { type: [number, 'null'], minimum: 0, maximum: 1 }
        counter_discontinuity: { type: boolean, default: false }
    RouterLiveMetrics:
      type: object
      required: [status, interfaces, interval_seconds]
      properties:
        status: { $ref: '#/components/schemas/RouterStatus' }
        interval_seconds: { type: integer }
        interfaces: { type: array, items: { $ref: '#/components/schemas/InterfaceSample' } }
    InfraServiceState:
      type: string
      description: Estado de un servicio o chequeo. `degraded` = responde pero con un problema (p. ej. `ddos_inbound`).
      enum: [up, down, degraded, unknown]
    InfraCheckType:
      type: string
      description: |
        `icmp` (ping), `tcp` (conexión al puerto), `http` (GET con estado esperado; no se guarda el cuerpo) — activos,
        desde el rol `snmp`. `no_traffic` (bytes hacia/desde el objetivo en la ventana por debajo del mínimo, solo si
        antes tuvo tráfico) y `ddos_inbound` (pps/bps entrantes por encima del umbral → `degraded`) — pasivos, desde
        los flujos.
      enum: [icmp, tcp, http, no_traffic, ddos_inbound]
    InfraCheck:
      type: object
      description: Un chequeo. Solo se aceptan los campos de su `type`; `id` lo asigna el servidor y se conserva al editar.
      required: [type]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/InfraCheckType' }
        port: { type: [integer, 'null'], minimum: 1, maximum: 65535, description: 'tcp y http (http: 80/443 por defecto).' }
        path: { type: [string, 'null'], maxLength: 256, description: 'http; ruta absoluta, por defecto /.' }
        https: { type: [boolean, 'null'], description: http. }
        tls_verify: { type: [boolean, 'null'], description: 'http con https; por defecto true.' }
        expected_status_min: { type: [integer, 'null'], minimum: 100, maximum: 599, description: 'http; por defecto 200.' }
        expected_status_max: { type: [integer, 'null'], minimum: 100, maximum: 599, description: 'http; por defecto 399.' }
        forward_port:
          type: [integer, 'null']
          minimum: 1
          maximum: 65535
          description: tcp y http con `probe_via_router_id`; puerto de la IP de túnel del router que reenvía a `port` del servidor.
        window_minutes: { type: [integer, 'null'], minimum: 5, maximum: 1440, description: 'no_traffic; por defecto 15.' }
        min_bytes: { type: [integer, 'null'], minimum: 1, description: 'no_traffic; por defecto 1.' }
        pps_threshold: { type: [number, 'null'], exclusiveMinimum: 0, description: 'ddos_inbound (al menos uno de los dos umbrales).' }
        bps_threshold: { type: [number, 'null'], exclusiveMinimum: 0, description: ddos_inbound. }
    InfraCheckResult:
      type: object
      required: [at, state, latency_ms, reason]
      properties:
        at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        state: { $ref: '#/components/schemas/InfraServiceState' }
        latency_ms: { type: [number, 'null'] }
        reason: { type: [string, 'null'] }
    InfraCheckStatus:
      type: object
      description: Estado actual de un chequeo con histéresis (`failures_before_down` fallos seguidos → down; `recoveries_before_up` éxitos → up).
      required: [check_id, type, state, reason, since, last_checked_at, latency_ms, consecutive_failures, consecutive_successes, detail]
      properties:
        check_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/InfraCheckType' }
        state: { $ref: '#/components/schemas/InfraServiceState' }
        reason:
          type: [string, 'null']
          description: 'Enum abierto: ok, timeout, refused, unreachable, tls_error, http_status, no_traffic, ddos_inbound, no_flow_data, icmp_unavailable, router_unavailable…'
        since:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        last_checked_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        latency_ms: { type: [number, 'null'] }
        consecutive_failures: { type: integer, minimum: 0 }
        consecutive_successes: { type: integer, minimum: 0 }
        detail:
          type: [string, 'null']
          description: 'Medida del último resultado sin datos sensibles (p. ej. "HTTP 503", "1250 pps entrantes").'
        recent:
          type: array
          description: Solo en el detalle (GET /infra-services/{id}); últimos resultados, el más reciente primero.
          items: { $ref: '#/components/schemas/InfraCheckResult' }
    InfraServiceStatus:
      type: object
      description: Estado del servicio = el peor de sus chequeos conocidos (down > degraded > up); `unknown` solo si ningún chequeo tiene estado todavía.
      required: [state, reason, check_type, since]
      properties:
        state: { $ref: '#/components/schemas/InfraServiceState' }
        reason: { type: [string, 'null'] }
        check_type:
          description: Chequeo que determina el estado (null si todos están up o no hay chequeos).
          oneOf:
            - $ref: '#/components/schemas/InfraCheckType'
            - type: 'null'
        since:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
    InfraService:
      allOf:
        - $ref: './common.yaml#/components/schemas/TenantScopedResource'
        - type: object
          required: [name, site_id, target, target_private, kind, checks, interval_seconds, failures_before_down, recoveries_before_up, enabled, probe_via_router_id, status, check_status]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            site_id:
              oneOf:
                - $ref: './common.yaml#/components/schemas/Uuid'
                - type: 'null'
            target:
              $ref: './common.yaml#/components/schemas/IpAddress'
              description: IP del servidor del ISP (infraestructura propia, no de un cliente).
            target_private: { type: boolean, description: 'RFC 1918 / ULA / CGNAT: puede necesitar el script de router.' }
            kind:
              type: string
              description: Etiqueta libre (iptv | http | dns | radius | other | …).
              examples: [iptv, http, dns, radius, other]
            checks: { type: array, items: { $ref: '#/components/schemas/InfraCheck' } }
            interval_seconds: { type: integer, minimum: 30, maximum: 3600 }
            failures_before_down: { type: integer, minimum: 1, maximum: 20 }
            recoveries_before_up: { type: integer, minimum: 1, maximum: 20 }
            enabled: { type: boolean }
            probe_via_router_id:
              description: Si se fija, los chequeos tcp/http van a la IP de túnel de ese router en `forward_port` (servidor privado con reenvío).
              oneOf:
                - $ref: './common.yaml#/components/schemas/Uuid'
                - type: 'null'
            status: { $ref: '#/components/schemas/InfraServiceStatus' }
            check_status: { type: array, items: { $ref: '#/components/schemas/InfraCheckStatus' } }
    InfraServiceInput:
      type: object
      required: [name, target, kind, checks]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        site_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        target: { $ref: './common.yaml#/components/schemas/IpAddress' }
        kind: { type: string, minLength: 1, maxLength: 32, pattern: '^[a-z0-9][a-z0-9_-]*$' }
        checks: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/InfraCheck' } }
        interval_seconds: { type: integer, minimum: 30, maximum: 3600, default: 60 }
        failures_before_down: { type: integer, minimum: 1, maximum: 20, default: 3 }
        recoveries_before_up: { type: integer, minimum: 1, maximum: 20, default: 2 }
        enabled: { type: boolean, default: true }
        probe_via_router_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
    InfraServicePatch:
      type: object
      additionalProperties: false
      description: JSON Merge Patch; `checks` reemplaza la lista completa.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        site_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
        target: { $ref: './common.yaml#/components/schemas/IpAddress' }
        kind: { type: string, minLength: 1, maxLength: 32, pattern: '^[a-z0-9][a-z0-9_-]*$' }
        checks: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/InfraCheck' } }
        interval_seconds: { type: integer, minimum: 30, maximum: 3600 }
        failures_before_down: { type: integer, minimum: 1, maximum: 20 }
        recoveries_before_up: { type: integer, minimum: 1, maximum: 20 }
        enabled: { type: boolean }
        probe_via_router_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Uuid'
            - type: 'null'
    InfraSchedulerHealth:
      type: object
      required: [enabled, healthy, last_cycle_at, passive_checks]
      properties:
        enabled: { type: boolean, description: 'false: el rol snmp no vigila (HORUS_SNMP_ENABLED=false).' }
        healthy: { type: boolean }
        last_cycle_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
        passive_checks: { type: boolean, description: 'false: sin lector de flujos (ClickHouse); no_traffic y ddos_inbound quedan unknown.' }
    InfraRouterSnippet:
      type: object
      required: [router_id, router_name, applicable, script, horus_side, warnings]
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        router_name: { type: string }
        applicable: { type: boolean, description: 'false si el objetivo no es privado o no hay chequeos tcp/http con forward_port.' }
        script: { type: string, description: 'Script RouterOS (.rsc) para pegar; vacío si no aplica.' }
        horus_side: { type: string, description: Qué cambia (o no) del lado de Horus. }
        warnings: { type: array, items: { type: string } }
    RouterThresholds:
      allOf:
        - $ref: '#/components/schemas/RouterThresholdValues'
        - type: object
          required: [defaults, customized, version, updated_at, sustained_cycles]
          properties:
            defaults: { $ref: '#/components/schemas/RouterThresholdValues' }
            customized: { type: boolean, description: false = rigen los de la instalación. }
            version: { type: integer, minimum: 0 }
            updated_at:
              oneOf:
                - $ref: './common.yaml#/components/schemas/Timestamp'
                - type: 'null'
            sustained_cycles: { type: integer, description: Ciclos seguidos sobre el umbral para CPU y memoria. }
    RouterThresholdValues:
      type: object
      required: [cpu_warning, cpu_critical, memory_warning, memory_critical, temperature_warning, temperature_critical]
      additionalProperties: false
      properties:
        cpu_warning: { type: number, minimum: 1, maximum: 100, description: '% sostenido.' }
        cpu_critical: { type: number, minimum: 1, maximum: 100 }
        memory_warning: { type: number, minimum: 1, maximum: 100, description: '% sostenido.' }
        memory_critical: { type: number, minimum: 1, maximum: 100 }
        temperature_warning: { type: number, minimum: 20, maximum: 150, description: °C. }
        temperature_critical: { type: number, minimum: 20, maximum: 150 }
    NullableTimestamp:
      oneOf:
        - $ref: './common.yaml#/components/schemas/Timestamp'
        - type: 'null'
    UplinkKind:
      type: string
      description: |
        `international_transit` (tránsito a Internet), `local_ix` (punto de intercambio local), `cache` (enlace a cachés
        de contenido) u `other`.
      enum: [international_transit, local_ix, cache, other]
    HealthStatus:
      type: string
      description: Vocabulario de estado de equipos (online = sano). `unknown` = sin datos observados.
      enum: [online, warning, degraded, critical, offline, unknown]
    SiteHealthReason:
      type: object
      required: [status, code, text]
      properties:
        status: { $ref: '#/components/schemas/HealthStatus' }
        code:
          type: string
          description: |
            Enum abierto: `uplink_down`, `all_uplinks_down`, `uplink_saturated`, `uplink_quality`, `router_<estado>`,
            `service_down`, `service_degraded`.
        text: { type: string, description: 'Razón legible en español (p. ej. «enlace Proveedor A al 92 % en hora pico»).' }
    SiteHealth:
      type: object
      required: [status, summary, reasons]
      properties:
        status: { $ref: '#/components/schemas/HealthStatus' }
        summary: { type: string, examples: ['Degradado: enlace Proveedor A al 92 % en hora pico y 2,0 % de pérdida'] }
        reasons: { type: array, items: { $ref: '#/components/schemas/SiteHealthReason' } }
    CapacityCrossing:
      type: object
      required: [threshold, date, days_until, already]
      properties:
        threshold: { type: number, description: 'Proporción de la capacidad (0,8 = 80 %).' }
        date:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: Fecha estimada de cruce (null = no cruza en 36 meses o datos insuficientes).
        days_until: { type: [integer, 'null'] }
        already: { type: boolean, description: El pico actual ya supera el umbral. }
    CapacityForecastLevel:
      type: string
      enum: [ok, planning, urgent, insufficient_data, no_capacity]
    CapacityConfidence:
      type: string
      enum: [low, medium, high]
    CapacityForecastSummary:
      type: object
      required: [subject_id, subject_kind, level, confidence, computed_at, history_days, seasonality, capacity_bps, current_peak_bps,
        monthly_growth, peak_6m_bps, growth_6m, planning, urgent, lead_days, recommendation]
      properties:
        subject_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        subject_kind: { type: string, enum: [uplink, international_egress] }
        level: { $ref: '#/components/schemas/CapacityForecastLevel' }
        confidence: { $ref: '#/components/schemas/CapacityConfidence' }
        computed_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        history_days: { type: integer }
        seasonality: { type: boolean, description: Se descontó la estacionalidad semanal (≥ 21 días). }
        capacity_bps: { type: integer, description: bits/s. }
        current_peak_bps: { type: [number, 'null'], description: 'Pico actual de tendencia (día de la semana más cargado), bits/s.' }
        monthly_growth: { type: [number, 'null'], description: 'Crecimiento mensual del pico (0,04 = +4 %).' }
        peak_6m_bps: { type: [number, 'null'] }
        growth_6m: { type: [number, 'null'] }
        planning: { $ref: '#/components/schemas/CapacityCrossing' }
        urgent: { $ref: '#/components/schemas/CapacityCrossing' }
        lead_days: { type: integer }
        recommendation: { type: string }
    CapacityForecastPoint:
      type: object
      required: [day, bps, low_bps, high_bps]
      properties:
        day: { $ref: './common.yaml#/components/schemas/Timestamp' }
        bps: { type: number }
        low_bps: { type: number }
        high_bps: { type: number }
    CapacityForecast:
      type: object
      description: Pronóstico completo (método Theil–Sen sobre ln del pico diario con estacionalidad semanal; docs/capacity-forecast.md).
      required: [level, method, history_days, first_day, last_day, seasonality, confidence, capacity_bps, observed_peak_bps, current_peak_bps,
        monthly_growth, monthly_growth_low, monthly_growth_high, peak_6m_bps, growth_6m, planning, urgent, lead_days, projection]
      properties:
        level: { $ref: '#/components/schemas/CapacityForecastLevel' }
        method: { type: string, examples: [theil_sen_log_weekly] }
        history_days: { type: integer }
        first_day: { $ref: '#/components/schemas/NullableTimestamp' }
        last_day: { $ref: '#/components/schemas/NullableTimestamp' }
        seasonality: { type: boolean }
        confidence: { $ref: '#/components/schemas/CapacityConfidence' }
        capacity_bps: { type: integer }
        observed_peak_bps: { type: [number, 'null'] }
        current_peak_bps: { type: [number, 'null'] }
        monthly_growth: { type: [number, 'null'] }
        monthly_growth_low: { type: [number, 'null'] }
        monthly_growth_high: { type: [number, 'null'] }
        peak_6m_bps: { type: [number, 'null'] }
        growth_6m: { type: [number, 'null'] }
        planning: { $ref: '#/components/schemas/CapacityCrossing' }
        urgent: { $ref: '#/components/schemas/CapacityCrossing' }
        lead_days: { type: integer }
        projection: { type: array, items: { $ref: '#/components/schemas/CapacityForecastPoint' }, description: 'Semanal, 12 meses.' }
    UplinkWindow:
      type: object
      required: [days, from, to, samples, rx_p95_bps, tx_p95_bps, util_p95, hours_above_warning, hours_above_critical, errors, drops]
      properties:
        days: { type: integer }
        from: { $ref: './common.yaml#/components/schemas/Timestamp' }
        to: { $ref: './common.yaml#/components/schemas/Timestamp' }
        samples: { type: integer, description: Intervalos de 5 min con dato. }
        rx_p95_bps: { type: number, description: 'Peor p95 diario de entrada (bits/s).' }
        tx_p95_bps: { type: number }
        util_p95: { type: [number, 'null'], description: Peor p95 diario sobre la capacidad (0..1+). }
        hours_above_warning: { type: number, description: Horas con la media de 5 min sobre el aviso de saturación. }
        hours_above_critical: { type: number }
        errors: { type: integer }
        drops: { type: integer }
    UplinkDiagnosis:
      type: object
      required: [kind, error_ratio, drop_ratio]
      properties:
        kind:
          type: string
          description: |
            `full` = saturado sin errores físicos (descartes de cola esperables); `faulty` = errores o descartes con el
            enlace holgado (física, negociación o política); `full_and_faulty`; `busy` = p95 sobre el aviso; `ok`;
            `no_data`; `no_capacity`.
          enum: [ok, busy, full, faulty, full_and_faulty, no_data, no_capacity]
        error_ratio: { type: number }
        drop_ratio: { type: number }
    CapacityProbe:
      type: object
      required: [probe_id, source, ref, target, label, router_id, interface_id, status, last_at, loss_pct, loss_pct_max, rtt_avg_ms, jitter_ms,
        last_loss_pct, last_rtt_ms, last_jitter_ms]
      properties:
        probe_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        source:
          type: string
          enum: [router_netwatch, router_nqa, horus]
          description: |
            `router_netwatch` = sonda netwatch del router MikroTik (por enlace, API REST); `router_nqa` = prueba NQA ICMP de
            un router Huawei VRP leída por SNMP (DISMAN-PING-MIB / NQA-MIB; jitter = desviación típica del RTT);
            `horus` = ruta Horus → destino (no mide un enlace).
        ref: { type: string, description: 'gw (puerta de enlace del proveedor) | intl (referencia internacional) | horus.' }
        target: { type: string, description: IP sondeada (infraestructura o referencia pública; nunca un cliente). }
        label: { type: string }
        router_id: { oneOf: [{ $ref: './common.yaml#/components/schemas/Uuid' }, { type: 'null' }] }
        interface_id: { oneOf: [{ $ref: './common.yaml#/components/schemas/Uuid' }, { type: 'null' }] }
        status: { type: string, enum: [up, down, unknown] }
        last_at: { $ref: '#/components/schemas/NullableTimestamp' }
        loss_pct: { type: [number, 'null'], description: Media de 24 h (%). }
        loss_pct_max: { type: [number, 'null'] }
        rtt_avg_ms: { type: [number, 'null'], description: Media de 24 h. }
        jitter_ms: { type: [number, 'null'], description: Media de 24 h. }
        last_loss_pct: { type: [number, 'null'] }
        last_rtt_ms: { type: [number, 'null'] }
        last_jitter_ms: { type: [number, 'null'] }
    UplinkCondition:
      type: object
      required: [condition, level, since, value]
      properties:
        condition: { type: string, enum: [saturation, loss, latency] }
        level: { type: string, enum: [ok, warning, critical] }
        since: { $ref: './common.yaml#/components/schemas/Timestamp' }
        value: { type: number, description: 'saturation: proporción; loss: %; latency: ms.' }
    CapacityUplink:
      type: object
      required: [interface_id, router_id, router_name, site_id, site_name, interface_name, configured, auto_detected, label, provider, kind,
        international_egress, contracted_bps, speed_bps, capacity_bps, capacity_source, oper_status, rx_bps, tx_bps, utilization, sampled_at,
        window, diagnosis, probe, conditions, forecast, version]
      properties:
        interface_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        router_name: { type: string }
        site_id: { oneOf: [{ $ref: './common.yaml#/components/schemas/Uuid' }, { type: 'null' }] }
        site_name: { type: string }
        interface_name: { type: string }
        configured: { type: boolean }
        auto_detected: { type: boolean, description: Es el enlace de subida que eligió el sondeador. }
        label: { type: string }
        provider: { type: [string, 'null'] }
        kind: { oneOf: [{ $ref: '#/components/schemas/UplinkKind' }, { type: 'null' }] }
        international_egress: { type: boolean }
        contracted_bps: { type: [integer, 'null'] }
        speed_bps: { type: [integer, 'null'] }
        capacity_bps: { type: [integer, 'null'] }
        capacity_source: { type: string, enum: [contracted, port_speed, unknown] }
        oper_status: { oneOf: [{ $ref: '#/components/schemas/InterfaceOperStatus' }, { type: 'null' }] }
        rx_bps: { type: [number, 'null'] }
        tx_bps: { type: [number, 'null'] }
        utilization: { type: [number, 'null'], description: 'Última muestra, max(rx, tx) / capacidad.' }
        sampled_at: { $ref: '#/components/schemas/NullableTimestamp' }
        window: { oneOf: [{ $ref: '#/components/schemas/UplinkWindow' }, { type: 'null' }] }
        diagnosis: { $ref: '#/components/schemas/UplinkDiagnosis' }
        probe: { oneOf: [{ $ref: '#/components/schemas/CapacityProbe' }, { type: 'null' }] }
        conditions: { type: array, items: { $ref: '#/components/schemas/UplinkCondition' } }
        forecast: { oneOf: [{ $ref: '#/components/schemas/CapacityForecastSummary' }, { type: 'null' }] }
        version: { type: integer, description: Versión de la configuración (0 = sin configurar). }
        device_type:
          type: string
          enum: [router, switch]
          description: '`switch`: uplink de un switch (elegido por el operador en la ficha del switch; `auto_detected=true`).'
    CapacityRouterBrief:
      type: object
      required: [router_id, name, status, probes_error]
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        name: { type: string }
        status: { $ref: '#/components/schemas/RouterEffectiveStatus' }
        probes_error: { type: [string, 'null'], description: Por qué no se leen sus sondas netwatch (null = se leen o no hay intento). }
        device_type: { type: string, enum: [router, switch] }
    CapacitySite:
      type: object
      required: [site_id, site_name, health, uplinks, router_probes, routers]
      properties:
        site_id: { oneOf: [{ $ref: './common.yaml#/components/schemas/Uuid' }, { type: 'null' }] }
        site_name: { type: string }
        health: { $ref: '#/components/schemas/SiteHealth' }
        uplinks: { type: array, items: { $ref: '#/components/schemas/CapacityUplink' } }
        router_probes: { type: array, items: { $ref: '#/components/schemas/CapacityProbe' }, description: Referencias internacionales de sus routers. }
        routers: { type: array, items: { $ref: '#/components/schemas/CapacityRouterBrief' } }
    CapacityEgress:
      type: object
      required: [subject_id, members, capacity_bps, rx_bps, tx_bps, utilization, window, forecast]
      properties:
        subject_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        members: { type: array, items: { $ref: './common.yaml#/components/schemas/Uuid' } }
        capacity_bps: { type: integer }
        rx_bps: { type: [number, 'null'] }
        tx_bps: { type: [number, 'null'] }
        utilization: { type: [number, 'null'] }
        window: { oneOf: [{ $ref: '#/components/schemas/UplinkWindow' }, { type: 'null' }] }
        forecast: { oneOf: [{ $ref: '#/components/schemas/CapacityForecastSummary' }, { type: 'null' }] }
    CapacityProbeTarget:
      type: object
      required: [label, address]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        address: { type: string, format: ipv4 }
    CapacitySettingsValues:
      type: object
      required: [country, planning_threshold, urgent_threshold, lead_days, saturation_warning, saturation_critical, sustained_minutes,
        loss_warning_pct, loss_critical_pct, latency_warning_ms, latency_critical_ms, local_asns, local_prefixes, probe_targets]
      additionalProperties: false
      properties:
        country: { type: [string, 'null'], pattern: '^[A-Za-z]{2}$', description: ISO 3166-1 alfa-2; null = el país del ISP. }
        planning_threshold: { type: number, minimum: 0.3, maximum: 1 }
        urgent_threshold: { type: number, minimum: 0.3, maximum: 1 }
        lead_days: { type: integer, minimum: 7, maximum: 365 }
        saturation_warning: { type: number, minimum: 0.3, maximum: 1 }
        saturation_critical: { type: number, minimum: 0.3, maximum: 1 }
        sustained_minutes: { type: integer, minimum: 5, maximum: 240 }
        loss_warning_pct: { type: number, exclusiveMinimum: 0, maximum: 100 }
        loss_critical_pct: { type: number, exclusiveMinimum: 0, maximum: 100 }
        latency_warning_ms: { type: number, exclusiveMinimum: 0 }
        latency_critical_ms: { type: number, exclusiveMinimum: 0, maximum: 10000 }
        local_asns: { type: array, maxItems: 200, items: { type: integer, minimum: 1, maximum: 4294967295 } }
        local_prefixes:
          type: array
          maxItems: 200
          description: |
            Prefijos CIDR IPv4/IPv6 que cuentan como tráfico local aunque su ASN no esté en la lista (LAN de un IXP,
            cachés on-net). Se normalizan (red, sin duplicados); como mínimo /8 en IPv4 y /16 en IPv6. Un prefijo más
            específico que /24 (IPv4) o /48 (IPv6) se cuenta por su /24 o /48 completo (aviso en `local_prefix_warnings`).
          items: { type: string, examples: ['198.51.100.0/24', '2001:db8:7a00::/48'] }
        probe_targets: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/CapacityProbeTarget' } }
    CapacitySettings:
      allOf:
        - $ref: '#/components/schemas/CapacitySettingsValues'
        - type: object
          required: [defaults, customized, version, updated_at, tenant_country, effective_country, local_prefix_warnings]
          properties:
            local_prefix_warnings:
              type: array
              description: Avisos sobre la lista local por prefijos (no impiden guardar).
              items:
                type: object
                required: [prefix, code, client_prefix, detail]
                properties:
                  prefix: { type: string }
                  code: { type: string, enum: [overlaps_client_prefix, counted_as_aggregate] }
                  client_prefix: { type: [string, 'null'], description: Prefijo de clientes con el que se solapa. }
                  detail: { type: string }
            defaults: { $ref: '#/components/schemas/CapacitySettingsValues' }
            customized: { type: boolean }
            version: { type: integer, minimum: 0 }
            updated_at: { $ref: '#/components/schemas/NullableTimestamp' }
            tenant_country: { type: [string, 'null'] }
            effective_country: { type: [string, 'null'] }
    CapacityOverview:
      type: object
      required: [data, egress, horus_probes, settings, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CapacitySite' }, description: 'Nodos, peor salud primero.' }
        egress: { oneOf: [{ $ref: '#/components/schemas/CapacityEgress' }, { type: 'null' }] }
        horus_probes: { type: array, items: { $ref: '#/components/schemas/CapacityProbe' } }
        settings: { $ref: '#/components/schemas/CapacitySettingsValues' }
        meta:
          type: object
          required: [generated_at, window_days, history, store]
          properties:
            generated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
            window_days: { type: integer }
            history: { type: boolean, description: 'false: sin ClickHouse (solo datos en vivo, sin pronósticos).' }
            store: { type: boolean, description: 'false: sin PostgreSQL (sin configuración por enlace).' }
    UplinkDaily:
      type: object
      required: [day, samples, rx_p95_bps, tx_p95_bps, rx_max_bps, tx_max_bps, capacity_bps, hours_above_warning, hours_above_critical,
        errors, drops, packets]
      properties:
        day: { $ref: './common.yaml#/components/schemas/Timestamp' }
        samples: { type: integer }
        rx_p95_bps: { type: number }
        tx_p95_bps: { type: number }
        rx_max_bps: { type: number }
        tx_max_bps: { type: number }
        capacity_bps: { type: integer, description: 'Capacidad vigente ese día (contratada según su historia, o velocidad del puerto); la utilización y las horas sobre umbral del día se miden contra ella.' }
        hours_above_warning: { type: number }
        hours_above_critical: { type: number }
        errors: { type: integer }
        drops: { type: integer }
        packets: { type: number }
    ProbeSeries:
      type: object
      required: [probe_id, label, target, points]
      properties:
        probe_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        label: { type: string }
        target: { type: string }
        points:
          type: array
          items:
            type: object
            required: [at, loss_pct, rtt_avg_ms, jitter_ms]
            properties:
              at: { $ref: './common.yaml#/components/schemas/Timestamp' }
              loss_pct: { type: [number, 'null'] }
              rtt_avg_ms: { type: [number, 'null'] }
              jitter_ms: { type: [number, 'null'] }
    CapacitySubjectDetail:
      type: object
      required: [subject_id, subject_kind, uplink, egress, days, daily, forecast, recommendation, computed_at, probe_series, settings,
        capacity_history]
      properties:
        subject_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        subject_kind: { type: string, enum: [uplink, international_egress] }
        uplink: { oneOf: [{ $ref: '#/components/schemas/CapacityUplink' }, { type: 'null' }] }
        egress: { oneOf: [{ $ref: '#/components/schemas/CapacityEgress' }, { type: 'null' }] }
        days: { type: integer }
        daily: { type: array, items: { $ref: '#/components/schemas/UplinkDaily' } }
        forecast: { oneOf: [{ $ref: '#/components/schemas/CapacityForecast' }, { type: 'null' }] }
        recommendation: { type: [string, 'null'] }
        computed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        probe_series: { type: array, items: { $ref: '#/components/schemas/ProbeSeries' } }
        settings: { $ref: '#/components/schemas/CapacitySettingsValues' }
        capacity_history:
          type: array
          description: Capacidad contratada del enlace con su vigencia, la más reciente primero (vacía en la salida internacional).
          items: { $ref: '#/components/schemas/CapacityPeriod' }
    CapacityPeriod:
      type: object
      required: [valid_from, valid_to, contracted_bps]
      properties:
        valid_from: { $ref: './common.yaml#/components/schemas/Timestamp' }
        valid_to: { $ref: '#/components/schemas/NullableTimestamp' }
        contracted_bps: { type: [integer, 'null'], description: 'bits/s; null = sin capacidad contratada (se mide contra la velocidad del puerto).' }
    UplinkConfigInput:
      type: object
      required: [router_id, label, kind]
      additionalProperties: false
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        label: { type: string, minLength: 1, maxLength: 120, description: 'Nombre visible (p. ej. «Proveedor A 10G»).' }
        provider: { type: [string, 'null'], maxLength: 120 }
        kind: { $ref: '#/components/schemas/UplinkKind' }
        contracted_bps: { type: [integer, 'null'], minimum: 1000000, maximum: 1600000000000, description: bits/s. }
        international_egress: { type: [boolean, 'null'], description: 'Forma parte de la salida internacional agregada (por defecto: kind = international_transit).' }
        capacity_valid_from:
          type: [string, 'null']
          format: date-time
          description: |
            Desde cuándo rige un cambio de `contracted_bps` (por defecto, ahora). Hasta 90 días atrás y nunca antes del cambio
            anterior (`422`); los picos diarios afectados se recalculan con la capacidad de cada día. Sin cambio de capacidad se ignora.
    UplinkConfig:
      type: object
      required: [interface_id, router_id, label, provider, kind, contracted_bps, international_egress, updated_at, version]
      properties:
        interface_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        label: { type: string }
        provider: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/UplinkKind' }
        contracted_bps: { type: [integer, 'null'] }
        international_egress: { type: boolean }
        updated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        version: { type: integer }
    TrafficSplit:
      type: object
      required: [local_bytes, local_by_country_bytes, local_by_list_bytes, local_by_prefix_bytes, international_bytes, unknown_bytes,
        international_share, local_share]
      properties:
        local_bytes: { type: integer }
        local_by_country_bytes: { type: integer }
        local_by_list_bytes: { type: integer }
        local_by_prefix_bytes: { type: integer, description: Hacia la lista local por prefijos (manda sobre la clasificación por ASN). }
        international_bytes: { type: integer }
        unknown_bytes: { type: integer }
        international_share: { type: [number, 'null'], description: Sobre lo clasificado (sin desconocido). }
        local_share: { type: [number, 'null'] }
    TrafficSplitReport:
      type: object
      required: [from, to, days, country, country_source, local_asns, local_prefixes, total, sites, daily]
      properties:
        from: { $ref: './common.yaml#/components/schemas/Timestamp' }
        to: { $ref: './common.yaml#/components/schemas/Timestamp' }
        days: { type: integer }
        country: { type: [string, 'null'] }
        country_source: { type: string, enum: [settings, tenant, none] }
        local_asns: { type: integer, description: Cuántos ASN tiene la lista local. }
        local_prefixes: { type: integer, description: Cuántos prefijos tiene la lista local. }
        total: { $ref: '#/components/schemas/TrafficSplit' }
        sites:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/TrafficSplit'
              - type: object
                required: [site_id, site_name]
                properties:
                  site_id: { $ref: './common.yaml#/components/schemas/Uuid' }
                  site_name: { type: string }
        daily:
          type: array
          items:
            type: object
            required: [day, local_bytes, international_bytes, unknown_bytes]
            properties:
              day: { $ref: './common.yaml#/components/schemas/Timestamp' }
              local_bytes: { type: integer }
              international_bytes: { type: integer }
              unknown_bytes: { type: integer }
    NetwatchSnippet:
      type: object
      required: [router_id, router_name, language, script, placeholders, warnings, probes_found, probes_error]
      properties:
        router_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        router_name: { type: string }
        language:
          type: string
          enum: [routeros, vrp]
          description: |
            `routeros`: script RouterOS (.rsc) con sondas netwatch (MikroTik). `vrp`: configuración Huawei VRP con pruebas
            NQA ICMP (admin-name `horus`, test-name `gw-<interfaz>` / `intl-<ip>`), sin comentarios, pendiente de
            validación en equipo real (docs/vendors/huawei.md §4).
        script: { type: string, description: 'Script RouterOS (.rsc) o configuración VRP con marcadores {GATEWAY_n}.' }
        placeholders:
          type: array
          items:
            type: object
            required: [key, interface, description]
            properties:
              key: { type: string, examples: ['{GATEWAY_1}'] }
              interface: { type: string }
              description: { type: string }
        warnings: { type: array, items: { type: string } }
        probes_found: { type: integer, description: Sondas de Horus leídas del router en el último ciclo. }
        probes_error: { type: [string, 'null'] }
