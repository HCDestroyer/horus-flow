openapi: 3.1.0
info:
  title: Horus Flow API — módulo analytics (contrato v0)
  version: 0.1.0
  description: |
    Consultas de tráfico sobre ClickHouse (C3), propuestas del modo descubrimiento, dashboards modulares,
    catálogo de widgets, datos por widget resueltos en servidor, playlists y configuración del kiosco
    (docs/api.md §1.7, §2.11, §2.12; docs/frontend.md §6). Esquemas del documento de dashboard, tipos de
    widget y playlist: packages/schemas/dashboard/v0/ (C9). ClickHouse caído → `503 ANALYTICS_UNAVAILABLE`.
  license:
    name: Propietaria
    identifier: LicenseRef-Horus-Proprietary
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: horus.example.net
tags:
  - name: traffic
    description: Tops y series de tráfico.
  - name: dashboards
    description: Dashboards, widgets y playlists (D8).
  - name: kiosk
    description: Configuración del kiosco.
  - name: routers
    description: Series históricas de los routers (SNMP e ICMP), para la ficha y la vista NOC.
  - name: reports
    description: Reportes programados y a petición (rol reporting; I3 — seguridad semanal en PDF y CSV).
paths:
  /analytics/traffic/top:
    get:
      tags: [traffic]
      operationId: getTrafficTop
      summary: Top N (≤ 10) + "Otros" por clientes, servicios, categorías, organizaciones o ASN
      description: '`dimension=customers` exige además `customers.read` (datos personales); sin él → 403.'
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - name: dimension
          in: query
          required: true
          schema: { type: string, enum: [customers, services, categories, organizations, asns] }
        - $ref: './common.yaml#/components/parameters/SiteIdFilter'
        - name: customer_id
          in: query
          description: Ámbito de cliente (exige `traffic.customer.read`).
          schema: { $ref: './common.yaml#/components/schemas/Uuid' }
        - name: direction
          in: query
          schema: { type: string, enum: [both, download, upload], default: both }
        - name: n
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - $ref: './common.yaml#/components/parameters/Range'
        - $ref: './common.yaml#/components/parameters/From'
        - $ref: './common.yaml#/components/parameters/To'
      responses:
        '200':
          description: Top.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/TopResult' }
                  meta: { $ref: './common.yaml#/components/schemas/AnalyticsMeta' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: './common.yaml#/components/responses/GatewayTimeout' }
  /analytics/traffic/timeseries:
    get:
      tags: [traffic]
      operationId: getTrafficTimeseries
      summary: Serie de tráfico ↓/↑ del ISP o de un nodo (huecos como null)
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/SiteIdFilter'
        - name: metrics
          in: query
          schema: { type: string, default: 'down_bps,up_bps', description: 'down_bps,up_bps,flows_per_second,active_customers' }
        - $ref: './common.yaml#/components/parameters/Range'
        - $ref: './common.yaml#/components/parameters/From'
        - $ref: './common.yaml#/components/parameters/To'
        - $ref: './common.yaml#/components/parameters/Step'
      responses:
        '200':
          description: Series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesResponse' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: './common.yaml#/components/responses/GatewayTimeout' }
  /analytics/traffic/attribution:
    get:
      tags: [traffic]
      operationId: getTrafficAttribution
      summary: Cobertura de atribución (bytes atribuidos a clientes, de infraestructura y fuera de prefijos)
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/SiteIdFilter'
        - $ref: './common.yaml#/components/parameters/Range'
      responses:
        '200':
          description: Proporciones.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [attributed_ratio, infrastructure_ratio, unattributed_ratio]
                    properties:
                      attributed_ratio: { type: number }
                      infrastructure_ratio: { type: number }
                      unattributed_ratio: { type: number }
                  meta: { $ref: './common.yaml#/components/schemas/AnalyticsMeta' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /analytics/customers/{customer_id}/traffic:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    get:
      tags: [traffic]
      operationId: getCustomerTraffic
      summary: Series de tráfico de un cliente (desde reset_at si existe). Acceso auditado
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.customer.read
      x-audited: true
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - name: group_by
          in: query
          schema: { type: string, enum: [none, service, category, asn], default: none }
        - $ref: './common.yaml#/components/parameters/Range'
        - $ref: './common.yaml#/components/parameters/From'
        - $ref: './common.yaml#/components/parameters/To'
        - $ref: './common.yaml#/components/parameters/Step'
      responses:
        '200':
          description: Series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesResponse' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /analytics/routers/{router_id}/metrics:
    parameters:
      - name: router_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    get:
      tags: [routers]
      operationId: getRouterMetrics
      summary: Series del dispositivo (CPU, memoria, temperatura, latencia, disponibilidad) con rango
      description: |
        Desde `snmp.device_metrics` (crudo 30 d, 5 min 90 d, 1 h 13 meses). `availability_ratio` es la fracción
        de sondeos ICMP respondidos en el bucket; los huecos (router apagado, sondeador caído) son `null`, nunca 0.
      x-module: analytics
      x-scope: tenant
      x-permission: snmp.read
      x-principals: [user, api_token, kiosk]
      x-increment: I2
      security:
        - tenantBearer: []
        - kioskBearer: []
      parameters:
        - name: metrics
          in: query
          schema: { type: string, default: 'cpu_percent,memory_percent,temperature_celsius', description: 'cpu_percent,cpu_max_core_percent,memory_percent,temperature_celsius,cpu_temperature_celsius,icmp_rtt_ms,icmp_loss_ratio,availability_ratio,poll_duration_ms,uptime_seconds' }
        - $ref: './common.yaml#/components/parameters/Range'
        - $ref: './common.yaml#/components/parameters/From'
        - $ref: './common.yaml#/components/parameters/To'
        - $ref: './common.yaml#/components/parameters/Step'
      responses:
        '200':
          description: Series (`metric` = nombre pedido; `unit` percent | celsius | ms | ratio | seconds).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesResponse' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /analytics/routers/{router_id}/interfaces/metrics:
    parameters:
      - name: router_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    get:
      tags: [routers]
      operationId: getRouterInterfaceMetrics
      summary: Series por interfaz (tráfico, paquetes, errores, descartes) con rango
      description: |
        Una serie por métrica e interfaz (`group` = nombre de la interfaz). Sin `interface_id`, las interfaces
        de subida (uplink) y, si no hay, las físicas con tráfico; como mucho 8 interfaces por consulta.
      x-module: analytics
      x-scope: tenant
      x-permission: snmp.read
      x-principals: [user, api_token, kiosk]
      x-increment: I2
      security:
        - tenantBearer: []
        - kioskBearer: []
      parameters:
        - name: interface_id
          in: query
          description: UUID de interfaces separados por comas (máximo 8).
          schema: { type: string }
        - name: metrics
          in: query
          schema: { type: string, default: 'rx_bps,tx_bps', description: 'rx_bps,tx_bps,rx_pps,tx_pps,rx_errors,tx_errors,rx_drops,tx_drops,utilization_rx,utilization_tx' }
        - $ref: './common.yaml#/components/parameters/Range'
        - $ref: './common.yaml#/components/parameters/From'
        - $ref: './common.yaml#/components/parameters/To'
        - $ref: './common.yaml#/components/parameters/Step'
      responses:
        '200':
          description: Series.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeriesResponse' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /sites/{site_id}/prefix-proposals:
    parameters:
      - name: site_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    get:
      tags: [traffic]
      operationId: listPrefixProposals
      summary: Propuestas del modo descubrimiento (prefijos agregados vistos del lado customer_edge)
      x-module: analytics
      x-scope: tenant
      x-permission: sites.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Range'
      responses:
        '200':
          description: Propuestas (se confirman con POST /sites/{site_id}/client-prefixes/batch).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [prefix, distinct_ips, bytes, suggested_role]
                      properties:
                        prefix: { $ref: './common.yaml#/components/schemas/Cidr' }
                        distinct_ips: { type: integer }
                        bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
                        suggested_role: { type: string, enum: [customers, infrastructure, excluded] }
                        reason: { type: string, enum: [private_or_cgnat, isp_public_asn] }
                  meta: { $ref: './common.yaml#/components/schemas/AnalyticsMeta' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /sites/{site_id}/unattributed-addresses:
    parameters:
      - name: site_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    post:
      tags: [traffic]
      operationId: queryUnattributedAddresses
      summary: IPs con más tráfico dentro de un rango sin atribuir de un nodo
      description: |
        Detalle de una propuesta de prefijo (`GET /sites/{site_id}/prefix-proposals`): las IP del rango que más
        tráfico generan en el periodo, de más a menos. Son IP de clientes aún sin declarar (dato personal), por eso
        exige `customers.read`. El rango va en el cuerpo (nunca IP en la URL). Fuente: flows.unattributed_1h (30 días).
      x-module: analytics
      x-scope: tenant
      x-permission: customers.read
      x-increment: I1
      security: [{ tenantBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefix]
              properties:
                prefix:
                  allOf: [{ $ref: './common.yaml#/components/schemas/Cidr' }]
                  description: Rango propuesto (IPv4 /24 o más amplio; IPv6 /48 o más amplio).
                range: { $ref: './common.yaml#/components/schemas/RelativeRange' }
                n: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: IPs del rango ordenadas por bytes.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [address, bytes, packets, last_seen_at]
                      properties:
                        address: { type: string, format: ip, examples: ['100.64.12.17'] }
                        bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
                        packets: { $ref: './common.yaml#/components/schemas/Uint64String' }
                        last_seen_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
                  meta: { $ref: './common.yaml#/components/schemas/AnalyticsMeta' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
  /widget-types:
    get:
      tags: [dashboards]
      operationId: listWidgetTypes
      summary: Catálogo de tipos de widget (sin tenant; autoritativo)
      x-module: analytics
      x-scope: session
      x-permission: authenticated
      x-principals: [user, api_token, kiosk]
      x-increment: I0
      security:
        - tenantBearer: []
        - kioskBearer: []
        - sessionBearer: []
      responses:
        '200':
          description: Catálogo (fuente packages/schemas/dashboard/v0/widget-types.json).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '../../dashboard/v0/widget-type.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
  /dashboards:
    get:
      tags: [dashboards]
      operationId: listDashboards
      summary: Plantillas de sistema + propios + compartidos con el ISP
      x-module: analytics
      x-scope: tenant
      x-permission: dashboards.read
      x-increment: I0
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: visibility
          in: query
          schema: { type: string, description: 'system,tenant,private' }
      responses:
        '200':
          description: Página de dashboards (sin widgets).
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '../../dashboard/v0/dashboard.schema.json#/$defs/DashboardSummary' }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [dashboards]
      operationId: createDashboard
      summary: Crea un dashboard (privado por defecto; config de cada widget validada contra su config_schema)
      description: '`visibility=tenant` exige `dashboards.manage`. Tipo desconocido → `422 WIDGET_TYPE_UNKNOWN`; config inválida → `422 WIDGET_CONFIG_INVALID`.'
      x-module: analytics
      x-scope: tenant
      x-permission: dashboards.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../../dashboard/v0/dashboard.schema.json#/$defs/DashboardInput' }
      responses:
        '201':
          description: Creado.
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/dashboard.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /dashboards/{dashboard_id}:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    get:
      tags: [dashboards]
      operationId: getDashboard
      summary: Documento de dashboard (kiosco solo si está asignado)
      x-module: analytics
      x-scope: tenant
      x-permission: dashboards.read
      x-principals: [user, api_token, kiosk]
      x-increment: I0
      security:
        - tenantBearer: []
        - kioskBearer: []
      responses:
        '200':
          description: Dashboard.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/dashboard.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    patch:
      tags: [dashboards]
      operationId: updateDashboard
      summary: Edita nombre, visibilidad, rango y refresco (dueño, o dashboards.manage si es del ISP)
      description: Plantillas de sistema → `409 DASHBOARD_READ_ONLY` (se duplican).
      x-module: analytics
      x-scope: tenant
      x-permission: dashboard_access
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '../../dashboard/v0/dashboard.schema.json#/$defs/DashboardPatch' }
          application/json:
            schema: { $ref: '../../dashboard/v0/dashboard.schema.json#/$defs/DashboardPatch' }
      responses:
        '200':
          description: Actualizado.
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/dashboard.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
    delete:
      tags: [dashboards]
      operationId: deleteDashboard
      summary: Borra un dashboard propio o del ISP
      x-module: analytics
      x-scope: tenant
      x-permission: dashboard_access
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
  /dashboards/{dashboard_id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    post:
      tags: [dashboards]
      operationId: duplicateDashboard
      summary: Copia privada (forma de editar una plantilla)
      x-module: analytics
      x-scope: tenant
      x-permission: dashboards.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Copia.
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/dashboard.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /dashboards/{dashboard_id}/layout:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    put:
      tags: [dashboards]
      operationId: replaceDashboardLayout
      summary: Reemplaza layout y posiciones de todos los widgets
      x-module: analytics
      x-scope: tenant
      x-permission: dashboard_access
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../../dashboard/v0/dashboard.schema.json#/$defs/LayoutReplace' }
      responses:
        '200':
          description: Dashboard con el layout nuevo.
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/dashboard.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /dashboards/{dashboard_id}/widgets:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
    post:
      tags: [dashboards]
      operationId: addDashboardWidget
      summary: Añade un widget (If-Match con la versión del dashboard)
      x-module: analytics
      x-scope: tenant
      x-permission: dashboard_access
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../../dashboard/v0/dashboard.schema.json#/$defs/Widget' }
      responses:
        '201':
          description: Dashboard actualizado.
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/dashboard.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /dashboards/{dashboard_id}/widgets/{widget_id}:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
      - $ref: '#/components/parameters/WidgetId'
    patch:
      tags: [dashboards]
      operationId: updateDashboardWidget
      summary: Edita título, posición, config o refresco de un widget
      x-module: analytics
      x-scope: tenant
      x-permission: dashboard_access
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '../../dashboard/v0/dashboard.schema.json#/$defs/WidgetPatch' }
          application/json:
            schema: { $ref: '../../dashboard/v0/dashboard.schema.json#/$defs/WidgetPatch' }
      responses:
        '200':
          description: Dashboard actualizado.
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/dashboard.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
    delete:
      tags: [dashboards]
      operationId: deleteDashboardWidget
      summary: Quita un widget
      x-module: analytics
      x-scope: tenant
      x-permission: dashboard_access
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '200':
          description: Dashboard actualizado.
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/dashboard.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
  /dashboards/{dashboard_id}/widgets/{widget_id}/data:
    parameters:
      - $ref: '#/components/parameters/DashboardId'
      - $ref: '#/components/parameters/WidgetId'
    get:
      tags: [dashboards]
      operationId: getWidgetData
      summary: Datos del widget resueltos en servidor desde su config guardada, con los permisos de quien mira
      description: |
        Sin el `required_permission` del tipo → `403 WIDGET_TYPE_NOT_ALLOWED` (solo ese widget). Kiosco: solo
        dashboards asignados y tipos `kiosk_allowed`; sin `show_personal_data` las IPs llegan enmascaradas
        (`meta.masked_personal_data = true`). `Cache-Control: private, max-age=<refresh/2>`, `ETag`; caché Valkey
        `t:<tenant_id>:wcache:…`. Timeout 10 s por widget.
      x-module: analytics
      x-scope: tenant
      x-permission: widget_type
      x-principals: [user, api_token, kiosk]
      x-increment: I1
      security:
        - tenantBearer: []
        - kioskBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Range'
        - $ref: './common.yaml#/components/parameters/From'
        - $ref: './common.yaml#/components/parameters/To'
        - name: site_id
          in: query
          description: Variable de dashboard (si el tipo la acepta).
          schema: { $ref: './common.yaml#/components/schemas/Uuid' }
      responses:
        '200':
          description: Datos.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/widget-data.schema.json' }
        '304': { description: Sin cambios. }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '503': { $ref: './common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: './common.yaml#/components/responses/GatewayTimeout' }
  /widget-data/preview:
    post:
      tags: [dashboards]
      operationId: previewWidgetData
      summary: Datos de un widget no guardado (editor; no disponible para kioscos)
      x-module: analytics
      x-scope: tenant
      x-permission: widget_type
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, config]
              properties:
                type: { type: string }
                config: { type: object }
                range: { $ref: './common.yaml#/components/schemas/RelativeRange' }
      responses:
        '200':
          description: Datos.
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/widget-data.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /playlists:
    get:
      tags: [dashboards]
      operationId: listPlaylists
      summary: Listas de reproducción para pantallas
      x-module: analytics
      x-scope: tenant
      x-permission: dashboards.read
      x-increment: I1
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Playlists.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '../../dashboard/v0/playlist.schema.json' } }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
    post:
      tags: [dashboards]
      operationId: createPlaylist
      summary: Crea una playlist
      x-module: analytics
      x-scope: tenant
      x-permission: dashboards.manage
      x-increment: I1
      security:
        - tenantBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../../dashboard/v0/playlist.schema.json#/$defs/PlaylistInput' }
      responses:
        '201':
          description: Creada.
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/playlist.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
  /playlists/{playlist_id}:
    parameters:
      - name: playlist_id
        in: path
        required: true
        schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    patch:
      tags: [dashboards]
      operationId: updatePlaylist
      summary: Edita una playlist (emite horus.analytics.playlist.updated → los kioscos la aplican)
      x-module: analytics
      x-scope: tenant
      x-permission: dashboards.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '../../dashboard/v0/playlist.schema.json#/$defs/PlaylistInput' }
          application/json:
            schema: { $ref: '../../dashboard/v0/playlist.schema.json#/$defs/PlaylistInput' }
      responses:
        '200':
          description: Actualizada.
          content:
            application/json:
              schema: { $ref: '../../dashboard/v0/playlist.schema.json' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
    delete:
      tags: [dashboards]
      operationId: deletePlaylist
      summary: Borra una playlist
      x-module: analytics
      x-scope: tenant
      x-permission: dashboards.manage
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      responses:
        '204': { $ref: './common.yaml#/components/responses/NoContent' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /kiosk/config:
    get:
      tags: [kiosk]
      operationId: getKioskConfig
      summary: Dashboards/playlist asignados al kiosco y parámetros de rotación
      x-module: analytics
      x-scope: tenant
      x-permission: kiosk_self
      x-principals: [kiosk]
      x-increment: I1
      security:
        - kioskBearer: []
      responses:
        '200':
          description: Configuración.
          content:
            application/json:
              schema:
                type: object
                required: [kiosk_id, tenant_id, items, show_personal_data, critical_finding_banner, frontend_min_version]
                properties:
                  kiosk_id: { $ref: './common.yaml#/components/schemas/Uuid' }
                  tenant_id: { $ref: './common.yaml#/components/schemas/Uuid' }
                  tenant_name: { type: string }
                  playlist_id:
                    oneOf:
                      - $ref: './common.yaml#/components/schemas/Uuid'
                      - type: 'null'
                  items:
                    type: array
                    items: { $ref: '../../dashboard/v0/playlist.schema.json#/$defs/PlaylistItem' }
                  transition: { type: string, enum: [fade, none] }
                  show_personal_data: { type: boolean }
                  critical_finding_banner: { type: boolean }
                  frontend_min_version: { type: [string, 'null'], description: 'Si la versión del frontend cambió, la TV se recarga en el siguiente cambio de dashboard.' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /asn/{asn}:
    get:
      tags: [traffic]
      operationId: getAsnInfo
      summary: Cómo se llama hoy un ASN (dataset público, catálogo de plataforma y regla propia del ISP)
      description: |
        Nombre y país del snapshot IP→ASN de plataforma, organización del catálogo si el ASN está en él y la
        regla ASN propia del ISP si existe (proyección de los eventos de devices: puede tardar unos segundos
        en reflejar un cambio). Un ASN desconocido responde 200 con `name` null.
      x-module: analytics
      x-scope: tenant
      x-permission: traffic.read
      x-increment: I1
      security:
        - tenantBearer: []
      parameters:
        - name: asn
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1, maximum: 4294967295 }
      responses:
        '200':
          description: Datos del ASN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsnInfo' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /reports:
    get:
      tags: [reports]
      operationId: listReports
      summary: Ejecuciones de reportes del ISP (programadas y a petición), más recientes primero
      description: |
        Reporte semanal de seguridad por ISP (I3, rol `reporting`). Los reportes cubren todo el ISP: el permiso
        debe tener alcance de todo el ISP (un permiso limitado a nodos → 403).
      x-module: analytics
      x-scope: tenant
      x-permission: reports.read
      x-increment: I3
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Limit'
        - $ref: './common.yaml#/components/parameters/Cursor'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ReportKind' }
      responses:
        '200':
          description: Página de ejecuciones.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReportRun' }
                  page: { $ref: './common.yaml#/components/schemas/PageInfo' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [reports]
      operationId: createReport
      summary: Genera un reporte a petición (asíncrono → 202 + Location de la ejecución)
      description: |
        Sin `from`/`to`: la última semana ISO completa (lunes 00:00 → lunes 00:00) en la zona horaria del ISP.
        Con rango: como mucho 31 días, sin empezar en el futuro (`to` se recorta a ahora). Idempotency-Key
        obligatorio: la misma clave del mismo usuario devuelve la misma ejecución (`Idempotency-Replayed: true`).
        Máximo 10 por usuario y hora (`429 RATE_LIMITED` con `Retry-After`). El aviso de "reporte listo" llega
        por WebSocket (topic `me`, `horus.reporting.report.completed|failed`).
      x-module: analytics
      x-scope: tenant
      x-permission: reports.export
      x-increment: I3
      x-rate-limit: reports
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportCreate' }
      responses:
        '202':
          description: Encolado (o ya existente con la misma Idempotency-Key).
          headers:
            Location: { $ref: './common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRun' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
        '429': { $ref: './common.yaml#/components/responses/TooManyRequests' }
  /reports/{report_id}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [reports]
      operationId: getReport
      summary: Estado de una ejecución (queued, running, completed, failed) y sus archivos
      description: Otro ISP o inexistente → `404 REPORT_NOT_FOUND`.
      x-module: analytics
      x-scope: tenant
      x-permission: reports.read
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Ejecución.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRun' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /reports/{report_id}/download:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [reports]
      operationId: downloadReport
      summary: Descarga el archivo de un reporte (PDF o zip de CSV), autenticada y auditada
      description: |
        Solo por la API (docs/api.md §2.10 bis; sin URLs firmadas): `Content-Disposition: attachment`,
        `Cache-Control: no-store`, `Repr-Digest` con el SHA-256. Cada descarga queda en la auditoría
        (`reports.download`, con la variante servida en `changes.variant`). Otro ISP → `404`; aún no generado →
        `409 REPORT_NOT_READY`; archivos borrados por la retención → `409 REPORT_EXPIRED`. CSV: zip con un archivo
        por sección, UTF-8 con BOM, separador `;`.

        Datos personales: sin `customers.read` con alcance de todo el ISP (usuario o API token), se sirve la
        variante enmascarada (IPv4 `100.64.1.x`, IPv6 el /48 y `…`, alias → `Cliente N`, estable dentro del
        archivo). Una ejecución generada antes de existir esa variante no se sirve a quien no tiene
        `customers.read` (`409 REPORT_NOT_READY`).
      x-module: analytics
      x-scope: tenant
      x-permission: reports.read
      x-increment: I3
      x-audited: true
      security:
        - tenantBearer: []
      parameters:
        - name: format
          in: query
          schema: { $ref: '#/components/schemas/ReportFormat' }
      responses:
        '200':
          description: Archivo.
          headers:
            Content-Disposition:
              description: '`attachment; filename="horus-seguridad-2026-W41-0192f0c4.pdf"`'
              schema: { type: string }
            Repr-Digest:
              description: SHA-256 del archivo (RFC 9530).
              schema: { type: string }
            X-Horus-Report-Variant:
              description: '`full` (con datos personales) o `masked` (enmascarados por permisos).'
              schema: { type: string, enum: [full, masked] }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /report-definitions:
    get:
      tags: [reports]
      operationId: listReportDefinitions
      summary: Programación de los reportes del ISP (se crea con los valores por defecto si falta)
      description: Por defecto el reporte semanal de seguridad está habilitado los lunes a las 07:00 (zona del ISP), en PDF y CSV.
      x-module: analytics
      x-scope: tenant
      x-permission: reports.read
      x-increment: I3
      security:
        - tenantBearer: []
      responses:
        '200':
          description: Definiciones.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReportDefinition' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
  /report-definitions/{definition_id}:
    parameters:
      - $ref: '#/components/parameters/ReportDefinitionId'
    patch:
      tags: [reports]
      operationId: updateReportDefinition
      summary: Cambia la programación (habilitado, día y hora, zona, formatos, destinatarios del aviso)
      description: |
        JSON Merge Patch con `If-Match`. `recipients`: hasta 20 correos que reciben un aviso con el enlace a la
        página de reportes de la consola (sin adjunto) si la instalación tiene SMTP (`email_available`).
      x-module: analytics
      x-scope: tenant
      x-permission: settings.manage
      x-increment: I3
      x-audited: true
      security:
        - tenantBearer: []
      parameters:
        - $ref: './common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ReportDefinitionPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/ReportDefinitionPatch' }
      responses:
        '200':
          description: Actualizada.
          headers:
            ETag: { $ref: './common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDefinition' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
        '412': { $ref: './common.yaml#/components/responses/PreconditionFailed' }
        '422': { $ref: './common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: './common.yaml#/components/responses/PreconditionRequired' }
components:
  securitySchemes:
    tenantBearer: { $ref: './common.yaml#/components/securitySchemes/tenantBearer' }
    sessionBearer: { $ref: './common.yaml#/components/securitySchemes/sessionBearer' }
    kioskBearer: { $ref: './common.yaml#/components/securitySchemes/kioskBearer' }
  parameters:
    DashboardId:
      name: dashboard_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    WidgetId:
      name: widget_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' }
    ReportId:
      name: report_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
    ReportDefinitionId:
      name: definition_id
      in: path
      required: true
      schema: { $ref: './common.yaml#/components/schemas/Uuid' }
  schemas:
    ReportKind:
      type: string
      description: Tipo de reporte (enum abierto; I3 trae el semanal de seguridad).
      enum: [security_weekly]
    ReportFormat:
      type: string
      enum: [pdf, csv]
    ReportStatus:
      type: string
      enum: [queued, running, completed, failed]
    ReportFile:
      type: object
      required: [format, size_bytes, sha256, download_path]
      properties:
        format: { $ref: '#/components/schemas/ReportFormat' }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        download_path: { type: string, description: 'Ruta de descarga (`/api/v1/reports/{id}/download?format=pdf`), autenticada.' }
    ReportRun:
      type: object
      required: [id, tenant_id, kind, status, definition_id, scheduled, period_from, period_to, timezone, iso_week, formats, files,
        size_bytes, personal_data_masked, error, created_by, created_at, started_at, completed_at, expires_at, expired]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        tenant_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/ReportKind' }
        status: { $ref: '#/components/schemas/ReportStatus' }
        definition_id:
          type: [string, 'null']
          format: uuid
          description: Definición que la programó; null = a petición.
        scheduled: { type: boolean }
        period_from: { $ref: './common.yaml#/components/schemas/Timestamp' }
        period_to:
          $ref: './common.yaml#/components/schemas/Timestamp'
          description: Fin excluyente del periodo `[period_from, period_to)`.
        timezone: { type: string, description: Zona IANA con la que se calculó y se muestra el periodo. }
        iso_week: { type: string, pattern: '^[0-9]{4}-W[0-9]{2}$', description: Semana ISO del inicio del periodo. }
        formats:
          type: array
          items: { $ref: '#/components/schemas/ReportFormat' }
        files:
          type: array
          items: { $ref: '#/components/schemas/ReportFile' }
          description: Archivos de la variante que descargaría quien pregunta (ver `personal_data_masked`).
        size_bytes: { type: integer, format: int64, minimum: 0 }
        personal_data_masked:
          type: boolean
          description: |
            `true` si quien pregunta no tiene `customers.read` con alcance de todo el ISP: `files` (tamaño y SHA-256)
            son los de la variante con las IPs y los alias de clientes enmascarados.
        error: { type: [string, 'null'], description: Motivo legible del fallo (sin detalles internos). }
        created_by:
          type: [string, 'null']
          format: uuid
          description: Usuario que lo pidió; null = programado.
        created_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Cuándo se borran los archivos (retención, 365 días por defecto).
        expired: { type: boolean, description: Los archivos ya se borraron por la retención. }
    ReportCreate:
      type: object
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/ReportKind' }
        from: { type: string, format: date-time, description: Inicio (con `to`); omitidos = última semana ISO completa. }
        to: { type: string, format: date-time }
        formats:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReportFormat' }
          description: Por defecto PDF y CSV.
    ReportDefinition:
      type: object
      required: [id, tenant_id, kind, enabled, weekday, hour, minute, timezone, formats, recipients, next_run_at, email_available, version,
        created_at, updated_at]
      properties:
        id: { $ref: './common.yaml#/components/schemas/Uuid' }
        tenant_id: { $ref: './common.yaml#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/ReportKind' }
        enabled: { type: boolean }
        weekday: { type: integer, minimum: 1, maximum: 7, description: 'Día ISO de la ejecución: 1 = lunes … 7 = domingo.' }
        hour: { type: integer, minimum: 0, maximum: 23 }
        minute: { type: integer, minimum: 0, maximum: 59 }
        timezone: { type: string, description: Zona IANA (por defecto la del ISP). }
        formats:
          type: array
          items: { $ref: '#/components/schemas/ReportFormat' }
        recipients:
          type: array
          maxItems: 20
          items: { type: string, format: email }
        next_run_at: { type: [string, 'null'], format: date-time, description: Próxima ejecución (null si está deshabilitada). }
        email_available: { type: boolean, description: La instalación tiene SMTP para el aviso a los destinatarios. }
        version: { $ref: './common.yaml#/components/schemas/Version' }
        created_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
        updated_at: { $ref: './common.yaml#/components/schemas/Timestamp' }
    ReportDefinitionPatch:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        weekday: { type: integer, minimum: 1, maximum: 7 }
        hour: { type: integer, minimum: 0, maximum: 23 }
        minute: { type: integer, minimum: 0, maximum: 59 }
        timezone: { type: string }
        formats:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReportFormat' }
        recipients:
          type: array
          maxItems: 20
          items: { type: string, format: email }
    AsnInfo:
      type: object
      required: [asn, name, country, catalog_organization, tenant_rule]
      properties:
        asn: { type: integer, format: int64 }
        name: { type: [string, 'null'], description: Nombre en el dataset público (null si no se conoce). }
        country: { type: [string, 'null'], description: ISO 3166-1 alfa-2. }
        catalog_organization:
          type: [object, 'null']
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        tenant_rule:
          type: [object, 'null']
          required: [name, category, service]
          properties:
            name: { type: string }
            category: { type: string }
            service: { type: [string, 'null'] }
    TopRow:
      type: object
      required: [key, label, down_bytes, up_bytes, share]
      properties:
        key: { type: string, description: 'ID de servicio/categoría/organización, ASN o customer_id.' }
        label: { type: string }
        down_bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
        up_bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
        share: { type: number, minimum: 0, maximum: 1 }
        customer:
          type: [object, 'null']
          description: Solo con dimension=customers.
          properties:
            customer_id: { $ref: './common.yaml#/components/schemas/Uuid' }
            address: { type: string, description: IP completa o enmascarada (`10.20.0.•••`) según permisos/kiosco. }
            address_masked: { type: boolean }
            alias: { type: [string, 'null'] }
            kind: { type: string }
    TopResult:
      type: object
      required: [dimension, rows, others, totals]
      properties:
        dimension: { type: string }
        rows: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/TopRow' } }
        others:
          type: object
          required: [down_bytes, up_bytes]
          properties:
            down_bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
            up_bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
        totals:
          type: object
          required: [down_bytes, up_bytes]
          properties:
            down_bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
            up_bytes: { $ref: './common.yaml#/components/schemas/Uint64String' }
    SeriesResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [series]
          properties:
            series:
              type: array
              items:
                type: object
                required: [metric, unit, points]
                properties:
                  metric: { type: string, examples: [down_bps] }
                  unit: { type: string, examples: [bps] }
                  group: { type: [string, 'null'] }
                  points:
                    type: array
                    description: '[timestamp, valor|null]; huecos como null.'
                    items:
                      type: array
                      prefixItems:
                        - { type: string, format: date-time }
                        - { type: [number, 'null'] }
                      minItems: 2
                      maxItems: 2
        meta: { $ref: './common.yaml#/components/schemas/AnalyticsMeta' }
