# Generación (la ejecuta CORE/PLAT al cablear `make generate`; el código generado se commitea en gen/).
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/hcdestroyer/horus-flow/packages/protobuf/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.5
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.2.3
    out: gen/ts
    include_imports: false
