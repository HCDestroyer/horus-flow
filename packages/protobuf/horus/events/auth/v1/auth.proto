syntax = "proto3";

// Payloads de horus.auth.* (docs/events.md §8.1). Estados como string (enum abierto, §5.3).
package horus.events.auth.v1;

import "google/protobuf/timestamp.proto";

// TenantQuotas cuotas del ISP.
message TenantQuotas {
  int32 max_routers = 1;
  int32 max_flows_per_second = 2;
  int32 max_customers = 3;
}

// Tenant: horus.auth.tenant.created | updated (estado completo; updated añade changed_fields).
message Tenant {
  string id = 1;
  int32 version = 2;
  string slug = 3;
  string name = 4;
  // active | suspended | offboarding
  string status = 5;
  string country = 6;
  string timezone = 7;
  TenantQuotas quotas = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  repeated string changed_fields = 11;
}

// TenantStatusChanged: horus.auth.tenant.suspended | resumed.
message TenantStatusChanged {
  string id = 1;
  int32 version = 2;
  string previous_status = 3;
  string status = 4;
  optional string reason = 5;
  bool pause_ingest = 6;
  google.protobuf.Timestamp changed_at = 7;
}

// RoleAssignment (rol, alcance) dentro del tenant.
message RoleAssignment {
  string role_id = 1;
  // tenant | site:<uuid> | router_group:<uuid>
  string scope = 2;
}

// Membership: horus.auth.membership.granted | updated | revoked (entity = membership_id).
message Membership {
  string id = 1;
  string user_id = 2;
  int32 version = 3;
  // active | invited | revoked
  string status = 4;
  repeated RoleAssignment assignments = 5;
  repeated RoleAssignment previous_assignments = 6;
  optional string reason = 7;
}

// Kiosk: horus.auth.kiosk.enrolled | revoked (sin credenciales ni códigos).
message Kiosk {
  string id = 1;
  int32 version = 2;
  string name = 3;
  // pending_enrollment | active | revoked | expired
  string status = 4;
  optional string reason = 5;
  optional string playlist_id = 6;
  repeated string dashboard_ids = 7;
  bool show_personal_data = 8;
  google.protobuf.Timestamp changed_at = 9;
}

// SessionRevoked: horus.auth.session.revoked (plataforma; entity = session_id; sin tokens).
message SessionRevoked {
  string session_id = 1;
  string user_id = 2;
  // logout | admin_revoked | password_changed | roles_changed | refresh_token_reuse | user_disabled | expired
  string reason = 3;
  optional string revoked_by = 4;
}
