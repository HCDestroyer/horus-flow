syntax = "proto3";

// Payloads de horus.analytics.* (docs/events.md §8.12). Los datos de widgets no son eventos.
package horus.events.analytics.v1;

import "google/protobuf/timestamp.proto";

// DashboardChanged: horus.analytics.dashboard.created | updated | deleted (sin la config de widgets).
message DashboardChanged {
  string id = 1;
  int32 version = 2;
  string name = 3;
  // system | tenant | private | platform
  string visibility = 4;
  optional string owner_id = 5;
  int32 widget_count = 6;
  repeated string changed_fields = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// PlaylistItem elemento de una playlist.
message PlaylistItem {
  string dashboard_id = 1;
  int32 duration_seconds = 2;
}

// PlaylistChanged: horus.analytics.playlist.updated | deleted.
message PlaylistChanged {
  string id = 1;
  int32 version = 2;
  string name = 3;
  repeated PlaylistItem items = 4;
  string transition = 5;
  google.protobuf.Timestamp updated_at = 6;
}
