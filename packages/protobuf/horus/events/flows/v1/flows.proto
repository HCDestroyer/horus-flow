syntax = "proto3";

// Payloads de horus.flows.* (docs/events.md §8.5; docs/traffic-model.md §3). Telemetría (FlowBatch,
// ClientActivitySummary, TrafficSummary) viaja en Protobuf binario con el sobre en cabeceras; el resto en JSON.
// En el lote las IPs viajan como string en la representación JSON de referencia; los productores pueden usar
// las variantes *_bytes (4/16 bytes) en binario.
package horus.events.flows.v1;

import "google/protobuf/timestamp.proto";

// FlowRecord registro canónico normalizado (traffic-model.md §3). bytes/packets SIN escalar; el ingester
// aplica sampling_rate. post_nat_* solo si el ISP activa nat-* en Traffic Flow (desactivado por defecto).
message FlowRecord {
  string exporter_ip = 1;
  uint32 observation_domain_id = 2;
  google.protobuf.Timestamp flow_start = 3;
  // Fin del flujo.
  google.protobuf.Timestamp ts = 4;
  string src_ip = 5;
  string dst_ip = 6;
  uint32 src_port = 7;
  uint32 dst_port = 8;
  uint32 protocol = 9;
  uint32 tcp_flags = 10;
  uint32 icmp_type_code = 11;
  uint64 bytes = 12;
  uint64 packets = 13;
  uint32 input_if_index = 14;
  uint32 output_if_index = 15;
  // ingress | egress | unknown (dirección según el exportador).
  string flow_direction = 16;
  uint32 src_as = 17;
  uint32 dst_as = 18;
  optional string next_hop = 19;
  uint32 vlan_id = 20;
  optional string post_nat_src_ip = 21;
  optional uint32 post_nat_src_port = 22;
  optional uint32 sampling_rate = 23;
  // netflow_v5 | netflow_v9 | ipfix
  string flow_source = 24;
  string batch_id = 25;
  // Bajada con NAT en el router principal: IP/puerto privado del cliente (IE 226/228).
  // Verificado con un MikroTik real (traffic-model.md §4.4.3); necesario para atribuir.
  optional string post_nat_dst_ip = 26;
  optional uint32 post_nat_dst_port = 27;
}

// FlowBatch: horus.flows.batch.received en horus.telemetry.flows.batch.<router_id> (un lote = un router = un tenant).
message FlowBatch {
  string batch_id = 1;
  string collector_id = 2;
  string tenant_id = 3;
  string router_id = 4;
  string exporter_ip = 5;
  uint32 sampling_rate = 6;
  google.protobuf.Timestamp received_from = 7;
  google.protobuf.Timestamp received_to = 8;
  repeated FlowRecord records = 9;
}

// FirstSeenClient IP de cliente vista por primera vez en un realm.
message FirstSeenClient {
  string address = 1;
  optional string client_prefix_id = 2;
  google.protobuf.Timestamp first_seen = 3;
}

// ClientFirstSeen: horus.flows.client.first_seen.<realm_id> (lotes cada 10 s; pii: clients.address).
message ClientFirstSeen {
  string batch_id = 1;
  string realm_id = 2;
  string router_id = 3;
  google.protobuf.Timestamp window_from = 4;
  google.protobuf.Timestamp window_to = 5;
  repeated FirstSeenClient clients = 6;
}

// ActiveClient actividad horaria de una IP de cliente.
message ActiveClient {
  string address = 1;
  google.protobuf.Timestamp last_seen = 2;
  uint64 bytes_est = 3;
  uint32 flows = 4;
}

// ClientActivitySummary: horus.flows.client.activity_summary (telemetría horaria por realm; pii: clients.address).
message ClientActivitySummary {
  string batch_id = 1;
  string realm_id = 2;
  google.protobuf.Timestamp hour = 3;
  int32 part = 4;
  int32 parts = 5;
  repeated ActiveClient clients = 6;
}

// TrafficSummary: horus.flows.traffic_summary.observed en horus.telemetry.flows.summary.<site_id|tenant_id>
// (cada 10 s; alimenta el topic WebSocket traffic.summary). Adición de C4 para I1-13.
message TrafficSummary {
  string batch_id = 1;
  // null = total del ISP.
  optional string site_id = 2;
  google.protobuf.Timestamp window_from = 3;
  google.protobuf.Timestamp window_to = 4;
  double down_bps = 5;
  double up_bps = 6;
  double flows_per_second = 7;
  int32 active_customers = 8;
  bool partial = 9;
}

// ExporterUnregistered: horus.flows.exporter.unregistered (plataforma; entity = UUIDv5 de la IP).
message ExporterUnregistered {
  string exporter_ip = 1;
  google.protobuf.Timestamp first_seen_at = 2;
  google.protobuf.Timestamp last_seen_at = 3;
  uint64 datagrams = 4;
}

// ExporterRateLimited: horus.flows.exporter.rate_limited (entity = router).
message ExporterRateLimited {
  string router_id = 1;
  int32 quota_flows_per_second = 2;
  int32 observed_flows_per_second = 3;
  uint64 dropped_records = 4;
  google.protobuf.Timestamp window_from = 5;
  google.protobuf.Timestamp window_to = 6;
}

// ExporterSilence: horus.flows.exporter.silent | recovered (entity = router).
message ExporterSilence {
  string router_id = 1;
  string exporter_ip = 2;
  optional google.protobuf.Timestamp last_flow_at = 3;
  int32 silent_after_seconds = 4;
}

// ExporterStateChanged: horus.flows.exporter.state_changed (I1-09; entity = router). Adición de C4.
message ExporterStateChanged {
  string router_id = 1;
  string site_id = 2;
  int32 version = 3;
  // pending_configuration | exporting | silent | lossy | clock_skew
  string previous_state = 4;
  string state = 5;
  optional google.protobuf.Timestamp last_flow_at = 6;
  optional double loss_ratio_5m = 7;
  optional double clock_skew_seconds = 8;
  google.protobuf.Timestamp changed_at = 9;
}

// CollectorDataGap: horus.flows.collector.data_gap (plataforma; entity = UUIDv5 del collector).
message CollectorDataGap {
  string collector_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  uint64 dropped_batches = 4;
  uint64 dropped_records_estimated = 5;
  // bus_unavailable | local_buffer_full | stream_full
  string reason = 6;
}
