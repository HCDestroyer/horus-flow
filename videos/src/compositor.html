<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Compositor de videos Horus</title>
<style>
  /* Identidad "vidrio y luz" (skill horus-identity): fondo azul noche, aura teal + índigo,
     tarjetas casi sólidas, luz teal solo en señales. */
  :root {
    --bg: #0b1014; --muted: #10151b; --elevated: #1a2029; --border: #232a33;
    --primary: #2dd4bf; --primary-700: #0f766e; --indigo: #a5b4fc;
    --text: #f4f4f5; --dim: #a1a1aa;
    --glow: rgb(45 212 191 / 0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--text); font-feature-settings: 'tnum' 1, 'cv11' 1; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  .aura { position: absolute; border-radius: 50%; pointer-events: none; }
  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  .win { position: absolute; overflow: hidden; border-radius: 16px; background: var(--muted);
         border: 1px solid var(--border); box-shadow: 0 30px 80px rgb(0 0 0 / 0.55), 0 0 0 1px rgb(255 255 255 / 0.03) inset; }
  .win.tv { border: 14px solid #05080a; border-radius: 22px; box-shadow: 0 30px 90px rgb(0 0 0 / 0.6), 0 0 0 2px #1a2029; }
  .win img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .chip { position: absolute; display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 12px;
          border-radius: 999px; background: rgb(16 21 27 / 0.78); border: 1px solid rgb(255 255 255 / 0.08);
          font-weight: 600; font-size: 22px; letter-spacing: -0.01em; color: var(--text); white-space: nowrap; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 12px var(--glow); }
  .hi { position: absolute; border: 2px solid var(--primary); border-radius: 12px;
        box-shadow: 0 0 22px var(--glow), 0 0 0 9999px rgb(11 16 20 / 0.0); }
  .hi-label { position: absolute; padding: 8px 14px; border-radius: 10px; background: var(--primary-700); color: #fff;
              font-weight: 600; font-size: 22px; white-space: nowrap; box-shadow: 0 8px 24px rgb(0 0 0 / 0.4); }
  .sub { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; padding: 14px 28px;
         border-radius: 18px; background: rgb(11 16 20 / 0.82); border: 1px solid rgb(255 255 255 / 0.07);
         font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; color: #fff; box-shadow: 0 12px 40px rgb(0 0 0 / 0.45); }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .brand { display: flex; align-items: center; gap: 0.32em; font-size: 44px; letter-spacing: -0.015em; }
  .brand svg { width: 1.45em; height: 1.45em; }
  .brand b { font-weight: 650; } .brand span { font-weight: 400; color: var(--dim); }
  .eyebrow { color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; }
  .title { font-weight: 650; letter-spacing: -0.025em; line-height: 1.04; }
  .subtitle { color: var(--dim); font-weight: 450; letter-spacing: -0.01em; line-height: 1.3; }
  .cta { display: inline-flex; align-items: center; gap: 14px; padding: 20px 38px; border-radius: 14px;
         background: var(--primary); color: #04201d; font-weight: 700; box-shadow: 0 0 26px var(--glow); }
  .chap-n { font-weight: 700; color: var(--primary); line-height: 1; text-shadow: 0 0 30px var(--glow); }
  .rule { height: 3px; background: var(--primary); border-radius: 2px; box-shadow: 0 0 14px var(--glow); }
  .link { position: absolute; height: 3px; background: linear-gradient(90deg, rgb(45 212 191 / 0.15), rgb(45 212 191 / 0.7), rgb(45 212 191 / 0.15)); }
  .pulse { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 22px 6px var(--glow); }
  .mark { position: absolute; display: flex; align-items: center; gap: 10px; font-size: 24px; opacity: 0.9; }
  .mark svg { width: 34px; height: 34px; } .mark b { font-weight: 650; } .mark span { color: var(--dim); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const LOGO = '<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0f766e"/><path d="M5 16c3-5.2 6.8-7.8 11-7.8S24 10.8 27 16c-3 5.2-6.8 7.8-11 7.8S8 21.2 5 16Z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="16" r="3.6" fill="#fff"/></svg>'
const IMG_AR = 16 / 9
const clamp = (v, a, b) => Math.min(b, Math.max(a, v))
const lerp = (a, b, k) => a + (b - a) * k
const easeIO = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2)
// Resorte sin rebote (crítico) normalizado a ~0,6 s.
const spring = (k) => (k <= 0 ? 0 : k >= 1 ? 1 : 1 - (1 + 8 * k) * Math.exp(-8 * k))
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent && parent.appendChild(e); return e }
const brandHTML = (name = 'Flow') => `${LOGO}<b>Horus</b><span>${name}</span>`

let CFG, L, stage, built = []

/** Diseño según el formato: 16:9 (1920×1080) o 9:16 (1080×1920). */
function layout(W, H) {
  const v = H > W
  return v
    ? { v, W, H, win: { x: 40, y: 250, w: 1000, h: 1180 }, chip: { x: 40, y: 168 }, sub: { y: 1500, w: 980, fs: 50 },
        mark: { x: 40, y: 70 }, title: 92, sub2: 42, eyebrow: 28, brand: 52 }
    : { v, W, H, win: { x: 150, y: 96, w: 1620, h: 911 }, chip: { x: 150, y: 28 }, sub: { y: 880, w: 1500, fs: 40 },
        mark: { x: 1560, y: 30 }, title: 96, sub2: 38, eyebrow: 24, brand: 46 }
}

window.setup = async (cfg) => {
  CFG = cfg; L = layout(cfg.W, cfg.H)
  document.body.style.width = cfg.W + 'px'; document.body.style.height = cfg.H + 'px'
  stage = document.getElementById('stage')
  stage.style.width = cfg.W + 'px'; stage.style.height = cfg.H + 'px'
  // Aura: dos manchas difusas (gradientes radiales, sin filtros para renderizar rápido).
  const s = Math.max(cfg.W, cfg.H)
  for (const [c, a] of [['20 184 166', 0.2], ['99 102 241', 0.16], ['20 184 166', 0.1]]) {
    const d = el('div', 'aura', stage); d.style.width = d.style.height = s * 1.1 + 'px'
    d.style.background = `radial-gradient(circle, rgb(${c} / ${a}) 0%, rgb(${c} / ${a * 0.45}) 30%, rgb(${c} / 0) 66%)`
  }
  const loads = []
  for (const sc of cfg.scenes) {
    const root = el('div', 'scene', stage); const b = { sc, root }
    if (sc.kind === 'shot') buildShot(b, sc, loads)
    else if (sc.kind === 'pair') buildPair(b, sc, loads)
    else buildText(b, sc)
    if (sc.kind === 'shot' || sc.kind === 'pair') {
      b.sub = el('div', 'sub', root); b.sub.style.maxWidth = L.sub.w + 'px'; b.sub.style.fontSize = L.sub.fs + 'px'
      b.sub.style.top = L.sub.y + 'px'
      if (!L.v) { b.sub.style.top = 'auto'; b.sub.style.bottom = (cfg.H - L.win.y - L.win.h + 34) + 'px' }
    } else {
      b.sub = el('div', 'sub', root); b.sub.style.maxWidth = L.sub.w + 'px'; b.sub.style.fontSize = (L.sub.fs * 0.9) + 'px'
      b.sub.style.bottom = (L.v ? 220 : 70) + 'px'
    }
    built.push(b)
  }
  // Marca fija en una esquina durante las capturas.
  const m = el('div', 'mark', stage, brandHTML(cfg.product || 'Flow')); m.style.left = L.mark.x + 'px'; m.style.top = L.mark.y + 'px'
  if (!L.v) { m.style.left = 'auto'; m.style.right = (cfg.W - L.win.x - L.win.w) + 'px' }
  built.mark = m
  // Decodificar de a una: muchas capturas grandes en paralelo hacen fallar a Chromium.
  for (const im of loads) {
    if (!im.complete) await new Promise((r) => { im.onload = r; im.onerror = r })
    try { await im.decode() } catch { await new Promise((r) => setTimeout(r, 200)); await im.decode().catch(() => {}) }
  }
  await document.fonts.ready
}

function buildShot(b, sc, loads) {
  const w = L.win
  b.win = el('div', 'win' + (sc.frame === 'tv' ? ' tv' : ''), b.root)
  Object.assign(b.win.style, { left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px' })
  b.img = el('img', '', b.win); b.img.src = CFG.assets + sc.img + '.png'
  loads.push(b.img)
  b.chip = el('div', 'chip', b.root, `<i class="dot"></i>${sc.label || ''}`)
  b.chip.style.left = L.chip.x + 'px'; b.chip.style.top = L.chip.y + 'px'
  b.his = (sc.hi || []).map((h) => ({ h, box: el('div', 'hi', b.win), lab: el('div', 'hi-label', b.root, h.label || '') }))
  b.path = (L.v ? sc.v : null) || sc.path || [[0, 0, 1]]
}

function buildPair(b, sc, loads) {
  const v = L.v
  const boxes = v
    ? [{ x: 60, y: 260, w: 960, h: 560 }, { x: 60, y: 930, w: 960, h: 560 }]
    : [{ x: 110, y: 200, w: 800, h: 560 }, { x: 1010, y: 200, w: 800, h: 560 }]
  b.wins = [sc.a, sc.b].map((img, i) => {
    const bx = boxes[i]; const win = el('div', 'win', b.root)
    Object.assign(win.style, { left: bx.x + 'px', top: bx.y + 'px', width: bx.w + 'px', height: bx.h + 'px' })
    const im = el('img', '', win); im.src = CFG.assets + img + '.png'; loads.push(im)
    const chip = el('div', 'chip', b.root, `<i class="dot"></i>${sc.labels[i]}`)
    chip.style.left = bx.x + 'px'; chip.style.top = (bx.y - 66) + 'px'
    return { win, im, bx, rect: i ? sc.bPath : sc.aPath, chip }
  })
  b.link = el('div', 'link', b.root); b.pulse = el('div', 'pulse', b.root)
  const [A, B] = boxes
  b.linkGeo = v ? { x: 540, y1: A.y + A.h, y2: B.y - 66, vertical: true } : { y: A.y + A.h / 2, x1: A.x + A.w, x2: B.x }
}

function buildText(b, sc) {
  const c = el('div', 'center', b.root); b.parts = []
  const add = (node, d) => { b.parts.push({ node, d }); return node }
  if (sc.kind === 'chapter') {
    const n = add(el('div', 'chap-n', c, sc.n), 0); n.style.fontSize = (L.title * 2.2) + 'px'
    const r = add(el('div', 'rule', c), 0.12); r.style.width = '120px'; r.style.margin = '28px 0'
    const t = add(el('div', 'title', c, sc.title), 0.2); t.style.fontSize = L.title + 'px'
    return
  }
  const brand = add(el('div', 'brand', c, brandHTML(CFG.product || 'Flow')), 0); brand.style.fontSize = L.brand + 'px'
  brand.style.marginBottom = (L.v ? 80 : 56) + 'px'
  if (sc.kind === 'outro' && CFG.partner) {
    brand.innerHTML = brandHTML(CFG.product || 'Flow') + `<span style="margin:0 0.4em;color:var(--primary)">+</span><b>${CFG.partner}</b>`
  }
  if (sc.eyebrow) { const e = add(el('div', 'eyebrow', c, sc.eyebrow), 0.08); e.style.fontSize = L.eyebrow + 'px'; e.style.marginBottom = '22px' }
  const t = add(el('div', 'title', c, sc.title), 0.14); t.style.fontSize = (sc.kind === 'outro' ? L.title * 1.05 : L.title) + 'px'
  t.style.maxWidth = (L.v ? 940 : 1500) + 'px'
  if (sc.sub) { const s = add(el('div', 'subtitle', c, sc.sub), 0.24); s.style.fontSize = L.sub2 + 'px'; s.style.marginTop = '30px'; s.style.maxWidth = (L.v ? 900 : 1300) + 'px' }
  if (sc.kind === 'outro') {
    const cta = add(el('div', 'cta', c, sc.cta || 'Agenda una demo'), 0.36); cta.style.fontSize = (L.sub2 * 0.95) + 'px'; cta.style.marginTop = '64px'
  }
}

/** Recorte de la captura [x, y, w] → rectángulo con el aspecto de la ventana. */
function cropRect(r, aspect) {
  let [x, y, w] = r
  // En vertical, un encuadre muy cerrado corta las frases: ancho mínimo, mismo centro.
  if (aspect < 1 && w < 0.42) { const c = x + w / 2, cy = y + (w * IMG_AR) / aspect / 2; w = 0.42; x = c - w / 2; y = cy - (w * IMG_AR) / aspect / 2 }
  let h = (w * IMG_AR) / aspect // altura normalizada
  if (h > 1) { h = 1; const nw = aspect / IMG_AR; x += (w - nw) / 2; w = nw }
  x = clamp(x, 0, 1 - w); y = clamp(y, 0, 1 - h)
  return { x, y, w, h }
}

function pathAt(path, k, aspect) {
  const rs = path.map((r) => cropRect(r, aspect))
  if (rs.length === 1) return rs[0]
  const seg = Math.min(rs.length - 2, Math.floor(k * (rs.length - 1)))
  const kk = easeIO(clamp(k * (rs.length - 1) - seg, 0, 1))
  const a = rs[seg], b = rs[seg + 1]
  return { x: lerp(a.x, b.x, kk), y: lerp(a.y, b.y, kk), w: lerp(a.w, b.w, kk), h: lerp(a.h, b.h, kk) }
}

function placeImg(img, win, rect) {
  const ww = win.clientWidth, wh = win.clientHeight
  const dispW = ww / rect.w, dispH = dispW / IMG_AR
  img.style.width = dispW + 'px'; img.style.height = dispH + 'px'
  img.style.transform = `translate(${-rect.x * dispW}px, ${-rect.y * dispH}px)`
  return { dispW, dispH, ox: -rect.x * dispW, oy: -rect.y * dispH }
}

function subAt(b, t) {
  const subs = b.sc.subs || []
  const s = subs.find((x) => t >= x.t0 && t < x.t1)
  if (!s) { b.sub.style.opacity = 0; return }
  b.sub.textContent = s.text
  const k = clamp((t - s.t0) / 0.18, 0, 1) * clamp((s.t1 - t) / 0.18, 0, 1)
  b.sub.style.opacity = k
}

window.renderAt = (T) => {
  // Aura en deriva lenta.
  const auras = stage.querySelectorAll('.aura'); const s = Math.max(CFG.W, CFG.H)
  const pos = [[0.15 + 0.08 * Math.sin(T / 9), 0.1 + 0.06 * Math.cos(T / 11)], [0.85 + 0.07 * Math.cos(T / 10), 0.85 + 0.06 * Math.sin(T / 8)], [0.6 + 0.1 * Math.sin(T / 13), 0.3 + 0.1 * Math.cos(T / 12)]]
  auras.forEach((a, i) => { a.style.left = (pos[i][0] * CFG.W - s * 0.55) + 'px'; a.style.top = (pos[i][1] * CFG.H - s * 0.55) + 'px' })
  let anyShot = false
  for (const b of built) {
    const { start, dur } = b.sc; const xf = CFG.xf
    const t = T - start
    if (t < -0.001 || t > dur + xf) { b.root.style.opacity = 0; b.root.style.display = 'none'; continue }
    b.root.style.display = ''
    const fin = clamp(t / xf, 0, 1), fout = clamp((dur + xf - t) / xf, 0, 1)
    const op = Math.min(fin, fout)
    b.root.style.opacity = op
    const sIn = spring(clamp(t / 0.9, 0, 1))
    if (b.sc.kind === 'shot') {
      anyShot = anyShot || op > 0.5
      const k = clamp(t / dur, 0, 1)
      const aspect = L.win.w / L.win.h
      const rect = pathAt(b.path, k, aspect)
      const g = placeImg(b.img, b.win, rect)
      b.win.style.transform = `translateY(${(1 - sIn) * 26}px) scale(${0.975 + 0.025 * sIn})`
      b.chip.style.opacity = sIn; b.chip.style.transform = `translateY(${(1 - sIn) * 12}px)`
      for (const { h, box, lab } of b.his) {
        const ta = h.at * dur; const kk = spring(clamp((t - ta) / 0.6, 0, 1))
        const [hx, hy, hw, hh] = h.r
        const x = hx * g.dispW + g.ox, y = hy * g.dispH + g.oy, w = hw * g.dispW, hh2 = hh * g.dispH
        const visible = kk > 0 && x > -10 && y > -10 && x + w < b.win.clientWidth + 10 && y + hh2 < b.win.clientHeight + 10
        const pad = 8
        Object.assign(box.style, { left: (x - pad) + 'px', top: (y - pad) + 'px', width: (w + pad * 2) + 'px', height: (hh2 + pad * 2) + 'px',
          opacity: visible ? kk : 0, transform: `scale(${1.06 - 0.06 * kk})` })
        const winX = b.win.offsetLeft, winY = b.win.offsetTop
        let lx = winX + x - pad, ly = winY + y - pad - 52
        if (ly < winY + 8) ly = winY + y + hh2 + pad + 10
        lx = clamp(lx, 20, CFG.W - 20 - lab.offsetWidth)
        Object.assign(lab.style, { left: lx + 'px', top: ly + 'px', opacity: visible ? kk : 0, transform: `translateY(${(1 - kk) * 10}px)` })
      }
    } else if (b.sc.kind === 'pair') {
      anyShot = anyShot || op > 0.5
      b.wins.forEach(({ win, im, rect, chip }, i) => {
        const kk = spring(clamp((t - i * 0.5) / 0.9, 0, 1))
        const r = cropRect(rect, win.clientWidth / win.clientHeight)
        const zoom = 1 + 0.06 * clamp(t / b.sc.dur, 0, 1)
        placeImg(im, win, { x: r.x + r.w * (1 - 1 / zoom) / 2, y: r.y + r.h * (1 - 1 / zoom) / 2, w: r.w / zoom, h: r.h / zoom })
        win.style.opacity = kk; win.style.transform = `translateY(${(1 - kk) * 30}px)`
        chip.style.opacity = kk
      })
      const g = b.linkGeo; const kk = clamp((t - 0.9) / 0.6, 0, 1)
      const ph = ((t * 0.7) % 1)
      if (g.vertical) {
        Object.assign(b.link.style, { left: (g.x - 1.5) + 'px', top: g.y1 + 'px', width: '3px', height: (g.y2 - g.y1) * kk + 'px',
          background: 'linear-gradient(180deg, rgb(45 212 191 / 0.15), rgb(45 212 191 / 0.7), rgb(45 212 191 / 0.15))' })
        Object.assign(b.pulse.style, { left: (g.x - 9) + 'px', top: (lerp(g.y1, g.y2, ph) - 9) + 'px', opacity: kk })
      } else {
        Object.assign(b.link.style, { left: g.x1 + 'px', top: (g.y - 1.5) + 'px', width: (g.x2 - g.x1) * kk + 'px' })
        Object.assign(b.pulse.style, { left: (lerp(g.x1, g.x2, ph) - 9) + 'px', top: (g.y - 9) + 'px', opacity: kk })
      }
    } else {
      for (const { node, d } of b.parts) {
        const kk = spring(clamp((t - d - 0.1) / 0.9, 0, 1))
        node.style.opacity = kk; node.style.transform = `translateY(${(1 - kk) * 28}px)`
      }
    }
    subAt(b, t)
  }
  built.mark.style.opacity = anyShot ? 1 : 0
  // La marca de la esquina dice de qué producto es la pantalla.
  const cur = built.filter((b) => b.sc.img && T >= b.sc.start && T < b.sc.start + b.sc.dur).at(-1)
  const argos = cur && cur.sc.img.startsWith('argos/')
  if (built.mark.dataset.argos !== String(!!argos)) {
    built.mark.dataset.argos = String(!!argos)
    built.mark.innerHTML = argos ? '<b>ArgosISP</b><span>· gestión del ISP</span>' : brandHTML(CFG.product || 'Flow')
  }
}
</script>
</body>
</html>
