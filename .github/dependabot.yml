# Actualizaciones automáticas de dependencias (ver .github/README.md).
# Las PR de Dependabot pasan por el mismo CI; auto-merge.yml las fusiona solo con ci-ok en verde
# y dependabot-notices.yml regenera THIRD_PARTY_NOTICES.md en ellas.
# Fuera de Dependabot (se suben a mano, a la vez en todos sus sitios): toolchain de Go
# (go.mod, Dockerfile, GO_VERSION de CI) e imágenes base fijadas con ARG en los Dockerfile.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Guatemala }
    open-pull-requests-limit: 5
    commit-message: { prefix: chore, include: scope }
    groups:
      go-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/frontend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Guatemala }
    open-pull-requests-limit: 5
    commit-message: { prefix: chore, include: scope }
    groups:
      frontend-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /packages/schemas
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Guatemala }
    open-pull-requests-limit: 3
    commit-message: { prefix: chore, include: scope }
    groups:
      contratos-menores:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /deployments/compose
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Guatemala }
    open-pull-requests-limit: 3
    commit-message: { prefix: chore, include: scope }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Guatemala }
    open-pull-requests-limit: 3
    commit-message: { prefix: chore, include: scope }
    groups:
      acciones:
        patterns: ["*"]
